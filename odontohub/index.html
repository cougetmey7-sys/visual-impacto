<head>

<title>odontoHub — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1e6d72; --teal2:#2b8a8f; --teal-l:#e3f0f0; --bg:#f6f2ec; --card:#fff; --sand:#c8a97c; --sand-l:#f3ebdf;
  --ink:#1f2b2d; --mut:#6b7a7c; --line:#e7e1d8; --ok:#2f9a66; --ok-l:#e2f4ea; --warn:#c98a1e; --warn-l:#fbf0dc; --bad:#c2524b; --bad-l:#f9e3e1;
  --wa:#25a35a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.serif{font-family:'Cormorant Garamond',serif}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,#eef0ee 0%,var(--bg) 60%)}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px}
.logo-ico{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--teal2),var(--teal));display:grid;place-items:center;box-shadow:0 6px 18px rgba(30,109,114,.3)}
.logo-name{font-weight:700;font-size:17px;color:var(--teal)}
.logo-name span{font-weight:500;color:#3a4b4d}
.logo-tag{font-style:italic;font-size:11px;color:var(--mut)}
.lcard{width:100%;max-width:380px;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(60,50,30,.07);padding:24px}
.clinic{background:linear-gradient(180deg,#fffdf9,#faf6f0);text-align:center;margin-bottom:14px;border:1px solid var(--line)}
.clinic h1{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.22em;font-size:20px}
.clinic p{font-size:9.5px;letter-spacing:.2em;color:var(--mut);margin-top:4px;text-transform:uppercase}
.clinic small{display:block;margin-top:12px;font-size:11px;color:var(--sand);}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;letter-spacing:.12em;font-weight:600;color:var(--mut);margin-bottom:6px;text-transform:uppercase}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafb;outline:none;transition:.15s}
.inp:focus{border-color:var(--teal2);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{background:#185c60}
.btn-s{background:var(--teal-l);color:var(--teal)}.btn-s:hover{background:#d2e7e7}
.btn-g{border:1px solid var(--line);background:#fff}.btn-g:hover{background:#faf8f5}
.btn-wa{background:var(--wa);color:#fff}
.full{width:100%;padding:13px;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.demo-hint{margin-top:14px;font-size:11.5px;color:var(--mut);text-align:center;background:var(--sand-l);padding:8px;border-radius:8px}
.foot{margin-top:28px;font-size:10px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.foot b{color:var(--teal)}

/* ---------- APP ---------- */
#app{display:none;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:232px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:20}
.side .logo{flex-direction:row;margin:0 6px 22px;gap:10px}
.side .logo-ico{width:36px;height:36px;border-radius:10px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#4b5a5c;font-weight:500;margin-bottom:3px;text-align:left}
.nav button:hover{background:#f6f8f8}
.nav button.on{background:var(--teal-l);color:var(--teal);font-weight:600}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav .badge{margin-left:auto;background:var(--teal);color:#fff;font-size:10px;border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--sand-l);font-size:12px}
.side-foot b{display:block;font-size:13px}
.main{margin-left:232px;padding:24px 28px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1}
.top .sub{color:var(--mut);font-size:13px;margin-top:5px}
.demo-flag{background:var(--sand-l);color:#8a6a3c;font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;letter-spacing:.04em}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:18px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.kpi .n{font-size:28px;font-weight:700;margin-top:6px}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--ok)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--ok-l);color:var(--ok)}.p-warn{background:var(--warn-l);color:var(--warn)}.p-bad{background:var(--bad-l);color:var(--bad)}.p-t{background:var(--teal-l);color:var(--teal)}.p-g{background:#eef0f0;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1ede7}
.row:last-child{border:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0;color:#fff}
.mut{color:var(--mut);font-size:12px}
.grow{flex:1;min-width:0}
.b{font-weight:600}

/* agenda */
.ag-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daysw{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.daysw button{min-width:62px;padding:8px 6px;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:center}
.daysw button small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.daysw button b{font-size:17px}
.daysw button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.daysw button.on small{color:#cfe5e5}
.cal{display:grid;grid-template-columns:58px 1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .hd{padding:12px;font-weight:600;border-bottom:1px solid var(--line);background:#fcfaf7;display:flex;align-items:center;gap:8px}
.cal .hr{height:56px;border-bottom:1px solid #f3efe9;font-size:11px;color:var(--mut);padding:4px 8px;text-align:right}
.col{position:relative;border-left:1px solid #f3efe9}
.slot{height:56px;border-bottom:1px solid #f3efe9;cursor:pointer}
.slot:hover{background:#f7fbfb}
.ev{position:absolute;left:6px;right:6px;border-radius:9px;padding:6px 9px;font-size:12px;cursor:pointer;overflow:hidden;border-left:3px solid;transition:.15s}
.ev:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ev b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:#5a6a6c;font-size:11px}
.e-conf{background:#e6f3f3;border-color:var(--teal2)}
.e-pend{background:#fbf3e3;border-color:var(--warn)}
.e-done{background:#e9f5ee;border-color:var(--ok)}
.e-aus{background:#f9e7e5;border-color:var(--bad)}

/* pacientes */
.search{position:relative}
.search input{padding-left:36px;width:280px}
.search svg{position:absolute;left:11px;top:11px;width:16px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid #f3efe9}
tbody tr{cursor:pointer}tbody tr:hover{background:#fbfaf8}

/* ficha */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:10px 14px;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal);border-color:var(--teal);font-weight:600}
.odo{display:flex;flex-direction:column;gap:18px;align-items:center;padding:10px 0}
.odo-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.odo-row .sep{width:14px}
.tooth{width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tooth svg{width:40px;height:45px}
.tooth small{font-size:10px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:16px}
.tl-i:before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--teal2);border:2px solid #fff;box-shadow:0 0 0 1px var(--teal2)}
.prog{height:8px;background:#eef0ee;border-radius:10px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));border-radius:10px;transition:width .4s}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid #c9d3d3;display:grid;place-items:center;flex-shrink:0}
.step.dn .chk{background:var(--ok);border-color:var(--ok)}
.step.dn span{text-decoration:line-through;color:var(--mut)}

/* whatsapp */
.phone{background:#e9e1d6;border-radius:18px;padding:14px;min-height:300px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.bub{background:#dcf7c5;border-radius:10px 10px 2px 10px;padding:9px 11px;max-width:88%;margin-left:auto;font-size:13px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08);margin-bottom:10px;white-space:pre-line}
.bub.in{background:#fff;margin-left:0;border-radius:10px 10px 10px 2px}
.bub small{display:block;text-align:right;font-size:10px;color:#6c7c6e;margin-top:3px}
.toggle{width:38px;height:22px;border-radius:20px;background:#cfd8d8;position:relative;transition:.2s;flex-shrink:0}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--teal2)}.toggle.on:after{left:19px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(25,35,36,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:22px;max-height:90vh;overflow:auto}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:14px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;transition:.3s;z-index:60;opacity:0}
#toast.show{transform:translateX(-50%);opacity:1}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:34px;background:var(--teal-l);border-radius:6px 6px 2px 2px;position:relative}
.bars i.hi{background:var(--teal2)}
.bars small{font-size:11px;color:var(--mut)}
.mob-top{display:none}

@media(max-width:960px){
  .g4{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:1fr}
}
@media(max-width:760px){
  .side{transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .main{margin-left:0;padding:16px 14px 60px}
  .mob-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
  .search input{width:100%}
  .cal{grid-template-columns:46px 1fr 1fr}
  .hide-m{display:none}
  .top h2{font-size:26px}
}
</style>

/* ======= NAV ======= */
const IC={

const VIEWS=[['inicio','Inicio'],['agenda','Agenda'],['pacientes','Pacientes'],['tratamientos','Tratamientos'],['recordatorios','Recordatorios WhatsApp']];
let view='inicio', fichaId=null, fichaTab='odo';
function renderNav(){
  const pend=TUR.filter(t=>t.d===0&&t.st==='pend').length;
  document.getElementById('nav').innerHTML=VIEWS.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}${k==='agenda'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');

function go(v){view=v;fichaId=null;render();document.getElementById('side').classList.remove('open');window.scrollTo(0,0)}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render()}
function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex'}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function render(){renderNav();const m=document.getElementById('main');
  m.innerHTML = fichaId? vFicha() : ({inicio:vInicio,agenda:vAgenda,pacientes:vPacientes,tratamientos:vTrat,recordatorios:vWA})[view]();}
function head(t,s,right=''){return `<div class="top"><div><h2>${t}</h2><div class="sub">${s}</div></div><div class="ag-tools">${right}<span class="demo-flag hide-m">MODO DEMO</span></div></div>`}

/* ======= INICIO ======= */
function vInicio(){
  const hoy=TUR.filter(t=>t.d===0).sort((a,b)=>a.h-b.h);
  const conf=hoy.filter(t=>t.st==='conf'||t.st==='done').length;
  const next=hoy.filter(t=>t.st!=='done'&&t.st!=='aus');
  const wd=(today.getDay()+6)%7;const week=[14,17,12,19,16,8,0];week[wd]=hoy.length;
  return head('Buen día, Lucía',fmtD(today).replace(/^./,c=>c.toUpperCase())+' · Centro Sonrisa',`<button class="btn btn-p" onclick="nuevoTurno()">+ Nuevo turno</button>`)+`
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">Turnos de hoy</div><div class="n">${hoy.length}</div><div class="d">${conf} confirmados</div></div>
    <div class="card kpi"><div class="l">Pacientes activos</div><div class="n">${PAC.length*31}</div><div class="d">+12 este mes</div></div>
    <div class="card kpi"><div class="l">Tratamientos en curso</div><div class="n">${Object.values(TRAT).flat().filter(t=>t.dn<t.steps.length).length}</div><div class="d" style="color:var(--mut)">ortodoncia, implantes, endo</div></div>
    <div class="card kpi"><div class="l">Ausentismo del mes</div><div class="n">4,2%</div><div class="d">↓ 9 pts desde recordatorios</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Próximos pacientes <button class="mut" onclick="go('agenda')">Ver agenda →</button></h3>
      ${next.map(t=>{const p=pac(t.pac);return `<div class="row" style="cursor:pointer" onclick="verTurno(${t.id})">
        <div class="b" style="width:46px;color:var(--teal)">${hh(t.h)}</div>
        <div class="av" style="background:${avc(p.id)}">${ini(p.n)}</div>
        <div class="grow"><div class="b">${p.n}</div><div class="mut">${t.mot} · ${pro(t.p).n}</div></div>
        <span class="pill ${ST[t.st][1]}">${ST[t.st][0]}</span></div>`}).join('')||'<p class="mut">No quedan turnos por hoy.</p>'}
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><h3>Turnos de la semana</h3>
        <div class="bars">${['L','M','M','J','V','S','D'].map((d,i)=>`<div><i class="${i===wd?'hi':''}" style="height:${week[i]/20*100}%"></i><small>${d}</small></div>`).join('')}</div>
      </div>
      <div class="card"><h3>WhatsApp automático <span class="pill ${WA_ON?'p-ok':'p-g'}">${WA_ON?'Activo':'Pausado'}</span></h3>
        <p class="mut" style="line-height:1.5">Mañana se envían <b style="color:var(--ink)">${TUR.filter(t=>t.d===1).length} recordatorios</b> ${WA_HOURS} h antes de cada turno. Los pacientes confirman respondiendo "SI".</p>
        <button class="btn btn-s" style="margin-top:12px" onclick="go('recordatorios')">Configurar mensajes</button>
      </div>
    </div>
  </div>`;
}

/* ======= AGENDA ======= */
function vAgenda(){
  const d=addD(selDay);
  const days=[...Array(7)].map((_,i)=>addD(i));
  const H0=8,H1=20;
  const hours=[...Array(H1-H0)].map((_,i)=>H0+i);
  const cols=PROS.map(p=>{
    const evs=TUR.filter(t=>t.d===selDay&&t.p===p.id);
    return `<div class="col">${hours.map(h=>`<div class="slot" onclick="nuevoTurno('${p.id}',${h})"></div>`).join('')}
      ${evs.map(t=>{const pc=pac(t.pac);return `<div class="ev ${ST[t.st][2]}" style="top:${(t.h-H0)*56+2}px;height:${t.dur*56-4}px" onclick="event.stopPropagation();verTurno(${t.id})"><b>${pc.n}</b><span>${hh(t.h)} · ${t.mot}</span></div>`}).join('')}
    </div>`});
  return head('Agenda',fmtD(d).replace(/^./,c=>c.toUpperCase())+' · tocá un horario libre para dar un turno',`<button class="btn btn-p" onclick="nuevoTurno()">+ Nuevo turno</button>`)+`
  <div class="daysw">${days.map((x,i)=>`<button class="${i===selDay?'on':''}" onclick="selDay=${i};render()"><small>${DN[x.getDay()]}</small><b>${x.getDate()}</b></button>`).join('')}</div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">${Object.values(ST).map(s=>`<span class="pill ${s[1]}">${s[0]}</span>`).join('')}</div>
  <div class="cal">
    <div class="hd" style="border-right:1px solid var(--line)"></div>
    ${PROS.map(p=>`<div class="hd" style="border-left:1px solid #f3efe9"><span class="av" style="width:26px;height:26px;font-size:10px;background:${p.c}">${ini(p.n.replace(/^Dr[a]?\. /,''))}</span><div><div style="font-size:13px">${p.n}</div><div class="mut hide-m" style="font-weight:400">${p.e}</div></div></div>`).join('')}
    <div>${hours.map(h=>`<div class="hr">${hh(h)}</div>`).join('')}</div>
    ${cols.join('')}
  </div>`;
}
function verTurno(id){
  const t=TUR.find(x=>x.id===id),p=pac(t.pac);
  openM(`<h3>Turno</h3>
   <div class="row" style="border:none"><div class="av" style="background:${avc(p.id)}">${ini(p.n)}</div><div class="grow"><div class="b">${p.n}</div><div class="mut">${p.os} · ${p.tel}</div></div></div>
   <div class="card" style="background:#fbfaf7;margin:8px 0 14px">
     <div class="mut">Fecha y hora</div><div class="b" style="margin-bottom:8px">${fmtD(addD(t.d))} · ${hh(t.h)} a ${hh(t.h+t.dur)}</div>
     <div class="mut">Profesional</div><div class="b" style="margin-bottom:8px">${pro(t.p).n}</div>
     <div class="mut">Motivo</div><div class="b">${t.mot}</div>

function setSt(id,k){TUR.find(x=>x.id===id).st=k;toast('Estado actualizado: '+ST[k][0]);verTurno(id);render()}
function nuevoTurno(pid='lf',h=9){
  openM(`<h3>Nuevo turno</h3>
   <div class="field"><label>Paciente</label><select class="inp" id="nt-pac">${PAC.map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select></div>
   <div class="field"><label>Profesional</label><select class="inp" id="nt-pro">${PROS.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${p.n}</option>`).join('')}</select></div>

     <div class="field"><label>Hora</label><select class="inp" id="nt-h">${[...Array(24)].map((_,i)=>8+i/2).map(x=>`<option value="${x}" ${x===h?'selected':''}>${hh(x)}</option>`).join('')}</select></div>
   </div>
   <div class="mrow">
     <div class="field"><label>Duración</label><select class="inp" id="nt-dur"><option value=".5">30 min</option><option value="1" selected>1 hora</option><option value="1.5">1 h 30</option></select></div>
     <div class="field"><label>Motivo</label><input class="inp" id="nt-mot" value="Consulta"></div>
   </div>
   <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:4px"><input type="checkbox" checked> Enviar recordatorio por WhatsApp</label>
   <div class="mact"><button class="btn btn-g" onclick="closeM()">Cancelar</button><button class="btn btn-p" onclick="guardarTurno()">Guardar turno</button></div>`);
}
function guardarTurno(){
  const g=id=>document.getElementById(id).value;
  const t={id:++turnoId,pac:+g('nt-pac'),p:g('nt-pro'),d:+g('nt-d'),h:+g('nt-h'),dur:+g('nt-dur'),mot:g('nt-mot')||'Consulta',st:'pend'};
  const clash=TUR.some(x=>x.d===t.d&&x.p===t.p&&t.h<x.h+x.dur&&x.h<t.h+t.dur);
  if(clash){toast('⚠ Ese horario se superpone con otro turno');return}
  TUR.push(t);selDay=t.d;closeM();view='agenda';fichaId=null;render();toast('Turno guardado para '+pac(t.pac).n);
}

  const list=PAC.filter(p=>(p.n+p.dni+p.os).toLowerCase().includes(q.toLowerCase()));
  return head('Pacientes',`${PAC.length} pacientes en la demo`,`<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="inp" placeholder="Buscar por nombre, DNI u obra social" value="${q}" oninput="q=this.value;const c=this.selectionStart;render();const i=document.querySelector('.search input');i.focus();i.setSelectionRange(c,c)"></div><button class="btn btn-p" onclick="nuevoPac()">+ Paciente</button>`)+`

function nuevoPac(){
  openM(`<h3>Nuevo paciente</h3>

  <div class="mrow"><div class="field"><label>DNI</label><input class="inp" id="np-dni"></div><div class="field"><label>Edad</label><input class="inp" id="np-ed" type="number"></div></div>
  <div class="mrow"><div class="field"><label>Teléfono (WhatsApp)</label><input class="inp" id="np-tel"></div><div class="field"><label>Obra social</label><select class="inp" id="np-os"><option>Particular</option><option>OSDE 210</option><option>Swiss Medical</option><option>APROSS</option><option>PAMI</option><option>Sancor Salud</option></select></div></div>
  <div class="field"><label>Alergias / antecedentes</label><input class="inp" id="np-al" placeholder="Opcional"></div>
  <div class="mact"><button class="btn btn-g" onclick="closeM()">Cancelar</button><button class="btn btn-p" onclick="guardarPac()">Crear ficha</button></div>`);

  const g=id=>document.getElementById(id).value.trim();

  PAC.push(p);closeM();abrirFicha(p.id);toast('Ficha creada');

/* ======= FICHA ======= */
function abrirFicha(id){fichaId=id;fichaTab='odo';view='pacientes';render();window.scrollTo(0,0)}
function vFicha(){
  const p=pac(fichaId);
  const prox=TUR.filter(t=>t.pac===p.id&&t.st!=='done').sort((a,b)=>a.d-b.d||a.h-b.h)[0];
  return `<button class="mut" style="margin-bottom:12px" onclick="fichaId=null;render()">← Volver a pacientes</button>
  <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
    <div class="av" style="width:58px;height:58px;font-size:19px;background:${avc(p.id)}">${ini(p.n)}</div>
    <div class="grow"><h2 class="serif" style="font-size:28px">${p.n}</h2><div class="mut">${p.ed} años · DNI ${p.dni} · ${p.tel}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="pill p-t">${p.os}</span>${p.al?`<span class="pill p-bad">⚠ ${p.al}</span>`:''}</div></div>
    <div style="text-align:right"><div class="mut">Próximo turno</div><div class="b">${prox?`${DN[addD(prox.d).getDay()]} ${addD(prox.d).getDate()} · ${hh(prox.h)}`:'Sin turnos'}</div>
      <button class="btn btn-s" style="margin-top:6px" onclick="nuevoTurno()">+ Turno</button></div>
  </div>
  <div class="tabs">${[['odo','Odontograma'],['hist','Historia clínica'],['trat','Tratamientos']].map(([k,l])=>`<button class="${fichaTab===k?'on':''}" onclick="fichaTab='${k}';render()">${l}</button>`).join('')}</div>
  ${fichaTab==='odo'?odograma(p):fichaTab==='hist'?historia(p):tratPac(p)}`;
}
let brush='caries';
function toothSVG(st){
  const c=ODO_STATES.find(s=>s[0]===st)[1];
  if(st==='aus')return `<svg viewBox="0 0 34 38"><path d="M7 6c3-3 7-1 10 0 3-1 7-3 10 0 3 4 1 10-1 15-1 4-1 13-4 13-2 0-2-8-5-8s-3 8-5 8c-3 0-3-9-4-13C6 16 4 10 7 6z" fill="#f4f6f6" stroke="#cfd5d5" stroke-dasharray="3 2"/><path d="M9 9l16 18M25 9L9 27" stroke="#9aa6a6" stroke-width="2"/></svg>`;
  return `<svg viewBox="0 0 34 38"><path d="M7 6c3-3 7-1 10 0 3-1 7-3 10 0 3 4 1 10-1 15-1 4-1 13-4 13-2 0-2-8-5-8s-3 8-5 8c-3 0-3-9-4-13C6 16 4 10 7 6z" fill="${c}" stroke="#9fb0b0" stroke-width="1.2"/>${st==='imp'?'<path d="M17 20v14M13 24h8M13 28h8" stroke="#2f7a5a" stroke-width="1.5"/>':''}${st==='end'?'<path d="M14 14v16M20 14v16" stroke="#6a4f9a" stroke-width="1.6"/>':''}</svg>`;
}
function odograma(p){
  const o=ODO[p.id]||(ODO[p.id]={});
  const q1=[18,17,16,15,14,13,12,11],q2=[21,22,23,24,25,26,27,28],q4=[48,47,46,45,44,43,42,41],q3=[31,32,33,34,35,36,37,38];
  const t=n=>`<div class="tooth" onclick="paint(${p.id},${n})" title="Pieza ${n}">${toothSVG(o[n]||'sano')}<small>${n}</small></div>`;
  const cnt=k=>Object.values(o).filter(v=>v===k).length;
  return `<div class="card">
   <h3>Odontograma <span class="mut" style="font-weight:400">Elegí un estado y tocá la pieza</span></h3>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${ODO_STATES.map(s=>`<button class="pill" style="padding:6px 10px;background:${brush===s[0]?'var(--teal)':'#f3f5f5'};color:${brush===s[0]?'#fff':'var(--ink)'}" onclick="brush='${s[0]}';render()"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s[1]};border:1px solid #b9c4c4;margin-right:5px;vertical-align:-1px"></i>${s[2]}</button>`).join('')}</div>
   <div class="odo" style="overflow-x:auto">
     <div class="odo-row">${q1.map(t).join('')}<div class="sep"></div>${q2.map(t).join('')}</div>
     <div style="width:100%;max-width:700px;border-top:1px dashed var(--line)"></div>
     <div class="odo-row">${q4.map(t).join('')}<div class="sep"></div>${q3.map(t).join('')}</div>
   </div>
   <div class="legend" style="margin-top:12px">${ODO_STATES.slice(1).map(s=>`<span><i style="background:${s[1]}"></i>${s[2]}: <b>${cnt(s[0])}</b></span>`).join('')}</div>
  </div>`;
}
function paint(pid,n){const o=ODO[pid];if(brush==='sano')delete o[n];else o[n]=brush;render();toast(`Pieza ${n}: ${ODO_STATES.find(s=>s[0]===brush)[2]}`)}
function historia(p){
  const h=HIST[p.id]||(HIST[p.id]=[]);
  return `<div class="grid g2e"><div class="card"><h3>Evoluciones</h3>
   ${h.length?`<div class="tl">${h.map(e=>`<div class="tl-i"><div class="mut">${e[0]} · ${pro(e[2]).n}</div><div style="margin-top:3px;line-height:1.5">${e[1]}</div></div>`).join('')}</div>`:'<p class="mut">Todavía no hay evoluciones cargadas.</p>'}
   </div>
   <div class="card"><h3>Nueva evolución</h3>
   <textarea class="inp" id="ev-txt" rows="5" placeholder="Ej: Se realiza obturación con resina en pieza 37..."></textarea>
   <div class="mact"><button class="btn btn-p" onclick="addEv(${p.id})">Guardar en historia</button></div>
   <div style="margin-top:14px" class="mut">Antecedentes: ${p.al||'sin datos relevantes'}</div></div></div>`;
}
function addEv(pid){const v=document.getElementById('ev-txt').value.trim();if(!v){toast('Escribí la evolución');return}
  const d=today;HIST[pid].unshift([`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`,v,'lf']);render();toast('Evolución guardada')}
function tratCard(t,pid,i){
  const pct=Math.round(t.dn/t.steps.length*100);
  return `<div class="card"><h3>${t.t} <span class="pill ${pct===100?'p-ok':'p-t'}">${pct===100?'Finalizado':pct+'%'}</span></h3>
   <div class="mut" style="margin:-6px 0 10px">${pro(t.p).n}${pid&&!fichaId?` · <a style="color:var(--teal);cursor:pointer" onclick="abrirFicha(${pid});fichaTab='trat';render()">${pac(pid).n}</a>`:''}</div>
   <div class="prog"><div style="width:${pct}%"></div></div>
   <div style="margin-top:10px">${t.steps.map((s,j)=>`<div class="step ${j<t.dn?'dn':''}" onclick="stepT(${pid},${i},${j})"><div class="chk">${j<t.dn?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':''}</div><span>${s}</span></div>`).join('')}</div></div>`;
}
function stepT(pid,i,j){const t=TRAT[pid][i];t.dn=(j<t.dn)?j:j+1;render();toast(t.dn===t.steps.length?'🎉 Tratamiento finalizado':'Avance registrado')}
function tratPac(p){const l=TRAT[p.id]||[];
  return `<div class="grid g2e">${l.map((t,i)=>tratCard(t,p.id,i)).join('')}<div class="card" style="display:grid;place-items:center;border-style:dashed;min-height:140px"><button class="btn btn-s" onclick="nuevoTrat(${p.id})">+ Nuevo plan de tratamiento</button></div></div>`}
function nuevoTrat(pid){
  openM(`<h3>Nuevo tratamiento</h3>
  <div class="field"><label>Tipo</label><select class="inp" id="tr-t"><option>Endodoncia</option><option>Ortodoncia</option><option>Implante</option><option>Blanqueamiento</option><option>Prótesis</option></select></div>
  <div class="field"><label>Profesional</label><select class="inp" id="tr-p">${PROS.map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select></div>
  <div class="mact"><button class="btn btn-g" onclick="closeM()">Cancelar</button><button class="btn btn-p" onclick="saveTrat(${pid})">Crear plan</button></div>`)}
function saveTrat(pid){const t=document.getElementById('tr-t').value;const S={Endodoncia:['Apertura','Instrumentación','Obturación','Reconstrucción'],Ortodoncia:['Estudios','Colocación','Controles','Retiro'],Implante:['Tomografía','Cirugía','Oseointegración','Corona'],Blanqueamiento:['Limpieza','Sesión 1','Sesión 2'],'Prótesis':['Impresiones','Pruebas','Entrega']};
  (TRAT[pid]=TRAT[pid]||[]).push({t,p:document.getElementById('tr-p').value,steps:S[t],dn:0});closeM();render();toast('Plan de tratamiento creado')}

/* ======= TRATAMIENTOS ======= */
function vTrat(){
  const all=Object.entries(TRAT).flatMap(([pid,l])=>l.map((t,i)=>({t,pid:+pid,i})));
  return head('Tratamientos',`${all.filter(x=>x.t.dn<x.t.steps.length).length} en curso · tocá un paso para registrar el avance`)+
  `<div class="grid g2e">${all.map(x=>tratCard(x.t,x.pid,x.i)).join('')}</div>`;
}

/* ======= WHATSAPP ======= */
function msgFor(t){const p=pac(t.pac);return `Hola ${p.n.split(' ')[0]} 👋 Te recordamos tu turno en *Centro Sonrisa*:\n📅 ${fmtD(addD(t.d))}\n🕐 ${hh(t.h)} hs con ${pro(t.p).n}\n\nRespondé *SI* para confirmar o *NO* si necesitás reprogramar.`}
function vWA(){
  const man=TUR.filter(t=>t.d===1).sort((a,b)=>a.h-b.h);
  const ex=man[0]||TUR[0];
  return head('Recordatorios WhatsApp','Mensajes automáticos para reducir el ausentismo')+`
  <div class="grid g2">
   <div class="grid" style="align-content:start">
    <div class="card"><div class="row" style="border:none;padding:0">
      <div class="grow"><div class="b">Envío automático</div><div class="mut">Se manda solo, sin que la secretaria tenga que escribir.</div></div>
      <button class="toggle ${WA_ON?'on':''}" onclick="WA_ON=!WA_ON;render();toast(WA_ON?'Recordatorios activados':'Recordatorios pausados')"></button></div>
      <div class="field" style="margin-top:14px"><label>Anticipación</label><select class="inp" onchange="WA_HOURS=+this.value;render()">${[2,12,24,48].map(h=>`<option value="${h}" ${h===WA_HOURS?'selected':''}>${h} horas antes</option>`).join('')}</select></div>
    </div>
    <div class="card"><h3>Programados para mañana <span class="mut" style="font-weight:400">${man.length} mensajes</span></h3>
      ${man.map(t=>{const p=pac(t.pac);const sent=WA_SENT.includes(t.id);return `<div class="row"><div class="av" style="background:${avc(p.id)}">${ini(p.n)}</div><div class="grow"><div class="b">${p.n}</div><div class="mut">${hh(t.h)} · ${p.tel}</div></div>${sent?'<span class="pill p-ok">✓✓ Enviado</span>':`<button class="btn btn-wa" style="padding:6px 10px;font-size:12px" onclick="enviarWA(${t.id})">Enviar ahora</button>`}</div>`}).join('')}
    </div>
   </div>
   <div class="card"><h3>Vista previa del paciente</h3>
     <div class="phone">
       <div class="bub">${msgFor(ex).replace(/\*(.+?)\*/g,'<b>$1</b>')}<small>09:00 ✓✓</small></div>
       <div class="bub in">SI, confirmo 🙌<small>09:12</small></div>
       <div class="bub">¡Gracias! Tu turno quedó <b>confirmado</b> ✅ Te esperamos.<small>09:12 ✓✓</small></div>
     </div>
     <p class="mut" style="margin-top:10px">Cuando el paciente responde "SI", el turno pasa a <span class="pill p-t">Confirmado</span> en la agenda automáticamente.</p>
   </div>
  </div>`;
}
function enviarWA(id){
  const t=TUR.find(x=>x.id===id),p=pac(t.pac);
  openM(`<h3>Recordatorio enviado</h3><div class="phone" style="min-height:0"><div class="bub">${msgFor(t).replace(/\*(.+?)\*/g,'<b>$1</b>')}<small>ahora ✓✓</small></div></div>
  <p class="mut" style="margin-top:10px">Simulación: en la versión real se envía al ${p.tel}.</p>
  <div class="mact"><button class="btn btn-g" onclick="closeM()">Cerrar</button><button class="btn btn-p" onclick="simConf(${id})">Simular respuesta "SI"</button></div>`);
  if(!WA_SENT.includes(id))WA_SENT.push(id);
}
function simConf(id){TUR.find(x=>x.id===id).st='conf';closeM();render();toast('El paciente confirmó → turno Confirmado')}

/* ======= MODAL ======= */
function openM(h){document.getElementById('modal').innerHTML=h;document.getElementById('ov').classList.add('show')}
function closeM(){document.getElementById('ov').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
</script>
</body>
</html>

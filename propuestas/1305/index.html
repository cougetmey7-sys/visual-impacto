<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<title>13.05 Indumentaria Laboral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Archivo:wdth,wght@125,800&display=swap" rel="stylesheet">
<style>
/* VOICE: taller de uniformes, seguro y directo, como un probador de prendas.
   IDEA: probador virtual — la prenda vuela del perchero (rail) al cuerpo del modelo.
   PICTURE: el modelo de cuerpo entero en el centro, fotos reales del catálogo 13.05.
   COLOUR and TYPE: negro de marca, amarillo 13.05 #FCE00F de acento; Inter + Archivo Expanded.
   LAYOUT: una sola pantalla; copy a la izquierda, rail a la derecha, pill de cotización abajo. */
:root{--bg:#0E0E0F;--nav:#151516;--ink:#F4F4F2;--muted:#9C9C98;--y:#FCE00F;--line:rgba(255,255,255,.08);
  --u:min(calc(100vw/1440),calc(100vh/900));--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:3px}
.hero{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

/* fondo */
.bgs{position:absolute;inset:-6%;z-index:0}
.bgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(48px) saturate(.7) brightness(.45);opacity:0}
.bgs img.on{opacity:.35}
.bgs::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 55%,transparent,var(--bg) 78%)}
.mark{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);z-index:0;font:800 calc(330*var(--u))/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px rgba(252,224,15,.10);white-space:nowrap;pointer-events:none}

/* escenario */
.stage{position:absolute;z-index:1;
  -webkit-mask-image:radial-gradient(ellipse 40% 58% at 50% 40%,#000 58%,transparent 100%),linear-gradient(to bottom,#000 80%,transparent);
  -webkit-mask-composite:source-in;mask-image:radial-gradient(ellipse 40% 58% at 50% 40%,#000 58%,transparent 100%),linear-gradient(to bottom,#000 80%,transparent);mask-composite:intersect}
.stage::after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse 60% 65% at 50% 42%,transparent 55%,rgba(14,14,15,.55));pointer-events:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0;opacity:0}
.stage img.on{opacity:1}

/* nav */
.nav{position:absolute;top:0;left:0;right:0;z-index:5;height:max(calc(54*var(--u)),46px);background:var(--nav);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 max(calc(24*var(--u)),14px)}
.nav .l{display:flex;align-items:center;gap:max(calc(8*var(--u)),6px);font-size:max(calc(14.5*var(--u)),13px);letter-spacing:-.005em}
.nav .l svg{width:max(calc(10*var(--u)),9px);height:auto}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:max(calc(28*var(--u)),24px);display:block}
.nav .r{display:flex;align-items:center;gap:max(calc(10*var(--u)),8px);font-size:max(calc(14*var(--u)),13px);font-weight:500}
.nav .r svg{width:max(calc(20*var(--u)),18px);height:max(calc(20*var(--u)),18px)}
.nav .r:hover{color:var(--y)}
.nav .short{display:none}

/* copy */
.copy{position:absolute;z-index:3;left:calc(64*var(--u));top:calc(50vh - 186*var(--u))}
.eyebrow{font-weight:500;font-size:calc(11.4*var(--u));letter-spacing:.22em;text-transform:uppercase;color:var(--y);line-height:1}
.mask{position:relative;overflow:hidden}
.mask span{display:block;white-space:nowrap}
h1{margin:calc(16*var(--u)) 0 0;font-weight:400;font-size:calc(52*var(--u));letter-spacing:-.025em;line-height:1.12}
.sub{margin-top:calc(10*var(--u));font-size:calc(21*var(--u));letter-spacing:-.01em;line-height:1.25;color:var(--muted)}
.cta{margin-top:calc(28*var(--u));display:inline-flex;align-items:center;gap:calc(12*var(--u));height:calc(44*var(--u));padding:0 calc(20*var(--u));border:1px solid var(--ink);font-size:calc(14.5*var(--u));transition:background .3s,color .3s,border-color .3s}
.cta svg{width:calc(15*var(--u));height:calc(15*var(--u))}
.cta:hover{background:var(--y);border-color:var(--y);color:#111}
.note{margin-top:calc(18*var(--u));font-size:calc(13*var(--u));color:var(--muted);line-height:1.5}
.note b{color:var(--ink);font-weight:500}

/* rail */
.rail,.fly{position:absolute;inset:0;pointer-events:none}
.rail{z-index:2}.fly{z-index:4}
.card{position:absolute;pointer-events:auto;cursor:pointer;border-radius:calc(10*var(--u));overflow:hidden;background:#1b1b1c center 22%/cover no-repeat;
  box-shadow:0 calc(14*var(--u)) calc(40*var(--u)) rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.10)}
.card span{position:absolute;left:0;right:0;bottom:0;padding:calc(26*var(--u)) calc(12*var(--u)) calc(10*var(--u));font-size:calc(12.5*var(--u));font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.78));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fly .card{pointer-events:none}
.dots{position:absolute;z-index:2;display:flex;gap:calc(5*var(--u))}
.dots i{display:block;height:calc(2*var(--u));min-height:2px;width:calc(5*var(--u));border-radius:2px;background:rgba(255,255,255,.22);transition:width .35s var(--ease),background .35s var(--ease)}
.dots i.on{width:calc(20*var(--u));background:var(--y)}
.track{position:absolute;z-index:2;right:calc(17*var(--u));top:calc(50vh - 234*var(--u));width:calc(3*var(--u));height:calc(69*var(--u));border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden}
.track b{position:absolute;left:0;right:0;top:0;height:16.6667%;background:var(--y);border-radius:3px;transition:transform .5s var(--ease)}

/* pill */
.pill{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(46*var(--u));width:calc(520*var(--u));height:calc(62*var(--u));background:#fff;color:#131313;border-radius:calc(10*var(--u));
  box-shadow:0 calc(8*var(--u)) calc(30*var(--u)) rgba(0,0,0,.35);display:flex;align-items:center;padding:0 calc(10*var(--u)) 0 calc(11*var(--u))}
.thumb{width:calc(42*var(--u));height:calc(42*var(--u));border-radius:calc(5*var(--u));background:#eee center 20%/cover no-repeat;flex:none}
.meta{margin-left:calc(14*var(--u));flex:1;line-height:1.25;overflow:hidden}
.meta .n{font-weight:500;font-size:calc(13*var(--u));letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:calc(11.5*var(--u));color:#5f6064;margin-top:calc(3*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.size{font-size:calc(13*var(--u));margin:0 calc(18*var(--u));white-space:nowrap;color:#3a3b3e}
.buy{display:flex;align-items:center;gap:calc(9*var(--u));height:calc(42*var(--u));padding:0 calc(15*var(--u)) 0 calc(13*var(--u));background:var(--y);color:#111;font-size:calc(14*var(--u));font-weight:500;border-radius:calc(6*var(--u));white-space:nowrap;transition:background .25s}
.buy:hover{background:#111;color:var(--y)}
.buy svg{width:calc(16*var(--u));height:calc(16*var(--u))}
.fade{transition:opacity .15s linear}
.drag{position:absolute;z-index:3;right:calc(44*var(--u));bottom:calc(66*var(--u));display:flex;align-items:center;gap:calc(12*var(--u));font-size:calc(14.5*var(--u));color:var(--muted)}
.drag svg{width:calc(15*var(--u));height:calc(15*var(--u))}

/* carga */
.tiles{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(6,1fr)}
.tiles i{background:var(--nav);margin:-.5px}
.tiles i.x{visibility:hidden}

/* teléfono */
@media (max-width:819.98px){
  :root{--u:calc(100vw/390)}
  .mark{font-size:44vw;top:48%}
  .nav{height:52px;padding:0 16px}.nav .l{font-size:14px}.nav .l .long,.nav .r .num{display:none}.nav .short{display:inline}.logo{height:22px}.nav .r{font-size:13px}.nav .r svg{width:20px;height:20px}
  .copy{left:20px;right:20px;top:72px}
  .eyebrow{font-size:10.5px}
  h1{font-size:clamp(30px,9vw,40px);margin-top:12px}
  .sub{font-size:16px;margin-top:6px}
  .cta{height:38px;padding:0 16px;font-size:13.5px;margin-top:16px;gap:10px}.cta svg{width:14px;height:14px}
  .note,.drag,.track{display:none}
  .card{border-radius:8px}.card span{font-size:10.5px;padding:18px 7px 6px}
  .dots{gap:4px}.dots i{height:2px;width:5px}.dots i.on{width:18px}
  .pill{left:12px;right:12px;transform:none;width:auto;bottom:calc(12px + env(safe-area-inset-bottom));height:60px;border-radius:12px;padding:0 9px 0 10px}
  .thumb{width:40px;height:40px;border-radius:6px}.meta{margin-left:11px}.meta .n{font-size:12px}.meta .s{font-size:11px;margin-top:2px}
  .size{display:none}
  .buy{height:42px;padding:0 13px;font-size:13px;border-radius:8px;gap:8px}.buy svg{width:15px;height:15px}
  .tiles{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(9,1fr)}
}
@media (max-width:819.98px) and (max-height:519.98px){.copy{top:62px}h1{font-size:28px}.sub{font-size:14px}.cta{height:34px}}
@media (prefers-reduced-motion:reduce){.tiles{display:none}}
</style>
</head>

 {t:'Remera Premium',n:'Remera Premium 24.1',line:'Línea Comercio',sub:'Algodón peinado · no encoge',size:'Talles XS al 3XL',img:'p5'}
];
const N=P.length,WA='https://wa.me/5493515332360?text=';
const $=id=>document.getElementById(id);
const hero=$('hero'),stage=$('stage'),bgs=$('bgs'),rail=$('rail'),fly=$('fly'),dots=$('dots');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mod=i=>((i%N)+N)%N;

// imágenes como blob (una sola copia del base64)
const URLS={};
for(const k in IMG){const b=atob(IMG[k].split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);URLS[k]=URL.createObjectURL(new Blob([a],{type:'image/webp'}))}
$('logo').src=URLS.logo;

const plates=[],blurs=[];
P.forEach((p,i)=>{
  const a=new Image();a.src=URLS[p.img];a.alt=p.n+' — foto de catálogo 13.05';a.decoding='async';stage.appendChild(a);plates.push(a);
  const b=new Image();b.src=URLS[p.img];b.alt='';bgs.appendChild(b);blurs.push(b);
});
dots.innerHTML=P.map(()=>'<i></i>').join('');

let cur=0,busy=false,queued=null,G={};
const wa=p=>WA+encodeURIComponent('Hola 13.05! Quiero cotizar '+p.n+' para mi equipo.');

function geo(){
  const vw=innerWidth,vh=innerHeight,phone=vw<820;
  if(!phone){
    const u=Math.min(vw/1440,vh/900),navH=Math.max(54*u,46);
    const sh=vh-navH,sw=Math.min(sh*.56,vw*.40),sl=(vw-sw)/2;
    const cw=168*u,ch=214*u,cy=vh/2-13*u;
    G={u,phone,sl,st:navH,sw,sh,cw,ch,cy,slots:[vw-400*u,vw-150*u],dx:vw-400*u,dy:cy+ch/2+30*u};
  }else{
    const u=vw/390,cta=$('cta').getBoundingClientRect();
    const st=cta.bottom+8,sh=Math.max(160,vh-86-st),sw=Math.min(sh*.56,vw*.72),sl=vw*.42-sw/2;
    const cw=86*u,ch=110*u,cy=st+.40*sh;
    G={u,phone,sl,st,sw,sh,cw,ch,cy,slots:[vw-102*u,vw-10*u],dx:vw-102*u,dy:cy+ch/2+14};
  }
  Object.assign(stage.style,{left:G.sl+'px',top:G.st+'px',width:G.sw+'px',height:G.sh+'px'});
  Object.assign(dots.style,{left:G.dx+'px',top:G.dy+'px'});
}
function card(i,slot){
  const c=document.createElement('button');c.className='card';c.dataset.i=i;c.dataset.slot=slot;
  c.style.backgroundImage='url('+URLS[P[i].img]+')';c.setAttribute('aria-label','Probar '+P[i].n);
  c.innerHTML='<span></span>';c.firstChild.textContent=P[i].t;
  place(c,slot);return c;
}
function place(c,slot){Object.assign(c.style,{left:G.slots[slot]+'px',top:(G.cy-G.ch/2)+'px',width:G.cw+'px',height:G.ch+'px'})}
function buildRail(anim){
  rail.innerHTML='';
  [mod(cur+1),mod(cur+2)].forEach((i,s)=>{const c=card(i,s);rail.appendChild(c);
    if(anim&&!RM)c.animate([{transform:`translateX(${45*G.u}px)`,opacity:0},{transform:'none',opacity:1}],{duration:350,easing:'cubic-bezier(.22,.61,.36,1)',fill:'backwards',delay:s*60})});
}
function setDots(){[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===cur));$('trackb').style.transform=`translateY(${cur*100}%)`}
function setPill(){const p=P[cur];$('pthumb').style.backgroundImage='url('+URLS[p.img]+')';$('pname').textContent=p.n;$('psub').textContent=p.line;$('psize').textContent=p.size;$('buy').href=wa(p);$('cta').href=wa(p)}
function setText(){$('title').firstElementChild.textContent=P[cur].t;$('sub').firstElementChild.textContent=P[cur].sub;$('eyebrow').textContent=P[cur].line}

function rollText(id,txt){
  const m=$(id),old=m.firstElementChild,nu=document.createElement('span');nu.textContent=txt;
  Object.assign(old.style,{position:'absolute',left:0,top:0});
  old.animate([{transform:'translateY(0)'},{transform:'translateY(-105%)'}],{duration:250,delay:100,easing:'cubic-bezier(.55,0,.8,.3)',fill:'forwards'}).onfinish=()=>old.remove();
  m.appendChild(nu);
  nu.animate([{transform:'translateY(105%)'},{transform:'translateY(0)'}],{duration:450,delay:350,easing:'cubic-bezier(.22,.61,.36,1)',fill:'backwards'});
}

function go(T){
  T=mod(T);if(T===cur)return;
  if(busy){queued=T;return}
  const A=cur;cur=T;
  if(RM){plates[A].classList.remove('on');blurs[A].classList.remove('on');plates[T].classList.add('on');blurs[T].classList.add('on');setText();buildRail(false);setDots();setPill();return}
  busy=true;clearTimeout(timer);
  // capas
  [plates,blurs].forEach(L=>{L[A].style.zIndex=1;L[T].style.zIndex=2;L[T].classList.add('on');
    L[T].animate([{opacity:0},{opacity:getComputedStyle(L[T]).opacity}],{duration:760,delay:420,easing:'cubic-bezier(.45,0,.25,1)',fill:'backwards'}).onfinish=()=>{L[A].classList.remove('on');L[A].style.zIndex='';L[T].style.zIndex=''}});
  // texto
  rollText('title',P[T].t);rollText('sub',P[T].sub);
  setTimeout(()=>{$('eyebrow').textContent=P[T].line},350);
  // vuelo
  let f=rail.querySelector(`.card[data-i="${T}"]`),fromRail=!!f;
  if(f){const r=f.getBoundingClientRect();f.remove();Object.assign(f.style,{left:r.left+'px',top:r.top+'px'})}else f=card(T,0);
  fly.appendChild(f);
  rail.querySelectorAll('.card').forEach(c=>c.animate([{opacity:1},{opacity:0}],{duration:200,delay:100,fill:'forwards'}));
  const r=f.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const tx=G.sl+G.sw/2,ty=G.st+G.sh*.42,k=(G.sw*.36)/G.cw;
  f.style.transformOrigin='50% 50%';
  f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${tx-cx}px,${ty-cy}px) scale(${k})`}],{duration:950,delay:60,easing:'cubic-bezier(.22,.9,.3,1)',fill:'both'});
  const ok=fromRail?[{opacity:1},{opacity:1,offset:.45},{opacity:.6,offset:.72},{opacity:0}]:[{opacity:0},{opacity:1,offset:.18},{opacity:1,offset:.45},{opacity:.6,offset:.72},{opacity:0}];
  f.animate(ok,{duration:1010,delay:60,easing:'ease-in-out',fill:'both'}).onfinish=()=>f.remove();
  // a los 600 ms
  setTimeout(()=>{
    buildRail(true);setDots();
    const els=[$('pthumb'),$('pmeta'),$('psize')];els.forEach(e=>e.style.opacity=0);
    setTimeout(()=>{setPill();els.forEach(e=>e.style.opacity=1)},150);
  },600);
  setTimeout(()=>{busy=false;if(queued!==null){const q=queued;queued=null;go(q)}else schedule()},1200);
}
function step(d){const base=busy&&queued!==null?queued:cur,t=mod(base+d);if(busy){queued=t===cur?null:t}else go(t)}

// autoplay
let timer=0,holdUntil=0,hoverPause=false,pressed=false;
function schedule(){clearTimeout(timer);if(RM)return;timer=setTimeout(tick,Math.max(2000,holdUntil-Date.now()))}
function tick(){
  if(busy)return;
  if(hoverPause||pressed||document.hidden){timer=setTimeout(tick,400);return}
  if(Date.now()<holdUntil){schedule();return}
  go(cur+1);
}
const hold=()=>{holdUntil=Date.now()+6000};

// rueda
let acc=0,lastWheel=0,lastStep=0;
addEventListener('wheel',e=>{
  e.preventDefault();
  let d=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?innerHeight:1);
  const now=performance.now();
  if(now-lastWheel>250||Math.sign(d)!==Math.sign(acc))acc=0;
  lastWheel=now;acc+=d;hold();
  if(Math.abs(acc)>=50&&now-lastStep>=140){step(acc>0?1:-1);acc=0;lastStep=now}
},{passive:false});

// arrastre / swipe
let sx=0,sy=0,dragged=false,ptype='';
hero.addEventListener('pointerdown',e=>{pressed=true;sx=e.clientX;sy=e.clientY;dragged=false;ptype=e.pointerType});
addEventListener('pointerup',e=>{
  if(!pressed)return;pressed=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.hypot(dx,dy)>40){
    dragged=true;hold();
    if(Math.abs(dx)>=Math.abs(dy))step(dx<0?1:-1);
    else if(ptype!=='mouse')step(dy<0?1:-1);
  }
});
addEventListener('pointercancel',()=>{pressed=false});
hero.addEventListener('click',e=>{
  if(dragged){e.preventDefault();dragged=false;return}
  const c=e.target.closest('.rail .card');if(c){hold();go(+c.dataset.i)}
},true);
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();hold();step(1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();hold();step(-1)}
});
document.addEventListener('pointerover',e=>{hoverPause=e.pointerType==='mouse'&&!!e.target.closest('.card,.pill,.cta')});
document.documentElement.addEventListener('mouseleave',()=>{hoverPause=false});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)schedule()});

let rz=0;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{geo();rail.querySelectorAll('.card').forEach(c=>place(c,+c.dataset.slot))})});

// inicio
geo();plates[0].classList.add('on');blurs[0].classList.add('on');setText();buildRail(false);setDots();setPill();

function reveal(){
  const t=$('tiles');if(RM){t.remove();return}
  const n=innerWidth<820?45:60;t.innerHTML='<i></i>'.repeat(n);
  const tiles=[...t.children],ord=tiles.map((_,i)=>i);
  for(let i=ord.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ord[i],ord[j]]=[ord[j],ord[i]]}
  const t0=performance.now();let k=0;
  (function f(now){const want=Math.min(n,Math.floor((now-t0)/600*n));while(k<want)tiles[ord[k++]].classList.add('x');if(k<n)requestAnimationFrame(f);else t.remove()})(t0);
  setTimeout(()=>t.remove(),1000);
  setTimeout(schedule,600);
}
if(!RM){$('tiles').innerHTML='<i></i>'.repeat(innerWidth<820?45:60)}
let started=false;const start=()=>{if(started)return;started=true;reveal()};
Promise.all([plates[0].decode(),plates[1].decode()]).then(start,start);
setTimeout(start,1800);
}
</script>
</body>
</html>

/* ---------- Interacción ---------- */
function agRender(){$('#view').innerHTML=planning()}
document.addEventListener('click',(e)=>{
  const tab=e.target.closest('[data-pltab]'); if(tab){PL.tab=tab.dataset.pltab;return agRender()}
  const c=e.target.closest('[data-ag]');
  if(c){
    const a=c.dataset.ag;
    if(a.startsWith('v-')) AG.vista=a.slice(2);
    else if(a==='hoy') AG.fecha=new Date(PL_HOY);
    else{
      const s=a==='next'?1:-1;
      if(AG.vista==='dia') AG.fecha=addD(AG.fecha,s);
      else if(AG.vista==='semana') AG.fecha=addD(AG.fecha,7*s);
      else AG.fecha=new Date(AG.fecha.getFullYear(),AG.fecha.getMonth()+s,1);
    }
    return agRender();
  }
  const dd=e.target.closest('[data-ag-dia]'); if(dd){AG.fecha=new Date(dd.dataset.agDia+'T00:00');AG.vista='dia';return agRender()}
  const ms=e.target.closest('[data-ag-sel]'); if(ms){AG.fecha=new Date(ms.dataset.agSel+'T00:00');return agRender()}
  const r=e.target.closest('[data-agr]'); if(r) return plDetalle(+r.dataset.agr);
  const h=e.target.closest('[data-agh]'); if(h) return habDetalle(h.dataset.agh);
  const t=e.target.closest('[data-agt]'); if(t) return tareaDetalle(+t.dataset.agt);
  const p=e.target.closest('[data-ag-plan]');
  if(p){cerrar();PL.tab='planning';PL.inicio=addD(AG.fecha,0);agRender();const row=[...document.querySelectorAll('.r-label b')].find(b=>b.textContent===p.dataset.agPlan);row&&row.scrollIntoView({block:'center'})}
});
document.addEventListener('change',(e)=>{if(e.target.id==='ag-fecha'&&e.target.value){AG.fecha=new Date(e.target.value+'T00:00');agRender()}});

/* =========================================================
   RESERVAS · ACCIONES
   Una sola implementación para todo el sistema: la ficha, el Planning,
   la Agenda e Inicio llaman a estas mismas funciones.
   ========================================================= */
const NOPERM='No tenés permiso para esta acción';
const limpiar=(s)=>String(s??'').replace(/[<>"]/g,'').trim();
const parseMonto=(v)=>Number(String(v??'').replace(/\D/g,''))||0;
const fmtMonto=(n)=>n?Number(n).toLocaleString('es-AR'):'';
const hhmmAhora=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const normaliza=(s)=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fechaCorta=(d)=>d.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','');

function logRes(r,accion,detalle=''){
  const d=new Date();
  r.historial.push({ts:d,hora:d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}),usuario:usuarioActual.nombre,accion,detalle});
}
/* Un pago = un movimiento de Caja vinculado a la reserva. El saldo se recalcula solo. */
function registrarPago(r,monto,medio,concepto){
  registrarMovimiento('ingreso',`${concepto} · Reserva #${r.nro} · ${r.huesped}`,{monto,medio,reserva:r.nro});
  logRes(r,'Pago registrado',`${concepto} · ${ars(monto)} · ${medio}`);
  auditar('Registró un pago',`Reserva #${r.nro} · ${ars(monto)} · ${medio}`);
}
const conceptoPago=(r,monto)=>r.pagado===0&&monto<r.total?'Seña':monto>=saldoDe(r)?'Saldo':'Pago parcial';

function puedeCheckin(r){
  if(r.estado==='inhouse') return {ok:false,motivo:'El check-in ya está hecho'};
  if(r.estado!=='confirmada'&&r.estado!=='pendiente') return {ok:false,motivo:'No disponible para esta reserva'};
  if(r.ingreso>HOY) return {ok:false,motivo:`Disponible el día de llegada (${ddmm(r.ingreso)})`};
  if(r.salida<=HOY) return {ok:false,motivo:'La fecha de salida ya pasó'};
  const ocup=RESERVAS.find(o=>o!==r&&o.hab===r.hab&&o.estado==='inhouse');
  if(ocup) return {ok:false,motivo:`La Hab. ${r.hab} sigue ocupada por ${ocup.huesped}`};
  {const b=bloqueoEn(r.hab,HOY); if(b){const i=incidenciaDePar(b,r);return {ok:false,motivo:`La Hab. ${r.hab} está ${b.tipoBloqueo==='manual'?'bloqueada':'en mantenimiento'} (${b.id||''}${i?' · conflicto '+i.id:''}). Adrián tiene que resolver el conflicto antes del check-in.`}}}
  if(limpieza.includes(r.hab)) return {ok:false,motivo:`La Hab. ${r.hab} está pendiente de limpieza`};
  /* Una reserva pendiente de confirmar puede confirmarse y hacer el check-in en un solo paso */
  return {ok:true,confirmar:r.estado==='pendiente'};
}
function puedeCheckout(r){
  if(r.estado!=='inhouse') return {ok:false,motivo:r.estado==='finalizada'?'El check-out ya está hecho':'Solo para huéspedes alojados'};
  return {ok:true,anticipada:r.salida>HOY};
}

function accionFicha(k,i){
  const acciones={
    ver:()=>{cerrar();abrirFicha(i)},
    editar:()=>abrirFormReserva({idx:i}),
    pago:()=>accionPago(i),
    checkin:()=>accionCheckin(i),
    checkout:()=>accionCheckout(i),
    habitacion:()=>accionHabitacion(i),
    cancelar:()=>accionCancelar(i),
    huesped:()=>verHuesped(i),
    planning:()=>verEnPlanning(i),
    destino:()=>accionDestino(i)
  };
  if(acciones[k]) acciones[k]();
}

/* ---------- Registrar pago ---------- */
function accionPago(idx){
  const r=RESERVAS[idx];
  if(!puede('cobros.registrar')) return aviso(NOPERM);
  const saldo=saldoDe(r);
  if(!saldo||r.estado==='cancelada') return aviso('Esta reserva no tiene saldo pendiente');
  modal(`<form id="pgf" novalidate><div class="modal-head"><div><h2>Registrar pago</h2><p>Reserva #${r.nro} · ${r.huesped} · Hab. ${r.hab}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="money3" style="margin:0 0 16px">
      <div><small>Total</small><b class="num">${ars(r.total)}</b></div>
      <div class="paid"><small>Pagado</small><b class="num">${ars(r.pagado)}</b></div>
      <div class="due"><small>Saldo pendiente</small><b class="num">${ars(saldo)}</b></div>
    </div>
    <div class="msg bad" id="pg-err" hidden></div>
    <div class="form">
      <div class="field"><label for="pg-monto">Importe ($)</label><input id="pg-monto" inputmode="numeric" value="${fmtMonto(saldo)}" autocomplete="off"></div>
      <div class="field"><label for="pg-medio">Medio de pago</label><select id="pg-medio">${MEDIOS.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="field full"><label for="pg-conc">Concepto</label><select id="pg-conc">${['Seña','Pago parcial','Saldo'].map(c=>`<option${c===conceptoPago(r,saldo)?' selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <p class="note">El pago se registra una sola vez y aparece automáticamente en Caja.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Registrar pago</button></div></form>`);
  $('#pgf').onsubmit=(e)=>{
    e.preventDefault();
    const monto=parseMonto($('#pg-monto').value);
    const err=!monto?'Ingresá un importe mayor a $0.':monto>saldoDe(r)?`El importe supera el saldo pendiente (${ars(saldoDe(r))}).`:chequeoEfectivo($('#pg-medio').value);
    if(err){const b=$('#pg-err');b.textContent=err;b.hidden=false;return}
    registrarPago(r,monto,$('#pg-medio').value,$('#pg-conc').value);
    cerrar();refrescar();
    aviso(`Pago de ${ars(monto)} registrado · saldo ${ars(saldoDe(r))}`);
  };
}

/* ---------- Check-in ---------- */
function accionCheckin(idx){
  const r=RESERVAS[idx];
  if(!puede('checkin.realizar')) return aviso(NOPERM);
  const ck=puedeCheckin(r); if(!ck.ok) return aviso(ck.motivo);
  const saldo=saldoDe(r), conf=ck.confirmar, puedeConf=puede('reservas.modificar');
  modal(`<form id="cif"><div class="modal-head"><div><h2>Check-in</h2><p>Hab. ${r.hab} · ${r.huesped}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    ${conf?`<div class="msg warn">${ic('alert')}<span>Esta reserva está <b>pendiente de confirmar</b>. ${puedeConf?'Podés confirmarla y hacer el check-in en un solo paso.':'Para hacer el check-in, primero tiene que confirmarla alguien con permiso para modificar reservas.'}</span></div>`:''}
    <div class="detail">
      <div><small>Estadía</small><b class="num">${ddmm(r.ingreso)} → ${ddmm(r.salida)} · ${r.noches} ${r.noches===1?'noche':'noches'}</b></div>
      <div><small>Huéspedes</small><b class="num">${r.pax}</b></div>
      <div><small>Pago</small>${payBadge(r)}</div>
      <div><small>Saldo pendiente</small><b class="num">${ars(saldo)}</b></div>
    </div>
    ${saldo?`<div class="msg warn" style="margin-top:14px">${ic('alert')}<span>Tiene un saldo pendiente de ${ars(saldo)}. Podés cobrarlo ahora o más adelante.</span></div>`:''}
    <div class="form" style="margin-top:14px"><div class="field"><label for="ci-hora">Hora de ingreso</label><input id="ci-hora" type="time" value="${hhmmAhora()}"></div></div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>
      ${saldo&&puede('cobros.registrar')?`<button type="button" class="btn" data-fa="pago" data-i="${idx}">${ic('coin')}Registrar pago</button>`:''}
      ${!conf?`<button type="submit" class="btn btn-primary">${ic('in')}Confirmar check-in</button>`:puedeConf?`<button type="submit" class="btn btn-primary">${ic('in')}Confirmar y realizar check-in</button>`:''}</div></form>`);
  $('#cif').onsubmit=(e)=>{
    e.preventDefault();
    const c=puedeCheckin(r); if(!c.ok) return;
    if(c.confirmar){
      if(!puede('reservas.modificar')) return;
      r.estado='confirmada';
      logRes(r,'Reserva confirmada','Al momento del check-in');
      auditar('Confirmó una reserva',`Reserva #${r.nro} · al hacer el check-in`);
    }
    const antesH=EST_HAB[estadoHab(r.hab)];
    r.estado='inhouse';
    habLog(r.hab,'estado','Check-in',antesH,'Ocupada',`Reserva #${r.nro} · ${r.huesped}`);
    logRes(r,'Check-in realizado',`Hab. ${r.hab} · ${$('#ci-hora').value||hhmmAhora()}`);
    auditar('Realizó un check-in',`Reserva #${r.nro} · Hab. ${r.hab} · ${r.huesped}`);
    cerrar();refrescar();aviso(`Check-in realizado · Hab. ${r.hab}`);
  };
}

/* ---------- Check-out (con deuda y salida anticipada) ---------- */
function accionCheckout(idx){
  const r=RESERVAS[idx];
  if(!puede('checkout.realizar')) return aviso(NOPERM);
  const ck=puedeCheckout(r); if(!ck.ok) return aviso(ck.motivo);
  /* Decisión 18 (pendiente de política): antes de la fecha prevista no se ejecuta la salida ni se recalcula el precio.
     Solo se registra una solicitud para Adrián. */
  if(ck.anticipada) return formSolicitud(idx,'salida_anticipada');
  modal(`<form id="cof" novalidate><div class="modal-head"><div><h2>Check-out</h2><p>Hab. ${r.hab} · ${r.huesped}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="detail">
      <div><small>Estadía</small><b class="num">${ddmm(r.ingreso)} → ${ddmm(r.salida)}</b></div>
      <div><small>Pago</small>${payBadge(r)}</div>
    </div>
    <div id="co-deuda" style="margin-top:14px"></div>
    <div class="msg bad" id="co-err" hidden></div>
    <div class="form"><div class="field"><label for="co-hora">Hora real de salida</label><input id="co-hora" type="time" value="${hhmmAhora()}"></div></div>
    <p class="note">Después del check-out la habitación pasa a <b>pendiente de limpieza</b>.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>
      ${saldoDe(r)&&puede('cobros.registrar')?`<button type="button" class="btn" data-fa="pago" data-i="${idx}">${ic('coin')}Registrar pago</button>`:''}
      <button type="submit" class="btn btn-primary">${ic('out')}Confirmar check-out</button></div></form>`);
  const pintarDeuda=()=>{
    const s=saldoDe(r), cr=creditoDe(r);
    $('#co-deuda').innerHTML=s
      ?`<div class="msg bad">${ic('alert')}<span>El huésped se va con una deuda de <b>${ars(s)}</b>. Conviene cobrarla antes de la salida.</span></div>
        <label class="check"><input type="checkbox" id="co-deu"> Autorizo el check-out con una deuda de ${ars(s)}</label>`
      :cr?`<div class="msg ok">${ic('coin')}<span>Tiene un <b>crédito a favor de ${ars(cr)}</b>. No se hace ninguna devolución automática.</span></div>`
      :`<div class="msg ok">${ic('check')}<span>La estadía queda pagada.</span></div>`;
  };
  pintarDeuda();
  $('#cof').onsubmit=(e)=>{
    e.preventDefault();
    const err=$('#co-err'), fallo=(t)=>{err.textContent=t;err.hidden=false};
    const c2=puedeCheckout(r); if(!c2.ok) return fallo(c2.motivo);
    if(c2.anticipada) return fallo('La salida es anterior a la fecha prevista: se registra como solicitud.');
    const s=saldoDe(r);
    if(s&&!($('#co-deu')&&$('#co-deu').checked)) return fallo('Para continuar, autorizá el check-out con deuda.');
    const hora=$('#co-hora').value||hhmmAhora();
    r.estado='finalizada';
    r.checkoutReal={fecha:fechaStr(HOY),hora,usuario:usuarioActual.nombre};
    r.registro=fotoEstadia(r,HOY);
    logRes(r,'Check-out realizado',`Hab. ${r.hab} · ${hora}`);
    if(s){
      logRes(r,'Check-out con deuda autorizado',`Saldo ${ars(s)} · autorizó ${usuarioActual.nombre}`);
      auditar('Autorizó un check-out con deuda',`Reserva #${r.nro} · ${ars(s)}`);
    }
    auditar('Realizó un check-out',`Reserva #${r.nro} · Hab. ${r.hab}`);
    if(!limpieza.includes(r.hab)) limpieza.push(r.hab);
    habLog(r.hab,'estado','Check-out','Ocupada','Pendiente de limpieza',`Reserva #${r.nro} · ${r.huesped}`);
    cerrar();refrescar();aviso(`Check-out realizado · Hab. ${r.hab} pasa a pendiente de limpieza`);
  };
}

/* ---------- Cambiar habitación con el huésped alojado: solo misma categoría, sin recotizar (Paso A) ---------- */
function accionHabitacionAlojado(idx){
  const r=RESERVAS[idx];
  if(!puede('reservas.cambiarHabitacion')) return aviso(NOPERM);
  const libres=habsMismaCategoria(r), cat=tipoNombre(catDeHab(r.hab));
  modal(`<form id="chf" novalidate><div class="modal-head"><div><h2>Cambiar habitación</h2><p>Reserva #${r.nro} · ${r.huesped} · alojado</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="msg bad" id="ch-err" hidden></div>
    <div class="form">
      <div class="field"><label>Habitación actual</label><input value="Hab. ${r.hab} · ${cat}" disabled></div>
      <div class="field"><label for="ch-hab">Nueva habitación (${cat})</label>
        ${libres.length?`<select id="ch-hab"><option value="">Elegí una habitación</option>${libres.map(h=>`<option value="${h}">Hab. ${h} · ${cat}</option>`).join('')}</select>`:'<input value="No hay habitaciones libres y limpias de esta categoría" disabled>'}
      </div>
      <div class="field full"><label for="ch-mot">Motivo</label><input id="ch-mot" placeholder="Ej.: el huésped pidió una habitación más tranquila"></div>
    </div>
    <div class="msg ok" style="margin-top:14px">${ic('coin')}<span>Misma categoría: el precio contratado (${ars(r.total)}) y los pagos no cambian. La Hab. ${r.hab} va a quedar <b>pendiente de limpieza</b>.</span></div>
    <p class="note">Solo se muestran habitaciones de ${cat} libres hasta el ${ddmm(r.salida)}, limpias, sin bloqueos y con capacidad. ¿El huésped quiere otra categoría? Eso se registra como solicitud para Adrián: <button type="button" class="link-btn" data-solnew="cambio_categoria" data-i="${idx}">Registrar solicitud de cambio de categoría</button></p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>${libres.length?'<button type="submit" class="btn btn-primary">Cambiar habitación</button>':''}</div></form>`);
  $('#chf').onsubmit=(e)=>{
    e.preventDefault();
    const nueva=$('#ch-hab')&&$('#ch-hab').value, err=$('#ch-err');
    const res=trasladoMismaCategoria(r,nueva,$('#ch-mot').value);
    if(res.error){err.textContent=res.error;err.hidden=false;return}
    cerrar();refrescar();aviso(`Reserva #${r.nro} movida a la Hab. ${nueva} · precio sin cambios`);
  };
}

/* ---------- Cambiar habitación (con nueva cotización: Regla 12) ---------- */
function accionHabitacion(idx){
  const r=RESERVAS[idx];
  if(!puede('reservas.cambiarHabitacion')) return aviso(NOPERM);
  /* Decisión 19 (pendiente): con el huésped alojado no se recotiza ni se cambia de categoría */
  if(r.estado==='inhouse') return accionHabitacionAlojado(idx);
  const alojado=r.estado==='inhouse', pl=plazasDe(r);
  /* Un huésped alojado entra hoy a la nueva habitación: tiene que estar limpia (misma regla que el check-in) */
  const libres=HABITACIONES.filter(h=>h!==r.hab&&!conflicto(h,r.ingreso,r.salida,r.nro)&&!(capacidadDe(h)!=null&&pl>capacidadDe(h))&&!(alojado&&(limpieza.includes(h)||RESERVAS.some(o=>o!==r&&o.hab===h&&o.estado==='inhouse'))));
  const est={modo:'nuevo',motivo:'',conf:false}; let q=null;
  modal(`<form id="chf" novalidate><div class="modal-head"><div><h2>Cambiar habitación</h2><p>Reserva #${r.nro} · ${r.huesped}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="msg bad" id="ch-err" hidden></div>
    <div class="form">
      <div class="field"><label>Habitación actual</label><input value="Hab. ${r.hab} · ${tipoNombre(catDeHab(r.hab))}" disabled></div>
      <div class="field"><label for="ch-hab">Nueva habitación</label>
        ${libres.length?`<select id="ch-hab"><option value="">Elegí una habitación</option>${libres.map(h=>`<option value="${h}">Hab. ${h} · ${tipoNombre(catDeHab(h))}${limpieza.includes(h)?' · pendiente de limpieza':''}</option>`).join('')}</select>`:'<input value="No hay habitaciones libres" disabled>'}
      </div>
      <div class="field full"><label for="ch-mot">Motivo (opcional)</label><input id="ch-mot" placeholder="Ej.: el huésped pidió una habitación más tranquila"></div>
    </div>
    <div id="ch-cot"></div>
    ${alojado?`<div class="msg warn" style="margin-top:14px">${ic('broom')}<span>El huésped ya está alojado: la Hab. ${r.hab} va a quedar <b>pendiente de limpieza</b> y vuelve a estar disponible cuando se marque limpia.</span></div>`:''}
    <p class="note">Solo se muestran las habitaciones libres del ${ddmm(r.ingreso)} al ${ddmm(r.salida)}${alojado?', listas para ocupar':''} y con capacidad para ${pl} ${pl===1?'plaza':'plazas'}.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>${libres.length?'<button type="submit" class="btn btn-primary">Cambiar habitación</button>':''}</div></form>`);
  const pintarCot=()=>{
    const h=$('#ch-hab')&&$('#ch-hab').value, w=$('#ch-cot');
    if(!h){w.innerHTML='';q=null;return}
    q=cotizar({hab:h,ingreso:r.ingreso,salida:r.salida,adultos:r.adultos,menores:r.edades||[],excluirNro:r.nro});
    w.innerHTML=`<h3 class="tf-sub">Nueva cotización con la Hab. ${h}</h3>${q.ok?htmlDecisionPrecio('chd',r,q,est):htmlCotizacion(q)}
      ${alojado&&q.ok?'<p class="note">Se recalcula la estadía completa con la nueva habitación. Si corresponde cobrar con la nueva categoría solo las noches restantes es una decisión pendiente.</p>':''}`;
    w.querySelectorAll('input[name="chd-modo"]').forEach(x=>x.onchange=()=>{Object.assign(est,leerDecision('chd'));pintarCot()});
  };
  if($('#ch-hab')) $('#ch-hab').onchange=()=>{Object.assign(est,{modo:'nuevo',motivo:'',conf:false});pintarCot()};
  $('#chf').onsubmit=(e)=>{
    e.preventDefault();
    const nueva=$('#ch-hab')&&$('#ch-hab').value, err=$('#ch-err'), fallo=(t)=>{err.textContent=t;err.hidden=false};
    if(!nueva) return fallo('Elegí la nueva habitación.');
    const c=conflicto(nueva,r.ingreso,r.salida,r.nro);
    if(c) return fallo(textoConflicto(c));
    if(alojado&&limpieza.includes(nueva)) return fallo(`La Hab. ${nueva} está pendiente de limpieza.`);
    q=cotizar({hab:nueva,ingreso:r.ingreso,salida:r.salida,adultos:r.adultos,menores:r.edades||[],excluirNro:r.nro});
    if(!q.ok) return fallo(q.errores.join(' '));
    const dec=leerDecision('chd'), m=validarDecision(dec,r,q); if(m) return fallo(m);
    const vieja=r.hab, mot=limpiar($('#ch-mot').value);
    const antesNueva=EST_HAB[estadoHab(nueva)], antes={total:r.total,credito:creditoDe(r)};
    r.hab=nueva;
    if(dec.modo==='mantener'){aplicarCotizacion(r,q,{excepcion:{total:antes.total,motivo:dec.motivo,tipo:'mantener precio anterior'}});auditarExcepcion(r,q,antes.total,dec.motivo,`cambio de Hab. ${vieja} a Hab. ${nueva}: se mantuvo el precio anterior`)}
    else aplicarCotizacion(r,q);
    if(r.estado==='inhouse'){
      /* La habitación que deja el huésped no queda disponible: pasa a pendiente de limpieza */
      if(!limpieza.includes(vieja)) limpieza.push(vieja);
      habLog(vieja,'estado','Cambio de habitación · sale el huésped','Ocupada','Pendiente de limpieza',`${r.huesped} pasó a la Hab. ${nueva} · reserva #${r.nro}`);
      habLog(nueva,'estado','Cambio de habitación · entra el huésped',antesNueva,'Ocupada',`${r.huesped} viene de la Hab. ${vieja} · reserva #${r.nro}`);
    }
    logRes(r,'Cambio de habitación',`Hab. ${vieja} → Hab. ${nueva}${mot?` · ${mot}`:''}${r.estado==='inhouse'?` · la Hab. ${vieja} queda pendiente de limpieza`:''}`);
    logRes(r,'Nueva cotización aplicada',`Anterior ${ars(antes.total)} · nuevo ${ars(r.total)}${dec.modo==='mantener'?' (excepción)':''}`);
    auditar('Cambió la habitación de una reserva',`Reserva #${r.nro} · Hab. ${vieja} → Hab. ${nueva} · precio ${ars(antes.total)} → ${ars(r.total)}${r.estado==='inhouse'?` · Hab. ${vieja}: Ocupada → Pendiente de limpieza`:''}`,{antes:`Hab. ${vieja} · ${ars(antes.total)}`,despues:`Hab. ${nueva} · ${ars(r.total)}`});
    registrarCredito(r,antes);
    cerrar();refrescar();aviso(`Reserva #${r.nro} movida a la Hab. ${nueva}`);
  };
}

/* ---------- Cancelar reserva (nunca se elimina) ---------- */
const DESTINOS={
  credito:{t:'Dejar como crédito',d:'Queda a favor del huésped. Caja no cambia.',log:'Dinero dejado como crédito a favor del huésped'},
  devolucion:{t:'Registrar devolución',d:'Se registra la salida del dinero en Caja.',log:'Devolución registrada'},
  retener:{t:'Retener importe',d:'El hotel conserva lo pagado. Caja no cambia.',log:'Importe retenido por el hotel'}
};
const opcionesDestino=(monto)=>`<div class="field full"><label>¿Qué hacer con los ${ars(monto)} pagados?</label><div class="radios r3">
  ${Object.entries(DESTINOS).map(([k,v])=>`<label class="radio"><input type="radio" name="dst" value="${k}"><span><b>${v.t}</b><small>${v.d}</small></span></label>`).join('')}
  </div></div>
  <div class="field" id="dst-medio-w" hidden><label for="dst-medio">Medio de la devolución</label><select id="dst-medio">${MEDIOS.map(m=>`<option>${m}</option>`).join('')}</select></div>`;
function conectarDestino(){
  document.querySelectorAll('input[name="dst"]').forEach(i=>i.onchange=()=>{$('#dst-medio-w').hidden=i.value!=='devolucion'||!i.checked});
}
/* Caja solo cambia si el usuario elige devolver: se registra un egreso vinculado a la reserva */
function aplicarDestino(r,tipo,medio){
  const monto=r.pagado, d=DESTINOS[tipo];
  if(tipo==='devolucion') registrarMovimiento('egreso',`Devolución · Reserva #${r.nro} · ${r.huesped}`,{monto,medio,reserva:r.nro});
  r.cancelacion.destino={tipo,monto,medio:tipo==='devolucion'?medio:'',usuario:usuarioActual.nombre,fecha:fechaStr(new Date()),hora:hhmmAhora()};
  logRes(r,d.log,`${ars(monto)}${tipo==='devolucion'?' · '+medio:''}`);
  auditar('Definió qué hacer con el dinero de una reserva cancelada',`Reserva #${r.nro} · ${d.log} · ${ars(monto)}`);
}
function accionCancelar(idx){
  const r=RESERVAS[idx];
  if(!puede('reservas.cancelar')) return aviso(NOPERM);
  if(!(r.estado==='pendiente'||r.estado==='confirmada')) return aviso('Esta reserva no se puede cancelar');
  const pagado=r.pagado;
  modal(`<form id="caf" novalidate><div class="modal-head"><div><h2>Cancelar reserva #${r.nro}</h2><p>${r.huesped} · Hab. ${r.hab} · ${ddmm(r.ingreso)} → ${ddmm(r.salida)}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="msg warn">${ic('alert')}<span>La reserva no se borra. Queda como <b>Cancelada</b>, con quién la canceló, cuándo y por qué, y libera la habitación.</span></div>
    <div class="msg bad" id="ca-err" hidden></div>
    <div class="form">
      <div class="field full"><label for="ca-mot">Motivo de la cancelación</label><textarea id="ca-mot" placeholder="Ej.: el huésped canceló el viaje"></textarea></div>
      ${pagado?opcionesDestino(pagado):''}
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Volver</button><button type="submit" class="btn btn-primary btn-danger">Cancelar reserva</button></div></form>`,pagado?'wide':'');
  if(pagado) conectarDestino();
  $('#caf').onsubmit=(e)=>{
    e.preventDefault();
    const err=$('#ca-err'), fallo=(t)=>{err.textContent=t;err.hidden=false};
    const mot=limpiar($('#ca-mot').value);
    if(mot.length<3) return fallo('Escribí el motivo de la cancelación.');
    const dst=document.querySelector('input[name="dst"]:checked');
    if(pagado&&!dst) return fallo('Elegí qué hacer con el dinero pagado.');
    if(pagado&&dst.value==='devolucion'){const ce=chequeoEfectivo($('#dst-medio').value);if(ce) return fallo(ce)}
    r.estado='cancelada';
    r.cancelacion={usuario:usuarioActual.nombre,fecha:fechaStr(new Date()),hora:hhmmAhora(),motivo:mot,destino:null};
    logRes(r,'Reserva cancelada',mot);
    auditar('Canceló una reserva',`Reserva #${r.nro} · ${mot}`);
    if(pagado) aplicarDestino(r,dst.value,$('#dst-medio').value);
    cerrar();refrescar();aviso(`Reserva #${r.nro} cancelada`);
  };
}
/* Reservas canceladas antes, con dinero y sin decisión registrada */
function accionDestino(idx){
  const r=RESERVAS[idx];
  if(!puede('reservas.cancelar')) return aviso(NOPERM);
  if(r.estado!=='cancelada'||!r.pagado||r.cancelacion.destino) return;
  modal(`<form id="dsf" novalidate><div class="modal-head"><div><h2>Dinero de la reserva #${r.nro}</h2><p>Reserva cancelada · ${r.huesped}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="msg bad" id="ds-err" hidden></div>
    <div class="form">${opcionesDestino(r.pagado)}</div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Guardar decisión</button></div></form>`,'wide');
  conectarDestino();
  $('#dsf').onsubmit=(e)=>{
    e.preventDefault();
    const dst=document.querySelector('input[name="dst"]:checked');
    if(!dst){const b=$('#ds-err');b.textContent='Elegí una opción.';b.hidden=false;return}
    if(dst.value==='devolucion'){const ce=chequeoEfectivo($('#dst-medio').value);if(ce){const b=$('#ds-err');b.textContent=ce;b.hidden=false;return}}
    aplicarDestino(r,dst.value,$('#dst-medio').value);
    cerrar();refrescar();aviso('Decisión registrada');
  };
}

/* =========================================================
   NUEVA RESERVA / EDITAR RESERVA (en 3 pasos)
   ========================================================= */
const NR={modo:'nueva',idx:null,paso:1,d:{},error:''};
function abrirFormReserva(o={}){
  if(o.idx!==undefined){
    if(!puede('reservas.modificar')) return aviso(NOPERM);
    const r=RESERVAS[o.idx];
    Object.assign(NR,{modo:'editar',idx:o.idx,paso:1,error:'',dup:null,desdeHuesped:false,d:{huespedId:r.huespedId,
      ingreso:isoD(r.ingreso),salida:isoD(r.salida),hab:r.hab,adultos:r.adultos,edades:(r.edades||[]).map(m=>({...m})),hora:r.horaLlegada,
      nombre:r.titular.nombre,docTipo:r.titular.docTipo||'DNI',docPais:r.titular.docPais||'',dni:r.titular.dni,tel:r.titular.tel,email:r.titular.email,acomp:r.acomp.join(', '),
      sena:0,medio:'Transferencia',estado:r.estado,obs:r.obs,dec:{modo:'nuevo',motivo:'',conf:false},exc:{on:false,total:0,motivo:''}}});
  }else{
    if(!puede('reservas.crear')) return aviso(NOPERM);
    const ing=o.ingreso||isoD(HOY), gh=o.huespedId?huespedDe(o.huespedId):null;
    Object.assign(NR,{modo:'nueva',idx:null,paso:1,error:'',dup:null,desdeHuesped:!!gh,cat:o.cat||null,d:{huespedId:gh?gh.id:null,
      ingreso:ing,salida:o.salida||isoD(addD(new Date(ing+'T00:00'),1)),hab:o.hab||'',adultos:o.adultos||2,edades:(o.menores||[]).map(m=>({nac:m.nac,cuna:!!m.cuna})),hora:PARAMS.horaCheckin,
      nombre:gh?gh.nombre:'',docTipo:gh?gh.docTipo||'DNI':'DNI',docPais:gh?gh.docPais||'':'Argentina',dni:gh?gh.dni:'',tel:gh?gh.tel:'',email:gh?gh.email:'',acomp:'',sena:0,medio:'Transferencia',estado:'pendiente',obs:'',
      dec:{modo:'nuevo',motivo:'',conf:false},exc:{on:false,total:0,motivo:''}}});
  }

const nrFechas=()=>{const i=new Date(NR.d.ingreso+'T00:00'),s=new Date(NR.d.salida+'T00:00');return {i,s,ok:!!NR.d.ingreso&&!!NR.d.salida&&!isNaN(i)&&!isNaN(s)&&s>i,n:diffD(i,s)}};

function nrCotizar(){

/* Regla 12: cambian fechas o cantidad/edades de huéspedes → nueva cotización. Si no, se conserva el precio pactado. */
function nrCambioRelevante(){
  if(NR.modo!=='editar') return true;
  const d=NR.d, r=RESERVAS[NR.idx], f=nrFechas();
  return +f.i!==+r.ingreso||+f.s!==+r.salida||d.adultos!==r.adultos||JSON.stringify(d.edades.map(m=>[m.nac||null,!!m.cuna]))!==JSON.stringify((r.edades||[]).map(m=>[m.nac||null,!!m.cuna]));

const nrTotalFinal=(q)=>NR.d.exc.on&&puede('tarifas.excepciones')?NR.d.exc.total:(q&&q.ok?q.total:0);
function nrValidar(paso){
  const d=NR.d, ed=NR.modo==='editar', r=ed?RESERVAS[NR.idx]:null, f=nrFechas();
  if(paso===1){
    if(!f.ok) return 'Revisá las fechas: la salida tiene que ser posterior al ingreso.';
    const cambioIng=!ed||d.ingreso!==isoD(r.ingreso);
    if(cambioIng&&f.i<HOY) return 'La fecha de ingreso no puede ser anterior a hoy.';
    if(!d.hab) return 'Elegí una habitación.';
    if(d.adultos<1) return 'Toda reserva necesita al menos un adulto responsable.';
    const c=conflicto(d.hab,f.i,f.s,ed?r.nro:undefined);
    if(c) return textoConflicto(c)+' Elegí otras fechas u otra habitación.';
    if(nrCambioRelevante()){const q=nrCotizar();if(!q.ok) return q.errores.join(' ')}
  }
  if(paso===2){
    if(limpiar(d.nombre).length<3) return 'Escribí el nombre y apellido del titular.';
    if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email)) return 'El email no parece válido.';
    /* No duplicar personas: el documento identifica; teléfono o email iguales solo generan un aviso */
    const co=buscarCoincidencias(d,ed?r.huespedId:d.huespedId);
    if(co.doc&&ed) return `Ya existe otro huésped con ese documento: ${co.doc.nombre}. Revisá los datos.`;
    if(co.doc){NR.dup={tipo:'doc',id:co.doc.id};return 'DUP'}
    if(!ed&&co.contacto.length&&!d.contactoRevisado){NR.dup={tipo:'contacto',id:co.contacto[0].id};return 'DUP'}
  }
  if(paso===3){
    if(!ed){
      const q=nrCotizar(); if(!q||!q.ok) return q?q.errores.join(' '):'Elegí fechas y habitación.';
      if(d.exc.on){
        if(!puede('tarifas.excepciones')) return 'Solo el Administrador puede autorizar un precio distinto al calculado.';
        if(!(d.exc.total>0)) return 'Ingresá el precio autorizado.';
        if(d.exc.motivo.length<5) return 'Escribí el motivo de la excepción.';
      }
      if(d.sena>nrTotalFinal(q)) return 'La seña no puede ser mayor que el total.';
    }else if(nrCambioRelevante()){
      const q=nrCotizar(); if(!q.ok) return q.errores.join(' ');

    }
  }
  return '';

  if(rel){

    if(d.dec.modo==='mantener'){aplicarCotizacion(r,q,{excepcion:{total:antes.total,motivo:d.dec.motivo,tipo:'mantener precio anterior'}});auditarExcepcion(r,q,antes.total,d.dec.motivo,'modificación de la reserva: se mantuvo el precio anterior')}
    else aplicarCotizacion(r,q);
    const dif=r.total-antes.total;
    cambios.push(`Precio ${ars(antes.total)} → ${ars(r.total)}`);
    logRes(r,'Nueva cotización aplicada',`Anterior ${ars(antes.total)} · nuevo ${ars(r.total)} · diferencia ${dif>0?'+':dif<0?'−':''}${ars(Math.abs(dif))}${d.dec.modo==='mantener'?' (excepción)':''}`);
    registrarCredito(r,antes);
  }
  if(confirmo||desconfirmo) r.estado=d.estado;
  if(cambios.length) logRes(r,'Reserva editada',cambios.join(' · '));
  if(confirmo) logRes(r,'Reserva confirmada');
  if(desconfirmo) logRes(r,'Volvió a pendiente de confirmar');
  auditar(confirmo?'Confirmó una reserva':'Editó una reserva',`Reserva #${r.nro}${cambios.length?' · '+cambios.join(' · '):''}`);
  cerrar();refrescar();aviso(`Reserva #${r.nro} actualizada`);
}

function ordenRs(a,b){
  if(activoRs(a)!==activoRs(b)) return activoRs(a)?-1:1;

}
function coincideRs(r,q){
  const n=normaliza(q).trim(), dig=q.replace(/\D/g,'');
  if(!n) return true;
  if(normaliza(r.huesped).includes(n)||r.acomp.some(a=>normaliza(a).includes(n))) return true;
  if(r.nro.includes(n.replace('#',''))) return true;
  if(r.hab===n||`hab ${r.hab}`===n||`hab. ${r.hab}`===n) return true;
  if(dig.length>=4&&(r.titular.tel.replace(/\D/g,'').includes(dig)||r.titular.dni.includes(dig))) return true;
  return false;
}

/* =========================================================
   HUÉSPEDES · CÁLCULOS (todo sale de Reservas y Caja)
   ========================================================= */
/* Reglas DEMO — confirmar con Adrian */
/* Criterios configurables desde Configuración. Valores iniciales: DEMO hasta que Adrian los confirme. */
const CRITERIOS={frecuente:3,sinActividad:180,confirmado:false};

const reservasDe=(g)=>RESERVAS.filter(r=>esReserva(r)&&r.huespedId===g.id);
const activa=(r)=>['pendiente','confirmada','inhouse'].includes(r.estado);
const parseFechaAR=(s)=>{const [d,m,y]=String(s||'').split('/').map(Number);return new Date(y||1970,(m||1)-1,d||1)};
function datosHuesped(g){
  const res=reservasDe(g);
  const actual=res.find(r=>r.estado==='inhouse');
  const proxima=res.filter(r=>(r.estado==='pendiente'||r.estado==='confirmada')&&r.salida>HOY).sort((a,b)=>a.ingreso-b.ingreso)[0];
  const estadias=res.filter(r=>r.estado==='finalizada'||r.estado==='inhouse');
  const ultima=res.filter(r=>r.estado==='finalizada').sort((a,b)=>b.salida-a.salida)[0];
  const saldo=res.filter(activa).reduce((s,r)=>s+saldoDe(r),0);
  const deudaFin=res.filter(r=>r.estado==='finalizada').reduce((s,r)=>s+saldoDe(r),0);
  /* Total adeudado = saldo de reservas activas + deudas de estadías finalizadas (cada reserva cuenta una sola vez) */
  const adeudado=saldo+deudaFin;
  const credito=res.filter(r=>r.estado==='cancelada'&&r.cancelacion&&r.cancelacion.destino&&r.cancelacion.destino.tipo==='credito').reduce((s,r)=>s+r.cancelacion.destino.monto,0)
    +res.reduce((s,r)=>s+creditoDe(r),0);
  let estado;
  if(actual) estado=['Alojado','ok'];
  else if(proxima&&mismoDia(proxima.ingreso,HOY)) estado=['Llega hoy','warn'];
  else if(proxima) estado=['Próxima reserva','info'];
  else estado=['Sin reserva activa','neutral'];
  const ultimaFecha=ultima?ultima.salida:actual?actual.ingreso:null;
  return {g,res,actual,proxima,estadias,ultima,saldo,deudaFin,adeudado,credito,estado,
    frecuente:estadias.length>=CRITERIOS.frecuente,
    sinActividad:!res.some(activa)&&(!ultimaFecha||diffD(ultimaFecha,HOY)>CRITERIOS.sinActividad)};
}
/* Cuenta del huésped: pagos y devoluciones (Caja) + créditos (cancelaciones) */
function cuentaHuesped(g){
  const res=reservasDe(g), nros=res.map(r=>r.nro), items=[];
  MOVIMIENTOS.filter(m=>m.reserva&&nros.includes(m.reserva)&&m.estado==='vigente').forEach(m=>items.push({
    ts:new Date(m.dia+'T'+(m.hora||'00:00')),fecha:m.fecha,concepto:m.concepto.split(' · ')[0],reserva:m.reserva,importe:m.monto,tipo:m.tipo==='ingreso'?'Pago':'Devolución'}));
  res.filter(r=>r.estado==='cancelada'&&r.cancelacion&&r.cancelacion.destino&&r.cancelacion.destino.tipo==='credito').forEach(r=>{const dd=r.cancelacion.destino;items.push({
    ts:parseFechaAR(dd.fecha),fecha:dd.fecha,concepto:'Crédito por cancelación',reserva:r.nro,importe:dd.monto,tipo:'Crédito'})});
  res.forEach(r=>(r.creditos||[]).forEach(c=>items.push({ts:new Date(c.ts),fecha:c.fecha,concepto:c.despues>c.antes?'Crédito por modificación de la reserva':'Ajuste de crédito por modificación',reserva:r.nro,importe:c.despues-c.antes,tipo:'Crédito'})));
  return items.sort((a,b)=>b.ts-a.ts);
}
function actualizarHuesped(g,nuevos,origen=''){
  const etiquetas={nombre:'Nombre',docTipo:'Tipo de documento',docPais:'País emisor',dni:'Documento',tel:'Teléfono',email:'Email',nacionalidad:'Nacionalidad',nacimiento:'Fecha de nacimiento'};
  const cambios=Object.keys(nuevos).filter(k=>k in etiquetas&&(nuevos[k]||'')!==(g[k]||''));
  if(!cambios.length) return [];
  const txt=cambios.map(k=>`${etiquetas[k]}: ${g[k]||'—'} → ${nuevos[k]||'—'}`);
  cambios.forEach(k=>{g[k]=nuevos[k];if(g.demo[k])g.demo[k]=false});

  g.historialDatos.push({ts:d,hora:hhmmAhora(),usuario:usuarioActual.nombre,detalle:txt.join(' · ')+(origen?` · ${origen}`:'')});

/* ---------- Acciones de la ficha del huésped ---------- */
function accionHuesped(k,el){
  const g=huespedDe(GF.id); if(!g) return;
  const d=datosHuesped(g), i=+el.dataset.i;
  const irPlanning=(r)=>{if(!puede('planning.ver'))return aviso(NOPERM);cerrarFicha();PL.tab='planning';PL.inicio=r?addD(r.ingreso,-1):new Date(HOY);PL.q=r?r.nro:'';if(location.hash==='#planning')route();else location.hash='#planning'};
  const acciones={
    nueva:()=>abrirFormReserva({huespedId:g.id}),
    actual:()=>d.actual&&abrirFicha(RESERVAS.indexOf(d.actual)),
    pago:()=>{const r=reservaParaCobrar(d);if(r)accionPago(RESERVAS.indexOf(r))},
    planning:()=>irPlanning(d.actual||d.proxima),
    editar:()=>editarHuesped(g),
    res:()=>abrirFicha(i),
    pagoR:()=>accionPago(i),
    hab:()=>abrirHab(el.dataset.h),
    checkout:()=>accionCheckout(i),
    planR:()=>irPlanning(RESERVAS[i])
  };
  if(acciones[k]) acciones[k]();
}
function agregarNota(g,texto){
  if(!puede('huespedes.observaciones')) return aviso(NOPERM);
  const t=limpiar(texto); if(t.length<2) return aviso('Escribí la observación');
  const d=new Date();
  g.notas.push({ts:d,fecha:fechaStr(d),hora:hhmmAhora(),usuario:usuarioActual.nombre,texto:t});
  auditar('Agregó una observación interna',`Huésped ${g.nombre} · ${t}`);
  refrescar();aviso('Observación agregada');
}
function editarHuesped(g){
  if(!puede('huespedes.modificar')) return aviso(NOPERM);
  const P=g.prefs;
  modal(`<form id="egf" novalidate><div class="modal-head"><div><h2>Editar datos</h2><p>${g.nombre} · los cambios se ven en todas sus reservas</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="msg bad" id="eg-err" hidden></div>
    <div class="form">
      <div class="field full"><label for="eg-nom">Nombre y apellido</label><input id="eg-nom" value="${g.nombre}"></div>
      <div class="field"><label for="eg-dtipo">Tipo de documento</label><select id="eg-dtipo">${TIPOS_DOC.map(t=>`<option${t===g.docTipo?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="eg-dpais">País emisor</label><input id="eg-dpais" value="${g.docPais||''}"></div>
      <div class="field"><label for="eg-dni">Número de documento</label><input id="eg-dni" value="${g.dni}"></div>
      <div class="field"><label for="eg-tel">Teléfono</label><input id="eg-tel" value="${g.tel}" inputmode="tel"></div>
      <div class="field full"><label for="eg-mail">Email</label><input id="eg-mail" type="email" value="${g.email}"></div>
      <div class="field"><label for="eg-nac">Nacionalidad</label><input id="eg-nac" value="${g.nacionalidad}" placeholder="Opcional"></div>
      <div class="field"><label for="eg-fn">Fecha de nacimiento</label><input id="eg-fn" type="date" value="${g.nacimiento}"></div>
      <div class="field full"><span class="sub-h" style="margin:6px 0 0">Preferencias (opcional)</span></div>
      <div class="field"><label for="eg-pt">Tipo de habitación habitual</label><select id="eg-pt"><option value="">Sin cargar</option>${TIPOS_HAB.map(t=>`<option value="${t.id}"${P.tipo===t.id?' selected':''}>${t.t}</option>`).join('')}</select></div>
      <div class="field"><label for="eg-pc">Cochera</label><select id="eg-pc"><option value="">Sin cargar</option>${['Sí','No'].map(v=>`<option${P.cochera===v?' selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="eg-pp">Piso preferido</label><select id="eg-pp"><option value="">Sin cargar</option>${Object.keys(pisos).map(p=>`<option value="${p}"${P.piso===p?' selected':''}>Piso ${p}</option>`).join('')}</select></div>
      <div class="field"><label for="eg-pca">Cama</label><input id="eg-pca" value="${P.cama}" placeholder="Opcional"></div>
      <div class="field full"><label for="eg-po">Observaciones de preferencias</label><input id="eg-po" value="${P.obs}" placeholder="Opcional"></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form>`,'wide');
  $('#egf').onsubmit=(e)=>{
    e.preventDefault();
    const err=$('#eg-err'), fallo=(t)=>{err.textContent=t;err.hidden=false};
    const nuevos={nombre:limpiar($('#eg-nom').value),docTipo:$('#eg-dtipo').value,docPais:limpiar($('#eg-dpais').value),dni:limpiar($('#eg-dni').value),tel:limpiar($('#eg-tel').value),email:limpiar($('#eg-mail').value),nacionalidad:limpiar($('#eg-nac').value),nacimiento:$('#eg-fn').value};
    if(nuevos.nombre.length<3) return fallo('Escribí el nombre y apellido.');
    if(nuevos.email&&!/^\S+@\S+\.\S+$/.test(nuevos.email)) return fallo('El email no parece válido.');
    const co=buscarCoincidencias(nuevos,g.id);
    if(co.doc) return fallo(`Ya existe otro huésped con ese documento: ${co.doc.nombre}. Revisá los datos.`);
    const f=$('#egf');
    if(co.contacto.length&&f.dataset.ok!=='1'){f.dataset.ok='1';err.className='msg warn';return fallo(`${co.contacto[0].nombre} tiene ${motivoContacto(nuevos,co.contacto[0])} que cargaste. Revisá si es la misma persona. Si es otra, tocá Guardar de nuevo.`)}
    const prefs={tipo:$('#eg-pt').value,cochera:$('#eg-pc').value,piso:$('#eg-pp').value,cama:limpiar($('#eg-pca').value),obs:limpiar($('#eg-po').value)};
    const cambios=actualizarHuesped(g,nuevos);
    const cambioPref=JSON.stringify(prefs)!==JSON.stringify(g.prefs);
    if(cambioPref){g.prefs=prefs;g.historialDatos.push({ts:new Date(),hora:hhmmAhora(),usuario:usuarioActual.nombre,detalle:'Preferencias actualizadas'});cambios.push('Preferencias')}
    if(!cambios.length){cerrar();return aviso('No hubo cambios')}
    auditar('Editó los datos de un huésped',`${g.nombre} · ${cambios.join(' · ')}${co.contacto.length?` · contacto coincide con ${co.contacto[0].nombre}, se confirmó que es otra persona`:''}`);
    cerrar();refrescar();aviso('Datos del huésped actualizados');
  };
}

const demoParaRevisar=()=>HUESPEDES.filter(g=>g.esDemo&&tieneDatosDeUsuario(g));
const hayDatosDemo=()=>Object.values(resumenDemo()).some(n=>n>0);

const turnoConDatosDeUsuario=(t)=>MOVIMIENTOS.some(m=>m.turno===t.id&&!m.demo)||!t.demo;
const usuarioConActividad=(u)=>TURNOS.some(t=>t.usuarioId===u.id&&turnoConDatosDeUsuario(t))||MOVIMIENTOS.some(m=>!m.demo&&m.creadoPor===u.nombre)||LIMPIEZAS.some(l=>!l.demo&&((l.asignada&&l.asignada.id===u.id)||l.intentos.some(it=>it.persona.id===u.id)));

function eliminarDatosDemo(){
  if(!puede('config.general')) return aviso(NOPERM);
  const ab=turnoAbierto();
  if(ab&&ab.demo&&turnoConDatosDeUsuario(ab)){cerrar();return aviso(`El turno de caja #${ab.nro} tiene movimientos cargados por usuarios: cerralo antes de eliminar los datos demo`)}
  const antes=resumenDemo();
  const nrosDemo=new Set(RESERVAS.filter(r=>r.demo&&r.nro).map(r=>r.nro));
  const movUsuarios=MOVIMIENTOS.filter(m=>!m.demo&&m.reserva&&nrosDemo.has(m.reserva)).length;
  for(let i=RESERVAS.length-1;i>=0;i--) if(RESERVAS[i].demo) RESERVAS.splice(i,1);
  for(let i=MOVIMIENTOS.length-1;i>=0;i--) if(MOVIMIENTOS[i].demo) MOVIMIENTOS.splice(i,1);
  /* Incidencias: se quitan las demo y las de bloqueos demo eliminados (sin dejar referencias huérfanas) */
  for(let i=INCIDENCIAS.length-1;i>=0;i--){const x=INCIDENCIAS[i];if(x.demo||(x.bloqueoId&&!bloqueoPorId(x.bloqueoId)))INCIDENCIAS.splice(i,1)}
  /* Avisos simulados: se quitan los demo y los que quedaron sin su origen (INC, PRO o BLQ) */
  {const existe=(o)=>o.tipo==='INC'?!!incPorId(o.id):o.tipo==='PRO'?INCIDENCIAS.some(i=>i.propuestas.some(p=>p.id===o.id)):o.tipo==='BLQ'?!!bloqueoPorId(o.id):true;
   for(let i=AVISOS.length-1;i>=0;i--){const a=AVISOS[i];if(a.demo||!existe(a.origen)||(a.incId&&!incPorId(a.incId)))AVISOS.splice(i,1)}}
  /* Limpieza: se quitan las tareas demo y las de estadía de reservas eliminadas; una incidencia de usuario que apuntaba a una tarea eliminada conserva la referencia como dato histórico */
  for(let i=LIMPIEZAS.length-1;i>=0;i--){const l=LIMPIEZAS[i];if(l.demo||(l.reserva&&!RESERVAS.some(r=>r.nro===l.reserva)))LIMPIEZAS.splice(i,1)}
  INCIDENCIAS.forEach(i=>{if(i.limId&&!limPorId(i.limId)){incHist(i,'Tarea de limpieza de demostración eliminada',`${i.limId} ya no existe; se conserva como referencia histórica`,SISTEMA_LIM);i.limIdEliminada=i.limId;i.limId=null}});
  /* Gastos demo (su egreso demo ya se quitó), sus solicitudes de anulación y los proveedores demo sin datos de usuarios */
  const gastosDemo=new Set(GASTOS.filter(g=>g.demo).map(g=>g.id));
  for(let i=GASTOS.length-1;i>=0;i--) if(GASTOS[i].demo) GASTOS.splice(i,1);
  for(let i=SOLICITUDES_G.length-1;i>=0;i--) if(gastosDemo.has(SOLICITUDES_G[i].gastoId)) SOLICITUDES_G.splice(i,1);
  for(let i=REGULARIZACIONES.length-1;i>=0;i--) if(gastosDemo.has(REGULARIZACIONES[i].gastoId)) REGULARIZACIONES.splice(i,1);
  for(let i=PROVEEDORES.length-1;i>=0;i--) if(PROVEEDORES[i].demo&&!provConDatosDeUsuario(PROVEEDORES[i])) PROVEEDORES.splice(i,1);
  let conservados=0, borrados=0;
  for(let i=HUESPEDES.length-1;i>=0;i--){
    const g=HUESPEDES[i]; if(!g.esDemo) continue;
    /* Un huésped demo con información cargada por usuarios (reservas, notas, ediciones) se conserva */
    if(RESERVAS.some(r=>r.huespedId===g.id)||g.notas.length||g.historialDatos.length) conservados++;
    else{HUESPEDES.splice(i,1);borrados++}
  }
  HABITACIONES.forEach(h=>{const inf=HAB_INFO[h];['tipo','capacidad','camas','tarifaBase'].forEach(k=>{if(inf.demo[k]){inf[k]=null;inf.demo[k]=false}});inf.log=inf.log.filter(e=>!e.demo)});
  [...LIMPIEZA_DEMO].forEach(h=>{const k=limpieza.indexOf(h);if(k>=0)limpieza.splice(k,1)}); LIMPIEZA_DEMO.clear();
  /* Tarifas demo: los importes ficticios vuelven a “sin definir” y se quitan la temporada y la fecha especial de ejemplo */
  Object.values(TARIFAS.categorias).forEach(c=>{if(c.demo.base){c.base=null;c.demo.base=false}if(c.demo.incluidas){c.incluidas=null;c.demo.incluidas=false}});
  if(TARIFAS.adultoAdicional.demo){TARIFAS.adultoAdicional.monto=null;TARIFAS.adultoAdicional.demo=false}
  for(let i=TARIFAS.rangos.length-1;i>=0;i--) if(TARIFAS.rangos[i].demo) TARIFAS.rangos.splice(i,1);
  if(TARIFAS.bebes.demo) Object.assign(TARIFAS.bebes,{activa:false,edadMax:null,ocupaPlaza:false,monto:null,cunasPorHab:null,cunasHotel:null,demo:false});
  ['temporadas','especiales'].forEach(k=>{for(let i=TARIFAS[k].length-1;i>=0;i--) if(TARIFAS[k][i].demo) TARIFAS[k].splice(i,1)});
  const tareasUsuario=TAREAS_AG.filter(t=>!t.demo); TAREAS_AG.splice(0,TAREAS_AG.length,...tareasUsuario);
  /* Caja: se quitan los turnos, diferencias y recepcionistas de ejemplo. El saldo inicial demo vuelve a $0 hasta cargar el real. */
  const turnosBorrar=new Set(TURNOS.filter(t=>t.demo&&!turnoConDatosDeUsuario(t)).map(t=>t.nro));
  const usrBorrar=USUARIOS.filter(u=>u.demo&&!usuarioConActividad(u)).map(u=>u.id);
  for(let i=TURNOS.length-1;i>=0;i--) if(turnosBorrar.has(TURNOS[i].nro)) TURNOS.splice(i,1);
  for(let i=DIFERENCIAS.length-1;i>=0;i--) if(turnosBorrar.has(DIFERENCIAS[i].turno)) DIFERENCIAS.splice(i,1);
  for(let i=USUARIOS.length-1;i>=0;i--) if(usrBorrar.includes(USUARIOS[i].id)) USUARIOS.splice(i,1);
  if(CAJA.demo){CAJA.saldoInicial={efectivo:0,banco:0,tarjetas:0};CAJA.demo=false}
  pintarMenu();
  auditar('Eliminó los datos de demostración',`${antes.reservas} reservas, ${antes.bloqueos} mantenimientos, ${antes.movimientos} movimientos, ${borrados} huéspedes, ${antes.tareas} tareas, ${antes.gastos} gastos y ${antes.proveedores} proveedores de ejemplo, ${antes.turnos} turnos de caja, ${antes.usuarios} usuarios de ejemplo (recepción y limpieza)${conservados?` · se conservaron ${conservados} huéspedes con información cargada por usuarios`:''}${movUsuarios?` · se conservaron ${movUsuarios} movimientos cargados por usuarios`:''}`);
  cerrar();cerrarFicha();PL.q='';refrescar();aviso('Datos de demostración eliminados');
}

        <div><small>Transferencias internas</small><b class="num">${R.trEnt-R.trSal>=0?'+':'−'}${ars(Math.abs(R.trEnt-R.trSal))}</b></div>
        ${R.reintEf?`<div><small>Reintegros de gastos</small><b class="num in">+${ars(R.reintEf)}</b></div>`:''}
        <div class="esp"><small>Efectivo esperado ahora</small><b class="num">${ars(R.esperado)}</b></div>
      </div>
    </section>`
    :`<section class="card cj-turno">
      <div class="card-head"><h2>${ic('clock')}No hay un turno abierto</h2><span class="pill warn" style="margin-left:auto">Caja sin responsable</span></div>
      <p class="cj-p">${u?`Último cierre: <b>#${u.nro}</b> de ${u.cierre.usuario}, el ${u.cierre.fin.fecha} a las ${u.cierre.fin.hora}. Entregó <b class="num">${ars(u.cierre.contado)}</b> en efectivo.`:'Todavía no hay cierres registrados.'}
      Mientras no haya un turno abierto no se puede registrar efectivo. La próxima recepcionista inicia su turno y confirma el efectivo que recibe.</p>
    </section>`;
  const cuentas=`<section class="cj-cuentas">${CUENTAS.map(c=>{const s=saldoCuenta(c.id);return `
    <div class="card cj-cta${c.fisica?' fis':''}"><small>${c.t}</small><b class="num">${ars(s)}</b><span>${c.sub}</span>
      ${c.fisica&&(sinAjustar||REGULARIZACIONES.length)?`<em class="${sinAjustar<0?'out':'in'}">Diferencias registradas sin regularizar: ${sinAjustar<0?'−':'+'}${ars(Math.abs(sinAjustar))}${REGULARIZACIONES.length?` · regularizadas ${ars(REGULARIZACIONES.reduce((a,r)=>a+r.monto,0))}`:''}</em>`:''}
      ${!c.fisica?`<em>Según movimientos registrados${CAJA.desde?` desde el ${ddmm(new Date(CAJA.desde+'T00:00'))}`:''}. No reemplaza el extracto.</em>`:''}
    </div>`}).join('')}</section>
    <p class="note cj-note">Turnos, cierres y anulaciones usan la fecha y hora real de Argentina${CAJA.demo?`. Los movimientos de ejemplo conservan la fecha operativa del demo (${fechaStr(HOY)})`:''}. Saldo según sistema: saldo inicial${CAJA.demo?' <span class="demo">demo</span>':''} + movimientos vigentes. Las diferencias de arqueo no lo modifican: quedan registradas para que las revise el Administrador.</p>`;
  const medios=t?`
    <section class="card cj-sec">
      <div class="card-head"><h2>${ic('caja')}Ingresos y egresos del turno</h2><span class="label num">${R.cant} movimientos</span></div>
      <div class="cj-pad"><div class="table-wrap"><table class="plain stack"><thead><tr><th>Medio</th><th class="right">Ingresos</th><th class="right">Egresos</th><th class="right">Reintegros</th><th class="right">Neto</th></tr></thead>
        <tbody>${R.porMedio.map(x=>`<tr><td data-label="Medio">${x.medio}</td><td class="num right in" data-label="Ingresos">${ars(x.ing)}</td><td class="num right out" data-label="Egresos">${ars(x.egr)}</td><td class="num right in" data-label="Reintegros">${ars(x.rein)}</td><td class="num right" data-label="Neto"><b>${ars(x.ing-x.egr+x.rein)}</b></td></tr>`).join('')}
        <tr class="cj-tot"><td data-label="">Total</td><td class="num right in" data-label="Ingresos">${ars(R.ingresos)}</td><td class="num right out" data-label="Egresos">${ars(R.egresos)}</td><td class="num right in" data-label="Reintegros">${ars(R.reintegros)}</td><td class="num right" data-label="Neto"><b>${ars(R.ingresos-R.egresos+R.reintegros)}</b></td></tr></tbody></table></div></div>
    </section>`:'';
  const difs=pend.length?`
    <section class="card cj-difs">
      <div class="card-head"><h2>${ic('alert')}Diferencias pendientes de revisión <span class="count num">${pend.length}</span></h2></div>
      <ul class="alerts">${pend.map(d=>`<li><div class="alert"><span class="ai">${ic('alert')}</span><div><b>${d.monto<0?'Faltante':'Sobrante'} de ${ars(Math.abs(d.monto))} · turno #${d.turno}</b>
        <span>${d.tipo==='cierre'?(d.excepcional?'Cierre excepcional':'En el cierre'):'Al recibir la caja'} · ${d.responsable}${d.usuario!==d.responsable?` · registró ${d.usuario}`:''} · ${dm(d.fecha)} ${d.hora} · “${d.explicacion}”</span></div>
        ${esAdmin()?`<button class="btn btn-sm" data-cj="revisar" data-id="${d.id}">Revisar</button>`:'<span class="pill warn">En revisión</span>'}</div></li>`).join('')}</ul>
    </section>`:'';
  const base=CJ.vista==='turno'?(t?movsTurno(t):[]):CJ.vista==='hoy'?MOVIMIENTOS.filter(m=>m.dia===isoD(HOY)):MOVIMIENTOS;
  const lista=base.slice().sort(ordenMov).slice(0,CJ.vista==='todos'?40:200);
  const chips=[['turno','Turno actual',t?movsTurno(t).length:0],['hoy','Hoy',MOVIMIENTOS.filter(m=>m.dia===isoD(HOY)).length],['todos','Todos',MOVIMIENTOS.length]];
  const movs=`
    <section class="card cj-sec">
      <div class="card-head"><h2>${ic('reservas')}Movimientos</h2></div>
      <div class="cj-pad">
        <div class="rs-filters">${chips.map(([k,l,n])=>`<button class="rs-chip${CJ.vista===k?' on':''}" data-cjv="${k}">${l} <span class="num">${n}</span></button>`).join('')}</div>
        ${lista.length?`<div class="table-wrap"><table class="plain stack cj-movs"><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Cuenta / medio</th><th>Registró</th><th>Turno</th><th class="right">Importe</th><th>Estado</th><th></th></tr></thead>
          <tbody>${lista.map(filaMov).join('')}</tbody></table></div>${CJ.vista==='todos'&&base.length>40?`<p class="note">Se muestran los 40 más recientes de ${base.length}.</p>`:''}`
          :`<p class="empty">${CJ.vista==='turno'&&!t?'No hay un turno abierto.':'No hay movimientos.'}</p>`}
        <p class="note">Los movimientos no se borran: se anulan con motivo y quedan en el historial.</p>
      </div>
    </section>`;
  const turnosConDif=[...new Set(DIFERENCIAS.map(d=>{const tt=TURNOS.find(x=>x.nro===d.turno);return d.tipo==='recepcion'&&tt&&tt.recepcion.deTurno?tt.recepcion.deTurno:d.turno}))].sort((a,b)=>b-a);
  const regs=esAdmin()&&turnosConDif.length?`
    <section class="card cj-sec">
      <div class="card-head"><h2>${ic('alert')}Diferencias de arqueo y regularizaciones</h2><span class="label">Respaldo para corregir gastos de turnos cerrados</span></div>
      <div class="cj-pad"><div class="table-wrap"><table class="plain stack cj-regs"><thead><tr><th>Turno</th><th>Diferencias registradas</th><th class="right">Neto</th><th class="right">Regularizado</th><th class="right">Disponible</th><th>Regularizaciones</th></tr></thead>
        <tbody>${turnosConDif.map(nro=>{const r=respaldoTurno(nro), disp=r.neto-r.usado;return `<tr>
          <td class="num" data-label="Turno"><b>#${nro}</b></td>
          <td data-label="Diferencias registradas">${r.difs.map(d=>`${d.tipo==='cierre'?'Cierre':'Recepción'} #${d.turno}: <b class="num ${d.monto<0?'out':'in'}">${d.monto<0?'−':'+'}${ars(Math.abs(d.monto))}</b> (${esc(d.responsable||d.usuario)})`).join('<br>')}</td>
          <td class="num right" data-label="Neto">${r.neto<0?'−':'+'}${ars(Math.abs(r.neto))}</td>
          <td class="num right" data-label="Regularizado">${ars(Math.abs(r.usado))}</td>
          <td class="num right" data-label="Disponible"><b>${disp?`${disp<0?'faltante ':'sobrante '}${ars(Math.abs(disp))}`:'$0'}</b></td>
          <td data-label="Regularizaciones">${r.regs.length?r.regs.map(x=>`#${x.id} · ${ars(x.monto)} · gasto #${x.gastoId} · autorizó ${esc(x.autorizo)} · ${dm(x.fecha)} ${x.hora}`).join('<br>'):'—'}</td></tr>`}).join('')}</tbody></table></div>
        <p class="note">El neto suma la diferencia del cierre y la de la recepción siguiente: si se compensan, no hay dinero extra. Cada regularización consume del disponible y no se puede usar dos veces. Los cierres no se modifican.</p></div>
    </section>`:'';
  const vis=cierresVisibles().slice().reverse();
  const hist=`
    <section class="card cj-sec">
      <div class="card-head"><h2>${ic('lock')}Historial de cierres</h2>${esAdmin()?'':'<span class="label">Tus cierres y el último entregado</span>'}</div>
      <div class="cj-pad">${vis.length?`<div class="table-wrap"><table class="plain stack"><thead><tr><th>Nº</th><th>Responsable</th><th>Inicio</th><th>Cierre</th><th class="right">Esperado</th><th class="right">Contado</th><th class="right">Diferencia</th><th>Revisión</th><th></th></tr></thead>
        <tbody>${vis.map(x=>{const c=x.cierre, d=DIFERENCIAS.find(y=>y.tipo==='cierre'&&y.turno===x.nro);return `<tr>
          <td class="num" data-label="Nº"><b>#${x.nro}</b>${x.demo?'<span class="demo">demo</span>':''}</td><td data-label="Responsable">${c.usuario}${c.excepcional?`<span class="t-sub cj-motivo">Cerró ${c.excepcional.por}</span>`:''}</td>
          <td class="num" data-label="Inicio">${dm(c.inicio.fecha)} ${c.inicio.hora}</td><td class="num" data-label="Cierre">${dm(c.fin.fecha)} ${c.fin.hora}</td>
          <td class="num right" data-label="Esperado">${ars(c.esperado)}</td><td class="num right" data-label="Contado">${ars(c.contado)}</td>
          <td class="num right" data-label="Diferencia">${c.diferencia?`<b class="${c.diferencia<0?'out':'in'}">${c.diferencia<0?'−':'+'}${ars(Math.abs(c.diferencia))}</b>`:'—'}</td>
          <td data-label="Revisión">${c.excepcional?'<span class="pill bad">Excepcional</span> ':''}${!c.diferencia?'<span class="pill ok">Sin diferencia</span>':d&&d.revision?'<span class="pill info">Revisada</span>':'<span class="pill warn">Pendiente</span>'}</td>
          <td class="right" data-label=""><button class="btn btn-sm" data-cj="comp" data-nro="${x.nro}">Comprobante</button></td></tr>`}).join('')}</tbody></table></div>`
        :'<p class="empty">Todavía no hay cierres de turno.</p>'}</div>
    </section>`;
  return `
  <div class="rs-head">
    <div class="page-head"><h1>Caja</h1><p>Caja única del hotel. Cada movimiento queda a nombre de quien lo registra.</p></div>
    <div class="cj-actions">${acciones}</div>
  </div>
  ${difs}${turnoCard}${cuentas}${medios}${movs}${regs}${hist}`;
}

/* ---------- Iniciar turno: recibir la caja ---------- */
function abrirInicioTurno(){
  if(!puede('caja.cierreTurno')) return aviso(NOPERM);
  const ab=turnoAbierto();
  if(ab){const r=iniciarTurno(0,'');return aviso(r.error)}
  const ent=efectivoEntregado(), u=ent.desde, ini=ahoraAR(), eh=chequeoHorarioApertura(ini);
  const destino=u&&u.cierre.entrega.a, quien=u?(u.cierre.excepcional?`Cierre excepcional · contó ${u.cierre.contadoPor}`:u.cierre.entrega.por):'Saldo del sistema';
  modal(`<form id="itf" novalidate><div class="modal-head"><div><h2>Iniciar turno de caja</h2><p>Recepción de la caja antes de abrir el turno</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="detail">
      <div><small>Entrega</small><b>${quien}${u?` · cierre #${u.nro}`:''}</b></div>
      <div><small>Recibe</small><b>${usuarioActual.nombre}</b></div>
      <div><small>Efectivo entregado</small><b class="num">${ars(ent.monto)}</b></div>
      <div><small>Apertura (hora de Argentina)</small><b class="num">${fh(ini)}</b></div>
    </div>
    ${destino&&destino.id!==usuarioActual.id?`<div class="msg warn" style="margin-top:14px">${ic('alert')}<span>El cierre #${u.nro} indicaba que la caja la recibía <b>${destino.nombre}</b>. Si continuás, queda registrado que la recibiste vos.</span></div>`:''}
    ${eh?`<div class="msg bad" style="margin-top:14px">${ic('alert')}<span>${eh}</span></div>`:''}
    <div class="msg bad" id="it-err" hidden></div>
    <div class="form" style="margin-top:14px">
      <div class="field full"><label for="it-cont">Efectivo que recibís, contado físicamente ($)</label><input id="it-cont" inputmode="numeric" autocomplete="off" placeholder="Contá el efectivo y escribí el total">
        <span class="hint" id="it-dif">Obligatorio. Si no hay efectivo, escribí 0.</span></div>
      <div class="field full"><label for="it-obs" id="it-obs-l">Observaciones (opcional)</label><textarea id="it-obs" placeholder="Opcional si coincide. Si hay diferencia, explicá qué se contó y con quién se verificó."></textarea></div>
    </div>
    <p class="note">Si lo que contás no coincide con lo entregado, la diferencia queda registrada y se genera una alerta para el Administrador. El saldo del sistema no se ajusta.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary" ${eh?'disabled':''}>Confirmar lo recibido y abrir el turno</button></div></form>`);
  const upd=()=>{const v=leerMonto($('#it-cont').value), h=$('#it-dif'), l=$('#it-obs-l');
    if(v===null){h.textContent='Obligatorio. Si no hay efectivo, escribí 0.';h.className='hint';l.textContent='Observaciones (opcional)';return}
    const d=v-ent.monto; h.textContent=d?`No coincide: ${difTxt(d)}.`:'Coincide con lo entregado.'; h.className='hint '+(d?'due':'cred');
    l.textContent=d?'Observaciones (obligatorias: hay diferencia)':'Observaciones (opcional)';};
  $('#it-cont').oninput=upd;
  $('#itf').onsubmit=(e)=>{
    e.preventDefault();
    const r=iniciarTurno(leerMonto($('#it-cont').value),$('#it-obs').value);
    if(r.error){const b=$('#it-err');b.textContent=r.error;b.hidden=false;return}
    cerrar();refrescar();
    aviso(r.turno.recepcion.diferencia?`Turno #${r.turno.nro} iniciado · diferencia registrada y alerta para el Administrador`:`Turno #${r.turno.nro} iniciado · la caja queda a tu cargo`);
  };
}

/* ---------- Cerrar turno: arqueo obligatorio (normal o excepcional) ---------- */
function abrirArqueo(exc=false){
  const t=turnoAbierto();
  if(!t) return aviso('No hay un turno abierto para cerrar.');
  if(exc){
    if(!esAdmin()) return aviso('Solo el Administrador puede hacer un cierre excepcional.');
    if(t.usuarioId===usuarioActual.id) return abrirArqueo(false);
  }else{
    if(!puede('caja.cierreTurno')) return aviso(NOPERM);
    if(t.usuarioId!==usuarioActual.id) return aviso(`Este turno está a cargo de ${t.usuario}. Solo esa persona puede cerrarlo.`);
  }
  const R=resumenTurno(t), fin=ahoraAR(), eh=chequeoHorarioCierre(t,fin), rec=receptoras(), pc=pendientesConfirmacion(t);
  modal(`<form id="aqf" novalidate><div class="modal-head"><div><h2>${exc?'Cierre excepcional':'Cerrar turno'} #${t.nro}</h2><p>${exc?`Cierre del turno de ${t.usuario} realizado por ${usuarioActual.nombre}`:'Arqueo de efectivo y entrega de la caja'}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    ${exc?`<div class="msg warn">${ic('alert')}<span>Vas a cerrar el turno de <b>${t.usuario}</b> sin que esa persona lo haga. Queda registrado como <b>cierre excepcional</b> a tu nombre, en el comprobante y en auditoría.</span></div>`:''}
    <div class="detail">
      <div><small>Recepcionista responsable</small><b>${t.usuario}</b></div>
      <div><small>${exc?'Cierra':'Entrega'}</small><b>${usuarioActual.nombre}</b></div>
      <div><small>Apertura</small><b class="num">${fh(t.inicio)}</b></div>
      <div><small>Cierre (hora de Argentina)</small><b class="num" id="aq-fin">${fh(fin)}</b></div>
    </div>
    ${eh?`<div class="msg bad" style="margin-top:14px">${ic('alert')}<span>${eh}</span></div>`:''}
    ${pc.length?`<div class="msg warn" id="aq-pend" style="margin-top:14px">${ic('alert')}<span><b>Hay ${pc.length} ${pc.length===1?'confirmación física pendiente':'confirmaciones físicas pendientes'} en este turno</b> (${pc.map(x=>`solicitud #${x.id} · ${ars(x.montoConfirmar)}`).join(', ')}). Si cerrás ahora, no se ejecutan: pasan a “Requiere nueva revisión” y queda registrado que viste esta advertencia.</span></div>`:''}
    <div class="cj-lines">
      <div><span>Saldo inicial de efectivo</span><b class="num">${ars(R.saldoInicial)}</b></div>
      <div><span>Ingresos en efectivo</span><b class="num in">+${ars(R.ingEf)}</b></div>
      <div><span>Egresos en efectivo</span><b class="num out">−${ars(R.egrEf)}</b></div>
      <div><span>Transferencias internas (entradas / salidas)</span><b class="num">+${ars(R.trEnt)} / −${ars(R.trSal)}</b></div>
      ${R.reintEf?`<div><span>Reintegros de gastos en efectivo</span><b class="num in">+${ars(R.reintEf)}</b></div>`:''}
      <div class="esp"><span>Efectivo esperado</span><b class="num">${ars(R.esperado)}</b></div>
    </div>
    <div class="msg bad" id="aq-err" hidden></div>
    <div class="form">
      ${exc?`<div class="field full"><label for="aq-mot">Motivo del cierre excepcional</label><textarea id="aq-mot" placeholder="Obligatorio. Ej.: la recepcionista se retiró sin cerrar el turno"></textarea></div>`:''}
      <div class="field"><label for="aq-cont">${exc?'Efectivo contado físicamente ($)':'Efectivo contado que entregás ($)'}</label><input id="aq-cont" inputmode="numeric" autocomplete="off" placeholder="Obligatorio"></div>
      <div class="field"><label>Diferencia (contado − esperado)</label><div class="cj-dif" id="aq-dif">Falta el conteo</div></div>
      ${exc?'':`<div class="field full"><label for="aq-para">¿A quién entregás la caja?</label><select id="aq-para"><option value="">Queda en caja: la recibe quien abra el próximo turno</option>${rec.map(u=>`<option value="${u.id}">${u.nombre}</option>`).join('')}</select>
        <span class="hint">Quien la reciba tiene que contar el efectivo y confirmar lo recibido antes de abrir su turno.</span></div>`}
      <div class="field full"><label for="aq-obs" id="aq-obs-l">Observaciones (opcional)</label><textarea id="aq-obs" placeholder="Opcional si no hay diferencia. Obligatorias si hay faltante o sobrante."></textarea></div>
      <label class="check field full"><input type="checkbox" id="aq-ok"> Revisé el conteo. Sé que el cierre confirmado no se puede modificar ni eliminar.</label>
    </div>
    <p class="note">Banco y tarjetas no se cuentan: del turno hay ${ars(R.ingresos-R.ingEf)} en ingresos y ${ars(R.egresos-R.egrEf)} en egresos por otros medios.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary${exc?' btn-danger':''}" ${eh?'disabled':''}>${exc?'Confirmar cierre excepcional':'Confirmar cierre y entrega'}</button></div></form>`,'wide');
  $('#aq-cont').oninput=()=>{const v=leerMonto($('#aq-cont').value), b=$('#aq-dif'), l=$('#aq-obs-l');
    if(v===null){b.textContent='Falta el conteo';b.className='cj-dif';l.textContent='Observaciones (opcional)';return}
    const d=v-R.esperado; b.textContent=d?`${d<0?'Faltante':'Sobrante'} de ${ars(Math.abs(d))}`:'Sin diferencia'; b.className='cj-dif '+(d<0?'out':d>0?'warn':'ok');
    l.textContent=d?'Observaciones (obligatorias: hay diferencia)':'Observaciones (opcional)';};
  $('#aqf').onsubmit=(e)=>{
    e.preventDefault();
    const b=$('#aq-err'), fallo=(x)=>{b.textContent=x;b.hidden=false};
    const v=leerMonto($('#aq-cont').value);
    if(exc&&limpiar($('#aq-mot').value).length<5) return fallo('El motivo del cierre excepcional es obligatorio.');
    if(v===null) return fallo('Ingresá el efectivo contado. Es obligatorio, aunque sea $0.');
    if(!$('#aq-ok').checked) return fallo('Marcá la confirmación del conteo para cerrar el turno.');
    const adv=!!pc.length;
    const r=exc?cierreExcepcional(v,$('#aq-mot').value,$('#aq-obs').value,{advertida:adv}):cerrarTurno(v,$('#aq-obs').value,{entregaA:$('#aq-para').value,advertida:adv});
    if(r.error) return fallo(r.error);
    refrescar(); verComprobante(r.turno.nro);
    const c=r.turno.cierre;
    aviso(`${exc?'Cierre excepcional del':'Cerrado el'} turno #${r.turno.nro} · ${c.diferencia?difTxt(c.diferencia)+' · alerta para el Administrador':'sin diferencias'}`);
  };
}

/* ---------- Comprobante de cierre ---------- */
function comprobanteHTML(t){
  const c=t.cierre, rec=TURNOS.find(x=>x.recepcion&&x.recepcion.deTurno===t.nro), exc=c.excepcional;
  const fila=(a,b,cl='')=>`<tr class="${cl}"><td>${a}</td><td class="r">${b}</td></tr>`;
  return `<div class="comp">
    <div class="comp-h"><div><b>JORGE PRIMERO</b><small>Gestión Hotelera</small></div><div class="r"><b>Cierre de turno Nº ${String(c.nro).padStart(4,'0')}</b><small>${t.demo?'DATOS DE DEMOSTRACIÓN':'Comprobante de arqueo de caja'}</small></div></div>
    ${exc?`<div class="comp-exc"><b>CIERRE EXCEPCIONAL</b><span>Realizado por ${exc.por} (Administrador) sobre el turno de ${c.usuario}. Motivo: ${exc.motivo}</span></div>`:''}
    <table class="comp-t">
      ${fila('Recepcionista responsable',c.usuario)}${fila('Apertura del turno',fh(c.inicio))}${fila('Cierre del turno',fh(c.fin))}

function verComprobante(nro){

}
const COMP_CSS=`body{font-family:Manrope,Arial,sans-serif;color:#1C1D20;margin:24px}.comp{max-width:640px;margin:0 auto;font-size:13px}.comp-h{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #B08D4A;padding-bottom:10px;margin-bottom:12px}.comp-h b{display:block;font-size:15px}.comp-h small{color:#666}.r{text-align:right}.comp h4{margin:16px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A6D33}.comp-t{width:100%;border-collapse:collapse}.comp-t td{padding:5px 0;border-bottom:1px solid #eee;vertical-align:top}.comp-t tr.b td{font-weight:700}.comp-t small{color:#777}.comp-f{color:#555;font-size:12px}.comp-s{display:flex;gap:30px;margin-top:40px}.comp-s div{flex:1;font-size:12px;color:#555}.comp-s span{display:block;border-top:1px solid #333;margin-bottom:4px;height:28px}.comp-exc{border:2px solid #A63D3D;color:#A63D3D;border-radius:8px;padding:8px 12px;margin:0 0 10px}.comp-exc b{display:block;letter-spacing:.1em}.comp-exc span{font-size:12px}`;
function imprimirComprobante(nro){
  const t=TURNOS.find(x=>x.nro===nro&&x.estado==='cerrado'); if(!t) return;
  $('#printRoot').innerHTML=comprobanteHTML(t);
  document.body.classList.add('imprimiendo');
  try{window.print()}catch(e){}
  setTimeout(()=>{document.body.classList.remove('imprimiendo');$('#printRoot').innerHTML=''},800);
  auditar('Imprimió un comprobante de cierre',`Turno #${nro}`);
}
async function descargarComprobante(nro){
  const t=TURNOS.find(x=>x.nro===nro&&x.estado==='cerrado'); if(!t) return;
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cierre de turno ${t.nro}</title><style>${COMP_CSS}</style></head><body>${comprobanteHTML(t)}</body></html>`;
  const filename=`cierre-turno-${String(t.nro).padStart(4,'0')}.html`;
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename,data:html})}
    catch(e){return aviso(e&&e.code==='declined'?'Descarga cancelada':'La descarga no está disponible en esta vista')}
  }else{
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}
    catch(e){return aviso('La descarga no está disponible en esta vista')}
  }
  auditar('Descargó un comprobante de cierre',`Turno #${nro}`);
}

/* ---------- Transferencia interna ---------- */
function abrirTransferencia(){
  if(!puede('caja.transferir')) return aviso(NOPERM);
  const opts=(sel)=>CUENTAS.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${c.t}</option>`).join('');
  modal(`<form id="trf" novalidate><div class="modal-head"><div><h2>Transferencia interna</h2><p>Mueve dinero entre cuentas del hotel. No es ingreso ni egreso.</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="msg bad" id="tr-err" hidden></div>
    <div class="form">
      <div class="field"><label for="tr-de">Desde</label><select id="tr-de">${opts('efectivo')}</select></div>
      <div class="field"><label for="tr-a">Hacia</label><select id="tr-a">${opts('banco')}</select></div>
      <div class="field"><label for="tr-m">Monto ($)</label><input id="tr-m" inputmode="numeric" autocomplete="off"></div>
      <div class="field"><label for="tr-c">Concepto</label><input id="tr-c" placeholder="Ej.: Depósito en el banco"></div>
    </div>
    <p class="note">Si la transferencia mueve efectivo, la registra quien es responsable del turno y entra en su arqueo.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Registrar</button></div></form>`);
  $('#trf').onsubmit=(e)=>{
    e.preventDefault();
    const monto=parseMonto($('#tr-m').value);
    const r=transferenciaInterna($('#tr-de').value,$('#tr-a').value,monto,$('#tr-c').value);
    if(r.error){const b=$('#tr-err');b.textContent=r.error;b.hidden=false;return}
    cerrar();refrescar();aviso(`Transferencia de ${ars(monto)} registrada`);
  };
}

/* ---------- Anular movimiento (con motivo; nunca se borra) ---------- */
function abrirAnular(id){
  const m=MOVIMIENTOS.find(x=>x.id===id); if(!m) return;
  const pa=puedeAnularMov(m); if(!pa.ok) return aviso(pa.motivo);
  const t=m.turno?TURNOS.find(x=>x.id===m.turno):null;
  modal(`<form id="anf" novalidate><div class="modal-head"><div><h2>Anular movimiento #${m.id}</h2><p>${m.concepto}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="detail">
      <div><small>Importe</small><b class="num">${ars(m.monto)}</b></div>
      <div><small>Cuenta / medio</small><b>${cuentaMov(m)}</b></div>
      <div><small>Registró</small><b>${m.creadoPor} · ${dm(m.fecha)} ${m.hora}</b></div>
    </div>
    ${t&&t.estado==='cerrado'?`<div class="msg warn" style="margin-top:14px">${ic('alert')}<span>Pertenece al turno #${t.nro}, ya cerrado. El comprobante de ese cierre no cambia; la anulación queda registrada aparte y modifica el saldo según sistema.</span></div>`:''}
    ${m.reserva?`<div class="msg warn" style="margin-top:14px">${ic('alert')}<span>Está vinculado a la reserva #${m.reserva}: su saldo pendiente se recalcula.</span></div>`:''}
    <div class="msg bad" id="an-err" hidden></div>
    <div class="form" style="margin-top:14px"><div class="field full"><label for="an-mot">Motivo de la anulación</label><textarea id="an-mot" placeholder="Obligatorio. Ej.: cargado dos veces"></textarea></div></div>
    <p class="note">El movimiento no se borra: queda en el historial como anulado, con tu usuario, fecha, hora y motivo.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary btn-danger">Anular movimiento</button></div></form>`);
  $('#anf').onsubmit=(e)=>{
    e.preventDefault();
    const mot=limpiar($('#an-mot').value);
    if(mot.length<5){const b=$('#an-err');b.textContent='Escribí el motivo de la anulación (al menos 5 caracteres).';b.hidden=false;return}
    if(!anularMovimiento(id,mot)) return aviso('No se pudo anular el movimiento');
    if(m.reserva){const r=RESERVAS.find(x=>x.nro===m.reserva);if(r) logRes(r,'Movimiento de caja anulado',`#${m.id} · ${ars(m.monto)} · ${mot}`)}
    cerrar();refrescar();aviso(`Movimiento #${id} anulado`);
  };
}

/* ---------- Revisión de diferencias (Administrador) ---------- */
function abrirRevision(id){
  if(!esAdmin()) return aviso('Solo el Administrador puede revisar diferencias de caja.');
  const d=DIFERENCIAS.find(x=>x.id===id); if(!d) return;
  if(d.revision) return aviso('Esta diferencia ya fue revisada');
  modal(`<form id="rvf" novalidate><div class="modal-head"><div><h2>Revisar diferencia</h2><p>Turno #${d.turno} · ${d.tipo==='cierre'?'cierre de caja':'recepción de la caja'}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="detail">
      <div><small>Diferencia</small><b class="num ${d.monto<0?'out':'in'}">${d.monto<0?'Faltante':'Sobrante'} de ${ars(Math.abs(d.monto))}</b></div>
      <div><small>Responsable</small><b>${d.responsable}${d.usuario!==d.responsable?` · registró ${d.usuario}`:''} · ${dm(d.fecha)} ${d.hora}</b></div>
      <div><small>Explicación</small><b>${d.explicacion}</b></div>
    </div>
    <div class="msg bad" id="rv-err" hidden></div>
    <div class="form" style="margin-top:14px"><div class="field full"><label for="rv-com">Comentario de revisión</label><textarea id="rv-com" placeholder="Qué se verificó y qué se decidió"></textarea></div></div>
    <p class="note">Marcarla como revisada saca la alerta de Inicio. No modifica el cierre ni ajusta el saldo.</p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Marcar como revisada</button></div></form>`);
  $('#rvf').onsubmit=(e)=>{
    e.preventDefault();
    const r=revisarDiferencia(id,$('#rv-com').value);
    if(r.error){const b=$('#rv-err');b.textContent=r.error;b.hidden=false;return}
    cerrar();refrescar();aviso('Diferencia revisada');
  };
}

/* ---------- Cambio de usuario (simula el ingreso con usuario y contraseña) ---------- */

function cambiarUsuario(id){
  const u=USUARIOS.find(x=>x.id===id&&x.activo); if(!u) return;
  usuarioActual=u; cerrar(); cerrarFicha(); pintarMenu();
  auditar('Ingresó al sistema',`${ROLES[u.rol].nombre}`);
  route(); aviso(`Ingresaste como ${u.nombre}`);

document.addEventListener('click',(e)=>{
  const c=e.target.closest('[data-cj]');
  if(c){if(c.disabled) return; const a=c.dataset.cj;
    if(a==='iniciar') return abrirInicioTurno();
    if(a==='cerrar') return abrirArqueo(false);
    if(a==='excepcional') return abrirArqueo(true);
    if(a==='transfer') return abrirTransferencia();
    if(a==='anular') return abrirAnular(+c.dataset.id);
    if(a==='revisar') return abrirRevision(+c.dataset.id);
    if(a==='comp') return verComprobante(+c.dataset.nro);
    if(a==='imprimir') return imprimirComprobante(+c.dataset.nro);
    if(a==='descargar') return descargarComprobante(+c.dataset.nro);
  }
  const v=e.target.closest('[data-cjv]'); if(v){CJ.vista=v.dataset.cjv;return pintarVista()}
  const dif=e.target.closest('[data-cjdif]'); if(dif){location.hash='#caja';route();if(esAdmin())abrirRevision(+dif.dataset.cjdif);return}
  if(e.target.closest('[data-usrmenu]')) return abrirCambioUsuario();
  const us=e.target.closest('[data-usr]'); if(us&&!us.disabled) return cambiarUsuario(us.dataset.usr);
});

function agrupar(lista,clave){

}

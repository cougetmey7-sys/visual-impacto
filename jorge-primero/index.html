<meta name="robots" content="noindex,nofollow">
<title>Jorge Primero · Prueba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: menú lateral grafito fijo + superficie de trabajo clara. Inicio: saludo y acciones → indicadores → llegadas/salidas → habitaciones, caja y alertas.
   Diseño de un solo tema (claro) a pedido: sistema administrativo de uso prolongado. */
:root{
  color-scheme:light;
  --bg:#F3F1EC;          /* fondo de trabajo, gris cálido muy claro */
  --surface:#FFFFFF;
  --surface-2:#FAF8F4;
  --line:#E6E1D8;
  --line-strong:#D4CDC1;
  --fg:#1E1F22;          /* grafito */
  --muted:#6B6964;
  --faint:#9A968F;
  --side:#1C1D20;        /* menú lateral */
  --side-2:#26272B;
  --side-fg:#ECE9E3;
  --side-muted:#8F8C86;
  --gold:#C29A48;        /* champagne: identidad y acento */
  --gold-deep:#8A6827;
  --gold-soft:#F5EDDB;
  --ok:#2E8456; --ok-soft:#E4F2EA;
  --info:#2D67AE; --info-soft:#E4EDF8;
  --warn:#B98A13; --warn-soft:#FBF2D9;
  --bad:#B8463B; --bad-soft:#F8E5E2;
  --overlay:rgba(20,20,22,.45);
  --shadow:0 1px 2px rgba(28,29,32,.04),0 6px 20px rgba(28,29,32,.05);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.sidebar{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:22px;padding:26px 14px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:172px;display:grid;place-items:center}
.logo img{width:100%;height:auto;display:block}
.logo.slot{border:1.5px dashed rgba(194,154,72,.55);border-radius:12px;color:var(--gold);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;line-height:1.3}
.brand-name{font-weight:700;font-size:15.5px;letter-spacing:.22em;color:var(--side-fg)}
.brand-sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:3px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-size:14px;font-weight:500;opacity:.72;transition:background .15s,opacity .15s;position:relative}
.nav a:hover{opacity:1;background:rgba(255,255,255,.04)}
.nav a.active{opacity:1;background:var(--side-2)}
.nav a.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a.active svg{color:var(--gold)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:11px;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.07)}
.avatar{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.side-foot b{display:block;font-weight:600;font-size:14px}
.side-foot small{display:block;color:var(--side-muted);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 36px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer}
.content{padding:30px 36px 56px;width:100%;max-width:1320px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);transition:transform .12s,border-color .15s,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn svg.i{width:16px;height:16px}
.btn-primary{background:var(--fg);border-color:var(--fg);color:#FFFFFF}
.btn-primary svg.i{color:var(--gold)}
.btn-primary:hover{background:#000;border-color:#000}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--fg);border-color:transparent}
.btn-sm{padding:7px 12px;font-size:13px}

/* ---------- Inicio ---------- */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 24px;margin-bottom:24px}
.hello .date{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:8px}
.hello h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--muted);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;flex-wrap:wrap}
.card-head h2{font-size:15.5px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.count{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold-deep)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Indicadores */
.kpis{display:grid;grid-template-columns:1.25fr repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.kpi .v{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-top svg.i{color:var(--faint);width:17px;height:17px}
.kpi.occ{flex-direction:row;align-items:center;gap:18px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--gold-soft)}
.ring .val{stroke:var(--gold);stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:18px}

/* Movimientos */
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.list{display:flex;flex-direction:column}
.arr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%;transition:background .12s}
.arr:hover{background:var(--surface-2)}
.arr:hover .go{color:var(--gold-deep);transform:translateX(2px)}
.room{width:52px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:none}
.room small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.room b{font-size:15px;font-weight:700}
.who{min-width:0}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--muted)}
.time{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.time svg.i{width:15px;height:15px}
.go{color:var(--faint);transition:transform .15s,color .15s;display:flex}
.arr-end{display:flex;align-items:center;gap:12px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.room-tag{font-weight:700}
.dep-cards{display:none}

/* Fila inferior */
.bottom{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:18px}

/* Habitaciones */
.rooms-body{padding:0 20px 20px;display:flex;flex-direction:column;gap:18px}
/* Barra de ocupación de Inicio. Va limitada a div: las tablas usan la clase "stack" para pasar a tarjetas en celular */
div.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface-2)}
div.stack i{display:block;height:100%}
.st-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st{display:flex;flex-direction:column;gap:2px}
.st b{font-size:22px;font-weight:700;line-height:1.1}
.st span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.c-ok{background:var(--ok)}.c-info{background:var(--info)}.c-warn{background:var(--warn)}.c-bad{background:var(--bad)}
.floors{display:flex;flex-direction:column;gap:8px}
.demo-reset{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.demo-reset p{margin:0 0 10px}
.floor{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.floor > small{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.tile{height:34px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid transparent}
.tile.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.tile.info{background:var(--info-soft);color:var(--info)}
.tile.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tile.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

/* Caja */
.cash{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px;height:calc(100% - 58px)}
.cash-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cash-row span{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
.cash-row b{font-size:17px;font-weight:700}
.cash-row .in{color:var(--ok)}
.cash-row .out{color:var(--bad)}
.net{background:var(--gold-soft);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.net span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-deep)}
.net b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.cash .btn{margin-top:auto;align-self:flex-start}

/* Alertas */
.alerts{padding:0 12px 14px;display:flex;flex-direction:column;gap:6px;list-style:none;margin:0}
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.alert.link{cursor:pointer;width:100%;text-align:left}
.alert.link:hover{border-color:var(--gold)}
.alert .ai{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.alert .ai svg.i{width:15px;height:15px}
.alert b{display:block;font-weight:600;font-size:13.5px}
.alert span{font-size:12.5px;color:var(--muted)}

/* Configuración */
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cfg{padding:20px;display:flex;flex-direction:column;gap:14px}
.cfg > p{margin:0;color:var(--muted);font-size:13.5px;max-width:60ch}
.cfg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cfg-head h2{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px}
.cfg-head h2 svg.i{color:var(--gold-deep)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold-deep)}
.users{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2)}
.user-row .who{flex:1}
.avatar.sm{width:32px;height:32px;font-size:13px;color:var(--gold-deep);border-color:var(--gold)}
.cfg .btn{align-self:flex-start}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-strong)}
.perm-groups{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.cfg .note{margin:0}
table.plain tbody tr{cursor:default}
table.plain th:first-child,table.plain td:first-child{padding-left:12px}
table.plain th:last-child,table.plain td:last-child{padding-right:12px;white-space:normal}
.empty{margin:0;padding:16px;border-radius:12px;border:1px dashed var(--line-strong);color:var(--muted);font-size:13px}
.void-ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.void-ex b{display:block;text-decoration:line-through;color:var(--muted)}
.void-ex span{font-size:12.5px;color:var(--muted)}
.void-ex small{grid-column:1/-1;font-size:12.5px;color:var(--bad)}

/* Planning / Ocupación */
.pl-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.pl-kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pl-kpi b{font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.pl-kpi b.gold{color:var(--gold-deep)}
.pl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.pl-nav{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn svg.i{width:16px;height:16px}
.icon-btn.flip svg{transform:scaleX(-1)}
.range{font-weight:700;font-size:14px;padding:0 6px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fg);color:#FFFFFF}
.search{position:relative;margin-left:auto;min-width:0;flex:0 1 260px}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);outline:none;font-size:13.5px}
.search input:focus{border-color:var(--gold)}
.search svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search small{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}

.plan-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.plan{--cols:7;--colw:minmax(92px,1fr);--roomw:128px;display:grid;grid-template-columns:var(--roomw) minmax(0,1fr);min-width:calc(var(--roomw) + var(--cols) * var(--minc,92px))}
.plan.d15{--minc:62px}
.plan.d30{--minc:46px}
.plan .days,.plan .cells{display:grid;grid-template-columns:repeat(var(--cols),minmax(var(--minc,92px),1fr))}
.ph-room{position:sticky;left:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px 14px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:flex-end}
.days{background:var(--surface-2);border-bottom:1px solid var(--line)}
.day{padding:8px 4px;text-align:center;border-left:1px solid var(--line);line-height:1.2}
.day:first-child{border-left:none}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:capitalize}
.day b{font-size:15px;font-weight:700}
.day.we small{color:var(--gold-deep)}
.day.today{background:var(--gold-soft)}
.day.today b{color:var(--gold-deep)}
.day .m{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}

.r-label{position:sticky;left:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 14px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:46px}
.r-label b{font-size:14px;font-weight:700}
.r-label span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.floor-sep{grid-column:1/-1;padding:6px 14px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;left:0}
.lane{position:relative;border-bottom:1px solid var(--line);min-height:46px}
.cells{position:absolute;inset:0}
.cell{border:none;border-left:1px solid var(--line);background:none;padding:0;margin:0;cursor:default;position:relative}
.cell:first-child{border-left:none}
.cell.today{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.cell.past{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px)}
.cell.free{cursor:pointer}
.cell.free:hover{background:var(--gold-soft)}
.cell.free:hover::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold-deep);font-weight:700;font-size:18px}

.bk{position:absolute;top:7px;bottom:7px;z-index:1;border-radius:8px;border:1px solid transparent;border-left-width:3px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;overflow:hidden;white-space:nowrap;min-width:0;transition:box-shadow .15s,opacity .15s,transform .12s}
.bk:hover{box-shadow:0 3px 10px rgba(28,29,32,.12);transform:translateY(-1px)}
.bk .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bk .px{display:inline-flex;align-items:center;gap:2px;font-weight:700;opacity:.8;flex:none}
.bk .px svg.i{width:12px;height:12px}
.bk.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bk.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bk.confirmada{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent);border-left-color:var(--info)}
.bk.inhouse{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent);border-left-color:var(--ok)}
.bk.pendiente{background:var(--gold-soft);color:var(--gold-deep);border-color:color-mix(in srgb,var(--gold) 45%,transparent);border-left-color:var(--gold)}
.bk.bloqueo{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 8px,color-mix(in srgb,var(--bad-soft) 60%,var(--surface)) 8px 14px);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent);border-left-color:var(--bad)}
.bk.finalizada{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong);border-left-color:var(--faint)}
.bk.dim{opacity:.22}
.bk.hit{box-shadow:0 0 0 2px var(--fg)}
.sw.confirmada{background:var(--info)}.sw.inhouse{background:var(--ok)}.sw.pendiente{background:var(--gold)}.sw.bloqueo{background:var(--bad)}.sw.finalizada{background:var(--faint)}
.pl-hint{font-size:12.5px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}

.modal .money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.money3 div{padding:12px;border-radius:12px;border:1px solid var(--line)}
.money3 small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.money3 b{font-size:16px;font-weight:700}
.money3 .due b{color:var(--bad)}
.money3 .paid b{color:var(--ok)}
.modal-foot .btn[disabled]{opacity:.5}

@media (max-width:1100px){.pl-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:768px){
  .pl-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl-kpis .pl-kpi:first-child{grid-column:1/-1}
  .search{flex:1 1 100%;margin-left:0;order:5}
  .plan{--roomw:84px}
  .r-label{padding:6px 10px}
  .r-label span{font-size:10px}
  .ph-room{padding:10px}
  .modal .money3{grid-template-columns:minmax(0,1fr)}
}

/* Planning › pestañas */
.pl-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin-bottom:18px}
.pl-tabs button{border:none;background:none;padding:10px 16px 11px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:8px}
.pl-tabs button svg.i{width:16px;height:16px}
.pl-tabs button:hover{color:var(--fg)}
.pl-tabs button.on{color:var(--fg)}
.pl-tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--gold)}
.pl-tabs button.on svg.i{color:var(--gold-deep)}

/* Agenda */
.ag-title{text-transform:capitalize;min-width:0;white-space:normal}
.ag-date{display:flex;align-items:center;gap:8px;margin-left:auto}
.ag-date input{padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);outline:none;font-size:13.5px}
.ag-date input:focus{border-color:var(--gold)}

.ag-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ag-ic svg.i{width:15px;height:15px}
.t-checkin.ag-ic{background:var(--info-soft);color:var(--info)}
.t-checkout.ag-ic{background:var(--fg);color:#FFFFFF}
.t-limpieza.ag-ic{background:var(--warn-soft);color:var(--warn)}
.t-mantenimiento.ag-ic{background:var(--bad-soft);color:var(--bad)}
.t-cobro.ag-ic{background:var(--gold-soft);color:var(--gold-deep)}
.t-tarea.ag-ic{background:var(--surface);color:var(--muted);border:1px solid var(--line-strong)}
.t-alert.ag-ic{background:var(--warn-soft);color:var(--warn)}

.ag-sum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.ag-sum-i{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ag-sum-i b{display:block;font-size:18px;font-weight:700;line-height:1.1}
.ag-sum-i small{font-size:12px;color:var(--muted)}

.ag-day{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.ag-col{padding-bottom:8px}
.ag-line{list-style:none;margin:0;padding:0 12px 8px;position:relative}
.ag-line::before{content:"";position:absolute;left:79px;top:6px;bottom:14px;width:1px;background:var(--line)}
.ag-att{list-style:none;margin:0;padding:0 12px 8px;display:flex;flex-direction:column;gap:6px}
.ag-item{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 8px;border:1px solid transparent;border-radius:12px;background:none;text-align:left;cursor:pointer;transition:background .12s,border-color .12s;position:relative}
.ag-line .ag-item{grid-template-columns:52px auto minmax(0,1fr) auto auto}
.ag-att .ag-item{grid-template-columns:auto minmax(0,1fr) auto;background:var(--surface-2);border-color:var(--line)}
.ag-item:hover{background:var(--surface-2);border-color:var(--line)}
.ag-item:hover .go{color:var(--gold-deep);transform:translateX(2px)}
.ag-time{font-weight:700;font-size:14px;text-align:right}
.ag-txt{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ag-txt small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ag-txt b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-txt > span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-item.done .ag-txt b,.ag-item.done .ag-time{color:var(--faint)}
.ag-item.done .ag-ic{opacity:.45}
.ag-now{display:flex;align-items:center;gap:8px;padding:2px 8px;margin:2px 0}
.ag-now span{font-size:11px;font-weight:700;color:var(--gold-deep);background:var(--gold-soft);padding:2px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.ag-now::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--gold)}

.ag-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}
.ag-wd{border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.ag-wd:first-child{border-left:none}
.ag-wd.today{background:color-mix(in srgb,var(--gold-soft) 45%,transparent)}
.ag-wh{border:none;border-bottom:1px solid var(--line);background:var(--surface-2);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.ag-wh small{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.ag-wh b{font-size:18px;font-weight:700}
.ag-wd.today .ag-wh{background:var(--gold-soft)}
.ag-wd.today .ag-wh b{color:var(--gold-deep)}
.ag-wh:hover b{color:var(--gold-deep)}
.ag-wl{padding:8px 6px 12px;display:flex;flex-direction:column;gap:5px;min-height:220px}
.ag-mini{border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:var(--surface);padding:5px 7px;font-size:11.5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;line-height:1.3;min-width:0}
.ag-mini span.num{font-weight:700;font-size:11px;color:var(--muted)}
.ag-mini .nm{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:600}
.ag-mini:hover{border-color:var(--gold)}
.ag-mini.t-checkin{border-left-color:var(--info)}
.ag-mini.t-checkout{border-left-color:var(--fg)}
.ag-mini.t-limpieza{border-left-color:var(--warn);background:var(--warn-soft)}
.ag-mini.t-mantenimiento{border-left-color:var(--bad);background:var(--bad-soft)}
.ag-mini.t-cobro{border-left-color:var(--gold);background:var(--gold-soft)}
.ag-mini.t-tarea{border-left-color:var(--faint);border-style:dashed;border-left-style:solid}
.ag-mini.done{opacity:.55}
.ag-none{font-size:12px;color:var(--faint);text-align:center;padding-top:10px}

.ag-month{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.ag-cal{padding:12px}
.ag-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ag-mh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:4px 0 6px}
.ag-md{min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left;transition:border-color .12s,background .12s}
.ag-md:hover{border-color:var(--gold)}
.ag-md .dn{font-weight:700;font-size:13.5px}
.ag-md.out{background:var(--surface-2);opacity:.55}
.ag-md.today{background:var(--gold-soft)}
.ag-md.today .dn{color:var(--gold-deep)}
.ag-md.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.ag-ind{display:flex;flex-wrap:wrap;gap:3px}
.ind{display:inline-flex;align-items:center;gap:2px;font-size:11px;padding:1px 5px 1px 3px;border-radius:6px}
.ind svg.i{width:11px;height:11px}
.ind.t-checkin{background:var(--info-soft);color:var(--info)}
.ind.t-checkout{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.ind.t-alert{background:var(--warn-soft);color:var(--warn)}
.ag-cal-leg{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 4px 2px;font-size:12.5px;color:var(--muted)}
.ag-cal-leg span{display:inline-flex;align-items:center;gap:7px}
.ag-cal-leg .ag-ic{width:22px;height:22px;border-radius:6px}
.ag-cal-leg .ag-ic svg.i{width:12px;height:12px}

@media (max-width:1100px){
  .ag-sum{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ag-day,.ag-month{grid-template-columns:minmax(0,1fr)}
  .ag-week{grid-template-columns:minmax(0,1fr)}
  .ag-wd{border-left:none;border-top:1px solid var(--line);flex-direction:row}
  .ag-wd:first-child{border-top:none}
  .ag-wh{border-bottom:none;border-right:1px solid var(--line);width:68px;flex:none;justify-content:center}
  .ag-wl{min-height:0;flex:1;flex-direction:row;flex-wrap:wrap}
  .ag-mini{flex:1 1 180px}
  .ag-none{padding:6px 0;text-align:left}
}
@media (max-width:768px){
  .ag-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ag-date{margin-left:0;flex:1 1 100%}
  .ag-date input{flex:1}
  .ag-line::before{left:63px}
  .ag-line .ag-item{grid-template-columns:44px auto minmax(0,1fr);row-gap:6px}
  .ag-line .ag-item .pill{grid-column:3;justify-self:start}
  .ag-line .ag-item .go{display:none}
  .ag-time{font-size:13px}
  .ag-md{min-height:52px;padding:4px}
  .ag-md .ind b{display:none}
  .ag-md .ind{padding:2px}
  .pl-tabs button{flex:1;justify-content:center}
}

/* Estados nuevos */
.pill.gold{background:var(--gold-soft);color:var(--gold-deep)}
.pill.cancel{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong)}
.pay{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;padding:2px 9px 2px 7px;border-radius:6px;border:1px solid currentColor;line-height:1.5}
.pay svg.i{width:13px;height:13px}
.pay.none{color:var(--muted);border-color:var(--line-strong)}
.pay.warn{color:var(--warn)}
.pay.ok{color:var(--ok)}

/* Botones y mensajes */
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn-danger:hover{border-color:var(--bad);background:var(--bad-soft)}
.btn-primary.btn-danger{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.btn-primary.btn-danger:hover{background:#9c3a30;border-color:#9c3a30}
.msg{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;margin-bottom:14px}
.msg[hidden]{display:none}
.form .msg{margin-bottom:0}
.msg svg.i{width:16px;height:16px;flex:none;margin-top:2px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:#7A5A06}
.modal.wide{max-width:680px}
.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);outline:none;min-height:76px;resize:vertical}
.field textarea:focus{border-color:var(--gold)}
.field input:disabled,.field select:disabled{opacity:.65}
.hint{font-size:12px;color:var(--muted)}
.sub-h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:800;margin:18px 0 10px}

/* Pasos de la nueva reserva */
.steps{list-style:none;display:flex;gap:6px;margin:0 0 16px;padding:0}
.steps li{flex:1;min-width:0}
.steps button{width:100%;display:flex;align-items:center;gap:8px;border:none;border-bottom:2px solid var(--line);background:var(--surface-2);border-radius:10px 10px 4px 4px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:default;white-space:nowrap;overflow:hidden}
.steps button span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-strong);font-size:12px;flex:none}
.steps li.on button{color:var(--fg);border-bottom-color:var(--gold)}
.steps li.on span{background:var(--fg);color:#FFFFFF;border-color:var(--fg)}
.steps li.done button{cursor:pointer;color:var(--fg)}
.steps li.done span{background:var(--gold-soft);color:var(--gold-deep);border-color:var(--gold)}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface-2)}
.radio input{margin-top:3px;accent-color:#1E1F22}
.radio b{display:block;font-size:13.5px}
.radio small{font-size:12px;color:var(--muted)}
.radio:has(input:checked){border-color:var(--fg);background:var(--surface)}
.calc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);font-size:13px;font-weight:700;color:var(--gold-deep)}
.calc b{font-size:18px;color:var(--fg)}

/* Reservas · listado */
.rs-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.rs-head .page-head{margin:0}
.rs-search{display:block;margin:0 0 12px;max-width:560px}
.rs-search input{padding:11px 12px 11px 36px;font-size:14px}
.rs-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.rs-chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.rs-chip span{font-size:11.5px;background:var(--surface-2);border-radius:999px;padding:1px 7px;color:var(--muted)}
.rs-chip:hover{border-color:var(--gold)}
.rs-chip.on{background:var(--fg);border-color:var(--fg);color:#FFFFFF}
.rs-chip.on span{background:rgba(255,255,255,.16);color:#FFFFFF}
.rs-card{overflow:hidden}
.rs-table td.who2 b{display:block;font-weight:600}
.rs-table .t-sub{font-size:12px;color:var(--muted)}
.rs-table .right{text-align:right}
.rs-table td.due{color:var(--bad);font-weight:700}
.rs-nro{color:var(--muted);font-weight:600}
.rs-cards{display:none}
.rs-count{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.rs-item{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border:none;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.rs-item:first-child{border-top:none}
.rs-item:hover{background:var(--surface-2)}
.rs-item .room{grid-row:span 2}
.rs-item .who b{white-space:normal}
.rs-item .row2{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rs-item .sal{font-size:12.5px;font-weight:700;color:var(--bad)}
@media (max-width:1100px){.rs-table-wrap{display:none}.rs-cards{display:block}}

/* Ficha de reserva (panel lateral) */
.drawer-ov{position:fixed;inset:0;background:var(--overlay);z-index:45;display:flex;justify-content:flex-end}
.drawer{width:min(760px,100%);height:100%;display:flex;flex-direction:column;background:var(--bg);box-shadow:-10px 0 40px rgba(28,29,32,.18);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.dr-head{background:var(--surface);padding:calc(18px + env(safe-area-inset-top,0px)) 24px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dr-head h2{margin:2px 0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.dr-head p{margin:0;color:var(--muted);font-size:13.5px}
.dr-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dr-actions{background:var(--surface);padding:12px 24px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.dr-actions .hint{flex-basis:100%;color:var(--faint);margin-top:2px}
.dr-body{flex:1;overflow-y:auto;padding:18px 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.dr-body .msg{margin:0}
.dr-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.dr-sec h3{margin:0 0 12px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:800;display:flex;align-items:center;gap:8px}
.dr-sec h3 svg.i{width:15px;height:15px}
.dr-sec .detail{background:none;border:none;padding:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.dr-sec .money3,.modal .money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.tarifa-line{margin:0;font-size:13.5px;color:var(--muted)}
.tarifa-line b{color:var(--fg)}
.obs{margin:0;white-space:pre-line}
.pagos th,.pagos td{padding:8px 10px}
.pagos th.right,.pagos td.right{text-align:right}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:none;padding-top:0}
.hist .when{font-size:12px;color:var(--muted)}
.hist b{display:block;font-size:13.5px;font-weight:600}
.hist span{font-size:12.5px;color:var(--muted)}

/* Listas rápidas (check-in / check-out / estadías) */
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left}
button.qrow{cursor:pointer}
button.qrow:hover{border-color:var(--gold)}
.qrow .who span{display:block}

@media (max-width:768px){
  .dr-head,.dr-actions,.dr-body{padding-left:16px;padding-right:16px}
  .dr-sec{padding:14px}
  .radios{grid-template-columns:1fr}
  .steps button{justify-content:center;font-size:12px}
  .hist li{grid-template-columns:1fr;gap:2px}
  .drawer .detail,.dr-sec .detail{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){
  .steps button{font-size:0;gap:0}
  .steps button span{font-size:12px}
  .dr-sec .money3,.modal .money3{grid-template-columns:minmax(0,1fr)}
}

/* Confirmaciones y opciones */
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;font-weight:600;cursor:pointer}
.check input{width:17px;height:17px;accent-color:#1E1F22;flex:none}
.radios.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
#co-deuda .msg{margin-bottom:0}
@media (max-width:768px){.radios.r3{grid-template-columns:minmax(0,1fr)}}

/* Habitaciones */

.hcard{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:12px 12px 11px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:12px;text-align:left;cursor:pointer;min-width:0;transition:box-shadow .15s,transform .12s;font-size:12.5px;line-height:1.35}

/* Huéspedes · ajustes finales */

@media (max-width:640px){
  table.stack thead{display:none}

/* Módulos en preparación */
.page-head{margin-bottom:22px}
.page-head h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.015em;margin:0 0 4px}

.soon{padding:56px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.soon .badge{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center}
.soon .badge svg.i{width:26px;height:26px}
.soon h2{font-size:18px;font-weight:700;margin:4px 0 0}

/* ---------- Modal, panel y aviso ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:540px;max-height:calc(100% - 32px);overflow-y:auto;padding:24px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.modal-head h2{font-size:20px;font-weight:700;margin:0}
.modal-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted);flex:none}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);outline:none}
/* Un campo oculto tiene que ocultarse aunque .field use flex; radios y casillas no se estiran al 100% */
.field[hidden]{display:none}
.field input[type=radio],.field input[type=checkbox]{width:auto;padding:0;border:none;background:none;flex:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;padding:16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.detail div small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.detail div b{font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:var(--side-fg);padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);z-index:60;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.toast .dot{background:var(--gold)}
.toast[hidden]{display:none}
.scrim{display:none}

/* Celular: menú desplegable */

  .app.open .sidebar{transform:none}

  LIMPIEZA_DEMO.delete(h);

/* Funciones sensibles: nunca se pueden delegar a una recepcionista */
const SOLO_ADMINISTRADORA=['usuarios.gestionar','permisos.gestionar','config.general','gastos.autorizar','tarifas.modificar','tarifas.excepciones','bloqueos.levantar','incidencias.resolver','incidencias.gestionar','avisos.ver','avisos.configurar','limpieza.corregir','limpieza.configurar'];

/* Administración real de usuarios (pendiente): cada cambio de nombre debe quedar en auditoría con
   valor anterior, valor nuevo, responsable y fecha. El identificador interno (id) nunca cambia. */
const USUARIOS=[
  {id:'u1',nombre:'Adrian',rol:'administradora',activo:true,permisos:[]}
  /* Recepcionistas: se agregan desde Configuración › Usuarios, p. ej.
     {id:'u2',nombre:'…',usuario:'…',rol:'recepcionista',activo:true,permisos:['planning.ver','checkin.realizar']} */
];
let usuarioActual=USUARIOS[0];

function puede(permiso){
  if(!permiso) return true;
  if(ROLES[usuarioActual.rol].accesoTotal) return true;
  if(SOLO_ADMINISTRADORA.includes(permiso)) return false;
  if(usuarioActual.rol==='limpieza'&&!PERM_ROL_LIMPIEZA.includes(permiso)) return false;
  return usuarioActual.permisos.includes(permiso);
}

/* =========================================================
   AUDITORÍA DE ACCIONES
   Cada operación importante deja: usuario responsable, fecha, hora y acción.
   ========================================================= */
/* =========================================================
   RELOJ REAL DE ARGENTINA
   Turnos, cierres, anulaciones y auditoría usan la fecha y hora real de
   America/Argentina/Buenos_Aires, sin depender de la zona horaria del equipo.
   RELOJ.ahora se puede reemplazar solo en pruebas.
   ========================================================= */
const TZ_AR='America/Argentina/Buenos_Aires';
const RELOJ={ahora:()=>Date.now()};
const FMT_AR=new Intl.DateTimeFormat('es-AR',{timeZone:TZ_AR,day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function fechaHoraAR(ts){
  const p={}; FMT_AR.formatToParts(new Date(ts)).forEach(x=>p[x.type]=x.value);
  return {ts,fecha:`${+p.day}/${+p.month}/${p.year}`,hora:`${p.hour}:${p.minute}`};
}
const ahoraAR=()=>fechaHoraAR(RELOJ.ahora());
/* Hora argentina (UTC−3, sin horario de verano) de un día del demo, como marca de tiempo real */
const tsAR=(dia,hhmm)=>{const [h,mi]=hhmm.split(':').map(Number);return Date.UTC(dia.getFullYear(),dia.getMonth(),dia.getDate(),h+3,mi)};

const AUDITORIA=[];
function auditar(accion,detalle='',extra={}){
  const d=ahoraAR();
  AUDITORIA.unshift({
    usuario:usuarioActual.nombre,
    rol:ROLES[usuarioActual.rol].nombre,
    fecha:d.fecha,
    hora:d.hora,
    accion,detalle,antes:extra.antes||'',despues:extra.despues||''
  });
}

/* =========================================================
   MOVIMIENTOS FINANCIEROS
   No se eliminan nunca: se marcan como ANULADOS y conservan su historial.
   (A propósito no existe ninguna función para borrarlos.)
   ========================================================= */
const MOVIMIENTOS=[];
let movSeq=1;
/* Un movimiento por operación. Los pagos de reservas llevan el nº de reserva:
   así la reserva calcula lo pagado leyendo Caja, sin guardar una copia aparte. */
function registrarMovimiento(tipo,concepto,extra={}){
  const d=new Date();
  const dia=extra.dia||isoD(PL_HOY);
  const ab=turnoAbierto(), real=!extra.fecha&&!extra.hora?ahoraAR():null;
  const m={id:movSeq++,tipo,concepto,monto:extra.monto||0,medio:extra.medio||'',reserva:extra.reserva||null,dia,
    turno:extra.turno!==undefined?extra.turno:(ab?ab.id:null),desde:extra.desde||null,hacia:extra.hacia||null,gasto:extra.gasto||null,origen:extra.origen||null,
    estado:'vigente',creadoPor:extra.usuario||usuarioActual.nombre,
    fecha:extra.fecha||(real?real.fecha:new Date(dia+'T00:00').toLocaleDateString('es-AR')),
    hora:extra.hora||(real?real.hora:d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})),ts:real?real.ts:null,anulacion:null};
  MOVIMIENTOS.push(m);
  return m;
}
function anularMovimiento(id,motivo,opts={}){
  const m=MOVIMIENTOS.find(x=>x.id===id);
  if(!m||m.estado!=='vigente'||!String(motivo||'').trim()) return false;
  /* opts.interno: solo lo usa la vía única de correcciones de gastos, después de validar todo */
  if(!opts.interno&&!puedeAnularMov(m).ok) return false;
  const d=new Date();
  m.estado='anulado';
  const ah=ahoraAR();
  m.anulacion={usuario:usuarioActual.nombre,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,motivo};
  auditar(`Anuló el movimiento #${id}`,`${m.concepto} · ${ars(m.monto)} · Motivo: ${motivo}`);
  return true;
}

/* =========================================================
   CAJA ÚNICA Y TURNOS
   - Hay una sola caja operativa. Los saldos NO se reinician al cambiar de turno:
     el dinero queda hasta que un movimiento real lo cambia.
   - Cada turno tiene una sola persona responsable. No puede haber dos turnos abiertos.
   - El efectivo físico se controla con arqueo. Banco y tarjetas se informan aparte.
   - Un cierre confirmado queda congelado: no se modifica ni se elimina.
   - Las diferencias se registran tal cual: el saldo contable nunca se ajusta solo.
   ========================================================= */
const CUENTAS=[
  {id:'efectivo',t:'Efectivo en caja',sub:'Dinero físico en recepción',medios:['Efectivo'],fisica:true},
  {id:'banco',t:'Cuenta bancaria',sub:'Cobros y pagos por transferencia',medios:['Transferencia']},
  {id:'tarjetas',t:'Tarjetas',sub:'Cobros con tarjeta (a acreditar)',medios:['Tarjeta']}
];
const cuentaDe=(id)=>CUENTAS.find(c=>c.id===id);
const cuentaDeMedio=(medio)=>(CUENTAS.find(c=>c.medios.includes(medio))||{}).id||null;
/* Punto de partida del control de saldos (fecha y saldo inicial de cada cuenta) */
const CAJA={desde:null,saldoInicial:{efectivo:0,banco:0,tarjetas:0},demo:false};
const TURNOS=[]; let turnoSeq=1;
const DIFERENCIAS=[]; let difSeq=1;
const turnoAbierto=()=>TURNOS.find(t=>t.estado==='abierto')||null;
const esAdmin=()=>ROLES[usuarioActual.rol].accesoTotal;
const dm=(f)=>String(f||'').split('/').slice(0,2).join('/');
const difTxt=(d)=>d<0?`faltante de ${ars(-d)}`:d>0?`sobrante de ${ars(d)}`:'sin diferencia';
/* Lee un importe escrito. Devuelve null si no se escribió nada (así “0” es un conteo válido). */
const leerMonto=(v)=>{const s=String(v??'').replace(/\D/g,'');return s===''?null:Number(s)};

/* Cuánto mueve un movimiento en una cuenta (+ entra / − sale). Los anulados no cuentan. */
function efectoCuenta(m,cid){
  if(m.estado!=='vigente') return 0;
  if(m.tipo==='transferencia') return (m.hacia===cid?m.monto:0)-(m.desde===cid?m.monto:0);
  if(cuentaDeMedio(m.medio)!==cid) return 0;
  return m.tipo==='ingreso'||m.tipo==='reintegro'?m.monto:m.tipo==='egreso'?-m.monto:0;
}
const enControl=(m)=>!!CAJA.desde&&m.dia>=CAJA.desde;
function saldoCuenta(cid){return (CAJA.saldoInicial[cid]||0)+MOVIMIENTOS.filter(enControl).reduce((s,m)=>s+efectoCuenta(m,cid),0)}
const movsTurno=(t)=>MOVIMIENTOS.filter(m=>m.turno===t.id);
function resumenTurno(t){
  const ms=movsTurno(t).filter(m=>m.estado==='vigente');
  const suma=(f)=>ms.filter(f).reduce((s,m)=>s+m.monto,0);
  const ingEf=suma(m=>m.tipo==='ingreso'&&m.medio==='Efectivo'), egrEf=suma(m=>m.tipo==='egreso'&&m.medio==='Efectivo');
  const trEnt=suma(m=>m.tipo==='transferencia'&&m.hacia==='efectivo'), trSal=suma(m=>m.tipo==='transferencia'&&m.desde==='efectivo');
  const reintEf=suma(m=>m.tipo==='reintegro'&&m.medio==='Efectivo');
  return {saldoInicial:t.saldoInicial,ingEf,egrEf,trEnt,trSal,reintEf,esperado:t.saldoInicial+ingEf-egrEf+trEnt-trSal+reintEf,
    ingresos:suma(m=>m.tipo==='ingreso'),egresos:suma(m=>m.tipo==='egreso'),reintegros:suma(m=>m.tipo==='reintegro'),
    porMedio:MEDIOS.map(md=>({medio:md,ing:suma(m=>m.tipo==='ingreso'&&m.medio===md),egr:suma(m=>m.tipo==='egreso'&&m.medio===md),rein:suma(m=>m.tipo==='reintegro'&&m.medio===md)})),
    cant:movsTurno(t).length};
}
const cierres=()=>TURNOS.filter(t=>t.estado==='cerrado');
const ultimoCierre=()=>{const c=cierres();return c[c.length-1]||null};
/* Lo que se entregó en el último cierre: es la referencia para quien recibe la caja */
function efectivoEntregado(){const u=ultimoCierre();return u?{monto:u.cierre.contado,desde:u}:{monto:saldoCuenta('efectivo'),desde:null}}

/* El efectivo solo lo mueve quien es responsable del turno abierto */
function chequeoEfectivo(medio){
  if(medio!=='Efectivo') return '';
  const t=turnoAbierto();
  if(!t) return 'No hay un turno de caja abierto. Para registrar efectivo, primero hay que iniciar el turno desde Caja.';
  if(t.usuarioId!==usuarioActual.id) return `La caja está a cargo de ${t.usuario} (turno #${t.nro}). Solo quien es responsable del turno puede registrar movimientos en efectivo.`;
  return '';
}

/* Arma el registro congelado del cierre (también lo usa el turno de ejemplo).
   usuario = responsable del turno · contadoPor = quien contó · entregaA = a quién se la entrega (o null: queda en caja) */
function armarCierre(t,contado,obs,fin,usuario,extra={}){
  const R=resumenTurno(t), dif=contado-R.esperado;
  const snap=movsTurno(t).map(m=>Object.freeze({id:m.id,tipo:m.tipo,concepto:m.concepto,medio:m.medio,desde:m.desde,hacia:m.hacia,monto:m.monto,estado:m.estado,creadoPor:m.creadoPor,fecha:m.fecha,hora:m.hora}));
  const exc=extra.excepcional?Object.freeze(Object.assign({},extra.excepcional)):null;
  return Object.freeze({nro:t.nro,usuario,inicio:t.inicio,fin,saldoInicial:R.saldoInicial,ingEf:R.ingEf,egrEf:R.egrEf,trEnt:R.trEnt,trSal:R.trSal,
    esperado:R.esperado,contado,diferencia:dif,obs,explicacion:dif?obs:'',ingresos:R.ingresos,egresos:R.egresos,reintEf:R.reintEf,reintegros:R.reintegros,
    contadoPor:extra.contadoPor||usuario,
    entrega:Object.freeze({por:exc?null:usuario,monto:contado,a:extra.entregaA?Object.freeze(Object.assign({},extra.entregaA)):null}),
    excepcional:exc,
    porMedio:Object.freeze(R.porMedio.map(x=>Object.freeze(x))),movimientos:Object.freeze(snap)});
}
function registrarDiferencia(tipo,t,monto,explicacion,extra={}){
  const ah=ahoraAR();
  const d=Object.assign({id:difSeq++,tipo,turno:t.nro,usuario:usuarioActual.nombre,responsable:t.usuario,monto,explicacion,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,revision:null},extra);
  DIFERENCIAS.push(d);
  auditar(tipo==='cierre'?'Diferencia en el cierre de caja':'Diferencia al recibir la caja',`Turno #${t.nro} · ${difTxt(monto)} · ${explicacion} · alerta para el Administrador`);
  return d;
}
/* Fecha y hora: siempre reloj real de Argentina. Nunca antes de la apertura (ni antes del cierre anterior al abrir). */
const fh=(x)=>`${x.fecha} ${x.hora}`;
function chequeoHorarioCierre(t,fin){
  if(t.inicio&&t.inicio.ts&&fin.ts<t.inicio.ts) return `La fecha y hora de cierre (${fh(fin)}) no puede ser anterior a la apertura del turno (${fh(t.inicio)}). Revisá la fecha y hora del equipo.`;
  return '';
}
function chequeoHorarioApertura(ini){
  const u=ultimoCierre();
  if(u&&u.cierre.fin.ts&&ini.ts<u.cierre.fin.ts) return `La fecha y hora de apertura (${fh(ini)}) no puede ser anterior al último cierre (#${u.nro}, ${fh(u.cierre.fin)}). Revisá la fecha y hora del equipo.`;
  return '';
}
/* Recepcionistas (y el Administrador) que pueden recibir la caja, excepto quien la entrega */
const puedeUsuario=(u,perm)=>ROLES[u.rol].accesoTotal||(!SOLO_ADMINISTRADORA.includes(perm)&&u.permisos.includes(perm));
const receptoras=()=>USUARIOS.filter(u=>u.activo&&u.id!==usuarioActual.id&&puedeUsuario(u,'caja.cierreTurno'));

function iniciarTurno(contado,obs){
  if(!puede('caja.cierreTurno')) return {error:NOPERM};
  const ab=turnoAbierto();
  if(ab){
    auditar('Intentó abrir un segundo turno de caja',`La caja sigue a cargo de ${ab.usuario} (turno #${ab.nro})`);
    return {error:`No se puede abrir otro turno: la caja está a cargo de ${ab.usuario} desde el ${ab.inicio.fecha} a las ${ab.inicio.hora} (turno #${ab.nro}). Primero tiene que cerrar su turno.`};
  }
  if(contado===null||contado<0) return {error:'Contá el efectivo y confirmá cuánto recibís. Si no hay efectivo, escribí 0.'};
  const ini=ahoraAR(), eh=chequeoHorarioApertura(ini);
  if(eh){auditar('Intento de apertura con horario inconsistente',eh);return {error:eh}}
  const ent=efectivoEntregado(), dif=contado-ent.monto, o=limpiar(obs);
  if(dif!==0&&o.length<5) return {error:`El efectivo contado no coincide con lo entregado (${difTxt(dif)}). La observación es obligatoria para iniciar el turno.`};
  const u=ent.desde, destino=u&&u.cierre.entrega.a;
  const t={id:turnoSeq,nro:turnoSeq++,usuarioId:usuarioActual.id,usuario:usuarioActual.nombre,estado:'abierto',inicio:ini,saldoInicial:contado,
    recepcion:Object.freeze({entregado:ent.monto,deTurno:u?u.nro:null,deUsuario:u?(u.cierre.entrega.por||`${u.cierre.contadoPor} (cierre excepcional)`):null,
      destinataria:destino?destino.nombre:null,recibe:usuarioActual.nombre,contado,diferencia:dif,obs:o}),cierre:null};
  TURNOS.push(t);
  auditar('Inició un turno de caja',`Turno #${t.nro} · ${usuarioActual.nombre} recibió ${ars(contado)} en efectivo${u?` de ${t.recepcion.deUsuario} (cierre #${u.nro}, entregó ${ars(ent.monto)})`:''} · ${difTxt(dif)}`);
  if(destino&&destino.id!==usuarioActual.id) auditar('Recibió una caja entregada a otra persona',`Turno #${t.nro} · el cierre #${u.nro} indicaba que la recibía ${destino.nombre}`);
  if(dif) registrarDiferencia('recepcion',t,dif,o,{entrega:t.recepcion.deUsuario||'Saldo del sistema'});
  return {turno:t};
}
function cerrarTurno(contado,obs,opc={}){
  if(!puede('caja.cierreTurno')) return {error:NOPERM};
  const t=turnoAbierto();
  if(!t) return {error:'No hay un turno abierto para cerrar.'};
  if(t.usuarioId!==usuarioActual.id) return {error:`Este turno está a cargo de ${t.usuario}. Solo esa persona puede cerrarlo${esAdmin()?' (o el Administrador con un cierre excepcional)':''}.`};
  if(contado===null||contado<0) return {error:'Ingresá el efectivo contado que entregás. Es obligatorio, aunque sea $0.'};
  const fin=ahoraAR(), eh=chequeoHorarioCierre(t,fin);
  if(eh){auditar('Intento de cierre con horario inconsistente',`Turno #${t.nro} · ${eh}`);return {error:eh}}
  const R=resumenTurno(t), dif=contado-R.esperado, o=limpiar(obs);
  if(dif!==0&&o.length<5) return {error:`Hay un ${difTxt(dif)}. La observación es obligatoria para cerrar el turno.`};
  const para=opc.entregaA?USUARIOS.find(u=>u.id===opc.entregaA&&u.id!==usuarioActual.id):null;
  t.cierre=armarCierre(t,contado,o,fin,usuarioActual.nombre,{entregaA:para?{id:para.id,nombre:para.nombre}:null});
  t.estado='cerrado';
  Object.freeze(t);
  auditar('Cerró un turno de caja',`Turno #${t.nro} · esperado ${ars(R.esperado)} · contado y entregado ${ars(contado)}${para?` a ${para.nombre}`:' (queda en caja)'} · ${difTxt(dif)}`);
  if(dif) registrarDiferencia('cierre',t,dif,o);
  marcarRevisionPorCierre(t,opc.advertida);
  return {turno:t};
}
/* Cierre excepcional: solo el Administrador, sobre el turno de otra persona. Motivo y conteo obligatorios. */
function cierreExcepcional(contado,motivo,obs,opc={}){
  if(!esAdmin()) return {error:'Solo el Administrador puede hacer un cierre excepcional.'};
  const t=turnoAbierto();
  if(!t) return {error:'No hay un turno abierto para cerrar.'};
  if(t.usuarioId===usuarioActual.id) return {error:'Este turno es tuyo: cerralo con el cierre normal.'};
  const mot=limpiar(motivo);
  if(mot.length<5) return {error:'El motivo del cierre excepcional es obligatorio.'};
  if(contado===null||contado<0) return {error:'Ingresá el efectivo contado físicamente. Es obligatorio, aunque sea $0.'};
  const fin=ahoraAR(), eh=chequeoHorarioCierre(t,fin);
  if(eh){auditar('Intento de cierre con horario inconsistente',`Turno #${t.nro} · ${eh}`);return {error:eh}}
  const R=resumenTurno(t), dif=contado-R.esperado, o=limpiar(obs);
  if(dif!==0&&o.length<5) return {error:`Hay un ${difTxt(dif)}. La observación es obligatoria para cerrar el turno.`};
  t.cierre=armarCierre(t,contado,o,fin,t.usuario,{contadoPor:usuarioActual.nombre,excepcional:{por:usuarioActual.nombre,porId:usuarioActual.id,motivo:mot}});
  t.estado='cerrado';
  Object.freeze(t);
  auditar('Cierre excepcional de un turno de caja',`Turno #${t.nro} de ${t.usuario} · cerrado por ${usuarioActual.nombre} · motivo: ${mot} · esperado ${ars(R.esperado)} · contado ${ars(contado)} · ${difTxt(dif)}`);
  if(dif) registrarDiferencia('cierre',t,dif,o,{excepcional:true});
  marcarRevisionPorCierre(t,opc.advertida);
  return {turno:t};
}
function revisarDiferencia(id,comentario){
  if(!esAdmin()) return {error:'Solo el Administrador puede revisar diferencias de caja.'};
  const d=DIFERENCIAS.find(x=>x.id===id);
  if(!d) return {error:'No se encontró la diferencia.'};
  if(d.revision) return {error:'Esta diferencia ya fue revisada.'};
  const c=limpiar(comentario);
  if(c.length<3) return {error:'Escribí un comentario de revisión.'};
  const ah=ahoraAR();
  d.revision=Object.freeze({usuario:usuarioActual.nombre,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,comentario:c});
  Object.freeze(d);
  auditar('Revisó una diferencia de caja',`Turno #${d.turno} · ${difTxt(d.monto)} · ${c}`);
  return {ok:true};

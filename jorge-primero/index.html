/* ===== VERSIÓN DE PRUEBA PÚBLICA (sin cuenta) · DATOS EN ESTE NAVEGADOR =====
   Guarda el estado en el navegador de cada persona (no se comparte entre personas ni dispositivos).
   Las opiniones se guardan acá y se envían por WhatsApp. */
const SYNC_L=(function(){
  const CLAVE='jp-prueba-estado-v1', CLAVE_U='jp-usuario';
  const raiz=()=>({limpieza,PARAMS,TIPOS_HAB,DATOS_POR_TIPO,HAB_INFO,USUARIOS,AUDITORIA,MOVIMIENTOS,CUENTAS,CAJA,TURNOS,DIFERENCIAS,
    CATEGORIAS_GASTO,PROVEEDORES,GASTOS,AUTORIZACIONES,SOLICITUDES_G,REGULARIZACIONES,HUESPEDES,TARIFAS,INCIDENCIAS,CONF_REC,AVISOS,
    LIMPIEZAS,CONF_LIM,LIMPIEZA_DEMO,RESERVAS,CRITERIOS,TAREAS_AG});
  const seqs=()=>({movSeq,turnoSeq,difSeq,provSeq,gastoSeq,autSeq,solSeq,regSeq,hSeq,tfSeq,cotSeq,solResSeq,incSeq,blqSeq,proSeq,aviSeq,limSeq,resSeq});
  function ponerSeqs(s){if(!s) return;
    if(s.movSeq!=null)movSeq=s.movSeq; if(s.turnoSeq!=null)turnoSeq=s.turnoSeq; if(s.difSeq!=null)difSeq=s.difSeq; if(s.provSeq!=null)provSeq=s.provSeq;
    if(s.gastoSeq!=null)gastoSeq=s.gastoSeq; if(s.autSeq!=null)autSeq=s.autSeq; if(s.solSeq!=null)solSeq=s.solSeq; if(s.regSeq!=null)regSeq=s.regSeq;
    if(s.hSeq!=null)hSeq=s.hSeq; if(s.tfSeq!=null)tfSeq=s.tfSeq; if(s.cotSeq!=null)cotSeq=s.cotSeq; if(s.solResSeq!=null)solResSeq=s.solResSeq;
    if(s.incSeq!=null)incSeq=s.incSeq; if(s.blqSeq!=null)blqSeq=s.blqSeq; if(s.proSeq!=null)proSeq=s.proSeq; if(s.aviSeq!=null)aviSeq=s.aviSeq;
    if(s.limSeq!=null)limSeq=s.limSeq; if(s.resSeq!=null)resSeq=s.resSeq}
  function codificar(valor){
    const ids=new Map(); let n=0;
    const enc=(v)=>{
      if(v===undefined) return {$u:1};
      if(v===null||typeof v!=='object') return (typeof v==='function'||typeof v==='symbol')?{$u:1}:(typeof v==='number'&&!isFinite(v)?{$n:String(v)}:v);
      if(v instanceof Date) return {$d:v.getTime()};
      if(ids.has(v)) return {$r:ids.get(v)};
      const id=n++; ids.set(v,id);
      if(Array.isArray(v)) return {$i:id,$a:v.map(enc)};
      if(v instanceof Set) return {$i:id,$s:[...v].map(enc)};
      if(v instanceof Map) return {$i:id,$m:[...v].map(([k,x])=>[enc(k),enc(x)])};
      if(v instanceof RegExp) return {$re:[v.source,v.flags]};
      const o={}; for(const k of Object.keys(v)){const x=v[k]; if(typeof x==='function') continue; o[k]=enc(x)} return {$i:id,$o:o};
    };
    return JSON.stringify(enc(valor));
  }
  function decodificar(texto,vivos){
    const objs=new Map();
    const dec=(x,dest)=>{
      if(x===null||typeof x!=='object') return x;
      if(Array.isArray(x)) return x.map(y=>dec(y));
      if('$u' in x) return undefined;
      if('$n' in x) return Number(x.$n);
      if('$d' in x) return new Date(x.$d);
      if('$re' in x) return new RegExp(x.$re[0],x.$re[1]);
      if('$r' in x){if(!objs.has(x.$r)) throw new Error('referencia rota '+x.$r); return objs.get(x.$r)}
      if('$a' in x){const a=dest&&Array.isArray(dest)?dest:[]; objs.set(x.$i,a); const vals=x.$a.map(y=>dec(y)); a.splice(0,a.length,...vals); return a}
      if('$s' in x){const s=dest instanceof Set?dest:new Set(); objs.set(x.$i,s); s.clear(); x.$s.forEach(y=>s.add(dec(y))); return s}
      if('$m' in x){const m=dest instanceof Map?dest:new Map(); objs.set(x.$i,m); m.clear(); x.$m.forEach(([k,y])=>m.set(dec(k),dec(y))); return m}
      if('$o' in x){const o=dest&&typeof dest==='object'&&!Array.isArray(dest)?dest:{}; objs.set(x.$i,o);
        if(o===dest) Object.keys(o).forEach(k=>delete o[k]);
        for(const k of Object.keys(x.$o)){const v=dec(x.$o[k]); if(v!==undefined||('$u' in Object(x.$o[k]))) o[k]=v} return o}
      return x;
    };
    const top=JSON.parse(texto);
    if(!top||!top.$o||!top.$o.estado||!top.$o.estado.$o) throw new Error('formato desconocido');
    objs.set(top.$i,{}); const est=top.$o.estado; objs.set(est.$i,{});
    for(const k of Object.keys(est.$o)){ if(k in vivos) dec(est.$o[k],vivos[k]) }
    return {seqs:dec(top.$o.seqs)};
  }
  function serializar(){
    try{if(typeof sincronizarLimpiezas==='function') sincronizarLimpiezas()}catch(e){}
    return codificar({version:1,estado:raiz(),seqs:seqs()});
  }
  function restaurar(texto){
    const r=decodificar(texto,raiz()); ponerSeqs(r.seqs);
    try{Object.values(HAB_INFO).forEach(h=>(h.log||[]).forEach(e=>LIM_VISTOS.add(e)))}catch(e){}
    let uid=null; try{uid=localStorage.getItem(CLAVE_U)}catch(e){}
    usuarioActual=USUARIOS.find(u=>u.id===uid&&u.activo)||USUARIOS.find(u=>u.rol==='administradora'&&u.activo)||USUARIOS[0];
  }
  /* Carga inicial, antes de la primera pantalla */
  let guardable=true, ultimo=null, timer=null, error='';
  try{
    const t=localStorage.getItem(CLAVE);
    if(t){ try{restaurar(t); ultimo=t}catch(e){console.error(e); error='No se pudieron recuperar los datos guardados: se empezó de nuevo con los datos de demostración.'; localStorage.removeItem(CLAVE)} }
    else { let uid=localStorage.getItem(CLAVE_U); const u=USUARIOS.find(x=>x.id===uid&&x.activo); if(u) usuarioActual=u }
  }catch(e){guardable=false}
  function guardar(){
    if(!guardable) return 'no';
    try{const s=serializar(); if(s===ultimo) return 'ok'; localStorage.setItem(CLAVE,s); ultimo=s; return 'ok'}
    catch(e){console.error(e); return (e&&e.name==='QuotaExceededError')?'lleno':'no'}
  }
  function programar(){clearTimeout(timer);timer=setTimeout(()=>{const r=guardar(); if(window.__pillEstado) window.__pillEstado(r)},800)}
  function reiniciar(){clearTimeout(timer); guardable=false; try{localStorage.removeItem(CLAVE)}catch(e){} location.reload()}
  return {guardar,programar,reiniciar,serializar,restaurar,get guardable(){return guardable},get error(){return error}};
})();

(function(){

  document.querySelector('.topbar').appendChild(pill);
  const estado=(r)=>{
    const ok=r==='ok';
    pill.dataset.s=ok?'ok':'bad';
    const t=ok?'Guardado en este dispositivo':r==='lleno'?'Sin espacio':'Sin guardar';
    const title=ok?'Los cambios quedan guardados en este navegador. Otras personas no los ven.':r==='lleno'?'El navegador no tiene más espacio: usá «Volver a empezar».':'Este navegador no permite guardar (por ejemplo, en modo incógnito): los cambios se pierden al recargar.';
    pill.querySelector('.t').textContent=t; pill.title=title; pill.setAttribute('aria-label',title);
  };
  window.__pillEstado=estado;
  estado(SYNC_L.guardable?'ok':'no');
  if(SYNC_L.error) setTimeout(()=>aviso(SYNC_L.error),400);
  ['click','change','submit','keyup'].forEach(ev=>document.addEventListener(ev,()=>SYNC_L.programar(),true));
  window.addEventListener('pagehide',()=>SYNC_L.guardar());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') SYNC_L.guardar()});
  const _cambiar=cambiarUsuario;
  cambiarUsuario=function(id){_cambiar(id); try{localStorage.setItem('jp-usuario',usuarioActual.id)}catch(e){}};
  window.reiniciarPrueba=function(){
    modal(`<div class="modal-head"><div><h2>Volver a empezar la prueba</h2><p>Se borran los cambios que hiciste en este dispositivo y el sistema vuelve a los datos de demostración iniciales. Tus opiniones guardadas no se borran.</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
      <div class="modal-foot"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" id="syReset">Sí, volver a empezar</button></div>`);
    document.getElementById('syReset').onclick=()=>SYNC_L.reiniciar();
  };
})();

/* ---------- Reservas: aplicar una cotización (único lugar donde cambia el total) ---------- */
const creditoDe=(r)=>!r.nro||r.estado==='cancelada'?0:Math.max(0,r.pagado-r.total);
function aplicarCotizacion(r,cot,opc={}){
  const reg={...JSON.parse(JSON.stringify(cot)),id:'q'+(cotSeq++),aplicada:opc.cuando||ahoraAR(),aplicadaPor:opc.usuario||usuarioActual.nombre,motivo:opc.motivo||'',
    totalCalculado:cot.total,excepcion:opc.excepcion?{total:opc.excepcion.total,motivo:opc.excepcion.motivo,autorizo:usuarioActual.nombre,tipo:opc.excepcion.tipo}:null};
  if(opc.cuando) reg.calculada=opc.cuando;
  reg.totalAplicado=reg.excepcion?reg.excepcion.total:cot.total;
  deepFreeze(reg);
  if(!r.cotizaciones) r.cotizaciones=[];
  r.cotizaciones.push(reg); r.cotizacion=reg;
  r.total=reg.totalAplicado; r.tarifa=cot.n?Math.round(reg.totalAplicado/cot.n):0;
  r.edades=cot.menores.map(m=>({nac:m.nac,edad:m.edad,cuna:m.cuna,rango:m.rango})); r.menores=r.edades.length; r.adultos=cot.adultos;
  return reg;
}
/* Rastro del crédito a favor (Regla 13): no hay devoluciones automáticas ni movimientos de Caja */
function registrarCredito(r,antes){
  const cr=creditoDe(r), crAntes=antes.credito;
  if(cr===crAntes) return;
  if(!r.creditos) r.creditos=[];
  const d=ahoraAR(), e={fecha:d.fecha,hora:d.hora,ts:d.ts,usuario:usuarioActual.nombre,antes:crAntes,despues:cr,totalAntes:antes.total,totalNuevo:r.total,pagado:r.pagado};
  r.creditos.push(Object.freeze(e));
  logRes(r,cr>crAntes?'Crédito a favor generado':'Crédito a favor actualizado',`${ars(crAntes)} → ${ars(cr)} · total ${ars(antes.total)} → ${ars(r.total)} · pagado ${ars(r.pagado)} · sin devolución automática`);
  auditar('Generó un crédito a favor por modificación',`Reserva #${r.nro} · crédito ${ars(crAntes)} → ${ars(cr)} · Caja sin cambios`,{antes:ars(crAntes),despues:ars(cr)});
}

/* ---------- Historial tarifario (solo se agrega, nunca se edita) ---------- */
function historialTf(accion,antes,despues,motivo=''){
  const d=ahoraAR();
  TARIFAS.historial.unshift(Object.freeze({fecha:d.fecha,hora:d.hora,ts:d.ts,usuario:usuarioActual.nombre,accion,antes:antes||'—',despues:despues||'—',motivo}));
  auditar(accion,`${antes||'—'} → ${despues||'—'}${motivo?` · Motivo: ${motivo}`:''}`,{antes,despues});
}
const tfDemo=(x)=>x?' <span class="demo" title="Valor ficticio de la demo: falta confirmarlo">demo</span>':'';

/* ---------- Superposiciones (Regla 10) ---------- */
function superposiciones(lista,cand,excluirId){
  const out=[];
  lista.filter(x=>x.id!==excluirId).forEach(x=>{
    const cats=Object.keys(cand.precios).filter(k=>cand.precios[k]!=null&&x.precios[k]!=null);
    const desde=cand.desde>x.desde?cand.desde:x.desde, hasta=cand.hasta<x.hasta?cand.hasta:x.hasta;
    if(cats.length&&desde<=hasta) out.push({nombre:x.nombre,cats,desde,hasta});
  });
  return out;
}
const textoSuperposicion=(s)=>s.map(x=>`“${x.nombre}” del ${ddmmIso(x.desde)} al ${ddmmIso(x.hasta)} (${x.cats.map(tipoNombre).join(', ')})`).join('; ');

/* ---------- Modificaciones de la configuración (solo Administrador: Regla 15) ---------- */
function tfGuardarCategorias(vals){
  if(!puede('tarifas.modificar')) return {error:NOPERM};
  for(const [cat,v] of Object.entries(vals)){
    const cap=capCategoria(cat);
    if(!(v.base>0)) return {error:`Ingresá un precio base mayor que $0 para ${tipoNombre(cat)}.`};
    if(!Number.isInteger(v.incluidas)||v.incluidas<1) return {error:`Las personas incluidas de ${tipoNombre(cat)} tienen que ser al menos 1.`};
    if(cap!=null&&v.incluidas>cap) return {error:`${tipoNombre(cat)} admite hasta ${cap} personas: no puede incluir ${v.incluidas}.`};
  }
  let n=0;
  for(const [cat,v] of Object.entries(vals)){
    const c=TARIFAS.categorias[cat]||(TARIFAS.categorias[cat]={base:null,incluidas:null,demo:{base:false,incluidas:false}});
    if(c.base!==v.base){historialTf(`Cambió el precio base de ${tipoNombre(cat)}`,c.base?ars(c.base):'Sin definir',ars(v.base));c.base=v.base;c.demo.base=false;n++}
    if(c.incluidas!==v.incluidas){historialTf(`Cambió las personas incluidas de ${tipoNombre(cat)}`,String(c.incluidas??'Sin definir'),String(v.incluidas));c.incluidas=v.incluidas;c.demo.incluidas=false;n++}
  }
  return {n};
}
function tfGuardarAdicionales(v){
  if(!puede('tarifas.modificar')) return {error:NOPERM};
  if(!(v.adulto>=0)) return {error:'Ingresá el importe del adulto adicional (puede ser $0).'};
  const rs=v.rangos.slice().sort((a,b)=>a.desde-b.desde);
  for(const r of rs){
    if(!Number.isInteger(r.desde)||!Number.isInteger(r.hasta)||r.desde<0||r.hasta>17) return {error:'Las edades de los rangos van de 0 a 17 años.'};
    if(r.desde>r.hasta) return {error:`El rango ${r.desde}–${r.hasta} está invertido: “desde” tiene que ser menor o igual que “hasta”.`};
    if(!(r.monto>=0)) return {error:'Ingresá el importe de cada rango (puede ser $0).'};
  }
  for(let i=1;i<rs.length;i++) if(rs[i].desde<=rs[i-1].hasta) return {error:`Los rangos ${rs[i-1].desde}–${rs[i-1].hasta} y ${rs[i].desde}–${rs[i].hasta} se superponen. Corregilos para que cada edad tenga un solo importe.`};
  const b=v.bebes;
  if(b.activa){
    if(!Number.isInteger(b.edadMax)||b.edadMax<0||b.edadMax>5) return {error:'Indicá hasta qué edad se considera bebé en cuna (0 a 5 años).'};
    if(!(b.monto>=0)) return {error:'Ingresá el importe del bebé en cuna (puede ser $0).'};
    if(!Number.isInteger(b.cunasPorHab)||b.cunasPorHab<1) return {error:'Indicá cuántas cunas se admiten por habitación (al menos 1).'};
    if(!Number.isInteger(b.cunasHotel)||b.cunasHotel<1) return {error:'Indicá cuántas cunas tiene el hotel (al menos 1).'};
  }
  let n=0; const A=TARIFAS.adultoAdicional;
  if(A.monto!==v.adulto){historialTf('Cambió el importe del adulto adicional',A.monto==null?'Sin definir':ars(A.monto),ars(v.adulto));A.monto=v.adulto;A.demo=false;n++}
  const txtR=(l)=>l.length?l.map(r=>`${r.desde}–${r.hasta} años: ${ars(r.monto)}`).join(' · '):'Sin rangos';
  const viejo=TARIFAS.rangos.slice().sort((a,b)=>a.desde-b.desde);
  if(txtR(viejo)!==txtR(rs)){
    historialTf('Cambió los rangos de edad de niños',txtR(viejo),txtR(rs));
    const nuevos=rs.map(r=>{const igual=viejo.find(x=>x.desde===r.desde&&x.hasta===r.hasta&&x.monto===r.monto);return {id:igual?igual.id:'rg'+(tfSeq++),desde:r.desde,hasta:r.hasta,monto:r.monto,demo:igual?igual.demo:false}});
    TARIFAS.rangos.splice(0,TARIFAS.rangos.length,...nuevos);n++;
  }
  const B=TARIFAS.bebes, txtB=(x)=>x.activa?`Activa · hasta ${x.edadMax} años · ${x.ocupaPlaza?'ocupa plaza':'no ocupa plaza'} · ${ars(x.monto)} por noche · ${x.cunasPorHab} por habitación · ${x.cunasHotel} en el hotel`:'Desactivada';
  if(txtB(B)!==txtB(b)){
    historialTf('Cambió la regla de bebés en cuna',txtB(B),txtB(b));
    Object.assign(B,b.activa?{activa:true,edadMax:b.edadMax,ocupaPlaza:!!b.ocupaPlaza,monto:b.monto,cunasPorHab:b.cunasPorHab,cunasHotel:b.cunasHotel}:{activa:false});B.demo=false;n++;
  }
  return {n};
}
function tfValidarPeriodo(lista,v,id,tipo){
  if(limpiar(v.nombre).length<3) return `Escribí un nombre para la ${tipo}.`;
  if(!v.desde||!v.hasta) return 'Indicá las fechas “desde” y “hasta”.';
  if(v.hasta<v.desde) return '“Hasta” no puede ser anterior a “desde”.';
  const cats=Object.keys(v.precios);
  if(!cats.length) return 'Cargá el precio de al menos una categoría.';
  if(cats.some(k=>!(v.precios[k]>0))) return 'Los precios tienen que ser mayores que $0.';
  const sup=superposiciones(lista,v,id);
  if(sup.length) return `No se puede guardar: se superpone con ${textoSuperposicion(sup)}. Corregí las fechas o las categorías.`;
  return '';
}
const txtPeriodo=(x)=>`${x.nombre} · ${ddmmIso(x.desde)}/${x.desde.slice(0,4)} al ${ddmmIso(x.hasta)}/${x.hasta.slice(0,4)} · ${Object.entries(x.precios).map(([k,v])=>`${k} ${ars(v)}`).join(', ')}`;
function tfGuardarPeriodo(clase,v,id){
  if(!puede('tarifas.modificar')) return {error:NOPERM};
  const lista=clase==='temporada'?TARIFAS.temporadas:TARIFAS.especiales, tipo=clase==='temporada'?'temporada':'fecha especial';
  const p={nombre:limpiar(v.nombre),desde:v.desde,hasta:v.hasta,precios:{}};
  Object.entries(v.precios).forEach(([k,m])=>{if(m!=null&&m!=='')p.precios[k]=m});
  const err=tfValidarPeriodo(lista,p,id,tipo); if(err) return {error:err};
  if(id){
    const x=lista.find(z=>z.id===id); if(!x) return {error:'No se encontró el registro.'};
    const antes=txtPeriodo(x); Object.assign(x,p,{demo:false});
    if(antes!==txtPeriodo(x)) historialTf(`Modificó la ${tipo} “${x.nombre}”`,antes,txtPeriodo(x));
    return {ok:true};
  }
  const nuevo={id:(clase==='temporada'?'tp':'fe')+(tfSeq++),...p,demo:false};
  lista.push(nuevo); historialTf(`Creó la ${tipo} “${nuevo.nombre}”`,'',txtPeriodo(nuevo));
  return {ok:true};
}
function tfEliminarPeriodo(clase,id,motivo){
  if(!puede('tarifas.modificar')) return {error:NOPERM};
  if(limpiar(motivo).length<3) return {error:'Escribí el motivo.'};
  const lista=clase==='temporada'?TARIFAS.temporadas:TARIFAS.especiales, i=lista.findIndex(z=>z.id===id);
  if(i<0) return {error:'No se encontró el registro.'};
  const x=lista[i]; lista.splice(i,1);
  historialTf(`Eliminó la ${clase==='temporada'?'temporada':'fecha especial'} “${x.nombre}”`,txtPeriodo(x),'Eliminada',limpiar(motivo));
  return {ok:true};
}

    ${ed?'<button type="submit" class="btn btn-primary">Guardar categorías</button>':''}</form></section>`;
}

/* 3 y 4. Temporadas y fechas especiales */
function tfPeriodos(clase){
  const ed=editableTf(), esT=clase==='temporada', lista=esT?TARIFAS.temporadas:TARIFAS.especiales;
  const titulo=esT?'Temporadas':'Fechas especiales', uno=esT?'temporada':'fecha especial';
  const ord=lista.slice().sort((a,b)=>a.desde<b.desde?-1:1);
  const form=TF.edit&&TF.edit.clase===clase?tfFormPeriodo(clase):'';
  return `<section class="card tf-card"><div class="card-head"><h2>${titulo}</h2>${ed&&!form?`<button type="button" class="btn btn-sm" data-tf="per-new" data-c="${clase}">${ic('plus')}Nueva ${uno}</button>`:''}</div>
    <p class="tf-p">${esT?'Cambian solo el precio base por noche de las categorías cargadas. Los adicionales no cambian.':'Tienen prioridad sobre la temporada y el precio base, solo en sus noches. No se suman.'} Las fechas “desde” y “hasta” son noches incluidas: del 1 al 31 de enero incluye la noche del 31 (salida el 1 de febrero). No se pueden superponer dos ${titulo.toLowerCase()} en la misma categoría y noche.</p>
    ${form}
    ${ord.length?`<div class="tf-list">${ord.map(x=>`<div class="tf-item"><div class="tf-item-h"><b>${x.nombre}${tfDemo(x.demo)}</b><span class="num">${ddmmIso(x.desde)}/${x.desde.slice(0,4)} → ${ddmmIso(x.hasta)}/${x.hasta.slice(0,4)} · ${diffD(fechaIso(x.desde),fechaIso(x.hasta))+1} noches</span></div>
      <div class="tf-precios">${TIPOS_HAB.map(t=>`<div><small>${t.t}</small><b class="num">${x.precios[t.id]!=null?ars(x.precios[t.id]):'No aplica'}</b></div>`).join('')}</div>
      ${ed?`<div class="tf-item-a"><button type="button" class="btn btn-sm" data-tf="per-edit" data-c="${clase}" data-id="${x.id}">${ic('edit')}Editar</button><button type="button" class="btn btn-sm btn-danger" data-tf="per-del" data-c="${clase}" data-id="${x.id}">${ic('xmark')}Eliminar</button></div>`:''}</div>`).join('')}</div>`
      :`<p class="empty">No hay ${titulo.toLowerCase()} cargadas.</p>`}
  </section>`;
}
function tfFormPeriodo(clase){
  const e=TF.edit, x=e.id?(clase==='temporada'?TARIFAS.temporadas:TARIFAS.especiales).find(z=>z.id===e.id):null, v=e.v||(x?{nombre:x.nombre,desde:x.desde,hasta:x.hasta,precios:{...x.precios}}:{nombre:'',desde:isoD(HOY),hasta:isoD(addD(HOY,1)),precios:{}});

}

/* 6. Cotizador */
function tfCotizar(){const c=TF.cot;return cotizar({cat:c.cat,ingreso:c.ingreso,salida:c.salida,adultos:c.adultos,menores:c.menores})}

  const c=TF.cot, q=tfCotizar();

    <form id="tf-cot-f" class="form" novalidate>

/* Editor de menores (fecha de nacimiento + cuna) reutilizado en el cotizador y en la reserva (Decisión 16) */
function htmlMenores(p,menores,ingresoIso){
  const ing=ingresoIso&&!isNaN(fechaIso(ingresoIso))?fechaIso(ingresoIso):null;
  const edadTxt=(m)=>{if(!m.nac||!ing) return '<span class="tf-men-e">Falta la fecha de nacimiento</span>';if(m.nac>ingresoIso) return '<span class="tf-men-e bad">Posterior al ingreso</span>';const e=edadAl(m.nac,ing);return `<span class="tf-men-e"><b>${e} ${e===1?'año':'años'}</b> al ingreso</span>`};
  return `<label>Menores <span class="hint" style="display:inline">· fecha de nacimiento y si usa cuna</span></label>
    <div class="tf-men">${menores.map((m,i)=>`<div class="tf-men-r"><span class="num">Menor ${i+1}</span>
      <input type="date" class="${p}-nac" data-i="${i}" value="${m.nac||''}" ${ingresoIso?`max="${ingresoIso}"`:''} aria-label="Fecha de nacimiento del menor ${i+1}">${edadTxt(m)}
      <label class="check"><input type="checkbox" class="${p}-cu" data-i="${i}" ${m.cuna?'checked':''}> Cuna</label>
      <button type="button" class="btn btn-sm btn-ghost" data-men-del="${p}" data-i="${i}" aria-label="Quitar menor ${i+1}">${ic('xmark')}</button></div>`).join('')}
    <button type="button" class="btn btn-sm" data-men-add="${p}">${ic('plus')}Agregar menor</button></div>`;
}
function leerMenores(p,menores){
  document.querySelectorAll(`.${p}-nac`).forEach(s=>{const m=menores[+s.dataset.i];if(m)m.nac=s.value||null});
  document.querySelectorAll(`.${p}-cu`).forEach(s=>{const m=menores[+s.dataset.i];if(m)m.cuna=s.checked});
}
/* Detalle de una cotización (cotizador, reserva y modificaciones) */
function htmlCotizacion(q,o={}){
  if(!q.ok) return `<div class="msg bad">${ic('alert')}<span><b>No se puede calcular el precio.</b><br>${q.errores.join('<br>')}</span></div>`;
  const ex=extrasAgrupados(q), incl=q.asignacion.filter(p=>p.incluido);
  const quien=(p)=>p.tipo==='adulto'?'adulto':p.tipo==='bebe'?`bebé de ${p.edad} años`:`niño de ${p.edad} años`;
  const orgs=[...new Set(q.detalle.map(d=>d.origen))];
  return `<div class="tf-q">
    <div class="tf-q-h"><div><small>${q.hab?`Hab. ${q.hab} · `:''}${q.catNombre} · ${q.n} ${q.n===1?'noche':'noches'}</small><b>${textoComposicion(q)}</b>
      <span>Incluidas en el precio base: ${q.incluidas} ${q.incluidas===1?'persona':'personas'}${incl.length?` (${incl.map(quien).join(', ')})`:''}. Ocupa ${q.plazas} de ${q.capacidad??'—'} plazas.</span></div>
      <div class="tf-q-t"><small>Total</small><b class="num">${ars(q.total)}</b></div></div>
    ${q.menores.length?`<div class="tf-q-men">${q.menores.map((m,i)=>`<span>Menor ${i+1} · nacido el ${fechaLarga(m.nac)} · <b>${m.edad} ${m.edad===1?'año':'años'} al ingreso</b> · ${m.rango}${m.cuna?'':''}</span>`).join('')}</div>`:''}
    ${(q.avisos||[]).map(a=>`<div class="msg warn tf-q-av">${ic('clock')}<span>${a}</span></div>`).join('')}
    ${ex.length?`<div class="tf-q-ex">${ex.map(x=>`<span>${x.cant} × ${x.concepto} · ${ars(x.monto)} por noche</span>`).join('')}<span><b>Adicionales por noche: ${ars(q.extrasNoche)}</b></span></div>`:'<div class="tf-q-ex"><span>Sin adicionales: todas las personas entran en el precio base.</span></div>'}
    <div class="tf-q-wrap"><table class="tf-q-tab"><thead><tr><th>Noche</th><th>Origen del precio</th><th class="right tf-hm">Precio base</th><th class="right tf-hm">Adicionales</th><th class="right">Total noche</th></tr></thead>
      <tbody>${q.detalle.map(d=>`<tr><td class="num">${fechaCorta(fechaIso(d.fecha))}</td><td>${pillOrigen(d.origen)}${d.origen!=='base'?` <small>${d.nombre}</small>`:''}${tfDemo(d.demo)}</td><td class="num right tf-hm">${ars(d.base)}</td><td class="num right tf-hm">${ars(d.extras)}</td><td class="num right"><b>${ars(d.total)}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total de la estadía<span class="tf-comb">${orgs.length>1?' · combina '+orgs.map(x=>ORIGEN_TF[x].toLowerCase()).join(', '):''}</span></td><td class="tf-hm"></td><td class="tf-hm"></td><td class="num right"><b>${ars(q.total)}</b></td></tr></tfoot></table></div>
    ${q.usaDemo?`<p class="note">${ic('alert')} Este cálculo usa valores <b>demo</b> ficticios.</p>`:''}
    ${q.menores.length?`<p class="note">${EDAD_D16}</p>`:''}
    ${o.crear&&puede('reservas.crear')?`<button type="button" class="btn btn-primary" data-tf="cot-res">${ic('plus')}Crear reserva con esta cotización</button>`:''}
  </div>`;
}
/* Precio anterior, nuevo y diferencia (Regla 12) */
function htmlComparacion(r,nuevo){
  const dif=nuevo-r.total, pag=r.pagado, cr=Math.max(0,pag-nuevo), sal=Math.max(0,nuevo-pag);
  return `<div class="tf-cmp"><div><small>Precio anterior</small><b class="num">${ars(r.total)}</b></div><div><small>Nuevo precio</small><b class="num">${ars(nuevo)}</b></div>
    <div class="${dif>0?'up':dif<0?'down':''}"><small>Diferencia</small><b class="num">${dif>0?'+':dif<0?'−':''}${ars(Math.abs(dif))}</b></div></div>
    <p class="note">Pagado hasta ahora: <b class="num">${ars(pag)}</b> · ${cr?`quedaría un <b>crédito a favor de ${ars(cr)}</b>. No se hace ninguna devolución automática y Caja no cambia.`:`saldo resultante: <b class="num">${ars(sal)}</b>.`}</p>`;
}
/* Bloque de decisión ante un cambio de precio: aplicar el nuevo o (solo Administrador) mantener el anterior */
function htmlDecisionPrecio(p,r,cot,estado){
  const adm=puede('tarifas.excepciones'), modo=estado.modo||'nuevo';
  return `<div class="tf-dec">${htmlComparacion(r,cot.total)}
    <div class="radios"><label class="radio"><input type="radio" name="${p}-modo" value="nuevo" ${modo==='nuevo'?'checked':''}><span><b>Aplicar el nuevo precio</b><small>${ars(cot.total)} según las tarifas vigentes.</small></span></label>
      <label class="radio${adm?'':' dis'}"><input type="radio" name="${p}-modo" value="mantener" ${modo==='mantener'?'checked':''} ${adm?'':'disabled'}><span><b>Mantener el precio anterior (excepción)</b><small>${adm?`${ars(r.total)} · queda auditado con motivo.`:'Solo el Administrador puede autorizarlo.'}</small></span></label></div>
    <div class="form" ${modo==='mantener'?'':'hidden'} id="${p}-mot-w"><div class="field full"><label for="${p}-mot">Motivo de la excepción (obligatorio)</label><input id="${p}-mot" value="${estado.motivo||''}"></div></div>
    <label class="check" ${modo==='nuevo'?'':'hidden'} id="${p}-conf-w"><input type="checkbox" id="${p}-conf" ${estado.conf?'checked':''}> Confirmo el cambio de precio (${ars(r.total)} → ${ars(cot.total)})</label></div>`;
}
function leerDecision(p){const m=document.querySelector(`input[name="${p}-modo"]:checked`);return {modo:m?m.value:'nuevo',motivo:limpiar(($('#'+p+'-mot')||{}).value),conf:!!($('#'+p+'-conf')||{}).checked}}
/* Valida la decisión y, si es una excepción, comprueba el permiso (no alcanza con deshabilitar el botón) */
function validarDecision(dec,r,cot){
  if(dec.modo==='mantener'){
    if(!puede('tarifas.excepciones')) return 'Solo el Administrador puede mantener el precio anterior.';
    if(dec.motivo.length<5) return 'Escribí el motivo de la excepción.';
    return '';
  }
  if(cot.total!==r.total&&!dec.conf) return 'Confirmá el cambio de precio para continuar.';
  return '';
}
/* Registra la excepción también en el historial de Tarifas */
function auditarExcepcion(r,cot,total,motivo,contexto){
  historialTf(`Autorizó una excepción de precio · Reserva #${r.nro}`,cot.total==null?'Sin cálculo posible':`Calculado ${ars(cot.total)}`,`Aplicado ${ars(total)} (${contexto})`,motivo);
  logRes(r,'Excepción de precio autorizada',`Calculado ${cot.total==null?'—':ars(cot.total)} · aplicado ${ars(total)} · ${contexto} · Motivo: ${motivo}`);
}

/* ---------- Eventos de Tarifas ---------- */
function tfRepintar(){const b=$('#tf-body');if(b)b.innerHTML=tfCuerpo();}
function tfLeerRangos(){return [...document.querySelectorAll('#tf-rangos .tf-rg')].map(el=>{const n=(c)=>{const v=el.querySelector(c).value;return v===''?null:+v};
  return {desde:n('.rg-d'),hasta:n('.rg-h'),monto:el.querySelector('.rg-m').value===''?null:parseMonto(el.querySelector('.rg-m').value)}})}
function tfAccion(b){
  const a=b.dataset.tf;
  if(a==='cal'){const d=+b.dataset.d;TF.calInicio=d?addD(TF.calInicio,d):new Date(HOY);return tfRepintar()}
  if(a==='rg-add'||a==='rg-del'){
    if(!editableTf()) return aviso(NOPERM);
    const l=tfLeerRangos(); if(a==='rg-add') l.push({desde:null,hasta:null,monto:null,demo:false}); else l.splice(+b.dataset.i,1);
    TF.edit={rangos:l}; tfRepintar(); TF.edit=null; return;
  }

/* =========================================================
   SOLICITUDES PENDIENTES DE POLÍTICA (Paso A · Decisiones 18 y 19)
   Control PROVISIONAL de la demo, no una política comercial:
   - Salida anticipada y cambio de categoría durante la estadía se REGISTRAN como solicitud.
   - Nada se ejecuta: no cambian fechas, habitación, ocupación, total, saldos ni Caja.
   - Solo el Administrador las resuelve administrativamente o las rechaza (sin ejecutar la operación).
   Estructura pensada para migrar al módulo de incidencias (Paso C): id estable, origen e historial.
   LIMITACIÓN: si el huésped ya se fue físicamente, el sistema lo sigue mostrando alojado hasta su
   salida prevista. No usar este flujo para operación real.
   ========================================================= */
const ZONA_AR='America/Argentina/Buenos_Aires (UTC−03:00)';
const SOL_RES_TIPO={salida_anticipada:'Salida anticipada',cambio_categoria:'Cambio de categoría durante la estadía'};
const SOL_RES_EST={pendiente:['Pendiente — Política sin definir','gold'],resuelta:['Resuelta administrativamente','info'],rechazada:['Rechazada','cancel']};
const SOL_PERM={salida_anticipada:'checkout.realizar',cambio_categoria:'reservas.cambiarHabitacion'};
const SOL_AVISO='Política pendiente de definición. Esto solo registra la solicitud: no ejecuta la salida ni el traslado, no recalcula el precio y no modifica fechas, habitación, saldos ni Caja.';
const SOL_LIMITE='Solución provisional de la demo: la reserva sigue figurando como “In House” hasta su salida prevista. No usar este flujo para operación real.';
let solResSeq=1;
const solicitudesDe=(r)=>r.solicitudes||[];
const solPendientes=()=>RESERVAS.filter(esReserva).flatMap(r=>solicitudesDe(r).filter(s=>s.estado==='pendiente').map(s=>({r,s})));
const tienePendiente=(r)=>solicitudesDe(r).some(s=>s.estado==='pendiente');
function solHist(s,accion,detalle){const d=ahoraAR();s.historial.push(Object.freeze({fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR,usuario:usuarioActual.nombre,accion,detalle:detalle||''}))}

/* Registrar (recepción o Administrador, con el permiso operativo correspondiente) */
function registrarSolicitud(r,tipo,datos={}){
  if(!SOL_RES_TIPO[tipo]) return {error:'Tipo de solicitud no válido.'};
  if(!puede(SOL_PERM[tipo])) return {error:NOPERM};
  if(!r||!esReserva(r)||r.estado!=='inhouse') return {error:'Solo se pueden registrar solicitudes de huéspedes alojados.'};
  const motivo=limpiar(datos.motivo);
  if(motivo.length<5) return {error:'Escribí el motivo de la solicitud.'};
  if(solicitudesDe(r).some(s=>s.estado==='pendiente'&&s.tipo===tipo)) return {error:'Esta reserva ya tiene una solicitud pendiente de este tipo.'};
  const s={id:'SOL-'+String(solResSeq++).padStart(4,'0'),origen:'solicitud-reserva',tipo,reserva:r.nro,hab:r.hab,categoria:catDeHab(r.hab),motivo,estado:'pendiente',observaciones:[],historial:[],resolucion:null};
  if(tipo==='salida_anticipada'){
    const f=datos.fecha;
    if(!f||isNaN(fechaIso(f))) return {error:'Indicá la fecha de salida solicitada.'};
    if(f<isoD(HOY)) return {error:'La fecha solicitada no puede ser anterior a hoy.'};
    if(f>=isoD(r.salida)) return {error:`La fecha solicitada tiene que ser anterior a la salida prevista (${ddmm(r.salida)}).`};
    s.fechaSolicitada=f;
  }else{
    const cat=datos.categoria, hab=datos.hab||null;
    if(!cat||!TIPOS_HAB.some(t=>t.id===cat)) return {error:'Elegí la categoría de destino.'};
    if(cat===catDeHab(r.hab)) return {error:'Para cambiar dentro de la misma categoría usá “Cambiar habitación”.'};
    if(hab&&(!HABITACIONES.includes(hab)||catDeHab(hab)!==cat)) return {error:'La habitación elegida no pertenece a la categoría de destino.'};
    s.categoriaDestino=cat; s.habDestino=hab;
  }
  const d=ahoraAR(); s.registrada={usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR};
  if(!r.solicitudes) r.solicitudes=[];
  r.solicitudes.push(s);
  const det=solDetalle(s);
  solHist(s,'Solicitud registrada',`${det} · Motivo: ${motivo}`);
  logRes(r,`Solicitud ${s.id} registrada`,`${SOL_RES_TIPO[tipo]} · ${det} · pendiente — política sin definir · no se ejecutó la operación`);
  auditar('Registró una solicitud pendiente de política',`${s.id} · Reserva #${r.nro} · Hab. ${r.hab} · ${SOL_RES_TIPO[tipo]} · ${det} · Motivo: ${motivo}`);
  return {ok:true,s};
}
const solDetalle=(s)=>s.tipo==='salida_anticipada'?`Salida solicitada para el ${ddmmIso(s.fechaSolicitada)} (prevista ${ddmm(RESERVAS.find(r=>r.nro===s.reserva).salida)})`
  :`De ${tipoNombre(s.categoria)} (Hab. ${s.hab}) a ${tipoNombre(s.categoriaDestino)}${s.habDestino?` · Hab. ${s.habDestino}`:''}`;
const buscarSol=(nro,id)=>{const r=RESERVAS.find(x=>x.nro===nro);return {r,s:r?solicitudesDe(r).find(x=>x.id===id):null}};

/* Observación, resolución y rechazo: SOLO el Administrador (se valida acá, no solo en la pantalla) */
function observarSolicitud(nro,id,texto){
  if(!esAdmin()) return {error:'Solo el Administrador puede agregar observaciones a las solicitudes.'};
  const {r,s}=buscarSol(nro,id); if(!s) return {error:'No se encontró la solicitud.'};
  const t=limpiar(texto); if(t.length<3) return {error:'Escribí la observación.'};
  const d=ahoraAR(); s.observaciones.push(Object.freeze({texto:t,usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,zona:ZONA_AR}));
  solHist(s,'Observación agregada',t);
  logRes(r,`Observación en la solicitud ${s.id}`,t);
  auditar('Agregó una observación a una solicitud',`${s.id} · Reserva #${r.nro} · ${t}`);
  return {ok:true};
}
function resolverSolicitud(nro,id,accion,texto){
  if(!esAdmin()) return {error:'Solo el Administrador puede resolver o rechazar solicitudes.'};
  if(accion!=='resuelta'&&accion!=='rechazada') return {error:'Acción no válida.'};
  const {r,s}=buscarSol(nro,id); if(!s) return {error:'No se encontró la solicitud.'};
  if(s.estado!=='pendiente') return {error:'La solicitud ya no está pendiente.'};
  const t=limpiar(texto); if(t.length<5) return {error:accion==='rechazada'?'Indicá el motivo del rechazo.':'Escribí la resolución administrativa.'};
  const d=ahoraAR();
  s.estado=accion; s.resolucion=Object.freeze({estado:accion,texto:t,usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR,ejecutoOperacion:false});
  const nom=accion==='resuelta'?'Resuelta administrativamente':'Rechazada';
  solHist(s,nom,`${t} · no se ejecutó la operación solicitada`);
  logRes(r,`Solicitud ${s.id}: ${nom.toLowerCase()}`,`${t} · no se ejecutó la salida ni el traslado; la reserva no cambió`);
  auditar(accion==='resuelta'?'Resolvió administrativamente una solicitud':'Rechazó una solicitud',`${s.id} · Reserva #${r.nro} · ${t} · sin ejecutar la operación`);
  return {ok:true};
}

/* Cambio de habitación dentro de la MISMA categoría con el huésped alojado: sin recotizar (aprobado en el Paso A) */
function habsMismaCategoria(r){
  const pl=plazasDe(r);
  return HABITACIONES.filter(h=>h!==r.hab&&catDeHab(h)===catDeHab(r.hab)&&!conflicto(h,r.ingreso,r.salida,r.nro)&&!limpieza.includes(h)
    &&!bloqueoEn(h,HOY)&&!RESERVAS.some(o=>o!==r&&o.hab===h&&o.estado==='inhouse')&&!(capacidadDe(h)!=null&&pl>capacidadDe(h)));
}
function trasladoMismaCategoria(r,nueva,motivo){
  if(!puede('reservas.cambiarHabitacion')) return {error:NOPERM};
  if(!r||r.estado!=='inhouse') return {error:'El traslado sin recotizar es solo para huéspedes alojados.'};
  if(!HABITACIONES.includes(nueva)) return {error:'Elegí la nueva habitación.'};
  if(nueva===r.hab) return {error:'Es la misma habitación.'};
  if(catDeHab(nueva)!==catDeHab(r.hab)) return {error:`La Hab. ${nueva} es de otra categoría (${tipoNombre(catDeHab(nueva))}). El cambio de categoría durante la estadía se registra como solicitud.`};
  if(RESERVAS.some(o=>o!==r&&o.hab===nueva&&o.estado==='inhouse')) return {error:`La Hab. ${nueva} está ocupada.`};
  if(bloqueoEn(nueva,HOY)) return {error:`La Hab. ${nueva} está bloqueada o en mantenimiento.`};
  const c=conflicto(nueva,r.ingreso,r.salida,r.nro); if(c) return {error:textoConflicto(c)};
  if(limpieza.includes(nueva)) return {error:`La Hab. ${nueva} está pendiente de limpieza.`};
  if(capacidadDe(nueva)!=null&&plazasDe(r)>capacidadDe(nueva)) return {error:`La Hab. ${nueva} admite hasta ${capacidadDe(nueva)} personas.`};
  if(cunasDe(r)&&TARIFAS.bebes.cunasPorHab!=null&&cunasDe(r)>TARIFAS.bebes.cunasPorHab) return {error:'La composición con cunas no es compatible con la habitación.'};
  const vieja=r.hab, mot=limpiar(motivo), antesNueva=EST_HAB[estadoHab(nueva)], total=r.total;
  r.hab=nueva;
  if(!limpieza.includes(vieja)) limpieza.push(vieja);
  habLog(vieja,'estado','Cambio de habitación · sale el huésped','Ocupada','Pendiente de limpieza',`${r.huesped} pasó a la Hab. ${nueva} · reserva #${r.nro}`);
  habLog(nueva,'estado','Cambio de habitación · entra el huésped',antesNueva,'Ocupada',`${r.huesped} viene de la Hab. ${vieja} · reserva #${r.nro}`);
  logRes(r,'Cambio de habitación',`Hab. ${vieja} → Hab. ${nueva} · misma categoría (${tipoNombre(catDeHab(nueva))}) · precio contratado sin cambios (${ars(total)})${mot?` · ${mot}`:''} · la Hab. ${vieja} queda pendiente de limpieza`);
  auditar('Cambió la habitación de un huésped alojado (misma categoría, sin recotizar)',`Reserva #${r.nro} · Hab. ${vieja} → Hab. ${nueva}${mot?` · Motivo: ${mot}`:''} · total ${ars(total)} sin cambios`,{antes:`Hab. ${vieja}`,despues:`Hab. ${nueva}`});
  return {ok:true,vieja};
}

function formAccionSolicitud(nro,id,a){

  modal(`<form id="solaf" novalidate><div class="modal-head"><div><h2>${t[0]}</h2><p>${s.id} · ${SOL_RES_TIPO[s.tipo]} · Reserva #${nro}</p></div><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>

    <div class="msg bad" id="sola-err" hidden></div>

/* Sección de la ficha de la reserva */

    ${l.slice().reverse().map(s=>`<div class="sol-item">

      <p class="sol-m">Motivo: ${s.motivo}</p>
      <p class="sol-r num">Registrada por ${s.registrada.usuario} · ${s.registrada.fecha} ${s.registrada.hora} · ${s.registrada.zona}</p>
      ${s.estado==='pendiente'?`<div class="msg warn" style="margin:8px 0 0">${ic('alert')}<span>${SOL_AVISO}</span></div>`:`<div class="msg ${s.estado==='rechazada'?'bad':'ok'}" style="margin:8px 0 0">${ic('check')}<span><b>${SOL_RES_EST[s.estado][0]}</b> por ${s.resolucion.usuario} · ${s.resolucion.fecha} ${s.resolucion.hora}: ${s.resolucion.texto}. No se ejecutó la operación solicitada.</span></div>`}
      ${s.observaciones.length?`<ul class="sol-obs">${s.observaciones.map(o=>`<li><span class="num">${o.fecha} ${o.hora} · ${o.usuario}</span> ${o.texto}</li>`).join('')}</ul>`:''}
      <details class="tf-det"><summary>Historial de la solicitud (${s.historial.length})</summary><ul class="hist">${s.historial.map(h=>`<li><span class="when num">${h.fecha} · ${h.hora}</span><div><b>${h.accion}</b><span>${h.detalle?h.detalle+' · ':''}${h.usuario}</span></div></li>`).join('')}</ul></details>
      ${adm?`<div class="sol-a">${s.estado==='pendiente'?`<button type="button" class="btn btn-sm" data-solact="resuelta" data-nro="${r.nro}" data-id="${s.id}">${ic('check')}Resolver administrativamente</button><button type="button" class="btn btn-sm btn-danger" data-solact="rechazada" data-nro="${r.nro}" data-id="${s.id}">${ic('xmark')}Rechazar</button>`:''}<button type="button" class="btn btn-sm" data-solact="obs" data-nro="${r.nro}" data-id="${s.id}">${ic('edit')}Agregar observación</button></div>`:''}
    </div>`).join('')}
    <p class="note">${SOL_LIMITE}</p></section>`;
}
document.addEventListener('click',(e)=>{
  const b=e.target.closest('[data-solact]'); if(b){e.preventDefault();return formAccionSolicitud(b.dataset.nro,b.dataset.id,b.dataset.solact)}
  const n=e.target.closest('[data-solnew]'); if(n){e.preventDefault();return formSolicitud(+n.dataset.i,n.dataset.solnew)}
});

/* =========================================================
   BLOQUEOS, CONFLICTOS Y TRASLADOS (Paso B · Decisiones 21 a 25)
   - Los bloqueos (manuales y mantenimientos) tienen identificador, fechas, motivo, responsable, observaciones e historial.
   - Recepción crea bloqueos e informa mantenimientos. Solo el Administrador los levanta.
   - Un bloqueo que coincide con reservas se registra igual, junto con una INCIDENCIA DE CONFLICTO mínima.
     Las reservas no se modifican. El bloqueo impide nuevas asignaciones en esas fechas.
   - Recepción propone traslados (solo misma categoría, precio contratado). Solo el Administrador los autoriza.
   - Fechas: el bloqueo cubre desde la fecha de inicio hasta el día ANTERIOR a “Disponible desde”.
   Paso C (tf_avisos.js): estados visibles Pendiente (clave interna “abierta”) → En gestión → Resuelta, prioridad,
   observaciones, reparaciones, avisos simulados y recordatorios. Identificadores e historial del Paso B se conservan.
   ========================================================= */
const INCIDENCIAS=[]; let incSeq=1, blqSeq=1, proSeq=1;
/* La clave interna “abierta” se conserva por compatibilidad; en pantalla es “Pendiente” */
const INC_EST={abierta:['Pendiente','bad'],en_gestion:['En gestión','gold'],resuelta:['Resuelta por Adrián','info']};
const PRO_EST={propuesta:['Propuesta · sin ejecutar','gold'],autorizada:['Autorizada y ejecutada','ok'],rechazada:['Rechazada','cancel'],reemplazada:['Sin efecto','cancel']};
const SISTEMA_DET='Sistema (detección automática)';
const pad4=(n)=>String(n).padStart(4,'0');
const limpiarB=(x)=>String(x??'').replace(/[<>"]/g,'').trim(); /* mismo criterio que limpiar(), disponible al armar los datos demo */
const ACT_RES_B=['pendiente','confirmada','inhouse'];
const esBloqueo=(r)=>r.estado==='bloqueo';
const bloqueosTodos=()=>RESERVAS.filter(esBloqueo);
const bloqueoPorId=(id)=>bloqueosTodos().find(b=>b.id===id);
const tipoBloqTxt=(b)=>b.tipoBloqueo==='manual'?'Bloqueo':'Mantenimiento';
const nochesBloq=(b)=>diffD(b.ingreso,b.salida);
const fechasBloqTxt=(b)=>mantVencido(b)?`desde el ${ddmm(b.ingreso)} · vencido: estaba previsto disponible desde el ${ddmm(b.salida)}`
  :b.finalizado?`del ${ddmm(b.ingreso)} · levantado el ${b.finalizado.fecha}`:`desde el ${ddmm(b.ingreso)} · disponible desde el ${ddmm(b.salida)} (${nochesBloq(b)} ${nochesBloq(b)===1?'noche':'noches'})`;
function prepBloqueo(b){
  if(!b.id) b.id='BLQ-'+pad4(blqSeq++);
  if(!b.historial) b.historial=[];
  if(!b.observaciones) b.observaciones=[];
  if(!b.creado) b.creado={usuario:b.informadoPor,fecha:b.informadoEl?b.informadoEl.fecha:fechaStr(HOY),hora:b.informadoEl?b.informadoEl.hora:'',zona:ZONA_AR};
  return b;
}
function blqHist(b,accion,detalle,usuario){const d=ahoraAR();b.historial.push(Object.freeze({fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR,usuario:usuario||usuarioActual.nombre,accion,detalle:detalle||''}))}
function incHist(i,accion,detalle,usuario){const d=ahoraAR();i.historial.push(Object.freeze({fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR,usuario:usuario||usuarioActual.nombre,accion,detalle:detalle||''}))}
function auditarComo(usuario,accion,detalle){const d=ahoraAR();AUDITORIA.unshift({usuario,rol:'Sistema',fecha:d.fecha,hora:d.hora,accion,detalle,antes:'',despues:''})}
const fotoRes=(r)=>Object.freeze({nro:r.nro,huesped:r.huesped,hab:r.hab,ingreso:isoD(r.ingreso),salida:isoD(r.salida),estado:r.estado,total:r.total});

/* ---------- Detección de conflictos (lectura pura, no modifica nada) ---------- */
/* Reservas activas que se superponen con la parte vigente del bloqueo (de hoy en adelante) */
function reservasAfectadas(b){
  if(!b||b.finalizado) return [];
  const ini=b.ingreso>HOY?b.ingreso:HOY, fin=finEfectivo(b);
  if(!(fin>ini)) return [];
  return RESERVAS.filter(r=>r.nro&&ACT_RES_B.includes(r.estado)&&r.hab===b.hab&&r.ingreso<fin&&ini<r.salida);
}
const conflictosVigentes=()=>bloqueosTodos().flatMap(b=>reservasAfectadas(b).map(r=>({b,r})));
const conflictosHab=(h)=>conflictosVigentes().filter(c=>c.b.hab===h);
const conflictosRes=(r)=>conflictosVigentes().filter(c=>c.r===r);
const incidenciasDeBloq=(b)=>INCIDENCIAS.filter(i=>i.bloqueoId===b.id);
const incidenciaDePar=(b,r)=>INCIDENCIAS.find(i=>i.bloqueoId===b.id&&i.reservas.some(x=>x.nro===r.nro));
const incPorId=(id)=>INCIDENCIAS.find(i=>i.id===id);
/* ¿Sigue vigente el conflicto de la incidencia? (aunque esté resuelta: nunca se oculta) */
function conflictoVigenteInc(i){const b=bloqueoPorId(i.bloqueoId);const af=reservasAfectadas(b).map(r=>r.nro);return i.reservas.filter(x=>af.includes(x.nro)).map(x=>x.nro)}

function crearIncidencia(b,rs,usuario,descripcion,seed){
  const d=ahoraAR();
  const i={id:'INC-'+pad4(incSeq++),origen:'conflicto-bloqueo',tipo:'conflicto_bloqueo',bloqueoId:b.id,hab:b.hab,
    desde:isoD(b.ingreso),disponibleDesde:isoD(b.salida),motivo:b.motivo,descripcion,
    registrada:{usuario,fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR},estado:'abierta',reservas:rs.map(fotoRes),propuestas:[],historial:[],resolucion:null,demo:!!b.demo};
  ampliarInc(i,sello(usuario),false); /* nace con el formato del Paso C */
  INCIDENCIAS.push(i);
  incHist(i,'Incidencia registrada',`${descripcion} · reservas afectadas: ${rs.map(r=>'#'+r.nro).join(', ')}`,usuario);
  rs.forEach(r=>r.historial.push({ts:new Date(),hora:d.hora,usuario,accion:`Afectada por el ${tipoBloqTxt(b).toLowerCase()} ${b.id}`,detalle:`Incidencia ${i.id} · la reserva no se modificó`}));
  if(!seed) (usuario===SISTEMA_DET?auditarComo:(u,a,t)=>auditar(a,t))(usuario,'Registró una incidencia de conflicto',`${i.id} · ${b.id} · Hab. ${b.hab} · reservas ${rs.map(r=>'#'+r.nro).join(', ')} · reservas sin cambios`);
  return i;
}
/* Detección idempotente: registra los conflictos nuevos (p. ej., mantenimientos vencidos) sin duplicar ni modificar reservas o Caja */
function sincronizarConflictos(){
  let n=0;
  conflictosVigentes().forEach(({b,r})=>{
    if(incidenciaDePar(b,r)) return;
    const ab=INCIDENCIAS.find(i=>i.bloqueoId===b.id&&i.estado!=='resuelta'); /* Pendiente o En gestión: hecho nuevo en la misma incidencia */
    const desc=mantVencido(b)?`Mantenimiento ${b.id} vencido sin finalizar: se superpone con la reserva #${r.nro}`:`El ${tipoBloqTxt(b).toLowerCase()} ${b.id} se superpone con la reserva #${r.nro}`;
    if(ab){ab.reservas.push(fotoRes(r));incHist(ab,'Reserva afectada agregada',desc,SISTEMA_DET);
      r.historial.push({ts:new Date(),hora:ahoraAR().hora,usuario:SISTEMA_DET,accion:`Afectada por el ${tipoBloqTxt(b).toLowerCase()} ${b.id}`,detalle:`Incidencia ${ab.id} · la reserva no se modificó`});
      auditarComo(SISTEMA_DET,'Agregó una reserva afectada a una incidencia',`${ab.id} · #${r.nro}`)}
    else crearIncidencia(b,[r],SISTEMA_DET,desc);
    n++;
  });
  return n;
}

/* ---------- Crear bloqueo (recepción o Administrador) ---------- */
function crearBloqueo(h,tipo,v,opc={}){
  if(!puede('bloqueos.crear')) return {error:NOPERM};
  if(!HABITACIONES.includes(h)) return {error:'Habitación inexistente.'};
  const esM=tipo!=='manual', desde=v.desde, hasta=v.hasta, mot=limpiarB(v.motivo);
  if(!(desde instanceof Date)||!(hasta instanceof Date)||isNaN(desde)||isNaN(hasta)) return {error:'Indicá la fecha de inicio y la fecha desde la que vuelve a estar disponible.'};
  if(hasta<=desde) return {error:'“Disponible desde” tiene que ser posterior a la fecha de inicio.'};
  if(desde<HOY) return {error:'La fecha de inicio no puede ser anterior a hoy.'};
  if(mot.length<3) return {error:'Escribí el motivo.'};
  const otros=RESERVAS.filter(r=>esBloqueo(r)&&r.hab===h&&!r.finalizado&&desde<finEfectivo(r)&&r.ingreso<hasta);
  if(otros.length) return {error:`En esas fechas la habitación ya tiene ${otros.map(b=>`el ${tipoBloqTxt(b).toLowerCase()} ${b.id||''} (${fechasBloqTxt(b)})`).join(', ')}.`};
  const afectadas=RESERVAS.filter(r=>r.nro&&ACT_RES_B.includes(r.estado)&&r.hab===h&&desde<r.salida&&r.ingreso<hasta);
  if(afectadas.length&&!opc.confirmarConflicto) return {requiereConfirmacion:true,afectadas};
  /* Todas las validaciones pasaron: recién ahora se modifica algo */
  const antes=EST_HAB[estadoHab(h)], d=ahoraAR(), usuario=opc.usuario||usuarioActual.nombre;
  const b=prepBloqueo({nro:null,hab:h,huesped:esM?'Mantenimiento':'Bloqueada',titular:{nombre:esM?'Mantenimiento':'Bloqueada'},pax:0,adultos:0,menores:0,estado:'bloqueo',
    tipoBloqueo:esM?'mantenimiento':'manual',motivo:mot,obs:limpiarB(v.obs),total:0,pagado:0,tarifa:0,ingreso:desde,salida:hasta,noches:diffD(desde,hasta),historial:[],
    informadoPor:usuario,informadoEl:{fecha:d.fecha,hora:d.hora},finalizado:null,demo:!!opc.demo});
  RESERVAS.push(b);
  blqHist(b,esM?'Mantenimiento informado':'Bloqueo creado',`${fechasBloqTxt(b)} · ${mot}`,usuario);
  let inc=null;
  if(afectadas.length) inc=crearIncidencia(b,afectadas,usuario,`El ${tipoBloqTxt(b).toLowerCase()} ${b.id} (${mot}) coincide con ${afectadas.length===1?'una reserva existente':afectadas.length+' reservas existentes'}`,opc.seed);
  const despues=EST_HAB[estadoHab(h)], det=`${b.id} · ${fechasBloqTxt(b)} · ${mot}${inc?` · conflicto ${inc.id}`:''}`;
  if(opc.seed) HAB_INFO[h].log.push({ts:new Date(),hora:d.hora,usuario,cat:esM?'mantenimiento':'estado',accion:esM?'Mantenimiento informado':'Habitación bloqueada',antes,despues,detalle:det,demo:true});
  else habLog(h,esM?'mantenimiento':'estado',esM?'Mantenimiento informado':'Habitación bloqueada',antes,despues,det,usuario);
  if(!opc.seed) auditar(esM?'Informó un mantenimiento':'Bloqueó una habitación',`Hab. ${h} · ${det}`,{antes,despues});
  return {ok:true,b,inc};
}
/* Observación sobre un bloqueo (recepción puede informar que el problema terminó: NO desbloquea) */
function observarBloqueo(id,texto,fin){
  if(!puede('bloqueos.crear')&&!esAdmin()) return {error:NOPERM};
  const b=bloqueoPorId(id); if(!b) return {error:'No se encontró el bloqueo.'};
  if(b.finalizado) return {error:'El bloqueo ya fue levantado.'};
  const t=limpiarB(texto); if(t.length<3) return {error:'Escribí la observación.'};
  const d=ahoraAR(); b.observaciones.push(Object.freeze({texto:t,fin:!!fin,usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,zona:ZONA_AR}));
  blqHist(b,fin?'Informó que el problema terminó (no desbloquea)':'Observación agregada',t);
  auditar(fin?'Informó que terminó un mantenimiento o problema':'Agregó una observación a un bloqueo',`${b.id} · Hab. ${b.hab} · ${t}${fin?' · la habitación sigue bloqueada hasta que Adrián la habilite':''}`);
  return {ok:true};
}
/* ---------- Levantar bloqueo o finalizar mantenimiento: SOLO Administrador (Decisiones 22 y 31) ---------- */
function verificarLevantar(id){
  if(!puede('bloqueos.levantar')) return {error:'Solo el Administrador puede levantar bloqueos o finalizar mantenimientos.'};
  const b=bloqueoPorId(id); if(!b) return {error:'No se encontró el bloqueo.'};
  if(b.finalizado) return {error:'El bloqueo ya fue levantado.'};
  sincronizarConflictos();
  /* Una incidencia Pendiente o En gestión impide levantar: solo una incidencia Resuelta lo habilita */
  const incs=incidenciasDeBloq(b), abiertas=incs.filter(i=>i.estado!=='resuelta');
  if(abiertas.length) return {error:`No se puede levantar: ${abiertas.map(i=>`${i.id} ${i.estado==='en_gestion'?'está En gestión':'está abierta (Pendiente)'}`).join(', ')}. Primero Adrián tiene que resolver la incidencia.`};
  const otros=bloqueosTodos().filter(o=>o!==b&&o.hab===b.hab&&!o.finalizado&&o.ingreso<=HOY&&HOY<finEfectivo(o));
  return {ok:true,b,incs,otros};
}
function levantarBloqueo(id,opc={}){
  const v=verificarLevantar(id); if(v.error) return v;
  if(!opc.confirmar) return {error:'Confirmá expresamente que la habitación puede habilitarse.'};
  const {b,incs,otros}=v, h=b.hab, esM=b.tipoBloqueo!=='manual', antes=EST_HAB[estadoHab(h)], d=ahoraAR();
  b.finalizado={usuario:usuarioActual.nombre,fecha:d.fecha,hora:opc.hora||d.hora,zona:ZONA_AR,sinIncidencias:!incs.length};
  b.salidaEstimada=b.salida; b.salida=new Date(HOY>b.ingreso?HOY:b.ingreso);
  if(esM&&!limpieza.includes(h)&&!RESERVAS.some(r=>r.hab===h&&r.estado==='inhouse')) limpieza.push(h);
  const despues=EST_HAB[estadoHab(h)];
  const nota=incs.length?`Incidencias resueltas: ${incs.map(i=>i.id).join(', ')}`:'Sin incidencias asociadas: el bloqueo no afectó reservas';
  blqHist(b,esM?'Mantenimiento finalizado por el Administrador':'Bloqueo levantado por el Administrador',`${nota}${otros.length?` · la habitación sigue bloqueada por ${otros.map(o=>o.id).join(', ')}`:''}`);
  habLog(h,esM?'mantenimiento':'estado',esM?'Mantenimiento finalizado':'Habitación desbloqueada',antes,despues,`${b.id} · ${b.motivo||''} · ${nota}`);
  auditar(esM?'Finalizó un mantenimiento':'Desbloqueó una habitación',`${b.id} · Hab. ${h} · ${antes} → ${despues} · ${nota}`,{antes,despues});
  return {ok:true,otros};
}

/* ---------- Traslados por conflicto (Decisión 24) ---------- */
/* Validación completa de una habitación de destino (se usa al proponer y otra vez al autorizar) */
function validarDestino(r,h){
  if(!HABITACIONES.includes(h)) return 'Elegí una habitación de destino.';
  if(h===r.hab) return 'Es la misma habitación.';
  if(catDeHab(h)!==catDeHab(r.hab)) return `La Hab. ${h} es de otra categoría (${tipoNombre(catDeHab(h))}): solo se aceptan traslados dentro de ${tipoNombre(catDeHab(r.hab))}.`;
  if(RESERVAS.some(o=>o!==r&&o.hab===h&&o.estado==='inhouse'&&o.ingreso<r.salida&&r.ingreso<o.salida)) return `La Hab. ${h} está ocupada.`;
  const c=conflicto(h,r.ingreso,r.salida,r.nro); if(c) return textoConflicto(c);
  if((r.estado==='inhouse'||mismoDia(r.ingreso,HOY))&&limpieza.includes(h)) return `La Hab. ${h} está pendiente de limpieza.`;
  if(capacidadDe(h)!=null&&plazasDe(r)>capacidadDe(h)) return `La Hab. ${h} admite hasta ${capacidadDe(h)} personas.`;
  if(cunasDe(r)&&TARIFAS.bebes.cunasPorHab!=null&&cunasDe(r)>TARIFAS.bebes.cunasPorHab) return 'La composición con cunas no es compatible con la habitación.';
  return '';
}
const destinosPosibles=(r)=>HABITACIONES.filter(h=>!validarDestino(r,h));
function proponerTraslado(incId,nro,h,motivo){
  if(!puede('bloqueos.crear')&&!puede('reservas.cambiarHabitacion')&&!esAdmin()) return {error:NOPERM};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  /* Corrección Paso B: una incidencia resuelta administrativamente NO impide gestionar un traslado si el conflicto real sigue vigente */
  if(!i.reservas.some(x=>x.nro===nro)) return {error:'Esa reserva no forma parte de la incidencia.'};
  const r=RESERVAS.find(x=>x.nro===nro); if(!r||!ACT_RES_B.includes(r.estado)) return {error:'La reserva ya no está activa.'};
  if(!conflictoVigenteInc(i).includes(nro)) return {error:'La reserva ya no está en conflicto con el bloqueo.'};
  const err=validarDestino(r,h); if(err) return {error:err};
  if(i.propuestas.some(p=>p.estado==='propuesta'&&p.nro===nro&&p.habDestino===h)) return {error:'Ya hay una propuesta igual pendiente.'};
  const m=limpiarB(motivo); if(m.length<3) return {error:'Escribí el motivo de la propuesta.'};
  const d=ahoraAR();
  const p={id:'PRO-'+pad4(proSeq++),nro,habOrigen:r.hab,habDestino:h,motivo:m,estado:'propuesta',propuesta:{usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,zona:ZONA_AR},autorizacion:null};
  const post=i.estado==='resuelta'; if(post) p.conIncidenciaResuelta=true;
  i.propuestas.push(p);
  incHist(i,post?'Traslado propuesto con la incidencia resuelta administrativamente':'Traslado propuesto',`${p.id} · #${nro}: Hab. ${r.hab} → Hab. ${h} · ${m} · sin ejecutar${post?' · conflicto operativo pendiente · la incidencia no se reabre':''}`);
  logRes(r,`Traslado propuesto (${p.id})`,`Hab. ${r.hab} → Hab. ${h} · pendiente de autorización de Adrián · la reserva no cambió`);
  auditar('Propuso un traslado por conflicto',`${p.id} · ${i.id}${post?' (resuelta administrativamente · conflicto operativo pendiente)':''} · #${nro} · Hab. ${r.hab} → Hab. ${h} · ${m} · sin ejecutar`);
  return {ok:true,p};
}
function autorizarTraslado(incId,proId,nota){
  if(!puede('incidencias.resolver')) return {error:'Solo el Administrador puede autorizar traslados por conflicto.'};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  const p=i.propuestas.find(x=>x.id===proId); if(!p) return {error:'No se encontró la propuesta.'};
  if(p.estado!=='propuesta') return {error:'La propuesta ya no está pendiente.'};
  const r=RESERVAS.find(x=>x.nro===p.nro); if(!r||!ACT_RES_B.includes(r.estado)) return {error:'La reserva ya no está activa.'};
  if(r.hab!==p.habOrigen) return {error:`La reserva ya no está en la Hab. ${p.habOrigen}.`};
  if(!conflictoVigenteInc(i).includes(p.nro)) return {error:'No se puede autorizar: la reserva ya no está en conflicto con el bloqueo, el traslado no es necesario.'};
  const err=validarDestino(r,p.habDestino); if(err) return {error:`No se puede autorizar: ${err}`};
  /* Validado todo: se ejecuta solo el traslado de esta reserva. Precio, pagos, saldos y Caja no cambian. */
  const vieja=r.hab, nueva=p.habDestino, total=r.total, d=ahoraAR(), n=limpiarB(nota);
  const antesNueva=EST_HAB[estadoHab(nueva)];
  r.hab=nueva;
  if(r.estado==='inhouse'){
    if(!limpieza.includes(vieja)) limpieza.push(vieja);
    habLog(vieja,'estado','Traslado por conflicto · sale el huésped','Ocupada','Pendiente de limpieza',`${r.huesped} pasó a la Hab. ${nueva} · ${p.id} · ${i.id}`);
    habLog(nueva,'estado','Traslado por conflicto · entra el huésped',antesNueva,'Ocupada',`${r.huesped} viene de la Hab. ${vieja} · ${p.id} · ${i.id}`);
  }
  p.estado='autorizada'; p.autorizacion=Object.freeze({usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,zona:ZONA_AR,nota:n,incidenciaEstado:i.estado});
  const estTxt=i.estado==='abierta'?'la incidencia sigue abierta':'la incidencia sigue resuelta administrativamente (no se reabrió ni se modificó su resolución)';
  i.propuestas.filter(x=>x!==p&&x.nro===p.nro&&x.estado==='propuesta').forEach(x=>{x.estado='reemplazada';incHist(i,'Propuesta sin efecto',`${x.id} · se autorizó ${p.id}`)});
  incHist(i,'Traslado autorizado y ejecutado',`${p.id} · #${r.nro}: Hab. ${vieja} → Hab. ${nueva} · precio contratado sin cambios (${ars(total)})${n?` · ${n}`:''} · ${estTxt}`);
  if(!conflictoVigenteInc(i).length) incHist(i,'Sin conflicto operativo vigente',`Tras ${p.id} ninguna reserva de la incidencia coincide con ${i.bloqueoId} · ${estTxt} · el bloqueo no se levantó`);
  logRes(r,'Traslado por conflicto autorizado',`Hab. ${vieja} → Hab. ${nueva} · ${p.id} · ${i.id} · autorizó ${usuarioActual.nombre} · motivo: ${p.motivo} · precio y pagos sin cambios${r.estado==='inhouse'?` · la Hab. ${vieja} queda pendiente de limpieza`:''}`);
  auditar('Autorizó un traslado por conflicto',`${p.id} · ${i.id} · #${r.nro} · Hab. ${vieja} → Hab. ${nueva} · propuso ${p.propuesta.usuario} · total ${ars(total)} sin cambios · ${estTxt}`,{antes:`Hab. ${vieja}`,despues:`Hab. ${nueva}`});
  return {ok:true};
}
function rechazarPropuesta(incId,proId,motivo){
  if(!puede('incidencias.resolver')) return {error:'Solo el Administrador puede rechazar propuestas de traslado.'};
  const i=incPorId(incId), p=i&&i.propuestas.find(x=>x.id===proId); if(!p) return {error:'No se encontró la propuesta.'};
  if(p.estado!=='propuesta') return {error:'La propuesta ya no está pendiente.'};
  const m=limpiarB(motivo); if(m.length<5) return {error:'Indicá el motivo del rechazo.'};
  const d=ahoraAR(); p.estado='rechazada'; p.autorizacion=Object.freeze({usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,zona:ZONA_AR,nota:m,rechazo:true});
  incHist(i,'Propuesta rechazada',`${p.id} · ${m}`);
  auditar('Rechazó una propuesta de traslado',`${p.id} · ${i.id} · ${m}`);
  return {ok:true};
}
/* Justificación específica cuando se resuelve con el conflicto vigente: no se aceptan textos vacíos o simbólicos.
   Criterio verificable: al menos 20 caracteres, 4 palabras y 3 palabras distintas, con letras variadas
   (rechaza “ok”, “listo”, “.....”, “resuelto resuelto resuelto”, “asdf asdf asdf asdf”, números sueltos). */
const JUST_MIN=20;
function errorJustificacion(txt){
  const t=limpiarB(txt); if(!t) return 'Escribí la justificación: el conflicto sigue vigente y hay que explicar por qué se resuelve igual.';
  const pal=t.toLowerCase().match(/[a-záéíóúüñ]{2,}/g)||[], letras=new Set(t.toLowerCase().match(/[a-záéíóúüñ]/g)||[]);
  if(t.length<JUST_MIN||pal.length<4||new Set(pal).size<3||letras.size<6) return `La justificación no es suficiente: explicá por qué se resuelve con el conflicto vigente y qué pasa con las reservas afectadas (al menos ${JUST_MIN} caracteres y 4 palabras).`;
  return '';
}
/* ---------- Resolver incidencia: SOLO Administrador. No levanta el bloqueo ni oculta un conflicto vigente ---------- */
function resolverIncidencia(incId,texto,opc={}){
  if(!puede('incidencias.resolver')) return {error:'Solo el Administrador puede resolver incidencias.'};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  if(i.estado==='resuelta') return {error:'La incidencia ya está resuelta.'}; /* se resuelve desde Pendiente o En gestión */
  const t=limpiarB(texto); if(t.length<5) return {error:'Escribí la resolución.'};
  const vig=conflictoVigenteInc(i);
  if(vig.length&&!opc.confirmarVigente) return {requiereConfirmacion:true,vigentes:vig,error:`El conflicto sigue vigente para ${vig.map(n=>'#'+n).join(', ')}. Resolver la incidencia no lo elimina: seguirá visible en el calendario y en las alertas hasta que se traslade la reserva o se levante el bloqueo.`};
  let j=null;
  if(vig.length){const ej=errorJustificacion(opc.justificacion); if(ej) return {requiereJustificacion:true,vigentes:vig,error:ej}; j=limpiarB(opc.justificacion)}
  /* Validado todo: recién ahora se modifica la incidencia */
  const d=ahoraAR();
  const afect=Object.freeze(vig.map(n=>{const r=RESERVAS.find(x=>x.nro===n);return Object.freeze({nro:n,hab:r.hab,ingreso:isoD(r.ingreso),salida:isoD(r.salida),estado:r.estado})}));
  const prev=i.estado;
  i.estado='resuelta'; i.resolucion=Object.freeze({tipo:'administrativa',texto:t,justificacion:j,usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR,conflictoVigente:Object.freeze(vig.slice()),reservasAfectadas:afect});
  incHist(i,'Resuelta por Adrián',`Resolución administrativa: ${t}${vig.length?` · Justificación: ${j} · conflicto operativo pendiente para ${vig.map(n=>'#'+n).join(', ')} (se puede gestionar un traslado con autorización de Adrián)`:''} · ${i.bloqueoId?'el bloqueo no se levantó':'sin bloqueo asociado'}`);
  if(i.seguimiento) i.seguimiento.push(Object.freeze({de:prev,a:'resuelta',texto:t,justificacion:j,usuario:usuarioActual.nombre,fecha:d.fecha,hora:d.hora,ts:d.ts,zona:ZONA_AR}));
  auditar('Resolvió una incidencia de conflicto',`${i.id} · resolución administrativa: ${t}${vig.length?` · justificación: ${j} · conflicto operativo pendiente: ${afect.map(x=>`#${x.nro} (Hab. ${x.hab} · ${x.ingreso} → ${x.salida})`).join(', ')}`:''} · ${i.bloqueoId?`bloqueo ${i.bloqueoId} sin cambios`:'sin bloqueo asociado'}`);
  return {ok:true};
}

  const leer=()=>({desde:new Date($('#bl-desde').value+'T00:00'),hasta:new Date($('#bl-hasta').value+'T00:00'),motivo:$('#bl-mot').value,obs:$('#bl-obs').value});
  const noches=()=>{const v=leer();$('#bl-noches').innerHTML=!isNaN(v.desde)&&!isNaN(v.hasta)&&v.hasta>v.desde?`Noches bloqueadas: del ${ddmm(v.desde)} al ${ddmm(addD(v.hasta,-1))} (${diffD(v.desde,v.hasta)} ${diffD(v.desde,v.hasta)===1?'noche':'noches'}). Disponible desde el ${ddmm(v.hasta)}.`:''; pendiente=null; $('#bl-conf').innerHTML=''; $('#bl-ok').textContent=esM?'Informar mantenimiento':'Bloquear'};
  ['bl-desde','bl-hasta'].forEach(id=>$('#'+id).addEventListener('change',noches)); noches();
  $('#blf').onsubmit=(e)=>{
    e.preventDefault();
    const err=$('#bl-err'), fallo=(t)=>{err.innerHTML=t;err.hidden=false};
    const conf=$('#bl-cf')&&$('#bl-cf').checked;
    const res=crearBloqueo(h,tipo,leer(),{confirmarConflicto:!!(pendiente&&conf)});
    if(res.requiereConfirmacion){

      pendiente=res.afectadas; err.hidden=true;
      $('#bl-conf').innerHTML=`<div class="msg bad">${ic('alert')}<span><b>Este bloqueo coincide con ${res.afectadas.length===1?'una reserva':res.afectadas.length+' reservas'}:</b><br>${res.afectadas.map(r=>`#${r.nro} · ${r.huesped} · ${ddmm(r.ingreso)} → ${ddmm(r.salida)} · ${EST_RES[r.estado].t}`).join('<br>')}<br>Las reservas <b>no se modifican</b>. Se registra una incidencia de conflicto para que Adrián decida.</span></div>
        <label class="check"><input type="checkbox" id="bl-cf"> Registrar el bloqueo con conflicto</label>`;
      $('#bl-ok').textContent='Registrar con conflicto';

    cerrar();refrescar();aviso(res.inc?`${res.b.id} registrado · conflicto ${res.inc.id} para Adrián`:`${res.b.id} registrado · Hab. ${h}`);

}

/* Estado del calendario para un día: disponible / reservada / ocupada / bloqueada (y combinados) */
function estadoCalendario(h,d){

  const occ=RESERVAS.some(r=>r.hab===h&&r.estado==='inhouse'&&r.ingreso<=d&&(d<r.salida||mismoDia(d,HOY)));
  const res=!occ&&RESERVAS.some(r=>r.hab===h&&['pendiente','confirmada'].includes(r.estado)&&r.ingreso<=d&&d<r.salida);
  const blq=RESERVAS.some(r=>esBloqueo(r)&&r.hab===h&&!r.finalizado&&r.ingreso<=d&&d<finEfectivo(r));
  const base=occ?'Ocupada':res?'Reservada':blq?'Bloqueada':'Disponible';
  return {occ,res,blq,conflicto:blq&&(occ||res),txt:blq&&(occ||res)?`${base} · Bloqueada (conflicto)`:base};

const difPendientes=()=>DIFERENCIAS.filter(d=>!d.revision&&(esAdmin()||d.responsable===usuarioActual.nombre||d.usuario===usuarioActual.nombre));
function transferenciaInterna(desde,hacia,monto,concepto){
  if(!puede('caja.transferir')) return {error:NOPERM};
  if(!cuentaDe(desde)||!cuentaDe(hacia)||desde===hacia) return {error:'Elegí dos cuentas distintas.'};
  if(!(monto>0)) return {error:'Ingresá un monto mayor a $0.'};
  if(desde==='efectivo'||hacia==='efectivo'){const e=chequeoEfectivo('Efectivo');if(e) return {error:e}}
  if(desde==='efectivo'&&monto>resumenTurno(turnoAbierto()).esperado) return {error:`No hay tanto efectivo esperado en caja (${ars(resumenTurno(turnoAbierto()).esperado)}).`};
  const c=limpiar(concepto)||`${cuentaDe(desde).t} → ${cuentaDe(hacia).t}`;
  const m=registrarMovimiento('transferencia',c,{monto,medio:'Interna',desde,hacia});
  auditar('Registró una transferencia interna',`${cuentaDe(desde).t} → ${cuentaDe(hacia).t} · ${ars(monto)} · ${c}`);
  return {mov:m};
}
/* Quién puede anular qué: el Administrador, cualquier movimiento; una recepcionista con permiso, solo los de su turno abierto */
function puedeAnularMov(m){
  if(!puede('movimientos.anular')) return {ok:false,motivo:NOPERM};
  if(m.estado!=='vigente') return {ok:false,motivo:'El movimiento ya está anulado'};
  if(m.gasto||m.tipo==='reintegro'||m.regularizacion) return {ok:false,motivo:'Gastos, reintegros y regularizaciones se corrigen solo desde Gastos y Proveedores, con sus validaciones.'};
  if(esAdmin()) return {ok:true};
  const t=turnoAbierto();
  if(!t||m.turno!==t.id||t.usuarioId!==usuarioActual.id) return {ok:false,motivo:'Solo podés anular movimientos de tu turno abierto. Los demás los anula el Administrador.'};
  return {ok:true};
}

/* =========================================================
   GASTOS Y PROVEEDORES
   - Solo gastos efectivamente pagados: no hay cuentas por pagar, deudas ni órdenes de compra.
   - Un gasto = un registro + exactamente un movimiento de egreso en Caja (m.gasto = id del gasto).
   - Indicadores y totales se leen de MOVIMIENTOS: un gasto anulado no suma.
   - El efectivo lo mueve solo quien es responsable del turno abierto y nunca más de lo que hay.
   - Las anulaciones de gastos las confirma solo el Administrador (prevalece sobre "Anular movimientos").
   ========================================================= */
const CATEGORIAS_GASTO=[
  {id:'lavanderia',t:'Lavandería'},{id:'limpieza',t:'Limpieza'},{id:'mantenimiento',t:'Mantenimiento'},
  {id:'servicios',t:'Servicios'},{id:'insumos',t:'Insumos'},{id:'personal',t:'Personal'},{id:'otros',t:'Otros'}];
const catDe=(id)=>CATEGORIAS_GASTO.find(c=>c.id===id)||{id,t:'Sin categoría'};
const TIPOS_COMPROBANTE=['Sin comprobante','Factura','Ticket','Recibo','Otro'];
const PROVEEDORES=[]; let provSeq=1;
const GASTOS=[]; let gastoSeq=1;
const AUTORIZACIONES=[]; let autSeq=1;
const provDe=(id)=>PROVEEDORES.find(p=>p.id===id)||null;
const gastoDe=(id)=>GASTOS.find(g=>g.id===id)||null;
const movDeGasto=(g)=>MOVIMIENTOS.find(m=>m.id===g.movId)||null;
const estadoGasto=(g)=>{const m=movDeGasto(g);return m?m.estado:'sin movimiento'};
const montoGasto=(g)=>{const m=movDeGasto(g);return m?m.monto:0};
const destinoGasto=(g)=>g.proveedorId?((provDe(g.proveedorId)||{}).nombre||'—'):(g.destinatario||'—');
/* Gastos con su movimiento en Caja. Por defecto solo los vigentes (los que suman). */
const gastosPagados=(conAnulados=false)=>GASTOS.filter(g=>{const m=movDeGasto(g);return m&&(conAnulados||m.estado==='vigente')});
const sumaGastos=(lista)=>lista.reduce((s,g)=>s+(estadoGasto(g)==='vigente'?montoGasto(g):0),0);
const ctaNom=(id)=>id?cuentaDe(id).t:'Aporte externo';

/* ---------- Proveedores ---------- */
const cuitDig=(s)=>String(s||'').replace(/\D/g,'');
const fmtCuit=(s)=>{const d=cuitDig(s);return d.length===11?`${d.slice(0,2)}-${d.slice(2,10)}-${d.slice(10)}`:s||''};
function cuitValido(c){
  const d=cuitDig(c); if(d.length!==11) return false;
  const f=[5,4,3,2,7,6,5,4,3,2]; let s=0; for(let i=0;i<10;i++) s+=+d[i]*f[i];
  let v=11-(s%11); if(v===11) v=0; if(v===10) return false;
  return v===+d[10];
}
const CAMPOS_PROV={nombre:'Nombre',cuit:'CUIT',tel:'Teléfono',email:'Email',dir:'Dirección',obs:'Observaciones'};
/* Alta o edición. Un CUIT cargado no se puede repetir. Un nombre igual avisa una vez (opc.confirmado lo acepta). */
function guardarProveedor(datos,id=null,opc={}){
  if(!puede('proveedores.gestionar')) return {error:NOPERM};
  const d={}; Object.keys(CAMPOS_PROV).forEach(k=>d[k]=limpiar(datos[k]));
  if(d.nombre.length<2) return {error:'Escribí el nombre o razón social.'};
  if(d.cuit){
    if(!cuitValido(d.cuit)) return {error:'El CUIT no es válido. Revisá los 11 números (o dejalo vacío si no corresponde).'};
    d.cuit=fmtCuit(d.cuit);
    const otro=PROVEEDORES.find(p=>p.id!==id&&p.cuit&&cuitDig(p.cuit)===cuitDig(d.cuit));
    if(otro) return {error:`Ya existe un proveedor con ese CUIT: ${otro.nombre}. Usá ese registro.`,dup:otro};
  }
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return {error:'El email no parece válido.'};
  const mismo=PROVEEDORES.find(p=>p.id!==id&&normaliza(p.nombre)===normaliza(d.nombre));
  if(mismo&&!opc.confirmado) return {aviso:`Ya hay un proveedor llamado “${mismo.nombre}”${mismo.cuit?` (CUIT ${mismo.cuit})`:''}. Si es otro distinto, volvé a guardar para confirmarlo.`,dup:mismo};
  if(id){
    const p=provDe(id); if(!p) return {error:'No se encontró el proveedor.'};
    const cambios=Object.keys(CAMPOS_PROV).filter(k=>(p[k]||'')!==d[k]);
    if(!cambios.length) return {sinCambios:true,prov:p};
    const antes=cambios.map(k=>`${CAMPOS_PROV[k]}: ${p[k]||'—'}`).join(' · '), despues=cambios.map(k=>`${CAMPOS_PROV[k]}: ${d[k]||'—'}`).join(' · ');
    cambios.forEach(k=>p[k]=d[k]);
    auditar('Editó un proveedor',`${p.nombre} · ${cambios.map(k=>CAMPOS_PROV[k]).join(', ')}`,{antes,despues});
    return {prov:p};
  }
  const p=Object.assign({id:'p'+(provSeq++),demo:false,creado:ahoraAR(),creadoPor:usuarioActual.nombre},d);
  PROVEEDORES.push(p);
  auditar('Registró un proveedor',`${p.nombre}${p.cuit?' · CUIT '+p.cuit:''}`);
  return {prov:p};
}

/* ---------- Registrar gasto pagado ---------- */
function validarGasto(d){
  if(!puede('gastos.registrar')) return NOPERM;
  if(limpiar(d.concepto).length<2) return 'El concepto es obligatorio.';
  if(!(d.monto>0)) return 'El importe tiene que ser mayor que $0.';
  if(!MEDIOS.includes(d.medio)) return 'Elegí el medio de pago.';
  if(d.proveedorId&&!provDe(d.proveedorId)) return 'El proveedor elegido no existe.';
  return chequeoEfectivo(d.medio);
}
const efectivoDisponible=()=>{const t=turnoAbierto();return t?resumenTurno(t).esperado:0};
function registrarGasto(d){
  const e=validarGasto(d); if(e) return {error:e};
  if(d.medio==='Efectivo'){
    const disp=efectivoDisponible();
    if(d.monto>disp) return {excede:true,disponible:disp,error:`El gasto (${ars(d.monto)}) supera el efectivo disponible en caja (${ars(disp)}). No se puede confirmar: podés solicitar autorización al Administrador.`};
  }
  const id=gastoSeq++, prov=d.proveedorId?provDe(d.proveedorId):null, dest=prov?prov.nombre:limpiar(d.destinatario);
  const concepto=limpiar(d.concepto);
  const m=registrarMovimiento('egreso',dest?`${concepto} · ${dest}`:concepto,{monto:d.monto,medio:d.medio,gasto:id});
  const g={id,movId:m.id,concepto,categoria:d.categoria||'otros',proveedorId:prov?prov.id:null,destinatario:prov?'':dest,monto:d.monto,medio:d.medio,
    comprobante:{tipo:d.comprobante&&d.comprobante.tipo||'Sin comprobante',numero:limpiar(d.comprobante&&d.comprobante.numero)},obs:limpiar(d.obs),
    usuario:usuarioActual.nombre,fecha:m.fecha,hora:m.hora,ts:m.ts,dia:m.dia,turno:m.turno,autorizacionId:d.autorizacionId||null,origen:d.origen||null,demo:false};
  GASTOS.push(g);
  const t=m.turno?TURNOS.find(x=>x.id===m.turno):null;
  auditar('Registró un gasto pagado',`Gasto #${g.id} · ${concepto} · ${catDe(g.categoria).t} · ${dest||'sin destinatario'} · ${ars(d.monto)} · ${d.medio}${t?` · turno #${t.nro}`:''}${g.autorizacionId?` · autorización #${g.autorizacionId}`:''}`);
  return {gasto:g};
}

/* ---------- Autorización: gasto en efectivo mayor al disponible ---------- */
function solicitarAutorizacion(d,motivo){
  const e=validarGasto(d); if(e) return {error:e};
  if(d.medio!=='Efectivo') return {error:'La autorización solo corresponde a gastos en efectivo.'};
  const disp=efectivoDisponible();
  if(d.monto<=disp) return {error:'Hay efectivo suficiente: registrá el gasto normalmente.'};
  const mot=limpiar(motivo); if(mot.length<5) return {error:'Explicá el motivo de la solicitud.'};
  const t=turnoAbierto(), ah=ahoraAR(), prov=d.proveedorId?provDe(d.proveedorId):null;
  const a={id:autSeq++,solicitante:usuarioActual.nombre,solicitanteId:usuarioActual.id,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,turno:t.nro,
    concepto:limpiar(d.concepto),categoria:d.categoria||'otros',proveedorId:prov?prov.id:null,destinatario:prov?'':limpiar(d.destinatario),
    monto:d.monto,disponible:disp,motivo:mot,comprobante:d.comprobante||{tipo:'Sin comprobante',numero:''},obs:limpiar(d.obs),
    estado:'pendiente',revision:null,pago:null};
  AUTORIZACIONES.push(a);
  auditar('Solicitó autorización por un gasto en efectivo',`Solicitud #${a.id} · ${a.concepto} · ${prov?prov.nombre:a.destinatario||'sin destinatario'} · ${ars(a.monto)} · disponible ${ars(disp)} · motivo: ${mot}`);
  return {aut:a};
}
const autProv=(a)=>a.proveedorId?((provDe(a.proveedorId)||{}).nombre||'—'):(a.destinatario||'—');
function resolverAutorizacion(id,aprobar,comentario){
  if(!puede('gastos.autorizar')) return {error:'Solo el Administrador puede revisar autorizaciones.'};
  const a=AUTORIZACIONES.find(x=>x.id===id);
  if(!a) return {error:'No se encontró la solicitud.'};
  if(a.estado!=='pendiente') return {error:'Esta solicitud ya fue resuelta.'};
  const c=limpiar(comentario);
  if(!aprobar&&c.length<3) return {error:'Para rechazar, escribí el motivo.'};
  const ah=ahoraAR();
  a.estado=aprobar?'aprobada':'rechazada';
  a.revision={usuario:usuarioActual.nombre,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,comentario:c};
  auditar(aprobar?'Aprobó una autorización de gasto':'Rechazó una autorización de gasto',`Solicitud #${a.id} de ${a.solicitante} · ${a.concepto} · ${ars(a.monto)}${c?' · '+c:''}`);
  return {aut:a};
}
/* Pagar una solicitud aprobada. La aprobación no crea dinero: si falta efectivo hay que registrar de dónde sale,
   o pagar con otro medio. origen = {tipo:'banco'|'aporte'|'otroMedio', detalle, medio} */
function pagarAutorizado(id,origen={}){
  const a=AUTORIZACIONES.find(x=>x.id===id);
  if(!a) return {error:'No se encontró la solicitud.'};
  if(a.estado!=='aprobada') return {error:a.estado==='pendiente'?'La solicitud todavía no fue aprobada.':`La solicitud está ${a.estado}.`};
  const base={concepto:a.concepto,categoria:a.categoria,proveedorId:a.proveedorId,destinatario:a.destinatario,monto:a.monto,comprobante:a.comprobante,obs:a.obs,autorizacionId:a.id};
  let r, fondos=null;
  if(origen.tipo==='otroMedio'){
    if(!['Transferencia','Tarjeta'].includes(origen.medio)) return {error:'Elegí transferencia o tarjeta.'};
    r=registrarGasto(Object.assign(base,{medio:origen.medio}));
  }else{
    const e=validarGasto(Object.assign({},base,{medio:'Efectivo'})); if(e) return {error:e};
    const disp=efectivoDisponible(), falta=Math.max(0,a.monto-disp);
    if(falta>0){
      if(origen.tipo==='banco'){
        if(saldoCuenta('banco')<falta) return {error:`La cuenta bancaria no tiene saldo suficiente según el sistema (${ars(saldoCuenta('banco'))}).`};
        const m=registrarMovimiento('transferencia',`Extracción bancaria para el gasto autorizado #${a.id}`,{monto:falta,medio:'Interna',desde:'banco',hacia:'efectivo'});
        fondos={tipo:'banco',monto:falta,movId:m.id,detalle:'Extracción de la cuenta bancaria'};
      }else if(origen.tipo==='aporte'){
        const det=limpiar(origen.detalle);
        if(det.length<5) return {error:'Indicá quién aporta los fondos y de dónde salen.'};
        const m=registrarMovimiento('transferencia',`Aporte de fondos para el gasto autorizado #${a.id} · ${det}`,{monto:falta,medio:'Interna',desde:null,hacia:'efectivo',origen:det});
        fondos={tipo:'aporte',monto:falta,movId:m.id,detalle:det};
      }else return {error:`Faltan ${ars(falta)} en efectivo. Registrá el origen real de los fondos adicionales o pagá con otro medio.`,falta};
      auditar('Registró el origen de fondos adicionales',`Autorización #${a.id} · ${fondos.detalle} · ${ars(falta)} · movimiento #${fondos.movId}`);
    }
    r=registrarGasto(Object.assign(base,{medio:'Efectivo',origen:fondos}));
  }
  if(r.error) return r;
  const ah=ahoraAR();
  a.estado='pagada'; a.pago={gastoId:r.gasto.id,usuario:usuarioActual.nombre,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,medio:r.gasto.medio,fondos};
  auditar('Registró el pago de un gasto autorizado',`Autorización #${a.id} · gasto #${r.gasto.id} · ${ars(a.monto)} · ${r.gasto.medio}`);
  return r;
}

/* =========================================================
   IMPORTANTE — PROTOTIPO
   Los datos viven solo en memoria y estas validaciones corren en el navegador.
   Antes de usar el sistema con datos reales es obligatorio implementar: base de datos,
   autenticación real, persistencia, respaldos y validaciones del lado del servidor
   (las mismas reglas de este archivo, aplicadas en el servidor).
   ========================================================= */
/* =========================================================
   CORRECCIONES DE GASTOS — VÍA ÚNICA
   Anulación      : el egreso nunca ocurrió o se registró por error.
   Reintegro      : el dinero salió y volvió (total o parcial). Movimiento nuevo, no es ingreso comercial.
   Corrección     : importe o medio equivocados → anular y reemplazar en una sola operación atómica.
   Regularización : si el egreso es de un turno cerrado, el efecto en efectivo tiene que estar
                    respaldado por diferencias de arqueo de ese turno (cierre o recepción siguiente).
   Toda operación pasa por planCorreccion(); Caja no puede anular gastos por su cuenta.
   ========================================================= */
const SOLICITUDES_G=[]; let solSeq=1;
const REGULARIZACIONES=[]; let regSeq=1;
const PRUEBA_TX={fallarEn:null}; /* solo para probar la reversión atómica */
const SOL_EST={pendiente:['Pendiente de autorización','warn'],esperando:['Esperando confirmación física','info'],ejecutada:['Ejecutada','ok'],
  rechazada:['Rechazada','cancel'],no_confirmada:['No confirmada · sin cambios','cancel'],revision:['Requiere nueva revisión','bad'],
  bloqueada:['Bloqueada · pendiente de investigación','bad'],cancelada:['Cancelada','neutral']};
const SOL_TIPO={anulacion:'Anulación',reintegro:'Reintegro',correccion:'Corrección de importe o medio'};
const SOL_ABIERTAS=['pendiente','esperando','revision','bloqueada'];

/* ---------- Lecturas derivadas ---------- */
function turnoDeGasto(g){const m=movDeGasto(g), id=m?m.turno:g.turno;return id?TURNOS.find(x=>x.id===id)||null:null}
const reintegrosDe=(g)=>MOVIMIENTOS.filter(m=>m.tipo==='reintegro'&&m.gasto===g.id&&m.estado==='vigente');
const reintegradoDe=(g)=>reintegrosDe(g).reduce((s,m)=>s+m.monto,0);
const solAbiertaDe=(gid)=>SOLICITUDES_G.find(s=>s.gastoId===gid&&SOL_ABIERTAS.includes(s.estado));
function reintegrable(g,exceptoId){
  if(estadoGasto(g)!=='vigente') return 0;
  const reservado=SOLICITUDES_G.filter(s=>s.id!==exceptoId&&s.gastoId===g.id&&s.tipo==='reintegro'&&['pendiente','esperando'].includes(s.estado)).reduce((a,s)=>a+s.importe,0);
  return Math.max(0,montoGasto(g)-reintegradoDe(g)-reservado);
}
function etiquetaGasto(g){
  const est=estadoGasto(g);
  if(est!=='vigente') return g.reemplazadoPor?['ANULADO · reemplazado por #'+g.reemplazadoPor,'bad']:['ANULADO','bad'];
  const r=reintegradoDe(g); if(r>=montoGasto(g)) return ['Reintegrado','info'];
  if(r>0) return [`Reintegro parcial ${ars(r)} de ${ars(montoGasto(g))}`,'info'];
  return ['Pagado','ok'];
}
const reintegrosEnPeriodo=(a,b)=>MOVIMIENTOS.filter(m=>m.tipo==='reintegro'&&m.estado==='vigente'&&m.dia>=a&&m.dia<=b);

/* ---------- Respaldo de regularizaciones: diferencias del turno original ----------
   Se juntan la diferencia del cierre del turno y la de la recepción del turno siguiente (el mismo dinero).
   Se toma el NETO: una diferencia de signo contrario compensa (p. ej. faltante al cerrar y sobrante al recibir
   = error de conteo, no dinero extra). Cada regularización consume del disponible: no se puede usar dos veces. */
function respaldoTurno(nro){
  const dc=DIFERENCIAS.filter(d=>d.tipo==='cierre'&&d.turno===nro);
  const sig=TURNOS.find(t=>t.recepcion&&t.recepcion.deTurno===nro);
  const dr=sig?DIFERENCIAS.filter(d=>d.tipo==='recepcion'&&d.turno===sig.nro):[];
  const difs=[...dc,...dr], neto=difs.reduce((s,d)=>s+d.monto,0);
  const regs=REGULARIZACIONES.filter(r=>r.turnoOrigen===nro), usado=regs.reduce((s,r)=>s+r.delta,0);
  const disp=neto-usado;
  return {nro,difs,neto,regs,usado,sobrante:Math.max(0,disp),faltante:Math.max(0,-disp)};
}
const difSinRegularizar=()=>DIFERENCIAS.reduce((s,d)=>s+d.monto,0)-REGULARIZACIONES.reduce((s,r)=>s+r.delta,0);

/* ---------- Plan: qué haría la operación ahora mismo (nada cambia todavía) ----------
   op = {tipo, gastoId, importe, medio}. Devuelve el plan o {error, bloqueo}. */
function planCorreccion(op,exceptoId){
  const g=gastoDe(op.gastoId); if(!g) return {error:'No se encontró el gasto.'};
  const m=movDeGasto(g); if(!m||m.estado!=='vigente') return {error:'El gasto ya está anulado.'};
  const t=turnoDeGasto(g), monto=m.monto, rein=reintegradoDe(g), ctl=enControl(m);
  const P={tipo:op.tipo,g,m,t,confirmar:null,referencia:false,regularizacion:null,lineas:[],req:[]};
  const abierto=t&&t.estado==='abierto', cerrado=t&&t.estado==='cerrado';
  if(op.tipo==='anulacion'||op.tipo==='correccion'){
    if(rein>0) return {error:`El gasto ya tiene reintegros por ${ars(rein)}. No se puede anular ni reemplazar: solo se admite una corrección administrativa.`};
    const nuevoMonto=op.tipo==='anulacion'?0:op.importe, nuevoMedio=op.tipo==='anulacion'?null:op.medio;
    if(op.tipo==='correccion'){
      if(!(nuevoMonto>0)) return {error:'Indicá el importe correcto (mayor que $0).'};
      if(!MEDIOS.includes(nuevoMedio)) return {error:'Indicá el medio de pago correcto.'};
      if(nuevoMonto===monto&&nuevoMedio===g.medio) return {error:'El importe y el medio son iguales a los registrados: no hay nada que corregir.'};
    }
    const origEf=g.medio==='Efectivo'?monto:0, nuevoEf=nuevoMedio==='Efectivo'?nuevoMonto:0, delta=origEf-nuevoEf;
    P.nuevoMonto=nuevoMonto; P.nuevoMedio=nuevoMedio; P.delta=delta;
    P.referencia=ctl&&(g.medio!=='Efectivo'||(nuevoMedio&&nuevoMedio!=='Efectivo'));
    if(!ctl){P.lineas.push('Es anterior al inicio del control de caja: no cambia ningún saldo actual.');P.destino='historico'}
    else if(abierto){
      P.destino='turno';
      if(delta>0) P.confirmar={turno:t,monto:delta};
      if(delta!==0){const R=resumenTurno(t);P.lineas.push(`Efectivo esperado del turno #${t.nro}: ${ars(R.esperado)} → ${ars(R.esperado+delta)}.`)}
      if(delta>0) P.req.push(`${t.usuario} tiene que confirmar que hay ${ars(delta)} físicamente en la caja.`);
      if(delta<0) P.lineas.push(`Ese efectivo ya salió de la caja: el esperado baja ${ars(-delta)} para coincidir con lo que hay.`);
    }else if(cerrado){
      P.destino='regularizacion';
      if(delta!==0){
        const r=respaldoTurno(t.nro), disp=delta>0?r.sobrante:r.faltante, tipoDif=delta>0?'sobrante':'faltante';
        if(disp<Math.abs(delta)) return {error:`El turno #${t.nro} está cerrado y no hay respaldo suficiente: se necesita un ${tipoDif} registrado de ${ars(Math.abs(delta))} (disponible: ${ars(disp)}). Queda pendiente de investigación.`,bloqueo:true};
        P.regularizacion={turnoNro:t.nro,delta,disponibleAntes:disp,difs:r.difs.map(d=>d.id)};
        P.lineas.push(`Regularización del turno #${t.nro} (cerrado): usa ${ars(Math.abs(delta))} del ${tipoDif} registrado (disponible ${ars(disp)} → ${ars(disp-Math.abs(delta))}).`);
        P.lineas.push(`El saldo de efectivo según sistema ${delta>0?'sube':'baja'} ${ars(Math.abs(delta))}. El cierre #${t.nro} y el efectivo esperado del turno actual no cambian.`);
      }else P.lineas.push(`El turno #${t.nro} está cerrado; la corrección no mueve efectivo. Su cierre no cambia.`);
    }else{
      if(delta!==0) return {error:'El egreso no tiene turno asociado y mueve efectivo: hay que investigarlo antes de corregir.',bloqueo:true};
      P.destino='sinturno';
    }
    if(P.referencia) P.req.push('Hay que verificar el extracto o resumen y cargar la referencia.');
    if(op.tipo==='correccion') P.lineas.push(`Se anula el egreso #${m.id} (${ars(monto)} · ${g.medio}) y se registra el gasto correcto (${ars(nuevoMonto)} · ${nuevoMedio}) en una sola operación.`);
    else P.lineas.push(`El egreso #${m.id} queda ANULADO (no se borra) y deja de sumar.`);
    return P;
  }
  if(op.tipo==='reintegro'){
    const max=reintegrable(g,exceptoId), a=op.importe, md=op.medio||g.medio;
    if(!(a>0)) return {error:'Indicá el importe devuelto (mayor que $0).'};
    if(a>max) return {error:`El reintegro supera lo que queda por devolver (${ars(max)}).`};
    if(!MEDIOS.includes(md)) return {error:'Indicá por qué medio volvió el dinero.'};
    P.importe=a; P.medio=md;
    if(md==='Efectivo'){
      const ab=turnoAbierto();
      if(!ab) return {error:'No hay turno abierto: el efectivo devuelto tiene que entrar a la caja de un turno.'};
      P.confirmar={turno:ab,monto:a}; const R=resumenTurno(ab);
      P.lineas.push(`Entra al turno actual #${ab.nro} (${ab.usuario}): efectivo esperado ${ars(R.esperado)} → ${ars(R.esperado+a)}.`);
      P.req.push(`${ab.usuario} tiene que confirmar que recibió ${ars(a)} en la caja.`);
      if(t&&t.id!==ab.id) P.lineas.push(`El gasto es del turno #${t.nro}: ese turno no cambia${t.estado==='cerrado'?' (su cierre queda igual)':''}.`);
    }else{P.referencia=true;P.lineas.push(`Entra a ${ctaNom(cuentaDeMedio(md))}.`);P.req.push('Hay que cargar la referencia de la acreditación.')}
    P.lineas.push(`El gasto queda ${a+rein>=monto?'reintegrado':'con reintegro parcial'} (${ars(a+rein)} de ${ars(monto)}). No cuenta como ingreso comercial.`);
    return P;
  }
  return {error:'Operación desconocida.'};
}

/* ---------- Ejecución atómica: todo o nada ---------- */
function transaccion(nombre,fn){
  const snap={mov:MOVIMIENTOS.length,gas:GASTOS.length,aud:AUDITORIA.length,reg:REGULARIZACIONES.length,movSeq,gastoSeq,regSeq,
    movs:MOVIMIENTOS.map(m=>[m,m.estado,m.anulacion]),gastos:GASTOS.map(g=>[g,g.reemplazadoPor])};
  try{return fn()}
  catch(e){
    MOVIMIENTOS.length=snap.mov; GASTOS.length=snap.gas; REGULARIZACIONES.length=snap.reg;
    AUDITORIA.splice(0,AUDITORIA.length-snap.aud);
    movSeq=snap.movSeq; gastoSeq=snap.gastoSeq; regSeq=snap.regSeq;
    snap.movs.forEach(([m,e,a])=>{m.estado=e;m.anulacion=a}); snap.gastos.forEach(([g,r])=>{g.reemplazadoPor=r});
    auditar('Operación revertida sin cambios',`${nombre} · ${e.message}`);
    return {error:`No se pudo completar la operación y no se aplicó ningún cambio (${e.message}).`};
  }
}
function ejecutarPlan(s,P){
  return transaccion(`Solicitud #${s.id}`,()=>{
    const g=P.g, ref=s.referencia?` · ref. ${s.referencia}`:'', motivo=`${SOL_TIPO[P.tipo]} · solicitud #${s.id} · ${s.motivo}${ref}`;
    const res={movs:[],gastoNuevo:null,reg:null};
    if(P.tipo==='reintegro'){
      const m=registrarMovimiento('reintegro',`Reintegro del gasto #${g.id} · ${g.concepto}`,{monto:P.importe,medio:P.medio,gasto:g.id,turno:P.confirmar?P.confirmar.turno.id:undefined});
      m.solicitud=s.id; res.movs.push(m.id);
      auditar('Registró un reintegro de gasto',`Gasto #${g.id} · ${ars(P.importe)} · ${P.medio}${P.confirmar?` · turno #${P.confirmar.turno.nro}`:''} · solicitud #${s.id}${ref}`);
      return res;
    }
    if(!anularMovimiento(P.m.id,motivo,{interno:true})) throw new Error('no se pudo anular el egreso original');
    res.movs.push(P.m.id);
    if(PRUEBA_TX.fallarEn==='reemplazo') throw new Error('falla simulada a mitad de la operación');
    if(P.tipo==='correccion'){
      const id=gastoSeq++, enTurno=P.destino==='turno';
      const extra={monto:P.nuevoMonto,medio:P.nuevoMedio,gasto:id};
      if(!enTurno){extra.turno=null;extra.dia=g.dia}
      const m=registrarMovimiento('egreso',`${g.concepto}${destinoGasto(g)!=='—'?' · '+destinoGasto(g):''}`,extra);
      if(P.regularizacion) m.regularizacion={turnoOrigen:P.regularizacion.turnoNro};
      m.solicitud=s.id;
      const nuevo=Object.assign({},g,{id,movId:m.id,monto:P.nuevoMonto,medio:P.nuevoMedio,fecha:m.fecha,hora:m.hora,ts:m.ts,dia:m.dia,turno:m.turno,
        usuario:usuarioActual.nombre,reemplazaA:g.id,reemplazadoPor:null,autorizacionId:null,origen:null,demo:false,solicitud:s.id,comprobante:Object.assign({},g.comprobante)});
      GASTOS.push(nuevo); g.reemplazadoPor=id; res.gastoNuevo=id; res.movs.push(m.id);
    }
    if(P.regularizacion){
      const r={id:regSeq++,turnoOrigen:P.regularizacion.turnoNro,delta:P.regularizacion.delta,monto:Math.abs(P.regularizacion.delta),difs:P.regularizacion.difs,
        solicitud:s.id,gastoId:g.id,movs:res.movs.slice(),autorizo:s.autorizacion?s.autorizacion.usuario:usuarioActual.nombre,...ahoraAR()};
      REGULARIZACIONES.push(r); res.reg=r.id;
      auditar('Regularizó una diferencia de arqueo',`Turno #${r.turnoOrigen} (cerrado) · ${r.delta>0?'sobrante':'faltante'} usado ${ars(r.monto)} · gasto #${g.id} · solicitud #${s.id}`);
    }
    auditar(P.tipo==='anulacion'?'Anuló un gasto (no ocurrió)':'Corrigió un gasto (anulación y reemplazo)',
      `Gasto #${g.id} · egreso #${P.m.id} ${ars(P.m.monto)} ${g.medio}${res.gastoNuevo?` → gasto #${res.gastoNuevo} ${ars(P.nuevoMonto)} ${P.nuevoMedio}`:''} · solicitud #${s.id}${ref}`);
    return res;
  });
}

/* ---------- Flujo de solicitudes ---------- */
function logSol(s,estado,detalle){const ah=ahoraAR();s.historial.push({estado,usuario:usuarioActual.nombre,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,detalle:detalle||''});s.estado=estado}
/* Validar una solicitud nueva sin crearla. Solo se registra al confirmar (altaSolicitud). */
function prepararSolicitud(d){
  if(!puede('gastos.solicitarAnulacion')&&!puede('gastos.autorizar')) return {error:NOPERM};
  const g=gastoDe(+d.gastoId); if(!g) return {error:'No se encontró el gasto.'};
  if(!SOL_TIPO[d.tipo]) return {error:'Elegí qué tipo de corrección pedís.'};
  if(estadoGasto(g)!=='vigente') return {error:'El gasto ya está anulado.'};
  if(solAbiertaDe(g.id)) return {error:`Ya hay una solicitud abierta para este gasto (#${solAbiertaDe(g.id).id}).`};
  const mot=limpiar(d.motivo); if(mot.length<5) return {error:'El motivo es obligatorio.'};
  const importe=d.tipo==='anulacion'?0:+d.importe||0, medio=d.tipo==='anulacion'?null:(d.medio||g.medio);
  if(d.tipo!=='anulacion'&&d.validar!==false){const p=planCorreccion({tipo:d.tipo,gastoId:g.id,importe,medio});if(p.error&&!p.bloqueo) return p}
  else if(reintegradoDe(g)>0&&d.tipo!=='reintegro') return {error:`El gasto ya tiene reintegros: no se puede anular. Solo se admite una corrección administrativa.`};
  return {draft:{id:null,tipo:d.tipo,gastoId:g.id,solicitante:usuarioActual.nombre,solicitanteId:usuarioActual.id,fecha:'',hora:'',ts:0,
    motivo:mot,importe,medio,iniciadaPorAdmin:!!d.iniciadaPorAdmin,estado:'pendiente',historial:[],autorizacion:null,confirmacion:null,ejecucion:null,turnoConfirmacion:null,montoConfirmar:0,referencia:'',resultado:null}};
}
function altaSolicitud(s){
  const g=gastoDe(s.gastoId), ah=ahoraAR();
  Object.assign(s,{id:solSeq++,fecha:ah.fecha,hora:ah.hora,ts:ah.ts});
  SOLICITUDES_G.push(s); logSol(s,'pendiente',s.iniciadaPorAdmin?'Iniciada y confirmada por el Administrador':'Solicitud creada');
  auditar(`${s.iniciadaPorAdmin?'Inició':'Solicitó'} ${s.tipo==='anulacion'?'la anulación':s.tipo==='reintegro'?'un reintegro':'una corrección'} de un gasto`,`Solicitud #${s.id} · gasto #${g.id} · ${g.concepto}${s.importe?` · ${ars(s.importe)}`:''}${s.medio?` · ${s.medio}`:''} · motivo: ${s.motivo}`);
  return s;
}
function solicitarCorreccion(d){
  const p=prepararSolicitud(d); if(p.error) return p;
  return {sol:altaSolicitud(p.draft)};
}
/* Autorización del Administrador. dec = {resultado:'nunca'|'volvio'|'no_volvio' (solo anulación), importe, medio,
   referencia, verificado, comentario, confirmar:{importe, fisico}} (confirmar: solo si el Administrador es el responsable del turno). */
function autorizarSolicitud(id,dec={}){
  if(!puede('gastos.autorizar')) return {error:'Solo el Administrador puede autorizar anulaciones, reintegros y correcciones.'};
  const s=SOLICITUDES_G.find(x=>x.id===id); if(!s) return {error:'No se encontró la solicitud.'};
  return autorizar_(s,dec,null);
}
/* Operación iniciada por Adrian desde el gasto: nada se registra hasta que él confirma.
   Si cierra la ventana o la validación falla, no queda ninguna solicitud. */
function autorizarBorrador(draft,dec={}){
  if(!puede('gastos.autorizar')) return {error:'Solo el Administrador puede autorizar anulaciones, reintegros y correcciones.'};
  if(draft.id) return autorizarSolicitud(draft.id,dec);
  const re=prepararSolicitud({gastoId:draft.gastoId,tipo:draft.tipo,motivo:draft.motivo,validar:false,iniciadaPorAdmin:true});
  if(re.error) return re;
  if(limpiar(dec.comentario).length>=5) draft.motivo=limpiar(dec.comentario);
  return autorizar_(draft,dec,()=>altaSolicitud(draft));
}
function autorizar_(s,dec,alta){
  const confirmarAlta=()=>{if(alta){alta();alta=null}};
  if(!['pendiente','revision','bloqueada'].includes(s.estado)) return {error:`La solicitud ya no se puede autorizar: su estado es “${SOL_EST[s.estado][0]}”.`};
  const c=limpiar(dec.comentario);
  if(s.iniciadaPorAdmin&&c.length<5) return {error:'Escribí el motivo en el comentario: es obligatorio.'};
  if(s.tipo==='anulacion'&&dec.resultado==='no_volvio'){
    if(c.length<3) return {error:'Indicá en el comentario qué se verificó.'};
    confirmarAlta();
    s.resultado='no_volvio';
    s.autorizacion={usuario:usuarioActual.nombre,...ahoraAR(),comentario:c};
    logSol(s,'rechazada','El dinero salió y no volvió: no se anula. Corresponde mantener el egreso y, si hubo un error de clasificación, hacer una corrección administrativa.');
    auditar('Rechazó una anulación de gasto (el dinero salió y no volvió)',`Solicitud #${s.id} · gasto #${s.gastoId} · ${c}`);
    return {sol:s};
  }
  let tipo=s.tipo, importe=s.importe, medio=s.medio;
  if(s.tipo==='anulacion'){
    if(!['nunca','volvio'].includes(dec.resultado)) return {error:'Indicá qué ocurrió con el dinero.'};
    if(dec.resultado==='volvio'){tipo='reintegro';importe=+dec.importe||0;medio=dec.medio||gastoDe(s.gastoId).medio}
  }else if(dec.importe!==undefined){importe=+dec.importe||0;medio=dec.medio||medio}
  const P=planCorreccion({tipo,gastoId:s.gastoId,importe,medio},s.id);
  if(P.error){
    if(P.bloqueo){confirmarAlta();s.autorizacion={usuario:usuarioActual.nombre,...ahoraAR(),comentario:c};logSol(s,'bloqueada',P.error);auditar('Corrección de gasto bloqueada por falta de respaldo',`Solicitud #${s.id} · ${P.error}`);return {sol:s,bloqueada:true,error:P.error}}
    return P;
  }
  const ref=limpiar(dec.referencia);
  if(P.referencia&&(!dec.verificado||ref.length<4)) return {error:'Verificá el extracto o resumen y cargá la referencia (número de operación o fecha del extracto).'};
  /* Si el Administrador es el responsable y confirma en el mismo paso, se valida la confirmación antes de registrar nada */
  if(P.confirmar&&P.confirmar.turno.usuarioId===usuarioActual.id&&dec.confirmar){
    if(dec.confirmar.importe!==P.confirmar.monto) return {error:`El importe confirmado tiene que ser exactamente ${ars(P.confirmar.monto)}.`};
    if(!dec.confirmar.fisico) return {error:'Confirmá que el efectivo está físicamente en la caja.'};
  }
  confirmarAlta();
  if(s.tipo==='anulacion') s.resultado=dec.resultado;
  s.tipo=tipo; s.importe=importe; s.medio=medio; s.referencia=ref;
  s.autorizacion={usuario:usuarioActual.nombre,...ahoraAR(),comentario:c};
  auditar('Autorizó una corrección de gasto',`Solicitud #${s.id} · ${SOL_TIPO[tipo]} · gasto #${s.gastoId}${importe?` · ${ars(importe)}`:''}${c?` · ${c}`:''}`);
  if(P.confirmar){
    s.turnoConfirmacion=P.confirmar.turno.id; s.montoConfirmar=P.confirmar.monto;
    const esResp=P.confirmar.turno.usuarioId===usuarioActual.id;
    if(esResp&&dec.confirmar) return confirmarFisico(s.id,dec.confirmar.importe,dec.confirmar.fisico,true);
    logSol(s,'esperando',`Autorizada. ${P.confirmar.turno.usuario} tiene que confirmar ${ars(P.confirmar.monto)} en la caja del turno #${P.confirmar.turno.nro}.`);
    return {sol:s,esperando:true};
  }
  const r=ejecutarPlan(s,P); if(r.error) return r;
  s.ejecucion=Object.assign({usuario:usuarioActual.nombre},ahoraAR(),r);
  logSol(s,'ejecutada',P.lineas.join(' '));
  return {sol:s,res:r};
}
/* Confirmación física de quien es responsable del turno abierto (o del Administrador si es el responsable) */
function confirmarFisico(id,importe,fisico,desdeAutorizacion){
  const s=SOLICITUDES_G.find(x=>x.id===id); if(!s) return {error:'No se encontró la solicitud.'};
  if(s.estado!=='esperando'&&!desdeAutorizacion) return {error:`No se puede confirmar: el estado de la solicitud es “${SOL_EST[s.estado][0]}”.`};
  const t=TURNOS.find(x=>x.id===s.turnoConfirmacion);
  if(!t||t.estado!=='abierto') return {error:'El turno de la confirmación ya está cerrado: la solicitud requiere nueva revisión.'};
  if(t.usuarioId!==usuarioActual.id) return {error:`La confirmación física la hace quien es responsable del turno #${t.nro} (${t.usuario}).`};
  if(importe!==s.montoConfirmar) return {error:`El importe confirmado tiene que ser exactamente ${ars(s.montoConfirmar)}.`};
  if(!fisico) return {error:'Confirmá que el efectivo está físicamente en la caja.'};
  const P=planCorreccion({tipo:s.tipo,gastoId:s.gastoId,importe:s.importe,medio:s.medio},s.id);
  if(P.error) return P;
  if(!P.confirmar||P.confirmar.turno.id!==t.id||P.confirmar.monto!==s.montoConfirmar) return {error:'La situación cambió desde la autorización: el Administrador tiene que revisarla de nuevo.'};
  s.confirmacion={usuario:usuarioActual.nombre,...ahoraAR(),importe,turno:t.nro};
  auditar('Confirmó el efectivo físico',`Solicitud #${s.id} · ${ars(importe)} en la caja del turno #${t.nro}`);
  const r=ejecutarPlan(s,P); if(r.error){s.confirmacion=null;return r}
  s.ejecucion=Object.assign({usuario:usuarioActual.nombre},ahoraAR(),r);
  logSol(s,'ejecutada',P.lineas.join(' '));
  return {sol:s,res:r};
}
function noConfirmarFisico(id,comentario){
  const s=SOLICITUDES_G.find(x=>x.id===id); if(!s||s.estado!=='esperando') return {error:'La solicitud no está esperando confirmación.'};
  const t=TURNOS.find(x=>x.id===s.turnoConfirmacion);
  if(!t||t.estado!=='abierto'||t.usuarioId!==usuarioActual.id) return {error:'Solo quien es responsable del turno abierto puede responder.'};
  const c=limpiar(comentario); if(c.length<3) return {error:'Contá qué encontraste en la caja.'};
  logSol(s,'no_confirmada',`El efectivo no está en la caja: ${c}`);
  auditar('No confirmó el efectivo físico',`Solicitud #${s.id} · ${c} · no se aplicó ningún cambio`);
  return {sol:s};
}
function rechazarSolicitud(id,comentario){
  if(!puede('gastos.autorizar')) return {error:'Solo el Administrador puede rechazar.'};
  const s=SOLICITUDES_G.find(x=>x.id===id); if(!s||!['pendiente','revision','bloqueada','esperando'].includes(s.estado)) return {error:'La solicitud ya está cerrada.'};
  const c=limpiar(comentario); if(c.length<3) return {error:'Para rechazar, escribí el motivo.'};
  logSol(s,'rechazada',c); auditar('Rechazó una corrección de gasto',`Solicitud #${s.id} · ${c}`);
  return {sol:s};
}
function cancelarSolicitud(id){
  const s=SOLICITUDES_G.find(x=>x.id===id); if(!s||s.estado!=='pendiente') return {error:'Solo se puede cancelar una solicitud pendiente.'};
  if(s.solicitanteId!==usuarioActual.id) return {error:'Solo quien la pidió puede cancelarla.'};
  logSol(s,'cancelada','Retirada por quien la pidió'); auditar('Canceló una solicitud de corrección de gasto',`Solicitud #${s.id}`);
  return {sol:s};
}
/* Al cerrar un turno, lo que esperaba su confirmación física pasa a "Requiere nueva revisión" (no se ejecuta ni se cancela) */
const pendientesConfirmacion=(t)=>SOLICITUDES_G.filter(s=>s.estado==='esperando'&&s.turnoConfirmacion===t.id);
function marcarRevisionPorCierre(t,advertida){
  const ps=pendientesConfirmacion(t); if(!ps.length) return;
  ps.forEach(s=>logSol(s,'revision',`El turno #${t.nro} se cerró antes de la confirmación física.`));
  auditar('Cerró el turno con confirmaciones pendientes',`Turno #${t.nro} · solicitudes ${ps.map(s=>'#'+s.id).join(', ')} pasan a "Requiere nueva revisión"${advertida?' · se mostró la advertencia en pantalla antes de confirmar':''}`);
}
/* Corrección administrativa: solo datos descriptivos; el dinero no se toca */
const CAMPOS_ADM={concepto:'Concepto',categoria:'Categoría',proveedorId:'Proveedor',destinatario:'Destinatario',comprobante:'Comprobante',obs:'Observaciones'};
function correccionAdministrativa(gid,datos,motivo){
  if(!puede('gastos.autorizar')) return {error:'Solo el Administrador puede hacer correcciones administrativas.'};
  const g=gastoDe(gid); if(!g) return {error:'No se encontró el gasto.'};
  const mot=limpiar(motivo); if(mot.length<5) return {error:'El motivo es obligatorio.'};
  const nuevo={concepto:limpiar(datos.concepto),categoria:datos.categoria,proveedorId:datos.proveedorId||null,destinatario:datos.proveedorId?'':limpiar(datos.destinatario),
    comprobante:{tipo:datos.comprobante.tipo,numero:limpiar(datos.comprobante.numero)},obs:limpiar(datos.obs)};
  if(nuevo.concepto.length<2) return {error:'El concepto es obligatorio.'};
  if(nuevo.proveedorId&&!provDe(nuevo.proveedorId)) return {error:'El proveedor no existe.'};
  const txt=(k,v)=>k==='categoria'?catDe(v).t:k==='proveedorId'?(v?provDe(v).nombre:'—'):k==='comprobante'?`${v.tipo}${v.numero?' Nº '+v.numero:''}`:(v||'—');
  const cambios=Object.keys(CAMPOS_ADM).filter(k=>JSON.stringify(g[k]??null)!==JSON.stringify(nuevo[k]??null)&&!(k==='destinatario'&&!g[k]&&!nuevo[k]));
  if(!cambios.length) return {sinCambios:true};
  const antes=cambios.map(k=>`${CAMPOS_ADM[k]}: ${txt(k,g[k])}`).join(' · '), despues=cambios.map(k=>`${CAMPOS_ADM[k]}: ${txt(k,nuevo[k])}`).join(' · ');
  const ah=ahoraAR();
  g.correcciones=(g.correcciones||[]).concat([{usuario:usuarioActual.nombre,fecha:ah.fecha,hora:ah.hora,ts:ah.ts,motivo:mot,antes,despues}]);
  cambios.forEach(k=>g[k]=nuevo[k]);
  auditar('Corrección administrativa de un gasto',`Gasto #${g.id} · ${mot} · el dinero no cambia`,{antes,despues});
  return {ok:true,cambios};
}


/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const ars=(n)=>'$'+n.toLocaleString('es-AR');
const pill=([t,c])=>`<span class="pill ${c}">${t}</span>`;
const roomBox=(n)=>`<div class="room"><small>Hab.</small><b class="num">${n}</b></div>`;

/* ---------- Navegación ---------- */
const MODULOS=[
  {id:'inicio',t:'Inicio',ic:'inicio'},
  /* perm: permiso necesario para ver el módulo. Los módulos sin permiso definido
     quedan visibles hasta acordar con Adrian qué permiso les corresponde. */
  {id:'planning',t:'Planning / Ocupación',ic:'planning',perm:'planning.ver'},
  {id:'reservas',t:'Reservas',ic:'reservas',perm:'reservas.ver'},
  {id:'habitaciones',t:'Habitaciones',ic:'habitaciones'},
  {id:'incidencias',t:'Incidencias',ic:'alert',perm:'incidencias.observar'},
  {id:'limpieza',t:'Limpieza',ic:'broom',perm:'limpieza.ver'},
  {id:'huespedes',t:'Huéspedes',ic:'huespedes',perm:'huespedes.ver'},
  {id:'caja',t:'Caja',ic:'caja',perm:'caja.consultar'},
  {id:'gastos',t:'Gastos y Proveedores',ic:'gastos',perm:'gastos.ver'},
  {id:'tarifas',t:'Tarifas',ic:'tarifas',perm:'tarifas.ver'},
  {id:'informes',t:'Informes',ic:'informes',perm:'informes.ver'},
  {id:'config',t:'Configuración',ic:'config',perm:'config.general'}
];
const nav=$('#nav');
function pintarMenu(){
  nav.innerHTML=MODULOS.filter(moduloVisible).map(m=>`<a href="#${m.id}" data-id="${m.id}" title="${m.t}">${ic(m.ic)}<span>${m.t}</span></a>`).join('');
  $('#userFoot').innerHTML=`<div class="avatar">${usuarioActual.nombre[0]}</div><div><b>${usuarioActual.nombre}</b><small>${ROLES[usuarioActual.rol].nombre}</small></div>${USUARIOS.filter(u=>u.activo).length>1?'<button class="sw-user" data-usrmenu title="Simula el ingreso con otro usuario">Cambiar</button>':''}`;
}
pintarMenu();

function moduloActual(){const id=(location.hash||'#inicio').slice(1);const m=MODULOS.find(x=>x.id===id)||MODULOS[0];return usuarioActual.rol==='limpieza'&&!moduloVisible(m)?MODULOS.find(x=>x.id==='limpieza'):m}
function pintarVista(){
  sincronizarConflictos();
  evaluarAvisos();
  const m=moduloActual();
  const chip=$('#demoChip'); if(chip) chip.hidden=!hayDatosDemo()&&!demoParaRevisar().length;
  $('#view').innerHTML=!moduloVisible(m)?sinAcceso(m):m.id==='inicio'?inicio():m.id==='planning'?planning():m.id==='reservas'?reservasView():m.id==='habitaciones'?habitacionesView():m.id==='huespedes'?huespedesView():m.id==='caja'?cajaView():m.id==='gastos'?gastosView():m.id==='tarifas'?tarifasView():m.id==='limpieza'?limpiezaView():m.id==='incidencias'?incidenciasView():m.id==='config'?configuracion():modulo(m);
  if(m.id==='planning'&&PL.q) plBuscar();
}
function route(){
  const m=moduloActual();
  nav.querySelectorAll('a').forEach(a=>{const on=a.dataset.id===m.id;a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  $('#crumb').textContent=m.t;
  pintarVista();
  $('#app').classList.remove('open');
  window.scrollTo(0,0);
}
/* Vuelve a dibujar la pantalla actual (y la ficha abierta) después de cualquier cambio de datos */
function refrescar(){
  const y=window.scrollY;
  pintarVista();
  try{window.scrollTo(0,y)}catch(e){}
  if(FICHA.idx!==null) pintarFicha(); else if(HF.h) pintarHab(); else if(GF.id) pintarHuesped(); else if(GSF.gasto) pintarGastoPanel(); else if(GSF.prov) pintarProvPanel();
}
window.addEventListener('hashchange',route);
$('#menuBtn').onclick=()=>$('#app').classList.add('open');
$('#scrim').onclick=()=>$('#app').classList.remove('open');

/* ---------- Pantalla: Inicio (todo calculado desde las reservas y la caja) ---------- */
function llegadaPill(r){
  if(r.estado==='inhouse') return ['Check-in realizado','ok'];
  if(r.estado==='pendiente') return ['Pendiente de confirmar','gold'];
  return ['Pendiente de ingresar','warn'];
}
function alertasHoy(){
  const a=[];
  if(puede('gastos.autorizar')){const n=AUTORIZACIONES.filter(x=>x.estado==='pendiente').length+SOLICITUDES_G.filter(x=>['pendiente','revision','bloqueada'].includes(x.estado)).length;
    if(n) a.push({tipo:'gasto',titulo:'Gastos para revisar',sub:`${n} ${n===1?'solicitud pendiente':'solicitudes pendientes'} de autorización, anulación, reintegro o corrección`,data:'data-gsaut="1"'})}
  {const t=turnoAbierto(); if(t&&t.usuarioId===usuarioActual.id) pendientesConfirmacion(t).forEach(x=>a.push({tipo:'gasto',titulo:`Confirmar efectivo · solicitud #${x.id}`,sub:`${SOL_TIPO[x.tipo]} autorizada · confirmá ${ars(x.montoConfirmar)} en la caja`,data:'data-gsaut="1"'}))}
  AUTORIZACIONES.filter(x=>x.estado==='aprobada'&&x.solicitanteId===usuarioActual.id).forEach(x=>a.push({tipo:'gasto',titulo:`Gasto autorizado #${x.id}`,sub:`${x.concepto} · ${ars(x.monto)} · aprobado, falta registrar el pago`,data:'data-gsaut="1"'}));
  /* Solicitudes pendientes de política: alerta interna solo para el Administrador */
  if(esAdmin()) solPendientes().forEach(({r,s})=>a.push({tipo:'solicitud',titulo:`Solicitud ${s.id} · Reserva #${r.nro}`,sub:`${SOL_RES_TIPO[s.tipo]} · Hab. ${r.hab} · pendiente — política sin definir`,data:`data-res="${RESERVAS.indexOf(r)}"`}));
  limpieza.forEach(h=>a.push({tipo:'limpieza',titulo:`Hab. ${h}`,sub:'Pendiente de limpieza',data:`data-agh="${h}"`}));
  alertasLimpieza().forEach(x=>a.push(x));
  saldosHoy().forEach(r=>a.push({tipo:'cobro',titulo:`Reserva #${r.nro}`,sub:`Saldo pendiente · ${ars(saldoDe(r))}`,data:`data-res="${RESERVAS.indexOf(r)}"`}));
  if(puede('caja.consultar')) difPendientes().forEach(d=>a.push({tipo:'caja',titulo:`Diferencia de caja · turno #${d.turno}`,sub:`${d.monto<0?'Faltante':'Sobrante'} de ${ars(Math.abs(d.monto))} · ${d.tipo==='cierre'?'cierre':'recepción'} de ${d.responsable}${d.excepcional?' (cierre excepcional)':''} · pendiente de revisión`,data:`data-cjdif="${d.id}"`}));
  conflictosVigentes().forEach(({b,r})=>{const i=incidenciaDePar(b,r);a.push({tipo:'conflicto',titulo:`Conflicto · Hab. ${b.hab} · Reserva #${r.nro}`,sub:`${b.id} se superpone con ${r.huesped}${i?` · ${i.id} (${INC_EST[i.estado][0]})`:''}${b.demo?' · DEMO':''}`,data:`data-agh="${b.hab}"`})});
  if(puede('incidencias.resolver')){
    INCIDENCIAS.filter(i=>i.tipo!=='operativa'&&i.estado!=='resuelta'&&!conflictoVigenteInc(i).length).forEach(i=>a.push({tipo:'conflicto',titulo:`${i.id} · ${INC_EST[i.estado][0]} · Hab. ${i.hab}`,sub:'Sin conflicto vigente · falta resolver la incidencia',data:`data-agh="${i.hab}"`}));
    INCIDENCIAS.filter(i=>i.tipo==='operativa'&&i.estado!=='resuelta'&&i.prioridad.nivel!=='urgente').forEach(i=>a.push({tipo:'incidencia',titulo:`${i.id} · ${INC_EST[i.estado][0]}`,sub:`${lugarInc(i)} · incidencia operativa sin resolver`,data:'data-incv="inc"'}));
    pendientesAdrian().rev.forEach(i=>a.push({tipo:'incidencia',titulo:`Revisión · ${i.id}`,sub:`Fecha de revisión ${ddmmIso(i.gestion.revision)} · sigue En gestión`,data:'data-incv="pend"'}));
    INCIDENCIAS.filter(i=>i.reparaciones&&i.reparaciones.length&&(i.estado!=='resuelta'||(i.bloqueoId&&bloqueoPorId(i.bloqueoId)&&!bloqueoPorId(i.bloqueoId).finalizado))).forEach(i=>a.push({tipo:'incidencia',titulo:`Reparación informada · ${i.id}`,sub:`${lugarInc(i)} · revisá la reparación (no cierra ni desbloquea)`,data:'data-incv="inc"'}));
    INCIDENCIAS.forEach(i=>i.propuestas.filter(p=>p.estado==='propuesta').forEach(p=>a.push({tipo:'conflicto',titulo:`Traslado propuesto ${p.id}`,sub:`Reserva #${p.nro} · Hab. ${p.habOrigen} → ${p.habDestino} · requiere tu autorización`,data:`data-agh="${p.habOrigen}"`})));
  }
  INCIDENCIAS.filter(i=>i.estado!=='resuelta'&&i.prioridad&&i.prioridad.nivel==='urgente').forEach(i=>a.push({tipo:'incidencia',titulo:`Urgente · ${i.id}`,sub:`${lugarInc(i)} · ${INC_EST[i.estado][0]}`,data:'data-incv="inc"'}));
  HABITACIONES.filter(h=>bloqueoEn(h,HOY)).forEach(h=>a.push({tipo:'mantenimiento',titulo:`Hab. ${h}`,sub:bloqueoEn(h,HOY).tipoBloqueo==='manual'?'Habitación bloqueada':mantVencido(bloqueoEn(h,HOY))?`Mantenimiento vencido (estaba previsto disponible desde el ${ddmm(bloqueoEn(h,HOY).salida)})`:'Mantenimiento informado',data:`data-agh="${h}"`}));
  return a;
}
/* Saludo según la hora real de Argentina */
function saludoAR(){const h=+ahoraAR().hora.slice(0,2);return h>=6&&h<12?'Buenos días':h>=12&&h<20?'Buenas tardes':'Buenas noches'}
function inicio(){
  const hoy=HOY.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const K=indicadores(), C=2*Math.PI*32, occ=K.pct, total=K.total;
  const est=[
    {t:'Disponibles',n:K.disp,c:'ok'},
    {t:'Ocupadas',n:K.ocup,c:'info'},
    {t:'Pendientes de limpieza',n:K.limp,c:'warn'},
    {t:'Mantenimiento',n:K.mant,c:'bad'},
    ...(K.blk?[{t:'Bloqueadas',n:K.blk,c:'blk'}]:[])
  ];
  const varC={ok:'var(--ok)',info:'var(--info)',warn:'var(--warn)',bad:'var(--bad)',blk:'var(--bad)'};
  const llegadas=K.llegadas.slice().sort((a,b)=>a.horaLlegada<b.horaLlegada?-1:1);
  const salidas=K.salidas.slice().sort((a,b)=>a.horaSalida<b.horaSalida?-1:1);
  const caja=cajaHoy(), alertas=alertasHoy();
  const pagoSal=(r)=>saldoDe(r)>0?['Saldo pendiente','bad']:['Pagado','ok'];
  const coSal=(r)=>r.estado==='finalizada'?['Check-out realizado','ok']:['Check-out pendiente','neutral'];

  return `
  <section class="hello">
    <div>
      <div class="date">${hoy}</div>
      <h1>${saludoAR()}, ${usuarioActual.nombre} 👋</h1>
      <p>Esto está pasando hoy en Jorge Primero.</p>
    </div>
    <div class="actions">
      ${[['reserva','plus','Nueva reserva',' btn-primary'],['checkin','in','Check-in',''],['checkout','out','Check-out',''],['ingreso','plus','Registrar ingreso',''],['gasto','plus','Registrar gasto','']]
        .filter(([k])=>puede(FORMS[k].perm))
        .map(([k,i,t,c])=>`<button class="btn${c}" data-modal="${k}">${ic(i)}${t}</button>`).join('')}
    </div>
  </section>

  <section class="kpis" aria-label="Estado del hotel">
    <div class="card kpi occ">
      <div class="ring"><svg viewBox="0 0 76 76"><circle class="track" cx="38" cy="38" r="32"/><circle class="val" cx="38" cy="38" r="32" stroke-dasharray="${C*occ/100} ${C}"/></svg><span class="num">${occ}%</span></div>
      <div><div class="label">Ocupación</div><div class="s" style="font-size:12.5px;color:var(--muted);margin-top:6px">${K.ocup} de ${total} habitaciones</div></div>
    </div>
    <div class="card kpi"><div class="kpi-top"><span class="label">Ocupadas</span>${ic('bed')}</div><div class="v num">${K.ocup}</div><div class="s">Habitaciones ocupadas</div></div>
    <div class="card kpi"><div class="kpi-top"><span class="label">Disponibles</span>${ic('door')}</div><div class="v num">${K.disp}</div><div class="s">Libres y listas</div></div>
    <div class="card kpi"><div class="kpi-top"><span class="label">Check-in hoy</span>${ic('in')}</div><div class="v num">${K.llegadas.length}</div><div class="s">Llegadas previstas</div></div>
    <div class="card kpi"><div class="kpi-top"><span class="label">Check-out hoy</span>${ic('out')}</div><div class="v num">${K.salidas.length}</div><div class="s">Salidas previstas</div></div>
  </section>

  <section class="moves">
    <div class="card">
      <div class="card-head"><h2>Llegadas de hoy <span class="count num">${llegadas.length}</span></h2></div>
      <div class="list">${llegadas.length?llegadas.map(l=>`
        <button class="arr" data-res="${RESERVAS.indexOf(l)}" aria-label="Ver reserva de ${l.huesped}">
          ${roomBox(l.hab)}
          <div class="who"><b>${l.huesped}</b><span>${l.pax} ${l.pax===1?'huésped':'huéspedes'}</span></div>
          <div class="time">${ic('clock')}Check-in <span class="num">${l.horaLlegada}</span></div>
          <div class="arr-end">${pill(llegadaPill(l))}<span class="go">${ic('arrow')}</span></div>
        </button>`).join(''):`<p class="empty" style="margin:0 20px 20px">No hay llegadas para hoy.</p>`}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Salidas de hoy <span class="count num">${salidas.length}</span></h2></div>
      <div class="table-wrap dep-table">
        <table>
          <thead><tr><th>Hab.</th><th>Huésped</th><th>Horario est.</th><th>Pago</th><th>Check-out</th></tr></thead>
          <tbody>${salidas.map(s=>`<tr data-res="${RESERVAS.indexOf(s)}" tabindex="0">
            <td class="room-tag num">${s.hab}</td><td>${s.huesped}</td><td class="num">${s.horaSalida}</td><td>${pill(pagoSal(s))}</td><td>${pill(coSal(s))}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="dep-cards list">${salidas.map(s=>`
        <button class="arr" data-res="${RESERVAS.indexOf(s)}" aria-label="Ver reserva de ${s.huesped}">
          ${roomBox(s.hab)}
          <div class="who"><b>${s.huesped}</b><span>${pill(coSal(s))}</span></div>
          <div class="time">${ic('clock')}Salida <span class="num">${s.horaSalida}</span></div>
          <div class="arr-end">${pill(pagoSal(s))}</div>
        </button>`).join('')}
      </div>
    </div>
  </section>

  <section class="bottom">
    <div class="card rooms-card">
      <div class="card-head"><h2>Estado de habitaciones</h2><span class="label num">${total} habitaciones</span></div>
      <div class="rooms-body">
        <div class="stack" aria-hidden="true">${est.map(e=>`<i style="width:${e.n/total*100}%;background:${varC[e.c]}"></i>`).join('')}</div>
        <div class="st-legend">${est.map(e=>`<div class="st"><b class="num">${e.n}</b><span><span class="dot c-${e.c}"></span>${e.t}</span></div>`).join('')}</div>
        <div class="floors">${Object.entries(pisos).map(([p,hs])=>`
          <div class="floor"><small>Piso ${p}</small><div class="tiles">${hs.map(h=>`<div class="tile ${estadoHab(h)}${conflictosHab(h).length?' cfl':''} num" title="Hab. ${h} · ${estadoCalendario(h,HOY).txt}">${h}</div>`).join('')}</div></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Caja de hoy</h2></div>
      <div class="cash">
        <div class="cash-row"><span>${ic('up')}Ingresos de hoy</span><b class="num in">${ars(caja.ingresos)}</b></div>
        <div class="cash-row"><span>${ic('down')}Egresos</span><b class="num out">${ars(caja.egresos)}</b></div>
        <div class="net"><span>Neto</span><b class="num">${ars(caja.ingresos-caja.egresos)}</b></div>
        ${(()=>{const t=turnoAbierto();return `<div class="cash-turno">${ic('clock')}${t?`Turno #${t.nro} · <b>${t.usuario}</b> desde las ${t.inicio.hora}`:'Sin turno de caja abierto'}</div>`})()}
        ${puede('caja.consultar')?`<a class="btn" href="#caja">Ver Caja ${ic('arrow')}</a>`:''}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Requiere atención <span class="count num">${alertas.length}</span></h2></div>
      ${alertas.length?`<ul class="alerts">${alertas.map(a=>`<li><button class="alert link" ${a.data}><span class="ai">${ic('alert')}</span><div><b>${a.titulo}</b><span>${a.sub}</span></div></button></li>`).join('')}</ul>`
        :`<p class="empty" style="margin:0 20px 20px">Nada pendiente por ahora.</p>`}
    </div>
  </section>`;
}

/* ---------- Configuración: estructura preparada para usuarios, permisos y auditoría ---------- */

  const grupos=[...new Set(PERMISOS.map(p=>p.g))];
  const audit=AUDITORIA.length
    ?`<div class="table-wrap"><table class="plain"><thead><tr><th>Usuario</th><th>Fecha</th><th>Hora</th><th>Acción</th></tr></thead>
       <tbody>${AUDITORIA.slice(0,6).map(a=>`<tr><td>${a.usuario}</td><td class="num">${a.fecha}</td><td class="num">${a.hora}</td><td>${a.accion}${a.detalle?` <span class="t-sub" style="color:var(--muted)">· ${a.detalle}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`

      </div>
      <button class="btn" disabled title="Disponible en la próxima etapa">${ic('plus')}Nuevo usuario</button>
    </section>

    <section class="card cfg">
      <div class="cfg-head"><h2>${ic('lock')}Permisos por recepcionista</h2><span class="tag">Próxima etapa</span></div>
      <p>El Administrador elige qué puede hacer cada recepcionista.</p>
      <div class="perm-groups">${grupos.map(g=>`
        <div><small class="label">${g}</small><div class="chips">${PERMISOS.filter(p=>p.g===g).map(p=>`<span class="chip">${p.t}</span>`).join('')}</div></div>`).join('')}

      <p class="note">Usuarios, permisos y configuración general quedan siempre en manos del Administrador.</p>

    <section class="card cfg">

      ${(()=>{const an=MOVIMIENTOS.filter(m=>m.estado==='anulado').slice(-3).reverse();
        return an.length?an.map(m=>`<div class="void-ex" style="margin-bottom:8px">
        <div><b class="num">${m.tipo==='egreso'?'Egreso':m.tipo==='ingreso'?'Ingreso':'Transferencia'} ${ars(m.monto)}</b><span>${m.concepto} · registrado por ${m.creadoPor} · ${dm(m.fecha)} ${m.hora}</span></div>

      </div>`).join('')+'<p class="note">Se anulan desde Caja › Movimientos.</p>'
        :`<div class="void-ex">
        <div><b class="num">Ingreso $45.000</b><span>Registrado por Adrian · ${ddmm(HOY)} 09:40</span></div>
        <span class="pill bad">Anulado</span>
        <small>Anulado por Adrian · ${ddmm(HOY)} 10:05 · Motivo: cargado dos veces</small>
      </div>
      <p class="note">Ejemplo ilustrativo. Los movimientos se anulan desde Caja › Movimientos.</p>`})()}

    <section class="card cfg">

/* =========================================================
   PLANNING / OCUPACIÓN
   ========================================================= */
/* Fecha de referencia ÚNICA de toda la demo: el día de hoy en Argentina, tomado al abrir el sistema.
   Inicio, Planning, Agenda, Reservas, Caja y Gastos usan esta misma fecha, y los datos demo se arman
   relativos a ella. Así la demo coincide con el día real en que se presenta. */
const PL_HOY=(()=>{const p={};new Intl.DateTimeFormat('en-US',{timeZone:TZ_AR,year:'numeric',month:'numeric',day:'numeric'})
  .formatToParts(new Date(RELOJ.ahora())).forEach(x=>p[x.type]=x.value);return new Date(+p.year,+p.month-1,+p.day)})();
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffD=(a,b)=>Math.round((b-a)/864e5);
const ddmm=(d)=>d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
const isoD=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* =========================================================
   ESTADOS
   - Estado de la reserva: Pendiente de confirmar / Confirmada / In House / Finalizada / Cancelada
   - Estado de pago (calculado): Sin pagos / Con seña / Pagada
   - Estado operativo (calculado): Pendiente de ingresar / Check-in realizado / Check-out pendiente / Check-out realizado
   "Con seña" NO confirma una reserva: confirmar es siempre una decisión explícita.
   ========================================================= */
const EST_RES={
  pendiente:{t:'Pendiente de confirmar',pill:'gold'},
  confirmada:{t:'Confirmada',pill:'info'},
  inhouse:{t:'In House',pill:'ok'},
  finalizada:{t:'Finalizada',pill:'neutral'},
  cancelada:{t:'Cancelada',pill:'cancel'},
  bloqueo:{t:'Bloqueada · Mantenimiento',pill:'bad'}
};
const EST_HAB={ok:'Disponible',info:'Ocupada',warn:'Pendiente de limpieza',bad:'Mantenimiento',blk:'Bloqueada'};

/* Acción preparada para un permiso propio en una etapa posterior */
const ACCIONES_RESERVA_FUTURAS=[{id:'tarifas.modificar',t:'Modificar tarifa'}];

/* =========================================================
   RESERVAS · FUENTE ÚNICA DE DATOS
   Inicio, Planning, Agenda, Reservas, Huéspedes y Caja leen de acá.
   Los pagos no se copian dentro de la reserva: son los movimientos de Caja
   vinculados a su número. Un pago = un solo movimiento.
   ========================================================= */
const HOY=PL_HOY;
const mismoDia=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const minD=(a,b)=>a<b?a:b;
const fechaStr=(d)=>d.toLocaleDateString('es-AR');
const pagosDe=(r)=>MOVIMIENTOS.filter(m=>m.tipo==='ingreso'&&m.reserva===r.nro&&m.estado==='vigente');
function conGetters(r){
  Object.defineProperties(r,{
    titular:{get(){return huespedDe(this.huespedId)},enumerable:true},
    /* Si la estadía ya terminó, el nombre sale del registro histórico (no cambia si después se edita el perfil) */
    huesped:{get(){return (this.registro||this.titular).nombre},enumerable:true},
    pax:{get(){return this.adultos+this.menores},enumerable:true},
    noches:{get(){return diffD(this.ingreso,this.salida)},enumerable:true},
    pagado:{get(){return pagosDe(this).reduce((s,m)=>s+m.monto,0)},enumerable:true}
  });
  return r;
}

/* Datos demo: [hab, titular, personas, ingreso (días desde hoy), noches, estado, total, pagado, nº]
   Las llegadas y salidas de hoy son las mismas de Inicio. */
/* =========================================================
   HUÉSPEDES · REGISTRO ÚNICO
   Cada persona existe una sola vez. Las reservas guardan solo su huespedId
   y r.titular devuelve siempre este registro: no hay copias de los datos.
   Estadías, pagos, saldos y créditos NO se guardan acá: se calculan desde Reservas y Caja.
   ========================================================= */
const HUESPEDES=[]; let hSeq=1;
const TIPOS_DOC=['DNI','Pasaporte','Cédula de identidad','Otro'];
function crearHuesped(datos){
  const g=Object.assign({id:'h'+(hSeq++),nombre:'',docTipo:'DNI',docPais:'Argentina',dni:'',tel:'',email:'',nacionalidad:'',nacimiento:'',
    notas:[],prefs:{tipo:'',cochera:'',piso:'',cama:'',obs:''},demo:{},historialDatos:[]},datos);
  HUESPEDES.push(g); return g;
}
const huespedDe=(id)=>HUESPEDES.find(g=>g.id===id);
/* Copia histórica de la reserva al cerrar la estadía (check-out): datos del titular tal como estaban ese día */
function fotoEstadia(r,fecha){
  const t=r.titular;
  return {nombre:t.nombre,docTipo:t.docTipo,docPais:t.docPais,dni:t.dni,tel:t.tel,email:t.email,hab:r.hab,ingreso:new Date(r.ingreso),salida:new Date(r.salida),pax:r.adultos+r.menores,total:r.total,tomadoEl:fechaStr(fecha||r.salida)};
}
const datosTitular=(r)=>r.registro||r.titular;
const soloDig=(s)=>String(s||'').replace(/\D/g,'');
/* Identificación: el documento (número + tipo + país emisor) es el criterio principal.
   Si coinciden solo el teléfono o el email, se avisa para revisar, pero no se bloquea. */
const normDoc=(s)=>String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
const docTexto=(g)=>g&&g.dni?`${g.docTipo||'DNI'} ${g.dni}${g.docPais?' · '+g.docPais:''}`:'Sin documento';
function mismoDocumento(a,b){
  const n=normDoc(a.dni);
  return n.length>=5&&n===normDoc(b.dni)&&(a.docTipo||'DNI')===(b.docTipo||'DNI')&&normaliza(a.docPais||'')===normaliza(b.docPais||'');
}
function buscarCoincidencias(d,excluirId){
  const doc=HUESPEDES.find(g=>g.id!==excluirId&&mismoDocumento(d,g));
  const tel=soloDig(d.tel), mail=normaliza(d.email||'').trim();
  const contacto=HUESPEDES.filter(g=>g.id!==excluirId&&g!==doc&&((tel.length>=6&&soloDig(g.tel)===tel)||(mail&&normaliza(g.email||'')===mail)));
  return {doc,contacto};
}
const motivoContacto=(d,g)=>[soloDig(d.tel).length>=6&&soloDig(g.tel)===soloDig(d.tel)?'el teléfono':'',d.email&&normaliza(g.email)===normaliza(d.email)?'el email':''].filter(Boolean).join(' y ');

/* =========================================================
   TARIFAS · CONFIGURACIÓN Y MOTOR DE PRECIOS (Etapa 2)
   Decisiones aprobadas:
   1. Precio base por categoría.  2. Personas incluidas por categoría.
   3. Adulto adicional: importe fijo general por adulto y noche.
   4. Niños: importe fijo por niño y noche según rango de edad.
   5. Adultos y niños cuentan para la capacidad. Bebés en cuna: regla especial configurable.
   6. Las plazas incluidas van a las personas cuya exclusión costaría más (combinación más económica).
   7. Temporadas y fechas especiales.  8. Fecha especial > temporada > precio base, noche por noche.
   Reglas: 9 (temporadas y fechas especiales cambian solo el precio base), 10 (sin superposiciones),
   11 (al menos un adulto), 12 (modificaciones con nueva cotización), 13 (crédito a favor),
   14 (fechas inclusivas; la noche de salida no se cobra), 15 (permisos).
   Todo importe marcado demo:true es FICTICIO y está pendiente de confirmación.
   ========================================================= */
const TARIFAS={
  categorias:{},
  adultoAdicional:{monto:25000,demo:true},
  rangos:[{id:'rg1',desde:3,hasta:12,monto:15000,demo:true}],
  /* CONFIGURACIÓN DEMO — PENDIENTE DE VALIDACIÓN por Adrián y Marlene */
  bebes:{activa:true,edadMax:2,ocupaPlaza:false,monto:0,cunasPorHab:1,cunasHotel:3,demo:true},
  temporadas:[],especiales:[],historial:[]
};
let tfSeq=1, cotSeq=1;
TIPOS_HAB.forEach(t=>{const v=DATOS_POR_TIPO[t.id];
  TARIFAS.categorias[t.id]={base:v?v.tarifaDemo:null,incluidas:v?Math.min(2,v.capacidad):null,demo:{base:true,incluidas:true}}});
/* Temporada y fecha especial de ejemplo, ubicadas cerca de la fecha de la demo (DEMO) */
TARIFAS.temporadas.push({id:'tp'+(tfSeq++),nombre:'Temporada alta (demo)',desde:isoD(addD(HOY,6)),hasta:isoD(addD(HOY,20)),
  precios:{MONSTD:90000,MONDXL:106000,STD:150000,DXL:138000},demo:true});
TARIFAS.especiales.push({id:'fe'+(tfSeq++),nombre:'Fin de semana largo (demo)',desde:isoD(addD(HOY,12)),hasta:isoD(addD(HOY,13)),
  precios:{MONSTD:110000,MONDXL:130000,STD:180000,DXL:165000},demo:true});

const ORIGEN_TF={base:'Precio base',temporada:'Temporada',especial:'Fecha especial'};
const ddmmIso=(iso)=>`${iso.slice(8,10)}/${iso.slice(5,7)}`;
const fechaIso=(iso)=>new Date(iso+'T00:00');
const catDeHab=(h)=>HAB_INFO[h]?HAB_INFO[h].tipo:null;
const capCategoria=(cat)=>{const c=HABITACIONES.filter(h=>HAB_INFO[h].tipo===cat).map(h=>HAB_INFO[h].capacidad).filter(x=>x!=null);return c.length?Math.min(...c):null};
const precioBaseHab=(h)=>{const c=TARIFAS.categorias[catDeHab(h)];return c?c.base:null};
const baseDemoHab=(h)=>{const c=TARIFAS.categorias[catDeHab(h)];return !!(c&&c.demo.base)};
function tarifasDemo(){const T=TARIFAS;return Object.values(T.categorias).reduce((s,c)=>s+(c.demo.base?1:0)+(c.demo.incluidas?1:0),0)+(T.adultoAdicional.demo?1:0)+T.rangos.filter(r=>r.demo).length+(T.bebes.demo?1:0)+T.temporadas.filter(x=>x.demo).length+T.especiales.filter(x=>x.demo).length}
const enRangoTf=(iso,a,b)=>iso>=a&&iso<=b; /* Regla 14: desde y hasta inclusivos */
/* Decisión 16: la edad de cada menor se calcula con su fecha de nacimiento a la fecha de ingreso (check-in)
   y define su rango tarifario durante toda la estadía, aunque cumpla años mientras está alojado. */
function edadAl(nacIso,fecha){const n=fechaIso(nacIso);let e=fecha.getFullYear()-n.getFullYear();if(fecha.getMonth()<n.getMonth()||(fecha.getMonth()===n.getMonth()&&fecha.getDate()<n.getDate()))e--;return e}
const fechaLarga=(iso)=>`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`;
/* Decisión 17: quien nació el 29/2 cumple años el 29/2 en años bisiestos y el 1/3 en años no bisiestos.
   (edadAl ya lo respeta: el 28/2 de un año no bisiesto todavía no cumplió; el 1/3 sí.) */
function cumpleDelAnio(nacIso,y){const n=fechaIso(nacIso);const c=new Date(y,n.getMonth(),n.getDate());return c.getMonth()!==n.getMonth()?new Date(y,2,1):c}
/* Cumpleaños que cae después del ingreso y antes de la salida */
function cumpleEnEstadia(nacIso,ingreso,salida){for(let y=ingreso.getFullYear();y<=salida.getFullYear();y++){const c=cumpleDelAnio(nacIso,y);if(c>ingreso&&c<salida)return c}return null}
function deepFreeze(o){if(o&&typeof o==='object'&&!Object.isFrozen(o)){Object.values(o).forEach(deepFreeze);Object.freeze(o)}return o}

/* Precio base de UNA noche para una categoría (Decisión 8 y Regla 9) */
function precioNoche(cat,iso){
  const esp=TARIFAS.especiales.filter(e=>e.precios[cat]!=null&&enRangoTf(iso,e.desde,e.hasta));
  if(esp.length>1) return {error:`La noche del ${ddmmIso(iso)} tiene ${esp.length} fechas especiales para ${tipoNombre(cat)} (${esp.map(e=>e.nombre).join(', ')}). Falta definir cuál prevalece.`};
  if(esp.length) return {monto:esp[0].precios[cat],origen:'especial',nombre:esp[0].nombre,ref:esp[0].id,demo:!!esp[0].demo};
  const tem=TARIFAS.temporadas.filter(t=>t.precios[cat]!=null&&enRangoTf(iso,t.desde,t.hasta));
  if(tem.length>1) return {error:`La noche del ${ddmmIso(iso)} tiene ${tem.length} temporadas para ${tipoNombre(cat)} (${tem.map(t=>t.nombre).join(', ')}). Falta definir cuál prevalece.`};
  if(tem.length) return {monto:tem[0].precios[cat],origen:'temporada',nombre:tem[0].nombre,ref:tem[0].id,demo:!!tem[0].demo};
  const c=TARIFAS.categorias[cat];
  if(!c||!c.base) return {error:`Falta configurar el precio base de ${tipoNombre(cat)}.`};
  return {monto:c.base,origen:'base',nombre:'Precio base',ref:null,demo:!!c.demo.base};
}

/* Clasifica a cada menor: bebé en cuna (regla especial) o niño según su rango de edad */
function clasificarMenor(m){
  const b=TARIFAS.bebes, e=m.edad;
  if(!Number.isInteger(e)||e<0||e>17) return {error:'Indicá la edad de cada menor (de 0 a 17 años).'};
  if(m.cuna){
    if(!b.activa) return {error:'La regla de bebés en cuna no está activa: no se pueden pedir cunas.'};
    if(b.edadMax==null) return {error:'Falta configurar hasta qué edad se considera bebé en cuna.'};
    if(e>b.edadMax) return {error:`La cuna es para bebés de hasta ${b.edadMax} ${b.edadMax===1?'año':'años'}. El menor de ${e} años no puede usar cuna.`};
    if(b.monto==null) return {error:'Falta configurar el importe de bebés en cuna.'};
    return {tipo:'bebe',edad:e,monto:b.monto,ocupaPlaza:!!b.ocupaPlaza,demo:!!b.demo};
  }
  const r=TARIFAS.rangos.filter(x=>e>=x.desde&&e<=x.hasta);
  if(r.length!==1) return {error:`Falta configurar la tarifa para niños de ${e} ${e===1?'año':'años'} (edad al ingreso).`,sinRango:true};
  return {tipo:'nino',edad:e,monto:r[0].monto,rango:`${r[0].desde} a ${r[0].hasta} años`,ocupaPlaza:true,demo:!!r[0].demo};
}

const ACTIVAS_TF=['pendiente','confirmada','inhouse'];
const cunasDe=(r)=>(r.edades||[]).filter(m=>m.cuna).length;
/* Cunas usadas por otras reservas activas en una noche */
function cunasEnNoche(iso,excluirNro){
  return RESERVAS.filter(r=>r.estado&&ACTIVAS_TF.includes(r.estado)&&r.nro&&r.nro!==excluirNro&&isoD(r.ingreso)<=iso&&iso<isoD(r.salida))
    .reduce((s,r)=>s+cunasDe(r),0);
}
/* Plazas que ocupa una reserva (adultos + niños + bebés solo si la regla dice que ocupan plaza) */
function plazasDe(r){
  if(!r.edades) return r.adultos+r.menores;
  return r.adultos+r.edades.filter(m=>!(m.cuna&&TARIFAS.bebes.activa&&!TARIFAS.bebes.ocupaPlaza)).length;
}

/* Asignación de plazas incluidas (Decisión 6): quedan incluidas las personas cuya exclusión costaría más.
   Como los adicionales no cambian entre noches (Regla 9), la asignación es la misma para toda la estadía. */
function asignarPlazas(personas,incluidas){
  const ord=personas.map((p,i)=>({...p,i})).sort((a,b)=>(b.monto-a.monto)||(a.i-b.i));
  const set=new Set(ord.slice(0,Math.max(0,incluidas)).map(p=>p.i));
  return personas.map((p,i)=>({...p,incluido:set.has(i)}));
}

/* Cotización completa. o = {hab | cat, ingreso: Date, salida: Date, adultos, menores:[{nac:'AAAA-MM-DD',cuna}], excluirNro} */
function cotizar(o){
  const errores=[], add=(t)=>{if(t&&!errores.includes(t))errores.push(t)};
  const cat=o.hab?catDeHab(o.hab):o.cat, cap=o.hab?capacidadDe(o.hab):capCategoria(cat);
  const ingreso=o.ingreso instanceof Date?o.ingreso:fechaIso(o.ingreso), salida=o.salida instanceof Date?o.salida:fechaIso(o.salida);
  const n=diffD(ingreso,salida), adultos=Math.max(0,parseInt(o.adultos)||0);
  const nacOk=(x)=>!!x&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(fechaIso(x));
  const menores=(o.menores||[]).map(m=>{const nac=nacOk(m.nac)?m.nac:null;return {nac,edad:nac&&!isNaN(ingreso)?edadAl(nac,ingreso):null,cuna:!!m.cuna}});
  if(!(n>0)) add('La salida tiene que ser posterior al ingreso.');
  if(!cat||!TIPOS_HAB.some(t=>t.id===cat)) add('Elegí una categoría o una habitación.');
  if(adultos<1) add('Toda reserva necesita al menos un adulto responsable.');
  const cl=menores.map(m=>!m.nac?{error:'Ingresá la fecha de nacimiento de cada menor.'}
    :m.nac>isoD(ingreso)?{error:'La fecha de nacimiento de un menor no puede ser posterior a la fecha de ingreso.'}
    :m.edad>17?{error:`Un huésped nacido el ${fechaLarga(m.nac)} tiene ${m.edad} años al ingreso: cargalo como adulto.`}
    :clasificarMenor(m));
  cl.forEach(x=>add(x.error));
  /* La cotización guarda la edad al ingreso y el rango usado (Decisión 16) */
  menores.forEach((m,i)=>{const c=cl[i];m.rango=c.error?null:c.tipo==='bebe'?'Bebé en cuna':`Niños de ${c.rango}`;m.importe=c.error?null:c.monto});
  const avisos=[];
  menores.forEach(m=>{if(!m.nac||m.edad==null||m.edad>17||!(n>0)) return;
    const c=cumpleEnEstadia(m.nac,ingreso,salida);
    if(c) avisos.push(`El menor nacido el ${fechaLarga(m.nac)} cumple ${edadAl(m.nac,c)} años el ${ddmmIso(isoD(c))}, durante la estadía: se mantiene su edad al ingreso (${m.edad} ${m.edad===1?'año':'años'}) y su tarifa.`);
    else if(mismoDia(cumpleDelAnio(m.nac,ingreso.getFullYear()),ingreso)) avisos.push(`El menor nacido el ${fechaLarga(m.nac)} cumple años el día del ingreso: se toma la edad nueva (${m.edad} ${m.edad===1?'año':'años'}).`);
  });
  const ok=cl.filter(x=>!x.error);
  const plazas=adultos+ok.filter(x=>x.ocupaPlaza).length+cl.filter(x=>x.error).length;
  if(cap!=null&&plazas>cap) add(`${o.hab?`La Hab. ${o.hab}`:tipoNombre(cat)} admite hasta ${cap} ${cap===1?'persona':'personas'}. Esta combinación ocupa ${plazas} plazas.`);
  const c=TARIFAS.categorias[cat];
  if(cat&&(!c||c.incluidas==null)) add(`Falta configurar cuántas personas incluye el precio base de ${tipoNombre(cat)}.`);
  const nAdic=adultos-(c&&c.incluidas!=null?c.incluidas:adultos);
  if(TARIFAS.adultoAdicional.monto==null&&nAdic>0) add('Falta configurar el importe del adulto adicional.');
  /* Cunas: límite por habitación y del hotel, noche por noche */
  const cunas=ok.filter(x=>x.tipo==='bebe').length;
  const B=TARIFAS.bebes;
  if(cunas&&B.cunasPorHab!=null&&cunas>B.cunasPorHab) add(`Se admite un máximo de ${B.cunasPorHab} ${B.cunasPorHab===1?'cuna':'cunas'} por habitación.`);
  const detalle=[], sinCuna=[];
  for(let k=0;k<Math.max(0,n);k++){
    const iso=isoD(addD(ingreso,k));
    if(cunas&&B.cunasHotel!=null){const usadas=cunasEnNoche(iso,o.excluirNro);if(usadas+cunas>B.cunasHotel)sinCuna.push(`${ddmmIso(iso)} (${usadas} de ${B.cunasHotel} en uso)`)}
    const p=cat?precioNoche(cat,iso):{error:''};
    if(p.error) add(p.error);
    detalle.push({fecha:iso,base:p.monto||0,origen:p.origen||null,nombre:p.nombre||'',ref:p.ref||null,demo:!!p.demo});
  }
  if(sinCuna.length) add(`No hay cunas disponibles todas las noches pedidas: ${sinCuna.join(', ')}.`);
  /* Personas que ocupan plaza compiten por las plazas incluidas; los bebés que no ocupan plaza pagan su importe aparte */
  const personas=[...Array(adultos)].map(()=>({tipo:'adulto',edad:null,monto:TARIFAS.adultoAdicional.monto||0,demo:!!TARIFAS.adultoAdicional.demo}))
    .concat(ok.filter(x=>x.ocupaPlaza).map(x=>({tipo:x.tipo,edad:x.edad,monto:x.monto,rango:x.rango||'',demo:x.demo})));
  const asignacion=asignarPlazas(personas,c&&c.incluidas!=null?c.incluidas:0);
  const bebesAparte=ok.filter(x=>x.tipo==='bebe'&&!x.ocupaPlaza).map(x=>({tipo:'bebe',edad:x.edad,monto:x.monto,incluido:false,aparte:true,demo:x.demo}));
  const cobrados=asignacion.filter(p=>!p.incluido).concat(bebesAparte);
  const extrasNoche=cobrados.reduce((s,p)=>s+p.monto,0);
  detalle.forEach(d=>{d.extras=extrasNoche;d.total=d.base+extrasNoche});
  const total=detalle.reduce((s,d)=>s+d.total,0);
  const usaDemo=detalle.some(d=>d.demo)||cobrados.some(p=>p.demo)||!!(c&&(c.demo.incluidas));
  return {ok:!errores.length,errores,cat,catNombre:cat?tipoNombre(cat):'',hab:o.hab||null,ingreso:isoD(ingreso),salida:isoD(salida),n:Math.max(0,n),
    adultos,menores,avisos,capacidad:cap,plazas,incluidas:c?c.incluidas:null,asignacion:asignacion.concat(bebesAparte),extrasNoche,detalle,total,usaDemo,
    calculada:ahoraAR(),usuario:usuarioActual.nombre};
}

/* Texto legible de la composición */
function textoComposicion(c){
  const ni=c.menores.filter(m=>!m.cuna), be=c.menores.filter(m=>m.cuna);
  return [`${c.adultos} ${c.adultos===1?'adulto':'adultos'}`,ni.length?`${ni.length} ${ni.length===1?'niño':'niños'} (${ni.map(m=>m.edad+' a').join(', ')})`:'',be.length?`${be.length} ${be.length===1?'bebé en cuna':'bebés en cuna'} (${be.map(m=>m.edad+' a').join(', ')})`:''].filter(Boolean).join(' · ');
}
/* Extras agrupados para mostrar */
function extrasAgrupados(c){

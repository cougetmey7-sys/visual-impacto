/* =========================================================
   PASO C · INCIDENCIAS AMPLIADAS, AVISOS SIMULADOS Y RECORDATORIOS (Decisiones 26 a 31)
   - Estados visibles: Pendiente (clave interna “abierta”, por compatibilidad) → En gestión → Resuelta.
   - Solo Adrián marca “En gestión”, devuelve a “Pendiente”, baja prioridades, configura recordatorios y resuelve.
   - Recepción registra incidencias (sin bloquear nada), agrega observaciones, informa reparaciones y marca urgencias.
   - Avisos AVI: registro con clave única. WhatsApp SIMULADO: no se envía nada, no hay números reales,
     no hay enlaces ni llamadas de red. Como máximo se copia el texto.
   - Recordatorios: solo para incidencias urgentes que siguen Pendientes. Se evalúan mientras la aplicación
     está abierta (al dibujar la pantalla y cada 60 segundos). Sin servidor, NO hay recordatorios con la
     aplicación cerrada: al volver a abrirla se emite como máximo uno.
   - Los permisos se validan dentro de cada función. Es seguridad demostrativa del prototipo, no de producción.
   ========================================================= */
const INC_ESQUEMA=2;
const SISTEMA_AVI='Sistema (avisos simulados)';
const AVI_LEYENDA='SIMULACIÓN — NO SE ENVIÓ NINGÚN MENSAJE.';
const AVI_CANAL='WhatsApp (simulado)';
const AVI_DEST='Adrián (Administrador) · número no configurado — DEMO';
const CONF_DEMO_TXT='CONFIGURACIÓN DEMO — PENDIENTE DE VALIDACIÓN';
const CONF_REC={intervaloHoras:2,maxDia:6,silencioDesde:'22:00',silencioHasta:'08:00',demo:true,historial:[]};
const PRIO={normal:['Prioridad normal','neutral'],urgente:['Urgente','bad']};
const AVI_CLASE={hecho:['Aviso por hecho nuevo','gold'],recordatorio:['Recordatorio periódico','bad'],revision:['Fecha de revisión','info'],llegada:['Llegada con conflicto vigente','bad']};
const H48=48*3600e3;
const AVISOS=[]; let aviSeq=1;

/* ---------- Utilidades de fecha y hora de Argentina ---------- */
function partesAR(ts){const p={};FMT_AR.formatToParts(new Date(ts)).forEach(x=>p[x.type]=x.value);
  return {iso:`${p.year}-${String(+p.month).padStart(2,'0')}-${String(+p.day).padStart(2,'0')}`,min:(+p.hour%24)*60+(+p.minute),fecha:`${+p.day}/${+p.month}/${p.year}`,hora:`${p.hour}:${p.minute}`}}
const minHHMM=(t)=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const horaValida=(t)=>/^([01]\d|2[0-3]):[0-5]\d$/.test(String(t||''));
function enSilencio(ts){const m=partesAR(ts).min,a=minHHMM(CONF_REC.silencioDesde),b=minHHMM(CONF_REC.silencioHasta);return a>b?(m>=a||m<b):(a<=m&&m<b)}
function sello(usuario){const ts=RELOJ.ahora(),d=fechaHoraAR(ts);return {usuario:usuario||usuarioActual.nombre,fecha:d.fecha,hora:d.hora,ts,zona:ZONA_AR}}
/* Texto obligatorio con contenido: al menos min caracteres y una palabra */
const txtValido=(t,min=5)=>{const x=limpiarB(t);return x.length>=min&&/[a-záéíóúüñ]{2,}/i.test(x)?x:''};
const lugarInc=(i)=>i.hab?`Hab. ${i.hab}`:(i.referencia||'Sin referencia');
const esConflicto=(i)=>i.tipo!=='operativa';

/* ---------- C1 · Ampliación y migración idempotente de las incidencias ---------- */
/* Solo AGREGA campos que faltan. No toca id, reservas, propuestas, resolución, justificación ni historial. */
function ampliarInc(i,marca,migracion){
  if(i.esquema===INC_ESQUEMA) return false;
  if(!i.tipo) i.tipo='conflicto_bloqueo';
  if(!i.prioridad) i.prioridad={nivel:'normal',origen:null,motivo:'',desde:null,reconocidas:[]};
  if(!i.prioridadHist) i.prioridadHist=[];
  if(!i.seguimiento) i.seguimiento=[];
  if(!('gestion' in i)) i.gestion=null;
  if(!i.observaciones) i.observaciones=[];
  if(!i.reparaciones) i.reparaciones=[];
  if(!i.ciclo) i.ciclo={inicio:marca.ts};
  if(migracion) i.migracion=Object.freeze({de:1,a:INC_ESQUEMA,usuario:marca.usuario,fecha:marca.fecha,hora:marca.hora,ts:marca.ts,zona:ZONA_AR});
  i.esquema=INC_ESQUEMA;
  return true;
}
function migrarIncidencias(opc={}){
  const s=sello(SISTEMA_AVI); let n=0;
  INCIDENCIAS.forEach(i=>{if(ampliarInc(i,s,true)) n++});
  if(n&&!opc.silencioso) auditarComo(SISTEMA_AVI,'Amplió incidencias al formato del Paso C',`${n} ${n===1?'incidencia':'incidencias'} · identificadores, reservas, propuestas, resoluciones, justificaciones e historial sin cambios`);
  return n;
}

/* ---------- C1 · Estados: Pendiente → En gestión → Resuelta (solo Adrián) ---------- */
function marcarEnGestion(incId,nota,opc={}){
  if(!puede('incidencias.gestionar')) return {error:'Solo el Administrador puede marcar una incidencia En gestión.'};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  if(i.estado==='en_gestion') return {error:'La incidencia ya está En gestión.'};
  if(i.estado!=='abierta') return {error:'Solo una incidencia Pendiente puede pasar a En gestión.'};
  const n=txtValido(nota); if(!n) return {error:'Escribí la nota de gestión (obligatoria).'};
  const rv=validarRevision(opc.revision); if(rv.error) return rv;
  const s=sello();
  i.estado='en_gestion'; i.gestion=Object.freeze({nota:n,revision:rv.fecha,...s});
  i.seguimiento.push(Object.freeze({de:'abierta',a:'en_gestion',texto:n,revision:rv.fecha,...s}));
  incHist(i,'Marcada En gestión',`Nota: ${n}${rv.fecha?` · fecha de revisión ${ddmmIso(rv.fecha)}`:''} · los recordatorios periódicos se detienen`);
  auditar('Marcó una incidencia En gestión',`${i.id} · ${n} · ${rv.fecha?'fecha de revisión '+ddmmIso(rv.fecha):'sin fecha de revisión'} · recordatorios periódicos detenidos`);
  return {ok:true};
}
function validarRevision(f){
  if(f===undefined||f===null||f==='') return {fecha:null};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f)||isNaN(new Date(f+'T00:00'))) return {error:'La fecha de revisión no es válida.'};
  if(f<partesAR(RELOJ.ahora()).iso) return {error:'La fecha de revisión no puede ser anterior a hoy.'};
  return {fecha:f};
}
function fijarRevision(incId,fecha,motivo){
  if(!puede('incidencias.gestionar')) return {error:'Solo el Administrador puede cambiar la fecha de revisión.'};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  if(i.estado!=='en_gestion') return {error:'La fecha de revisión solo se usa en incidencias En gestión.'};
  const rv=validarRevision(fecha); if(rv.error) return rv;
  if(rv.fecha===(i.gestion&&i.gestion.revision)) return {error:'Es la misma fecha de revisión.'};
  const m=txtValido(motivo); if(!m) return {error:'Escribí el motivo del cambio.'};
  const s=sello(), antes=i.gestion.revision;
  i.gestion=Object.freeze({...i.gestion,revision:rv.fecha,revisionCambiada:Object.freeze({antes,motivo:m,...s})});
  i.seguimiento.push(Object.freeze({de:'en_gestion',a:'en_gestion',cambio:'revision',antes,revision:rv.fecha,texto:m,...s}));
  incHist(i,'Fecha de revisión cambiada',`${antes?ddmmIso(antes):'sin fecha'} → ${rv.fecha?ddmmIso(rv.fecha):'sin fecha'} · ${m}`);
  auditar('Cambió la fecha de revisión de una incidencia',`${i.id} · ${antes?ddmmIso(antes):'sin fecha'} → ${rv.fecha?ddmmIso(rv.fecha):'sin fecha'} · ${m}`);
  return {ok:true};
}
function volverAPendiente(incId,motivo){
  if(!puede('incidencias.gestionar')) return {error:'Solo el Administrador puede devolver una incidencia a Pendiente.'};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  if(i.estado!=='en_gestion') return {error:i.estado==='resuelta'?'Una incidencia resuelta no se reabre.':'La incidencia ya está Pendiente.'};
  const m=txtValido(motivo); if(!m) return {error:'Escribí el motivo para volver a Pendiente (obligatorio).'};
  const s=sello();
  i.estado='abierta'; i.ciclo={inicio:s.ts};
  i.seguimiento.push(Object.freeze({de:'en_gestion',a:'abierta',texto:m,...s}));
  incHist(i,'Vuelve a Pendiente',`Motivo: ${m} · el ciclo de recordatorios se reinicia desde ahora, sin recordatorios retroactivos`);
  auditar('Devolvió una incidencia a Pendiente',`${i.id} · ${m} · ciclo de recordatorios reiniciado`);
  return {ok:true};
}

/* ---------- C1 · Prioridad: urgencia automática y manual ---------- */
function cambioPrioridad(i,nivel,origen,motivo,usuario,extra={}){
  const s=sello(usuario), de=i.prioridad.nivel;
  i.prioridad={nivel,origen,motivo,desde:s.ts,usuario:s.usuario,reconocidas:extra.reconocidas||(i.prioridad.reconocidas||[]).slice()};
  i.prioridadHist.push(Object.freeze({de,a:nivel,origen,motivo,claves:Object.freeze((extra.claves||[]).slice()),...s}));
  const acc=nivel==='urgente'?(origen==='auto'?'Urgente (automático)':'Marcada urgente'):(origen==='auto'?'Prioridad normal (automático)':'Prioridad reducida por Adrián');
  incHist(i,acc,motivo,s.usuario);
  const det=`${i.id} · ${PRIO[de][0]} → ${PRIO[nivel][0]} · ${origen==='auto'?'automático':'manual'} · ${motivo}`;
  if(extra.seed) return;
  if(origen==='auto') auditarComo(s.usuario,nivel==='urgente'?'Marcó una incidencia urgente (automático)':'Normalizó una urgencia automática',det);
  else auditar(nivel==='urgente'?'Marcó una incidencia urgente':'Redujo la prioridad de una incidencia',det);
}
/* Condiciones de urgencia automática: huésped alojado o check-in dentro de 48 horas, con el conflicto vigente */
function clavesUrgencia(i,ts){
  if(!esConflicto(i)) return [];
  const now=ts??RELOJ.ahora();
  return conflictoVigenteInc(i).map(n=>RESERVAS.find(r=>r.nro===n)).filter(Boolean).flatMap(r=>{
    if(r.estado==='inhouse') return [{k:`aloj:${r.nro}:${isoD(r.ingreso)}`,nro:r.nro,t:`huésped alojado en la reserva #${r.nro} (Hab. ${r.hab})`}];
    const ci=tsAR(r.ingreso,r.horaLlegada||PARAMS.horaCheckin);
    if(['pendiente','confirmada'].includes(r.estado)&&ci-now<=H48&&now<tsAR(r.salida,'00:00')) return [{k:`lleg:${r.nro}:${isoD(r.ingreso)}`,nro:r.nro,t:`check-in de la reserva #${r.nro} el ${ddmm(r.ingreso)}, dentro de las próximas 48 horas`}];
    return [];
  });
}
/* Reevaluación idempotente: solo registra un cambio cuando el nivel cambia de verdad */
function evaluarUrgencias(ts){
  let n=0;
  INCIDENCIAS.forEach(i=>{
    if(i.estado==='resuelta'||i.esquema!==INC_ESQUEMA) return;
    const cl=clavesUrgencia(i,ts), p=i.prioridad, nuevas=cl.filter(c=>!(p.reconocidas||[]).includes(c.k));
    if(p.nivel!=='urgente'&&nuevas.length){cambioPrioridad(i,'urgente','auto',`Urgencia automática: ${nuevas.map(c=>c.t).join('; ')}`,SISTEMA_AVI,{claves:nuevas.map(c=>c.k)});n++}
    /* Nunca se rebaja una urgencia manual. Una urgencia automática vuelve a normal solo si ya no se cumple ninguna condición. */
    else if(p.nivel==='urgente'&&p.origen==='auto'&&!cl.length){cambioPrioridad(i,'normal','auto','Ya no se cumple la condición de urgencia automática (sin huésped alojado ni check-in dentro de 48 horas en conflicto)',SISTEMA_AVI);n++}
  });
  return n;
}
function marcarUrgente(incId,motivo){
  if(!puede('incidencias.observar')) return {error:NOPERM};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  if(i.estado==='resuelta') return {error:'La incidencia ya está resuelta.'};
  if(i.prioridad.nivel==='urgente'&&i.prioridad.origen==='manual') return {error:'La incidencia ya está marcada urgente.'};
  const m=txtValido(motivo); if(!m) return {error:'Escribí por qué es urgente.'};
  cambioPrioridad(i,'urgente','manual',m);
  return {ok:true};
}
function bajarPrioridad(incId,motivo){
  if(!puede('incidencias.gestionar')) return {error:'Solo el Administrador puede reducir la prioridad.'};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  if(i.prioridad.nivel!=='urgente') return {error:'La incidencia no está marcada urgente.'};
  const m=txtValido(motivo); if(!m) return {error:'Escribí el motivo para reducir la prioridad.'};
  /* Las condiciones actuales quedan reconocidas: solo un hecho nuevo vuelve a marcarla urgente */
  cambioPrioridad(i,'normal','manual',m,null,{reconocidas:clavesUrgencia(i).map(c=>c.k)});
  return {ok:true};
}

/* ---------- C1 · Incidencias sin bloqueo, observaciones y reparaciones (recepción) ---------- */
function crearIncidenciaOperativa(v,opc={}){
  if(!puede('incidencias.crear')) return {error:NOPERM};
  return registrarIncOperativa(v,opc);
}
/* Registro interno de una incidencia operativa: valida todo antes de modificar. Lo usan recepción (con permiso
   incidencias.crear) y el módulo de limpieza (con permiso limpieza.problemas). opc: usuario, demo, seed, origen, limId */
function registrarIncOperativa(v,opc={}){
  const hab=v.hab||''; if(hab&&!HABITACIONES.includes(hab)) return {error:'Habitación inexistente.'};
  const ref=limpiarB(v.referencia);
  if(!hab&&ref.length<3) return {error:'Indicá la habitación o una referencia operativa (por ejemplo, “ascensor”).'};
  const desc=txtValido(v.descripcion,10); if(!desc) return {error:'Describí el problema (al menos 10 caracteres).'};
  const nivel=!v.prioridad||v.prioridad==='normal'?'normal':v.prioridad==='urgente'?'urgente':null; if(!nivel) return {error:'Prioridad no válida.'};
  let mu=''; if(nivel==='urgente'){mu=txtValido(v.motivoUrgencia); if(!mu) return {error:'Escribí por qué es urgente.'}}
  if(INCIDENCIAS.some(i=>i.tipo==='operativa'&&i.estado!=='resuelta'&&(i.hab||'')===hab&&(i.referencia||'')===ref&&i.descripcion.toLowerCase()===desc.toLowerCase())) return {error:'Ya hay una incidencia igual sin resolver.'};
  /* Validado todo: se registra. No se toca disponibilidad, reservas, ocupación, limpieza ni Caja. */
  const s=sello(opc.usuario);
  const i={id:'INC-'+pad4(incSeq++),origen:opc.origen||'reporte-operativo',tipo:'operativa',limId:opc.limId||null,bloqueoId:null,hab:hab||null,referencia:ref||null,desde:null,disponibleDesde:null,motivo:desc,descripcion:desc,
    registrada:{usuario:s.usuario,fecha:s.fecha,hora:s.hora,ts:s.ts,zona:ZONA_AR},estado:'abierta',reservas:[],propuestas:[],historial:[],resolucion:null,demo:!!opc.demo};
  ampliarInc(i,s,false);
  INCIDENCIAS.push(i);
  incHist(i,'Incidencia registrada',`${lugarInc(i)} · ${desc} · no bloquea la habitación`,s.usuario);
  if(!opc.seed) auditar('Registró una incidencia',`${i.id} · ${lugarInc(i)}${opc.limId?` · desde la limpieza ${opc.limId}`:''} · ${PRIO[nivel][0]} · sin bloqueo: no cambia disponibilidad, reservas, limpieza ni Caja`);
  if(nivel==='urgente') cambioPrioridad(i,'urgente','manual',mu,s.usuario,{seed:opc.seed});
  return {ok:true,i};
}
function observarIncidencia(incId,texto){
  if(!puede('incidencias.observar')) return {error:NOPERM};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  const t=txtValido(texto); if(!t) return {error:'Escribí la observación.'};
  const s=sello(); i.observaciones.push(Object.freeze({texto:t,...s}));
  incHist(i,'Observación agregada',t);
  auditar('Agregó una observación a una incidencia',`${i.id} · ${t} · sin cambios de estado`);
  return {ok:true};
}
function informarReparacion(incId,texto){
  if(!puede('incidencias.observar')) return {error:NOPERM};
  const i=incPorId(incId); if(!i) return {error:'No se encontró la incidencia.'};
  const b=i.bloqueoId?bloqueoPorId(i.bloqueoId):null, bVivo=b&&!b.finalizado;
  if(i.estado==='resuelta'&&!bVivo) return {error:'La incidencia ya está resuelta y no tiene un bloqueo vigente.'};
  const t=txtValido(texto); if(!t) return {error:'Describí la reparación realizada.'};
  const s=sello(); i.reparaciones.push(Object.freeze({texto:t,...s}));
  incHist(i,'Reparación informada (no cierra ni desbloquea)',`${t} · Adrián tiene que revisarla`);
  if(bVivo) blqHist(b,`Reparación informada en ${i.id} (no desbloquea)`,t);
  auditar('Informó una reparación',`${i.id}${bVivo?` · ${b.id} sigue vigente`:''} · ${t} · la incidencia no se cerró y no se levantó ningún bloqueo`);
  return {ok:true};
}

/* ---------- C3 · Configuración de recordatorios (solo Adrián) ---------- */
function configurarRecordatorios(v){
  if(!puede('avisos.configurar')) return {error:'Solo el Administrador puede configurar los recordatorios.'};
  const iv=Number(v.intervaloHoras), mx=Number(v.maxDia);
  if(!Number.isInteger(iv)||iv<1||iv>12) return {error:'El intervalo tiene que ser de 1 a 12 horas.'};
  if(!Number.isInteger(mx)||mx<1||mx>12) return {error:'El máximo diario tiene que ser de 1 a 12 recordatorios.'};
  if(!horaValida(v.silencioDesde)||!horaValida(v.silencioHasta)) return {error:'Indicá el horario de silencio con formato HH:MM.'};
  if(v.silencioDesde===v.silencioHasta) return {error:'El horario de silencio tiene que tener un inicio y un fin distintos.'};
  const antes={intervaloHoras:CONF_REC.intervaloHoras,maxDia:CONF_REC.maxDia,silencioDesde:CONF_REC.silencioDesde,silencioHasta:CONF_REC.silencioHasta};
  const desp={intervaloHoras:iv,maxDia:mx,silencioDesde:v.silencioDesde,silencioHasta:v.silencioHasta};
  if(JSON.stringify(antes)===JSON.stringify(desp)) return {error:'No hay cambios para guardar.'};
  const s=sello(); Object.assign(CONF_REC,desp);
  CONF_REC.historial.push(Object.freeze({antes:Object.freeze(antes),despues:Object.freeze(desp),...s}));
  const t=(c)=>`cada ${c.intervaloHoras} h · máx. ${c.maxDia}/día · silencio ${c.silencioDesde}–${c.silencioHasta}`;
  auditar('Cambió la configuración de recordatorios',`${t(antes)} → ${t(desp)} · ${CONF_DEMO_TXT}`,{antes:t(antes),despues:t(desp)});
  return {ok:true};
}

/* ---------- C2 · Avisos simulados con clave única ---------- */
const aviExiste=(k)=>AVISOS.some(a=>a.clave===k||a.cubre.includes(k));
/* El texto lleva solo identificadores, habitación, número de reserva, fechas y la acción requerida: nunca nombres ni teléfonos */
function emitirAviso(o){
  if(aviExiste(o.clave)) return null;
  const d=fechaHoraAR(o.ts);
  const texto=[AVI_LEYENDA,`Jorge Primero · ${o.titulo}`,...o.lineas,`Acción requerida: ${o.accion}`].join('\n');
  const a=Object.freeze({id:'AVI-'+pad4(aviSeq++),clave:o.clave,cubre:Object.freeze((o.cubre||[]).slice()),clase:o.clase,evento:o.evento,titulo:o.titulo,accion:o.accion,texto,
    canal:AVI_CANAL,destinatario:AVI_DEST,estado:'Preparado — simulado, no enviado',enviado:false,origen:Object.freeze({...o.origen}),incId:o.incId||null,hab:o.hab||null,
    nros:Object.freeze((o.nros||[]).slice()),atrasado:!!o.atrasado,usuario:SISTEMA_AVI,fecha:d.fecha,hora:d.hora,ts:o.ts,zona:ZONA_AR,demo:!!o.demo});
  AVISOS.push(a); return a;
}
const lineaRes=(n)=>{const r=RESERVAS.find(x=>x.nro===n);return r?`Reserva #${n} · ${ddmm(r.ingreso)} → ${ddmm(r.salida)}`:`Reserva #${n}`};
const avisosDeInc=(i)=>AVISOS.filter(a=>a.incId===i.id);
/* Evaluación idempotente: se puede llamar muchas veces en el mismo momento sin crear duplicados */
function evaluarAvisos(ts){
  ts=ts??RELOJ.ahora();
  sincronizarConflictos(); /* detecta conflictos nuevos también en la evaluación periódica (idempotente) */
  migrarIncidencias();
  evaluarUrgencias(ts);
  const antes=AVISOS.length, hoy=partesAR(ts).iso;
  /* Paso D: tareas de limpieza y avisos de bloqueo sugerido (antes que la urgencia, para no duplicar el aviso) */
  if(typeof sincronizarLimpiezas==='function') sincronizarLimpiezas(ts);
  if(typeof avisosLimpieza==='function') avisosLimpieza(ts);
  INCIDENCIAS.forEach(i=>{
    if(i.esquema!==INC_ESQUEMA) return;
    const b=i.bloqueoId?bloqueoPorId(i.bloqueoId):null, demo=!!(i.demo||(b&&b.demo)), base={incId:i.id,hab:i.hab,demo,ts};
    /* Bloqueo que afecta reservas y reservas nuevas afectadas (hecho nuevo) */
    if(esConflicto(i)&&b){
      const nuevas=i.reservas.filter(x=>!aviExiste(`BLQ:${b.id}:afecta:${x.nro}`));
      if(nuevas.length){const primero=!avisosDeInc(i).some(a=>a.evento==='bloqueo_afecta');
        emitirAviso({...base,clave:`BLQ:${b.id}:afecta:${nuevas[0].nro}`,cubre:nuevas.map(x=>`BLQ:${b.id}:afecta:${x.nro}`),clase:'hecho',evento:primero?'bloqueo_afecta':'reserva_afectada_nueva',
          titulo:primero?`Bloqueo que afecta ${nuevas.length===1?'una reserva':nuevas.length+' reservas'}`:`Hecho nuevo: otra reserva afectada${i.estado==='en_gestion'?' (incidencia En gestión)':''}`,
          lineas:[`${i.id} · ${b.id} · Hab. ${b.hab}`,`Bloqueada desde el ${ddmm(b.ingreso)} · disponible desde el ${ddmm(b.salida)}`,...nuevas.map(x=>lineaRes(x.nro))],
          accion:'revisar el conflicto y decidir (traslado, resolución o levantamiento). Las reservas no se modificaron.',origen:{tipo:'BLQ',id:b.id},nros:nuevas.map(x=>x.nro)})}
    }
    /* Incidencia urgente (cada vez que sube a urgente) */
    i.prioridadHist.forEach((h,k)=>{if(h.a!=='urgente'||h.de==='urgente') return;
      emitirAviso({...base,clave:`INC:${i.id}:urgente:${k}`,cubre:h.claves.map(c=>`INC:${i.id}:${c}`),clase:'hecho',evento:'incidencia_urgente',titulo:`Incidencia urgente${i.estado==='en_gestion'?' (En gestión)':''}`,
        lineas:[`${i.id} · ${lugarInc(i)}`,h.origen==='auto'?`Urgencia automática: ${h.claves.map(c=>{const [t,n]=c.split(':');return t==='aloj'?`huésped alojado · ${lineaRes(+n)}`:`check-in dentro de 48 horas · ${lineaRes(+n)}`}).join(' / ')}`:'Marcada urgente manualmente (el motivo queda en el sistema)'],
        accion:'revisar la incidencia urgente.',origen:{tipo:'INC',id:i.id},nros:h.claves.map(c=>+c.split(':')[1])})});
    /* Hechos nuevos: llegada próxima o huésped alojado en conflicto (incidencias no resueltas) */
    if(i.estado!=='resuelta') clavesUrgencia(i,ts).forEach(c=>emitirAviso({...base,clave:`INC:${i.id}:${c.k}`,clase:'hecho',evento:c.k.startsWith('aloj')?'huesped_alojado':'llegada_proxima',
      titulo:`Hecho nuevo: ${c.k.startsWith('aloj')?'huésped alojado en conflicto':'llegada próxima en conflicto'}${i.estado==='en_gestion'?' (incidencia En gestión)':''}`,
      lineas:[`${i.id} · ${lugarInc(i)}`,lineaRes(c.nro)],accion:'revisar la llegada y el conflicto.',origen:{tipo:'INC',id:i.id},nros:[c.nro]}));
    /* Reparaciones informadas por recepción */
    i.reparaciones.forEach((r,k)=>emitirAviso({...base,ts,clave:`INC:${i.id}:reparacion:${k}`,clase:'hecho',evento:'reparacion_informada',titulo:'Reparación informada: requiere revisión',
      lineas:[`${i.id} · ${lugarInc(i)}${b?` · ${b.id}`:''}`,`Informada el ${r.fecha} a las ${r.hora}`],accion:'revisar la reparación. No se cerró la incidencia ni se levantó ningún bloqueo.',origen:{tipo:'INC',id:i.id}}));
    /* Fecha de revisión de una incidencia En gestión: aviso único, sin cambiar estado ni prioridad */
    if(i.estado==='en_gestion'&&i.gestion&&i.gestion.revision&&i.gestion.revision<=hoy)
      emitirAviso({...base,clave:`INC:${i.id}:revision:${i.gestion.revision}:${i.gestion.ts}`,clase:'revision',evento:'fecha_revision',titulo:'Fecha de revisión de una incidencia En gestión',
        lineas:[`${i.id} · ${lugarInc(i)}`,`Revisión prevista: ${ddmmIso(i.gestion.revision)}`],accion:'revisar la incidencia. Sigue En gestión; no se reactivaron recordatorios.',origen:{tipo:'INC',id:i.id}});
    /* Resuelta administrativamente con conflicto vigente: aviso único el día del check-in, por reserva y fecha */
    if(i.estado==='resuelta'&&esConflicto(i)) conflictoVigenteInc(i).forEach(n=>{const r=RESERVAS.find(x=>x.nro===n);
      if(!r||!['pendiente','confirmada'].includes(r.estado)) return; const ing=isoD(r.ingreso); /* solo llegadas todavía no realizadas */
      if(hoy>=ing&&hoy<isoD(r.salida)) emitirAviso({...base,clave:`INC:${i.id}:llegada:${n}:${ing}`,clase:'llegada',evento:'llegada_con_conflicto',titulo:'Llegada afectada: incidencia resuelta con conflicto vigente',
        lineas:[`${i.id} · ${b?b.id+' · ':''}Hab. ${r.hab}`,lineaRes(n),'Incidencia resuelta administrativamente · conflicto operativo vigente · la habitación sigue bloqueada'],
        accion:'gestionar la llegada (proponer o autorizar un traslado, o levantar el bloqueo según las reglas).',origen:{tipo:'INC',id:i.id},nros:[n]})});
    /* Recordatorios periódicos: solo urgentes y Pendientes */
    evaluarRecordatorio(i,ts,base);
  });
  /* Propuestas de traslado que esperan la autorización de Adrián */
  INCIDENCIAS.forEach(i=>i.propuestas.forEach(p=>{if(p.estado!=='propuesta') return;
    const b=bloqueoPorId(i.bloqueoId);
    emitirAviso({incId:i.id,hab:p.habOrigen,demo:!!(i.demo||(b&&b.demo)),ts,clave:`PRO:${p.id}:propuesta`,clase:'hecho',evento:'traslado_propuesto',titulo:'Traslado propuesto: requiere tu autorización',
      lineas:[`${p.id} · ${i.id} · Hab. ${p.habOrigen} → Hab. ${p.habDestino} (misma categoría)`,lineaRes(p.nro)],accion:'autorizar o rechazar el traslado (solo Adrián).',origen:{tipo:'PRO',id:p.id},nros:[p.nro]})}));
  /* Reparaciones informadas directamente en un bloqueo (“Informar que terminó”) */
  bloqueosTodos().forEach(b=>(b.observaciones||[]).forEach((o,k)=>{if(!o.fin) return;
    emitirAviso({incId:null,hab:b.hab,demo:!!b.demo,ts,clave:`BLQ:${b.id}:fin:${k}`,clase:'hecho',evento:'reparacion_informada',titulo:'Reparación informada en un bloqueo: requiere revisión',
      lineas:[`${b.id} · Hab. ${b.hab}`,`Informada el ${o.fecha} a las ${o.hora}`],accion:'revisar y, si corresponde, levantar el bloqueo según las reglas (solo Adrián).',origen:{tipo:'BLQ',id:b.id}})}));
  return AVISOS.length-antes;
}
/* ---------- C3 · Recordatorio periódico: cada intervalo, máximo diario, silencio, sin ráfagas ---------- */
function evaluarRecordatorio(i,ts,base){
  if(i.estado!=='abierta'||i.prioridad.nivel!=='urgente') return null;
  const desde=Math.max(i.ciclo.inicio,i.prioridad.desde||0), iv=CONF_REC.intervaloHoras*3600e3;
  const recs=AVISOS.filter(a=>a.incId===i.id&&a.clase==='recordatorio'&&a.ts>=desde);
  const ult=recs.length?Math.max(...recs.map(a=>a.ts)):desde;
  if(ts-ult<iv||enSilencio(ts)) return null;
  const hoy=partesAR(ts).iso;
  if(AVISOS.filter(a=>a.incId===i.id&&a.clase==='recordatorio'&&partesAR(a.ts).iso===hoy).length>=CONF_REC.maxDia) return null;
  const atrasado=ts-ult>=2*iv, k=recs.length+1;
  return emitirAviso({...base,ts,clave:`INC:${i.id}:rec:${desde}:${k}`,clase:'recordatorio',evento:'recordatorio',atrasado,titulo:`Recordatorio ${k}: incidencia urgente Pendiente${atrasado?' (demorado: se emite uno solo)':''}`,
    lineas:[`${i.id} · ${lugarInc(i)}`,...conflictoVigenteInc(i).map(lineaRes),`Pendiente desde el ${fechaHoraAR(desde).fecha} ${fechaHoraAR(desde).hora}`],
    accion:'marcarla En gestión o resolverla.',origen:{tipo:'INC',id:i.id}});
}

/* =========================================================
   PASO D · LIMPIEZA DE HABITACIONES (Decisiones 33, 34 y 35)
   - Tareas LIM con identificador único: limpieza de salida y limpieza de estadía.
   - Salida: Pendiente → En curso → Pendiente de verificación → Verificada / Disponible.
     La confirmación del personal NO habilita la habitación: sigue “pendiente de limpieza” (lista `limpieza`,
     que usan check-in, traslados e indicadores) hasta que recepción o Adrián aprueban la verificación.
   - Estadía (habitación ocupada): Pendiente → En curso → Realizada / No realizada (con motivo y reintentos
     el mismo día). Nunca cambia disponibilidad, ocupación, reservas, tarifas ni Caja.
   - Problemas: leve → incidencia INC operativa; “requiere bloqueo” → INC urgente con
     “Bloqueo sugerido — Pendiente de evaluación”. Nunca se bloquea automáticamente: el bloqueo se registra
     por el procedimiento BLQ existente.
   - Rol Limpieza (usuarios DEMO): solo ve sus tareas, sin datos de huéspedes ni financieros.
   - Permisos validados dentro de cada función. Seguridad demostrativa, no apta para producción.
   ========================================================= */
const LIMPIEZAS=[]; let limSeq=1;
const LIM_VISTOS=new WeakSet(); /* entradas del historial de habitación ya procesadas como origen de limpieza */
const SISTEMA_LIM='Sistema (limpieza)';
const CONF_LIM={frecuenciaDias:1,demo:true,historial:[]};
/* El rol Limpieza solo puede tener estos permisos, aunque se le asignen otros manualmente */
const PERM_ROL_LIMPIEZA=['limpieza.ver','limpieza.realizar','limpieza.problemas'];
const LIM_TIPO={salida:'Limpieza de salida',estadia:'Limpieza de estadía'};
const LIM_EST={pendiente:['Pendiente','gold'],en_curso:['En curso','info'],pendiente_verificacion:['Pendiente de verificación','warn'],verificada:['Verificada / Disponible','ok'],
  realizada:['Realizada','ok'],no_realizada:['No realizada','bad'],sin_efecto:['Sin efecto','cancel']};
const LIM_MOTIVOS={no_molestar:'No molestar',rechazada:'Rechazada por el huésped',mas_tarde:'Solicitada para más tarde',sin_acceso:'Sin acceso',otro:'Otro'};
const LIM_ORIGEN={checkout:'Check-out',cambio:'Cambio de habitación',traslado:'Traslado autorizado',mantenimiento:'Finalización de mantenimiento',diaria:'Limpieza diaria',demo:'Dato de demostración',sin_dato:'Origen pendiente de identificación'};
const LIM_INSTR={salida:'Limpieza completa de salida: ropa blanca, baño, pisos, residuos y reposición de amenities. (Instrucción DEMO)',
  estadia:'Repaso diario: tender camas, baño, residuos y amenities. Respetar el cartel “No molestar”. (Instrucción DEMO)'};
const SUG_EST={pendiente_evaluacion:['Bloqueo sugerido — Pendiente de evaluación','bad'],bloqueo_registrado:['Bloqueo registrado por el procedimiento BLQ','info'],descartada:['Sugerencia de bloqueo descartada','neutral']};
const esRolLimpieza=(u=usuarioActual)=>!!u&&u.rol==='limpieza';
const personalLimpieza=()=>USUARIOS.filter(u=>u.activo&&u.rol==='limpieza');
const limPorId=(id)=>LIMPIEZAS.find(l=>l.id===id);
const limSalidaAbierta=(h)=>LIMPIEZAS.find(l=>l.tipo==='salida'&&l.hab===h&&['pendiente','en_curso','pendiente_verificacion'].includes(l.estado));
const isoAR=(ts)=>partesAR(ts).iso;
const ultIntento=(l)=>l.intentos[l.intentos.length-1]||null;
/* Módulos visibles: el rol Limpieza solo ve su tablero (declaración de función: se usa también al cargar) */
function moduloVisible(m){return usuarioActual&&usuarioActual.rol==='limpieza'?m.id==='limpieza':puede(m.perm)}
function selloL(ts,usuario,usuarioId){const t=ts??RELOJ.ahora(),d=fechaHoraAR(t);return {usuario:usuario||usuarioActual.nombre,usuarioId:usuarioId!==undefined?usuarioId:usuarioActual.id,fecha:d.fecha,hora:d.hora,ts:t,zona:ZONA_AR}}
function limHist(l,accion,detalle,s){s=s||selloL();l.historial.push(Object.freeze({accion,detalle:detalle||'',...s}))}
function etiquetaLim(l){
  if(l.estado==='pendiente'&&l.rehacer) return ['Pendiente — repetir limpieza','bad'];
  if(['pendiente','en_curso','no_realizada'].includes(l.estado)&&l.tipo==='estadia'&&l.fecha<isoAR(RELOJ.ahora())) return [`${LIM_EST[l.estado][0]} · vencida`,'bad'];
  return LIM_EST[l.estado];
}
const origenTxt=(o,completo)=>`${LIM_ORIGEN[o.tipo]||o.tipo}${o.identificacion==='pendiente'&&o.tipo!=='sin_dato'?' · origen pendiente de identificación':''}${completo?[o.reserva?` · reserva #${o.reserva}`:'',o.pro?` · ${o.pro}`:'',o.inc?` · ${o.inc}`:'',o.blq?` · ${o.blq}`:''].join(''):''}`;

/* ---------- D1 · Creación idempotente de tareas ---------- */
function crearLim(o,s){
  const l={id:'LIM-'+pad4(limSeq++),tipo:o.tipo,hab:o.hab,fecha:o.fecha,origenes:(o.origenes||[]).slice(),reserva:o.reserva||null,clave:o.clave||null,estado:'pendiente',rehacer:false,
    asignada:null,asignaciones:[],intentos:[],verificaciones:[],correcciones:[],observaciones:[],incidencias:[],historial:[],creada:Object.freeze({...s}),demo:!!o.demo};
  LIMPIEZAS.push(l);
  limHist(l,'Tarea creada',`${LIM_TIPO[l.tipo]} · Hab. ${l.hab} · origen: ${l.origenes.map(x=>origenTxt(x,true)).join(', ')}`,s);
  return l;
}
/* Origen de una limpieza de salida, leído del historial de la habitación (sin cambiar check-out, traslados ni mantenimientos).
   Corrección del Paso D: solo se leen los segmentos FIJOS de cada tipo de registro y cada referencia se verifica contra los datos
   reales. Nunca se interpretan identificadores escritos en motivos, descripciones u observaciones libres. Si el origen no se puede
   identificar de forma confiable, queda “pendiente de identificación”, sin vínculos inventados. Nunca se guarda el nombre del huésped.
   Formatos fijos: Check-out → “Reserva #N · …” (al inicio) · Cambio → “… · reserva #N” (al final) ·
   Traslado → “… · PRO-#### · INC-####” (al final) · Mantenimiento → “BLQ-#### · …” (al inicio). */
const MAPA_ORIGEN=[[/^Check-out$/,'checkout'],[/^Cambio de habitación · sale el huésped$/,'cambio'],[/^Traslado por conflicto · sale el huésped$/,'traslado'],[/^Mantenimiento finalizado$/,'mantenimiento'],[/^Pasó a pendiente de limpieza$/,'demo']];
const resPorNro=(n)=>RESERVAS.find(x=>x.nro&&String(x.nro)===String(n));
function origenDeLog(e,h){
  const m=MAPA_ORIGEN.find(([re])=>re.test(e.accion||'')); if(!m) return null;
  const tipo=m[1], d=String(e.detalle||''), base={tipo,reserva:null,pro:null,inc:null,blq:null,ts:e.ts instanceof Date?+e.ts:(+e.ts||null),hora:e.hora||'',usuario:e.usuario||''};
  const pend=(motivo)=>Object.freeze({...base,identificacion:'pendiente',motivoIdentificacion:motivo});
  if(tipo==='demo') return Object.freeze({...base,identificacion:'ok'});
  if(tipo==='checkout'){const x=d.match(/^Reserva #(\d{6,}) · /),r=x&&resPorNro(x[1]);
    return r&&r.hab===h&&r.estado==='finalizada'?Object.freeze({...base,reserva:r.nro,identificacion:'ok'}):pend('El registro de check-out no identifica una reserva finalizada de esta habitación')}
  if(tipo==='cambio'){const x=d.match(/ pasó a la Hab\. (\w+) · reserva #(\d{6,})$/),r=x&&resPorNro(x[2]);
    return r&&HABITACIONES.includes(x[1])&&x[1]!==h?Object.freeze({...base,reserva:r.nro,identificacion:'ok'}):pend('El registro del cambio de habitación no identifica una reserva existente')}
  if(tipo==='traslado'){const x=d.match(/ pasó a la Hab\. (\w+) · (PRO-\d{4}) · (INC-\d{4})$/),i=x&&incPorId(x[3]),pp=i&&i.propuestas.find(z=>z.id===x[2]);
    return pp&&pp.estado==='autorizada'&&pp.habOrigen===h&&pp.habDestino===x[1]?Object.freeze({...base,reserva:pp.nro,pro:pp.id,inc:i.id,identificacion:'ok'}):pend('El registro del traslado no coincide con una propuesta autorizada de esta incidencia')}
  if(tipo==='mantenimiento'){const x=d.match(/^(BLQ-\d{4}) · /),b=x&&bloqueoPorId(x[1]);
    return b&&b.hab===h&&b.tipoBloqueo!=='manual'&&b.finalizado?Object.freeze({...base,blq:b.id,identificacion:'ok'}):pend('El registro no identifica un mantenimiento finalizado de esta habitación')}
  return pend('Tipo de registro no reconocido');
}
/* Sincronización idempotente: se puede ejecutar muchas veces (al dibujar y cada 60 s) sin duplicar nada */
function sincronizarLimpiezas(ts){
  ts=ts??RELOJ.ahora(); const hoy=isoAR(ts); let n=0; const sis=()=>selloL(ts,SISTEMA_LIM,null);
  /* Salida: una tarea abierta por habitación mientras figure pendiente de limpieza */
  HABITACIONES.forEach(h=>{
    const nuevos=[]; (HAB_INFO[h].log||[]).forEach(e=>{if(LIM_VISTOS.has(e)) return; LIM_VISTOS.add(e); const o=origenDeLog(e,h); if(o) nuevos.push(o)});
    const ab=limSalidaAbierta(h);
    if(limpieza.includes(h)){
      if(!ab){crearLim({tipo:'salida',hab:h,fecha:hoy,origenes:nuevos.length?nuevos:[Object.freeze({tipo:'sin_dato',reserva:null,pro:null,inc:null,blq:null,ts,identificacion:'pendiente',motivoIdentificacion:'No hay un registro de origen reconocible'})],demo:LIMPIEZA_DEMO.has(h)},sis());n++}
      else if(nuevos.length){nuevos.forEach(o=>ab.origenes.push(o));limHist(ab,'Nuevo origen registrado',`${nuevos.map(o=>origenTxt(o,true)).join(', ')} · no se creó otra tarea`,sis())}
    }else if(ab){ab.estado='sin_efecto';limHist(ab,'Sin efecto','La habitación dejó de figurar pendiente de limpieza por otro proceso',sis())}
  });
  /* Estadía: una tarea por habitación, reserva y fecha de Argentina (sin el día de llegada ni el de salida) */
  RESERVAS.forEach(r=>{
    if(!r.nro||r.estado!=='inhouse') return;
    const ing=isoD(r.ingreso), sal=isoD(r.salida); if(!(hoy>ing&&hoy<sal)) return;
    const dias=Math.round((Date.parse(hoy)-Date.parse(ing))/864e5); if(dias%CONF_LIM.frecuenciaDias!==0) return;
    const clave=`${r.hab}|${r.nro}|${hoy}`; if(LIMPIEZAS.some(l=>l.clave===clave)) return;
    crearLim({tipo:'estadia',hab:r.hab,fecha:hoy,reserva:r.nro,clave,origenes:[Object.freeze({tipo:'diaria',reserva:r.nro,ts})],demo:!!r.demo},sis()); n++;
  });
  /* Estadía abierta que perdió su condición (el huésped ya no está o cambió de habitación) */
  LIMPIEZAS.forEach(l=>{
    if(l.tipo!=='estadia'||!['pendiente','en_curso','no_realizada'].includes(l.estado)) return;
    const r=RESERVAS.find(x=>x.nro===l.reserva);
    if(!r||r.estado!=='inhouse'||r.hab!==l.hab){l.estado='sin_efecto';limHist(l,'Sin efecto',r&&r.estado==='inhouse'?`El huésped pasó a la Hab. ${r.hab}`:'El huésped ya no está alojado',sis())}
  });
  /* Sugerencias de bloqueo: se vinculan cuando recepción o Adrián registran el bloqueo por el procedimiento BLQ */
  INCIDENCIAS.forEach(i=>{const sg=i.sugerenciaBloqueo; if(!sg||sg.estado!=='pendiente_evaluacion') return;
    const b=bloqueosTodos().find(x=>x.hab===i.hab&&!x.finalizado&&x.historial.length&&x.historial[0].ts>=sg.ts);
    if(b){i.sugerenciaBloqueo=Object.freeze({...sg,estado:'bloqueo_registrado',bloqueoId:b.id,registro:Object.freeze({usuario:b.creado.usuario,fecha:b.creado.fecha,hora:b.creado.hora})});
      incHist(i,'Bloqueo registrado por el procedimiento BLQ',`${b.id} · registró ${b.creado.usuario} · la sugerencia quedó evaluada`,SISTEMA_LIM);
      const l=limPorId(sg.limId); if(l) limHist(l,'Bloqueo registrado por el procedimiento BLQ',`${b.id} · ${i.id}`,sis())}});
  return n;
}

/* ---------- D2 y D3 · Quién registra: el trabajador asignado o recepción en su nombre ---------- */
function actorLim(l,personaId){
  if(esRolLimpieza()){
    if(!puede('limpieza.realizar')) return {error:NOPERM};
    if(!l.asignada||l.asignada.id!==usuarioActual.id) return {error:'Solo podés registrar tus propias tareas asignadas.'};
    if(personaId&&personaId!==usuarioActual.id) return {error:'No podés registrar trabajos de otra persona.'};
    return {persona:{id:usuarioActual.id,nombre:usuarioActual.nombre},enNombre:false};
  }
  if(!puede('limpieza.gestionar')) return {error:'No tenés permiso para registrar limpiezas en nombre del personal.'};
  if(!l.asignada) return {error:'Primero asigná la tarea a una persona del personal de limpieza.'};
  if(!personaId) return {error:'Indicá la persona que realizó la tarea (obligatorio).'};
  if(personaId!==l.asignada.id) return {error:`La tarea está asignada a ${l.asignada.nombre}: reasignala antes de registrar a otra persona.`};
  return {persona:{...l.asignada},enNombre:true};
}
const quienTxt=(a,s)=>a.enNombre?`${a.persona.nombre} (registrado por ${s.usuario} en su nombre)`:`${a.persona.nombre} (confirmado personalmente)`;
function asignarLimpieza(id,usuarioId,motivo){
  if(!puede('limpieza.asignar')) return {error:'No tenés permiso para asignar tareas de limpieza.'};
  const l=limPorId(id); if(!l) return {error:'No se encontró la tarea.'};
  if(!['pendiente','no_realizada'].includes(l.estado)) return {error:'Solo se asignan tareas pendientes o no realizadas (no en curso, en verificación ni terminadas).'};
  const u=personalLimpieza().find(x=>x.id===usuarioId); if(!u) return {error:'Elegí una persona del personal de limpieza.'};
  if(l.asignada&&l.asignada.id===u.id) return {error:'La tarea ya está asignada a esa persona.'};
  const re=!!l.asignada, m=re?txtValido(motivo):limpiarB(motivo); if(re&&!m) return {error:'Indicá el motivo de la reasignación.'};
  const s=selloL(), de=l.asignada;
  l.asignada={id:u.id,nombre:u.nombre};
  l.asignaciones.push(Object.freeze({de:de?Object.freeze({...de}):null,a:Object.freeze({...l.asignada}),motivo:m,...s}));
  limHist(l,re?'Reasignada':'Asignada',`${de?de.nombre+' → ':''}${u.nombre}${m?' · '+m:''}`,s);

/* Verificación obligatoria (recepción o Adrián). Solo una verificación aprobada quita la condición de “pendiente de limpieza”. */
function verificarLimpieza(id,v={}){
  if(!puede('limpieza.verificar')) return {error:'Solo recepción o Adrián pueden verificar limpiezas.'};
  const l=limPorId(id); if(!l) return {error:'No se encontró la tarea.'};
  if(l.tipo!=='salida') return {error:'Solo las limpiezas de salida se verifican.'};
  if(l.estado!=='pendiente_verificacion') return {error:'La limpieza no está pendiente de verificación.'};
  const it=ultIntento(l); if(it&&it.persona.id===usuarioActual.id) return {error:'No podés verificar una limpieza que realizaste vos.'};
  if(typeof v.aprobada!=='boolean') return {error:'Indicá si la verificación se aprueba o se rechaza.'};
  const m=v.aprobada?limpiarB(v.motivo):txtValido(v.motivo); if(!v.aprobada&&!m) return {error:'Indicá por qué se rechaza la verificación.'};
  const s=selloL(), h=l.hab, antes=EST_HAB[estadoHab(h)], obs=limpiarB(v.obs);
  const ocupacion=Object.freeze(RESERVAS.filter(r=>r.hab===h&&['inhouse','finalizada'].includes(r.estado)).map(r=>r.nro+':'+r.estado));
  l.verificaciones.push(Object.freeze({intento:it?it.n:null,aprobada:v.aprobada,motivo:m,obs,ocupacion,...s}));
  if(v.aprobada){
    const k=limpieza.indexOf(h); if(k>=0) limpieza.splice(k,1);
    l.estado='verificada';
    const despues=EST_HAB[estadoHab(h)];
    limHist(l,'Verificación aprobada',`Verificó ${s.usuario} · limpió ${it.persona.nombre} · ${antes} → ${despues}${obs?' · '+obs:''}`,s);
    habLog(h,'limpieza','Limpieza verificada',antes,despues,`${l.id} · limpió ${it.persona.nombre} · verificó ${s.usuario}`);
    auditar('Verificó una limpieza',`${l.id} · Hab. ${h} · aprobada · ${antes} → ${despues} · limpió ${it.persona.nombre} · los bloqueos y conflictos no cambian`,{antes,despues});
  }else{
    l.estado='pendiente'; l.rehacer=true;
    limHist(l,'Verificación rechazada',`Verificó ${s.usuario} · motivo: ${m} · hay que repetir la limpieza y volver a verificarla`,s);
    habLog(h,'limpieza','Verificación de limpieza rechazada',antes,antes,`${l.id} · ${m}`);
    auditar('Rechazó la verificación de una limpieza',`${l.id} · Hab. ${h} · ${m} · la habitación sigue pendiente de limpieza`,{antes:LIM_EST.pendiente_verificacion[0],despues:'Pendiente — repetir limpieza'});
  }
  return {ok:true};
}
/* Corrección de una limpieza confirmada o verificada por error: solo Adrián, con motivo. Nunca se borra nada. */
function corregirLimpieza(id,motivo){
  if(!puede('limpieza.corregir')) return {error:'Solo el Administrador puede corregir o revertir una limpieza confirmada.'};
  const l=limPorId(id); if(!l) return {error:'No se encontró la tarea.'};
  const m=txtValido(motivo); if(!m) return {error:'Escribí el motivo de la corrección (obligatorio).'};
  const h=l.hab, s=selloL();
  if(l.tipo==='salida'&&l.estado==='verificada'){
    const ver=l.verificaciones.filter(x=>x.aprobada).slice(-1)[0];
    const ahora=RESERVAS.filter(r=>r.hab===h&&['inhouse','finalizada'].includes(r.estado)).map(r=>r.nro+':'+r.estado);
    const posterior=ahora.filter(x=>!(ver.ocupacion||[]).includes(x));
    const otra=LIMPIEZAS.find(x=>x!==l&&x.tipo==='salida'&&x.hab===h&&x.creada.ts>=ver.ts);
    if(RESERVAS.some(r=>r.hab===h&&r.estado==='inhouse')||posterior.length||otra)
      return {error:`No se puede revertir automáticamente: ${RESERVAS.some(r=>r.hab===h&&r.estado==='inhouse')?`la Hab. ${h} ya está ocupada`:posterior.length?'hubo una ocupación posterior a la verificación':`ya existe una limpieza posterior (${otra.id})`}. Queda para evaluación de Adrián; no se modificaron reservas, ocupación ni la tarea.`,conflicto:true};
    const antes=EST_HAB[estadoHab(h)];
    l.estado='pendiente'; l.rehacer=true; if(!limpieza.includes(h)) limpieza.push(h);
    l.correcciones.push(Object.freeze({tipo:'revertir_verificacion',estadoAnterior:'verificada',motivo:m,...s}));
    limHist(l,'Verificación revertida por Adrián',`${m} · la habitación vuelve a pendiente de limpieza hasta repetir limpieza y verificación`,s);
    habLog(h,'limpieza','Limpieza revertida por Adrián',antes,EST_HAB[estadoHab(h)],`${l.id} · ${m}`);
    auditar('Revirtió una limpieza verificada',`${l.id} · Hab. ${h} · ${m} · ${antes} → ${EST_HAB[estadoHab(h)]} · se conservan la confirmación y la verificación originales`,{antes,despues:EST_HAB[estadoHab(h)]});
    return {ok:true};
  }
  if((l.tipo==='salida'&&l.estado==='pendiente_verificacion')||(l.tipo==='estadia'&&l.estado==='realizada')){
    const ant=l.estado;
    l.estado='pendiente'; l.rehacer=l.tipo==='salida';
    l.correcciones.push(Object.freeze({tipo:'revertir_confirmacion',estadoAnterior:ant,motivo:m,...s}));
    limHist(l,'Confirmación revertida por Adrián',`${m} · se conserva el intento original`,s);
    habLog(h,'limpieza','Confirmación de limpieza revertida por Adrián',EST_HAB[estadoHab(h)],EST_HAB[estadoHab(h)],`${l.id} · ${m}`);
    auditar('Revirtió una confirmación de limpieza',`${l.id} · Hab. ${h} · ${LIM_EST[ant][0]} → Pendiente · ${m}`,{antes:LIM_EST[ant][0],despues:'Pendiente'});
    return {ok:true};
  }
  return {error:'Solo se corrigen limpiezas confirmadas, verificadas o realizadas.'};
}

/* ---------- D4 · Problemas detectados durante la limpieza ---------- */
function informarProblemaLimpieza(id,v={}){
  if(!puede('limpieza.problemas')) return {error:NOPERM};
  const l=limPorId(id); if(!l) return {error:'No se encontró la tarea.'};
  if(l.estado==='sin_efecto') return {error:'La tarea quedó sin efecto.'};
  if(esRolLimpieza()&&(!l.asignada||l.asignada.id!==usuarioActual.id)) return {error:'Solo podés informar problemas de tus propias tareas.'};
  if(!['leve','bloqueo'].includes(v.gravedad)) return {error:'Indicá si es un problema leve o si requiere evaluar un bloqueo.'};
  const desc=txtValido(v.descripcion,10); if(!desc) return {error:'Describí el problema (al menos 10 caracteres).'};
  let mu=''; if(v.gravedad==='bloqueo'){mu=txtValido(v.motivoUrgencia); if(!mu) return {error:'Con un bloqueo sugerido, el motivo de la urgencia es obligatorio.'}}
  let i=null;
  if(v.incId){ i=incPorId(v.incId);
    if(!i||i.tipo!=='operativa'||i.estado==='resuelta'||i.hab!==l.hab) return {error:'Solo se puede vincular una incidencia operativa sin resolver de la misma habitación.'};
    if(v.gravedad==='bloqueo'&&i.sugerenciaBloqueo&&i.sugerenciaBloqueo.estado==='pendiente_evaluacion') return {error:'Esa incidencia ya tiene un bloqueo sugerido pendiente de evaluación.'};
  }
  /* Validado todo: se crea o se vincula la incidencia. Nunca se bloquea la habitación. */
  if(!i){const r=registrarIncOperativa({hab:l.hab,descripcion:desc,prioridad:v.gravedad==='bloqueo'?'urgente':'normal',motivoUrgencia:mu},{origen:'limpieza',limId:l.id,demo:!!v.demo,seed:v.seed}); if(r.error) return r; i=r.i}
  else{i.observaciones.push(Object.freeze({texto:desc,...sello()}));incHist(i,'Problema informado desde la limpieza',`${l.id} · ${desc}`);
    if(v.gravedad==='bloqueo'&&!(i.prioridad.nivel==='urgente'&&i.prioridad.origen==='manual')) cambioPrioridad(i,'urgente','manual',mu,null,{seed:v.seed})}
  const s=selloL();
  if(v.gravedad==='bloqueo'){
    const idx=i.prioridadHist.map((h,k)=>h.a==='urgente'&&h.de!=='urgente'?k:-1).filter(k=>k>=0).slice(-1)[0];
    i.sugerenciaBloqueo=Object.freeze({estado:'pendiente_evaluacion',limId:l.id,motivo:mu,urgenteIdx:idx??null,...s});
    incHist(i,'Bloqueo sugerido — Pendiente de evaluación',`Desde ${l.id} · la habitación NO se bloqueó: recepción o Adrián evalúan y, si corresponde, registran el bloqueo por el procedimiento BLQ`);
  }
  if(!i.limId) i.limId=l.id;
  if(!l.incidencias.includes(i.id)) l.incidencias.push(i.id);
  limHist(l,'Problema informado',`${i.id} · ${v.gravedad==='bloqueo'?'requiere evaluar un bloqueo (urgente)':'leve'}${v.incId?' · vinculado a una incidencia existente':''}`,s);
  if(!v.seed) auditar('Informó un problema durante la limpieza',`${l.id} · Hab. ${l.hab} · ${i.id} · ${v.gravedad==='bloqueo'?'bloqueo sugerido, pendiente de evaluación (no se bloqueó)':'leve, sin bloqueo'} · reservas, ocupación y Caja sin cambios`);
  return {ok:true,i};
}

const finEfectivo=(r)=>mantVencido(r)?new Date(8.64e15):r.salida;
function bloqueoEn(h,d){return RESERVAS.find(r=>r.estado==='bloqueo'&&r.hab===h&&r.ingreso<=d&&d<finEfectivo(r))}
function estadoHab(h){

    mant:st.filter(s=>s==='bad').length,

      const txt=r.estado==='bloqueo'?(r.tipoBloqueo==='manual'?'Bloqueada':mantVencido(r)?'Mantenimiento vencido':'Mantenimiento'):r.huesped;

      let s=diffD(desde,ini)+.5, e=diffD(desde,fin)+.5; if(e<=0||s>=N) return ''; s=Math.max(s,0); e=Math.min(e,N);

function plBuscar(){
  if(PL.tab!=='planning') return;
  const q=PL.q.trim().toLowerCase(); const out=$('#pl-qn');
  const bars=document.querySelectorAll('.bk');
  if(!q){bars.forEach(b=>b.classList.remove('dim','hit'));if(out)out.textContent='';return}
  const hits=RESERVAS.filter(r=>r.estado!=='bloqueo'&&r.estado!=='cancelada'&&(r.huesped.toLowerCase().includes(q)||(r.nro||'').includes(q)));
  bars.forEach(b=>{const on=hits.includes(RESERVAS[+b.dataset.bk]);b.classList.toggle('hit',on);b.classList.toggle('dim',!on)});
  if(out) out.textContent=hits.length?`${hits.length}`:'0';
  /* Si la coincidencia está fuera del rango visible, mover el planning hasta ella */
  const visible=[...bars].some(b=>b.classList.contains('hit'));
  if(hits.length&&!visible){
    PL.inicio=addD(hits[0].ingreso,-1);
    plRender(true);
  }
}

  {fecha:addD(PL_HOY,0),hora:'09:00',t:'Reposición de amenities · Piso 2',d:'Revisar stock de amenities y reponer en las habitaciones del piso 2.'},
  {fecha:addD(PL_HOY,0),hora:'17:00',t:'Confirmar horario de llegada · Familia Quiroga',d:'Llamar para confirmar a qué hora llegan (check-in previsto 20:00).'},

];

function eventosDel(dia){
  const ev=[], pasado=dia<HOY, esHoy=mismoDia(dia,HOY);
  RESERVAS.forEach((r,i)=>{
    if(r.estado==='bloqueo'){
      if(r.ingreso<=dia&&dia<finEfectivo(r)) ev.push({tipo:'mantenimiento',hora:null,titulo:`Hab. ${r.hab}`,sub:r.tipoBloqueo==='manual'?'Habitación bloqueada':mantVencido(r)?'Mantenimiento vencido':mismoDia(dia,r.ingreso)?'Entra en mantenimiento':(esHoy?'Mantenimiento informado':'Sigue en mantenimiento'),hab:r.hab,ref:{hab:r.hab},estado:['Bloqueada','bad']});
      return;
    }
    if(r.estado==='cancelada') return;
    const saldo=saldoDe(r);
    if(mismoDia(r.salida,dia)){
      const hecho=r.estado==='finalizada';
      ev.push({tipo:'checkout',hora:r.horaSalida,titulo:r.huesped,sub:`Hab. ${r.hab} · ${r.pax} ${r.pax===1?'huésped':'huéspedes'}`,hab:r.hab,ref:{res:i},
        estado:hecho?['Check-out realizado','neutral']:saldo>0?['Saldo pendiente','bad']:['Check-out pendiente','neutral'],hecho});
      if(!hecho&&saldo>0&&r.estado==='inhouse') ev.push({tipo:'cobro',hora:null,titulo:`Reserva #${r.nro}`,sub:`${r.huesped} · Hab. ${r.hab} · saldo ${ars(saldo)}`,hab:r.hab,ref:{res:i},estado:['Cobrar antes de la salida','warn']});
    }
    if(mismoDia(r.ingreso,dia)){
      const hecho=r.estado==='inhouse'||r.estado==='finalizada';
      ev.push({tipo:'checkin',hora:r.horaLlegada,titulo:r.huesped,sub:`Hab. ${r.hab} · ${r.pax} ${r.pax===1?'huésped':'huéspedes'}`,hab:r.hab,ref:{res:i},
        estado:hecho?['Check-in realizado','neutral']:r.estado==='pendiente'?['Pendiente de confirmar','gold']:(esHoy||pasado)?['Pendiente de ingresar','warn']:['Confirmada','info'],hecho});
    }
  });
  if(esHoy) limpieza.forEach(h=>ev.push({tipo:'limpieza',hora:null,titulo:`Hab. ${h}`,sub:'Pendiente de limpieza',hab:h,ref:{hab:h},estado:['Pendiente','warn']}));
  TAREAS_AG.forEach((t,i)=>{if(mismoDia(t.fecha,dia))ev.push({tipo:'tarea',hora:t.hora,titulo:t.t,sub:'Tarea operativa',ref:{tarea:i},estado:pasado?['Realizada','neutral']:['Pendiente','neutral'],hecho:pasado})});
  return ev.sort((a,b)=>(a.hora||'')<(b.hora||'')?-1:1);
}

/* ---------- Render ---------- */
function agenda(){
  const f=AG.fecha;
  let titulo, cuerpo;
  if(AG.vista==='dia'){
    titulo=f.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    cuerpo=agDia(f);
  }else if(AG.vista==='semana'){
    const lun=addD(f,-((f.getDay()+6)%7)), dom=addD(lun,6);
    titulo=`${lun.getDate()} ${lun.toLocaleDateString('es-AR',{month:'short'}).replace('.','')} – ${dom.getDate()} ${dom.toLocaleDateString('es-AR',{month:'short'}).replace('.','')} ${dom.getFullYear()}`;
    cuerpo=agSemana(lun);
  }else{
    titulo=f.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
    cuerpo=agMes(f);
  }
  return `
  <div class="pl-bar">
    <div class="seg" role="group" aria-label="Vista de agenda">${[['dia','Día'],['semana','Semana'],['mes','Mes']].map(([k,t])=>`<button data-ag="v-${k}" class="${AG.vista===k?'on':''}" aria-pressed="${AG.vista===k}">${t}</button>`).join('')}</div>
    <button class="btn" data-ag="hoy">Hoy</button>
    <div class="pl-nav">
      <button class="icon-btn flip" data-ag="prev" aria-label="Anterior">${ic('arrow')}</button>
      <span class="range ag-title">${titulo}</span>
      <button class="icon-btn" data-ag="next" aria-label="Siguiente">${ic('arrow')}</button>
    </div>
    <label class="ag-date"><span class="label">Ir a</span><input id="ag-fecha" type="date" value="${isoD(f)}"></label>
  </div>
  ${cuerpo}
  <!-- Reservado para el asistente de ayuda contextual (etapa posterior) -->
  <div id="asistente-slot" data-contexto="agenda" hidden></div>`;
}

const chipTipo=(tipo)=>`<span class="ag-ic t-${tipo}">${ic(TIPOS_AG[tipo].ic)}</span>`;
const evData=(e)=>e.ref.res!==undefined?`data-agr="${e.ref.res}"`:e.ref.hab?`data-agh="${e.ref.hab}"`:`data-agt="${e.ref.tarea}"`;

function agDia(f){
  const ev=eventosDel(f);
  const orden=['limpieza','mantenimiento','cobro'];
  const conHora=ev.filter(e=>e.hora), atencion=ev.filter(e=>!e.hora).sort((a,b)=>orden.indexOf(a.tipo)-orden.indexOf(b.tipo));
  const cuenta=(t)=>ev.filter(e=>e.tipo===t).length;
  const esHoy=mismoDia(f,PL_HOY);
  const ahora=new Date(), hhmm=`${String(ahora.getHours()).padStart(2,'0')}:${String(ahora.getMinutes()).padStart(2,'0')}`;
  let marcaPuesta=!esHoy||!mismoDia(ahora,PL_HOY);
  const filas=conHora.map(e=>{
    let marca='';
    if(!marcaPuesta&&e.hora>hhmm){marca=`<li class="ag-now"><span>Ahora ${hhmm}</span></li>`;marcaPuesta=true}
    return marca+`<li><button class="ag-item${e.hecho?' done':''}" ${evData(e)}>
      <span class="ag-time num">${e.hora}</span>${chipTipo(e.tipo)}
      <span class="ag-txt"><small>${TIPOS_AG[e.tipo].t}</small><b>${e.titulo}</b><span>${e.sub}</span></span>
      ${pill(e.estado)}<span class="go">${ic('arrow')}</span></button></li>`;
  }).join('')+(!marcaPuesta?`<li class="ag-now"><span>Ahora ${hhmm}</span></li>`:'');

  return `
  <div class="ag-sum">${['checkout','checkin','limpieza','mantenimiento','cobro','tarea'].map(t=>`<div class="ag-sum-i">${chipTipo(t)}<div><b class="num">${cuenta(t)}</b><small>${t==='checkin'?'Llegadas':t==='checkout'?'Salidas':t==='cobro'?'Saldos':t==='tarea'?'Tareas':TIPOS_AG[t].t}</small></div></div>`).join('')}</div>
  <div class="ag-day">
    <section class="card ag-col">
      <div class="card-head"><h2>Durante el día</h2><span class="label">${conHora.length} actividades</span></div>
      ${conHora.length?`<ol class="ag-line">${filas}</ol>`:`<p class="empty" style="margin:0 20px 20px">No hay actividades con horario para este día.</p>`}
    </section>
    <section class="card ag-col">
      <div class="card-head"><h2>Requiere atención <span class="count num">${atencion.length}</span></h2></div>
      ${atencion.length?`<ul class="ag-att">${atencion.map(e=>`<li><button class="ag-item" ${evData(e)}>${chipTipo(e.tipo)}
        <span class="ag-txt"><small>${TIPOS_AG[e.tipo].t}</small><b>${e.titulo}</b><span>${e.sub}</span></span><span class="go">${ic('arrow')}</span></button></li>`).join('')}</ul>`
      :`<p class="empty" style="margin:0 20px 20px">Nada pendiente para este día.</p>`}
    </section>
  </div>`;
}

function agSemana(lun){
  const dias=[...Array(7)].map((_,i)=>addD(lun,i));
  return `<section class="card ag-week">${dias.map(d=>{
    const ev=eventosDel(d), hoy=mismoDia(d,PL_HOY);
    return `<div class="ag-wd${hoy?' today':''}">
      <button class="ag-wh" data-ag-dia="${isoD(d)}" title="Ver el día"><small>${hoy?'Hoy':d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','')}</small><b class="num">${d.getDate()}</b></button>
      <div class="ag-wl">${ev.length?ev.map(e=>`<button class="ag-mini t-${e.tipo}${e.hecho?' done':''}" ${evData(e)} title="${TIPOS_AG[e.tipo].t} · ${e.titulo}">
        <span class="num">${e.hora||'•'}</span><span class="nm">${e.tipo==='checkin'||e.tipo==='checkout'?`${TIPOS_AG[e.tipo].t} · ${e.titulo}`:`${e.titulo} · ${e.sub}`}</span></button>`).join(''):`<span class="ag-none">Sin actividades</span>`}</div>
    </div>`;
  }).join('')}</section>`;
}

function agMes(f){
  const primero=new Date(f.getFullYear(),f.getMonth(),1);
  const ini=addD(primero,-((primero.getDay()+6)%7));
  const celdas=[...Array(42)].map((_,i)=>addD(ini,i));
  const sel=AG.fecha;
  const cab=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="ag-mh">${d}</div>`).join('');
  const grid=celdas.map(d=>{
    const ev=eventosDel(d), fuera=d.getMonth()!==f.getMonth();
    const n=(t)=>ev.filter(e=>e.tipo===t).length;
    const at=ev.filter(e=>!e.hora&&!e.hecho).length;
    return `<button class="ag-md${fuera?' out':''}${mismoDia(d,PL_HOY)?' today':''}${mismoDia(d,sel)?' sel':''}" data-ag-sel="${isoD(d)}" aria-label="${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}: ${ev.length} actividades">
      <span class="dn num">${d.getDate()}</span>
      <span class="ag-ind">
        ${n('checkin')?`<span class="ind t-checkin">${ic('in')}<b class="num">${n('checkin')}</b></span>`:''}
        ${n('checkout')?`<span class="ind t-checkout">${ic('out')}<b class="num">${n('checkout')}</b></span>`:''}
        ${at?`<span class="ind t-alert" title="Requiere atención">${ic('alert')}<b class="num">${at}</b></span>`:''}
      </span></button>`;
  }).join('');
  const evSel=eventosDel(sel);
  return `
  <div class="ag-month">
    <section class="card ag-cal"><div class="ag-cal-grid">${cab}${grid}</div>
      <div class="ag-cal-leg"><span>${chipTipo('checkin')}Llegadas</span><span>${chipTipo('checkout')}Salidas</span><span><span class="ag-ic t-alert">${ic('alert')}</span>Requiere atención</span></div>
    </section>
    <section class="card ag-col">
      <div class="card-head"><h2>${sel.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h2><button class="btn btn-sm" data-ag-dia="${isoD(sel)}">Ver día completo</button></div>
      ${evSel.length?`<ul class="ag-att">${evSel.map(e=>`<li><button class="ag-item${e.hecho?' done':''}" ${evData(e)}>${chipTipo(e.tipo)}
        <span class="ag-txt"><small>${e.hora?e.hora+' · ':''}${TIPOS_AG[e.tipo].t}</small><b>${e.titulo}</b><span>${e.sub}</span></span><span class="go">${ic('arrow')}</span></button></li>`).join('')}</ul>`
      :`<p class="empty" style="margin:0 20px 20px">No hay actividades para este día.</p>`}
    </section>
  </div>`;
}
